o, ningún vehículo puede utilizar el trozo de vía en reparación en ningún caso"], "a": 0, "expl": "Se permite el paso a los vehículos de asistencia sanitaria, policía, extinción de incendios, protección civil y salvamento en servicio urgente, si es posible sin peligro ni daño para la obra.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 60.3", "img": null}, {"tema": 4, "q": "Llegas a la boca de un túnel y el semáforo muestra una indicación que no permite el paso. ¿Qué debes hacer?", "opts": ["Entrar con precaución si no hay ningún tráfico a la vista", "Entrar si reduces la velocidad y conectas las emergencias", "No entrar en el túnel hasta que el semáforo lo permita"], "a": 2, "expl": "Ningún usuario debe penetrar en un túnel si el semáforo de su boca no le permite el paso; solo se exceptúan los servicios de urgencia, asistencia mecánica y conservación.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 96.3", "img": null}, {"tema": 4, "q": "Un camión de bomberos en servicio urgente llega a una intersección donde un agente de tráfico le ordena detenerse. ¿Debe obedecer?", "opts": ["Solo si el agente se lo ordena mediante silbato además de con el gesto del brazo", "No, un vehículo prioritario en servicio urgente puede ignorarlas bajo su responsabilidad", "Sí, las órdenes y señales de los agentes son siempre de obligado cumplimiento"], "a": 2, "expl": "Los vehículos prioritarios pueden dejar de cumplir ciertas normas, pero nunca las órdenes y señales de los agentes.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 68.1", "img": null}, {"tema": 4, "q": "Un camión de más de 3.500 kg circula fuera de poblado por una calzada con dos carriles para su sentido. ¿Por cuál debe circular normalmente?", "opts": ["Por el que prefiera, sin necesidad de volver nunca al de la derecha.", "Por el de la izquierda, reservado siempre a los vehículos más rápidos.", "Por el de la derecha, usando el otro si no entorpece a quien le siga."], "a": 2, "expl": "Se circula normalmente por el carril más a la derecha, pudiendo usar los demás cuando las circunstancias lo aconsejen y sin entorpecer la marcha de otro vehículo que siga.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 31.1", "img": null}, {"tema": 4, "q": "Te acercas a un cruce con una vía para ciclistas y quieres adelantar a un turismo. ¿Está permitido?", "opts": ["No, está prohibido en esos cruces y en sus proximidades", "Sí, siempre que el turismo circule a menos de 40 km/h", "Sí, si no se observa ningún ciclista que se aproxime por ella"], "a": 0, "expl": "Queda prohibido adelantar en las intersecciones con vías para ciclistas y en sus proximidades, aunque no se vea ningún ciclista.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 87.1.b)", "img": null}, {"tema": 4, "q": "Circulas por una calzada de un poblado con dos carriles para tu sentido, delimitados por marcas. ¿Qué carril puedes utilizar?", "opts": ["Siempre el de la izquierda, si el de la derecha está ocupado", "Siempre el de la derecha, salvo para adelantar a otro vehículo", "El que mejor convenga a tu destino, sin estorbar"], "a": 2, "expl": "En poblado, con dos o más carriles delimitados por marcas, se puede usar el que mejor convenga al destino, sin obstaculizar a otros, y no abandonarlo salvo para cambiar de dirección, adelantar, parar o estacionar.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 33", "img": null}, {"tema": 4, "q": "Una avería de emergencia te obliga a detener el vehículo en un túnel sin zona reservada para emergencia próxima. ¿Dónde debes inmovilizarlo?", "opts": ["Lo más cerca posible del borde derecho de la calzada", "Lo más cerca posible del borde izquierdo de la calzada", "En el centro del carril, para que te vean los demás"], "a": 0, "expl": "Si no existe zona de emergencia, el vehículo se inmoviliza lo más cerca posible del borde derecho de la calzada.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 97.3.b)", "img": null}, {"tema": 4, "q": "Una retención por el tráfico te obliga a detenerte dentro de un túnel, entre otros vehículos. ¿Qué deben hacer el conductor y los pasajeros?", "opts": ["Bajar del vehículo y esperar junto a él con el chaleco puesto", "Abandonar el vehículo y caminar por la calzada hasta la salida", "No abandonar el vehículo y conectar la emergencia un momento"], "a": 2, "expl": "Si por necesidades de la circulación se queda inmovilizado en un túnel, conductor y pasajeros no deben abandonar el vehículo.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 97.3", "img": null}, {"tema": 4, "q": "A efectos de las normas sobre utilización de carriles, ¿qué carriles no se tienen en cuenta en el cómputo?", "opts": ["Los situados a la izquierda de la calzada, por ser de adelantamiento", "Los de anchura inferior a tres metros, por ser estrechos", "Los reservados a determinados vehículos o maniobras"], "a": 2, "expl": "Para contar los carriles no se cuentan los reservados a determinados vehículos o a ciertas maniobras (por ejemplo, VAO o de deceleración).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 34", "img": null}, {"tema": 4, "q": "En una vía de doble sentido, un tranvía circula por la zona central de la calzada. ¿Por qué lado debe adelantarse?", "opts": ["Por la derecha, con máximas precauciones.", "No está permitido adelantar a los tranvías en ningún caso.", "Por la izquierda, como a cualquier otro vehículo."], "a": 0, "expl": "Por excepción, en vías con circulación en ambos sentidos se adelanta por la derecha a los tranvías que marchan por la zona central.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 82.2", "img": null}, {"tema": 4, "q": "Conduces un turismo por una autovía de tres carriles por sentido, fuera de poblado. ¿Por qué carril debes circular normalmente?", "opts": ["El más a tu derecha, pudiendo usar otros si no entorpeces", "El que prefieras, mientras respetes la velocidad máxima de la vía", "El central, usando los extremos solo para adelantar o para salir"], "a": 0, "expl": "Fuera de poblado, con varios carriles por sentido, se circula normalmente por el más a la derecha, pudiendo usar el resto si las circunstancias lo aconsejan y no se entorpece a quien sigue.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 31.1", "img": null}, {"tema": 4, "q": "En una carretera convencional con adelantamiento prohibido, un coche averiado ocupa tu carril. ¿Qué separación mínima y qué velocidad debes llevar al rebasarlo?", "opts": ["1 metro de separación y 10 km/h menos que el límite de la vía", "1,5 m de separación y 20 km/h menos que el límite", "1,5 m de separación y la velocidad que permita la vía"], "a": 1, "expl": "Al rebasar un vehículo inmovilizado que ocupa el carril hay que mantener una anchura de seguridad de al menos 1,5 m y reducir la velocidad al menos 20 km/h respecto al límite de la vía.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 88.1", "img": null}, {"tema": 4, "q": "En un tramo estrecho sin señalizar, un autobús de viajeros y un camión se encuentran y uno debe retroceder, sin saberse cuál entró antes. ¿Quién tiene preferencia?", "opts": ["El camión, por lo que debe retroceder el autobús", "El más ligero de los dos, por tener mayor facilidad para maniobrar", "El autobús, por lo que debe retroceder el camión"], "a": 2, "expl": "En el orden de preferencia para la marcha atrás, los vehículos de transporte colectivo de viajeros preceden a los camiones.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 62.1 e) y f)", "img": null}, {"tema": 4, "q": "El tráfico es tan denso que los vehículos ocupan toda la anchura de la calzada, y los de un carril avanzan más deprisa que los de otro. ¿Se considera adelantamiento?", "opts": ["Sí, y se permite si se avisa antes con el intermitente.", "Sí, pero solo si se efectúa por el lado izquierdo.", "No, y ningún conductor debe cambiar de carril para adelantar."], "a": 2, "expl": "Con esa densidad, que unos carriles avancen más rápido que otros no es adelantamiento, y ningún conductor debe cambiar de carril para adelantar.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 83.2", "img": null}, {"tema": 4, "q": "El conductor de una ambulancia en servicio urgente recibe de un agente de tráfico la orden de detenerse. ¿Debe obedecerla?", "opts": ["Sí, las órdenes de los agentes son siempre obligatorias", "Solo si el agente emplea también señales acústicas o luminosas", "No, un vehículo prioritario puede ignorar toda orden que reciba"], "a": 0, "expl": "Los vehículos prioritarios pueden dejar de cumplir algunas normas bajo su responsabilidad, pero no las órdenes y señales de los agentes, que son siempre de obligado cumplimiento.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 68.1", "img": null}, {"tema": 4, "q": "Un grupo de ciclistas cruza una intersección y el primero ya ha iniciado el cruce. Tu trayectoria corta la del grupo. ¿Qué debes hacer?", "opts": ["Pasar entre ellos si hay un hueco suficiente para hacerlo sin rozar a ningún ciclista", "Dejar pasar a todo el grupo, que tiene prioridad desde el inicio del cruce", "Dejar pasar solo al primero y continuar si hay hueco entre él y el siguiente ciclista"], "a": 1, "expl": "Cuando circulan en grupo, los ciclistas tienen prioridad si el primero ha iniciado ya el cruce o ha entrado en una glorieta.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 64.2 c)", "img": null}, {"tema": 4, "q": "Un conductor sin vehículo prioritario debe trasladar con urgencia a un herido grave sin otro medio. ¿Qué debe hacer respecto a las normas de circulación?", "opts": ["Ignorar los semáforos si utiliza la luz de emergencia conectada siempre.", "Respetarlas, sobre todo en las intersecciones, y avisar de su situación.", "Superar los límites de velocidad si utiliza el avisador acústico en continuo."], "a": 1, "expl": "El vehículo no prioritario que realiza un servicio urgente debe respetar las normas de circulación, sobre todo en las intersecciones, y avisar con avisador intermitente y luz de emergencia.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 70.2", "img": null}, {"tema": 4, "q": "Un vehículo de policía situado detrás del tuyo muestra sus señales especiales y una luz roja intermitente hacia delante. ¿Qué debes hacer?", "opts": ["Detenerte a la derecha, delante del vehículo policial, y no salir del tuyo.", "Detenerte en tu carril, bajar del vehículo y esperar junto a la puerta trasera.", "Seguir hasta el siguiente área de servicio y detenerte allí con total calma."], "a": 0, "expl": "Debes detener el vehículo a la derecha, delante del policial, en un lugar sin riesgo, permanecer en su interior y seguir las instrucciones del agente.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 69", "img": null}, {"tema": 4, "q": "Un ciclista de 16 años quiere circular por el arcén de una autovía en la que no hay ninguna señal que lo prohíba. ¿Puede hacerlo?", "opts": ["Sí, si es mayor de 14 años, salvo prohibición señalizada", "Sí, pero solo si le acompaña un vehículo de apoyo en todo momento", "No, las bicicletas no pueden circular nunca por autovías"], "a": 0, "expl": "Las bicicletas pueden circular por el arcén de las autovías si el conductor es mayor de 14 años, salvo que la señalización lo prohíba por razones de seguridad.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 38.1", "img": null}, {"tema": 4, "q": "Te aproximas a una glorieta en la que no gozas de prioridad. ¿Cómo debes circular?", "opts": ["A velocidad moderada y, si fuera preciso, deteniendo el vehículo", "Acelerando para entrar antes de que lleguen otros vehículos al anillo", "Manteniendo la velocidad, pues los que están en el anillo deben anticiparse"], "a": 0, "expl": "Al aproximarse a glorietas e intersecciones en que no se goza de prioridad se debe circular a velocidad moderada y, si es preciso, detenerse.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 46.1 h)", "img": null}, {"tema": 4, "q": "¿Cuál de estos vehículos tiene prohibido circular por un carril habilitado para VAO?", "opts": ["Un ciclomotor", "Una motocicleta", "Un vehículo mixto adaptable"], "a": 0, "expl": "El carril VAO queda limitado a motocicletas, turismos y vehículos mixtos adaptables (con la ocupación exigida); está prohibido, entre otros, a los ciclomotores.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 35.2.a)", "img": null}, {"tema": 4, "q": "Dos turismos se encuentran en un puente que no permite el cruce. En un extremo hay una señal de ceda el paso. ¿Quién debe retroceder?", "opts": ["El que haya entrado en último lugar en el puente, sin tener en cuenta la señal", "El que haya llegado por el extremo contrario al de la señal de ceda el paso", "El que haya llegado por el extremo en que está la señal de ceda el paso"], "a": 2, "expl": "Si en un extremo del puente hay señal de ceda el paso o de prioridad en sentido contrario, el que llegue por ese extremo retrocede para dejar paso al otro.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 61.2", "img": null}, {"tema": 4, "q": "Dos turismos llegan a una intersección entre vías pavimentadas, sin señales de prioridad, sin semáforos ni agentes y sin raíles. ¿Quién debe ceder el paso?", "opts": ["El que ve acercarse al otro por su izquierda", "El que circula a menor velocidad de los dos", "El que ve acercarse al otro por su derecha"], "a": 2, "expl": "En defecto de señal que regule la preferencia, se cede el paso a los vehículos que se aproximan por la derecha.", "fuente": "RGC art. 57.1", "img": null}, {"tema": 4, "q": "Te va a adelantar otro vehículo y la calzada tiene espacio suficiente. ¿Qué te está prohibido a ti, conductor del vehículo adelantado?", "opts": ["Disminuir la velocidad si surge una situación de peligro", "Ceñirte al borde derecho de la calzada para dejar paso", "Aumentar la velocidad para impedir que te adelanten"], "a": 2, "expl": "Se prohíbe al conductor del vehículo adelantado aumentar la velocidad o efectuar maniobras que impidan o dificulten el adelantamiento.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 86.2", "img": null}, {"tema": 4, "q": "En un tramo de gran pendiente tan estrecho que impide el cruce y sin señalizar, el turismo que sube puede llegar antes a un apartadero. ¿Quién tiene preferencia?", "opts": ["El turismo que sube, pues en pendiente el ascendente siempre tiene preferencia", "Ninguno de los dos, pues deben ponerse de acuerdo entre ellos sin que exista regla", "El que baja, pues el que sube puede llegar antes al apartadero"], "a": 2, "expl": "El vehículo ascendente tiene preferencia salvo que pueda llegar antes a un apartadero; en ese caso la preferencia pasa al descendente.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 63.1", "img": null}, {"tema": 4, "q": "Se incendia tu vehículo dentro de un túnel. ¿Qué debes hacer con él?", "opts": ["Seguir circulando hasta la salida, aunque debas ir muy lento", "Arrimarlo a la derecha, apagar el motor y dejar la llave puesta", "Detenerlo en el centro de la calzada y cerrar con llave las puertas"], "a": 1, "expl": "En caso de incendio en un túnel se aproxima el vehículo todo lo posible a la derecha, se apaga el motor y se deja la llave puesta y las puertas abiertas; después se abandona en sentido contrario al fuego.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 97.3", "img": null}, {"tema": 4, "q": "Una comitiva organizada de personas a pie cruza la calzada. ¿Quién tiene prioridad de paso?", "opts": ["Los vehículos, que tienen prioridad en la calzada", "Los vehículos, si no hay paso para peatones", "Los peatones de la comitiva"], "a": 2, "expl": "Los peatones tienen prioridad de paso sobre los vehículos cuando transitan unidades militares a pie, filas escolares y comitivas organizadas.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 65.1.e)", "img": null}, {"tema": 4, "q": "Circulas por un carril habilitado en sentido contrario al habitual. ¿Puedes invadir el carril del sentido normal para adelantar?", "opts": ["Sí, si el carril contiguo está libre y la maniobra es segura.", "No, ni siquiera para adelantar.", "Sí, pero solo para adelantar a vehículos de dos ruedas."], "a": 1, "expl": "Los usuarios de estos carriles no pueden desplazarse lateralmente invadiendo el carril o carriles del sentido normal, ni siquiera para adelantar.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 41.1", "img": null}, {"tema": 4, "q": "En una calzada con varios carriles delimitados por marcas, solo el carril por el que circulas lleva pintado un STOP. ¿A quién obliga?", "opts": ["A los vehículos de ese carril y a los del carril contiguo situados a su izquierda", "Exclusivamente a los vehículos que circulan por ese carril", "A todos los vehículos que circulan por cualquier carril de esa calzada"], "a": 1, "expl": "Si la marca de STOP está en un carril delimitado por marcas longitudinales, la obligación afecta solo a los vehículos de ese carril.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, 4.4 (M-6.3 y M-6.4)", "img": null}, {"tema": 4, "q": "Ves una marca de paso a nivel en el pavimento antes de un cruce con una vía de tranvía. ¿Qué debes hacer?", "opts": ["Pasar con preferencia, porque el tranvía debe esperar a los vehículos de la calzada", "Ceder el paso si se aproxima un tren o un tranvía", "Detenerte siempre, aunque no se aproxime ningún tranvía"], "a": 1, "expl": "La marca de paso a nivel indica la proximidad de un paso a nivel por vía de ferrocarril o tranvía, en el que los vehículos deben ceder el paso cuando se aproxime un tren o tranvía.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, 4.4 (M-7.5)", "img": null}, {"tema": 4, "q": "Conduces un vehículo pesado por una calzada estrecha en la que no pueden adelantarte con facilidad por el tráfico contrario. ¿Qué debes hacer?", "opts": ["Aminorar la marcha o apartarte al arcén, si es practicable, para dejar paso.", "Mantener tu velocidad y trayectoria, pues adelantar es cosa de quien te sigue.", "Acelerar para llegar antes a un tramo más ancho."], "a": 0, "expl": "Los conductores de vehículos pesados deben aminorar o apartarse cuanto antes al arcén, si resulta practicable, cuando no puedan ser adelantados con facilidad y sin peligro.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 86.3", "img": null}, {"tema": 4, "q": "Tu vehículo cruza una zona peatonal por la zona habilitada para ello y por ella circulan peatones. ¿Qué debes hacer?", "opts": ["Dejar pasar a los peatones que circulen por ella", "Continuar, pues la zona habilitada da preferencia al vehículo", "Avisar con la bocina y seguir despacio si los peatones no se apartan"], "a": 0, "expl": "En las zonas peatonales, cuando los vehículos las cruzan por zonas habilitadas, deben dejar pasar a los peatones.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 65.2", "img": null}, {"tema": 4, "q": "Un turismo circula por una carretera convencional con arcén y no existe ninguna emergencia. ¿Por dónde debe circular?", "opts": ["Por la calzada, no por el arcén", "Por el arcén, si el tráfico es denso", "Por la calzada o el arcén, según la hora del día"], "a": 0, "expl": "El conductor de un automóvil circula por la calzada y no por el arcén, salvo por razones de emergencia.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 30.1", "img": null}, {"tema": 4, "q": "En el régimen de circulación de convoyes militares del Reglamento, ¿cómo se define un convoy?", "opts": ["Dos unidades: la de cabeza y la de cola, ambas con la señal V-2", "Tres o más unidades, dos de ellas señalizadoras de cabeza y cola", "Cinco unidades, con un vehículo señalizador cada dos vehículos más"], "a": 1, "expl": "Convoy es todo grupo de al menos tres unidades, de las cuales dos son los vehículos señalizadores de cabeza y cola, que montan la señal V-2.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo III, Sección 2.ª, apartado 1.e)", "img": null}, {"tema": 4, "q": "En un tramo en obras, un operario regula el paso y sus indicaciones difieren de lo que harías por tu cuenta. ¿Qué debes hacer?", "opts": ["Atenerte a tu criterio, pues un operario de obra no tiene facultad para regular", "Seguir las indicaciones del personal destinado a regular el paso de vehículos", "Esperar a que un agente confirme las indicaciones del operario antes de obedecerlas"], "a": 1, "expl": "En los tramos en obras y estrechamientos los usuarios están obligados a seguir las indicaciones del personal que regula el paso.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 60.5", "img": null}, {"tema": 4, "q": "Te acercas a un paso a nivel con barreras, y estas empiezan a bajar mientras el tren aún no ha llegado. ¿Qué debes hacer?", "opts": ["Cruzar con rapidez si no ves el tren, antes de que las barreras terminen de cerrarse del todo", "Entrar solo si puedes pasar a velocidad moderada rodeando las barreras por el carril contrario", "No entrar en el paso a nivel y esperar hasta que se levanten las barreras"], "a": 2, "expl": "Está prohibido entrar en un paso a nivel con barreras o semibarreras atravesadas en la vía o en movimiento, o con semáforo que ordene detenerse.", "fuente": "RGC art. 96.1", "img": null}, {"tema": 4, "q": "¿Qué deben hacer todos los conductores al aproximarse a un paso a nivel?", "opts": ["Mantener la velocidad máxima permitida si no se ve ningún tren.", "Acelerar para cruzar cuanto antes si la vía está libre.", "Extremar la prudencia y reducir la velocidad por debajo de la máxima permitida."], "a": 2, "expl": "Al aproximarse a un paso a nivel o a un puente móvil hay que extremar la prudencia y reducir la velocidad por debajo de la máxima permitida.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 95.1", "img": null}, {"tema": 4, "q": "Una fila escolar cruza la calzada por la que circulas con tu turismo. ¿Qué debes hacer?", "opts": ["Dejarla pasar solo si cruza por un paso para peatones debidamente señalizado", "Continuar si no ocupa tu carril, reduciendo algo la velocidad al pasar junto a ella", "Dejarla pasar, ya que las filas escolares tienen prioridad sobre los vehículos"], "a": 2, "expl": "Los peatones tienen prioridad cuando transitan unidades militares a pie, filas escolares y comitivas organizadas.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 65.1 e)", "img": null}, {"tema": 4, "q": "Por unos trabajos en la calzada se habilita un carril en sentido contrario al habitual. ¿Qué vehículos pueden circular por él?", "opts": ["Únicamente los vehículos que participan en los trabajos de obra", "Solo las motocicletas y los turismos que no arrastren remolque", "Todos los autorizados a circular por la vía, salvo prohibición expresa"], "a": 2, "expl": "Cuando el carril en sentido contrario se habilita por obras, pueden usarlo todos los tipos de vehículos autorizados a circular por la vía en obra, salvo prohibición expresa y con las mismas condiciones de velocidad y alumbrado.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 41.1", "img": null}, {"tema": 4, "q": "¿Puede adelantarse a otro vehículo dentro de una glorieta?", "opts": ["Sí, la prohibición en intersecciones no se aplica a las glorietas.", "Solo si el vehículo adelantado es una bicicleta o un ciclomotor.", "No, está prohibido adelantar en cualquier intersección, glorietas incluidas."], "a": 0, "expl": "El art. 87 prohíbe adelantar en las intersecciones y sus proximidades, pero exceptúa las plazas de circulación giratoria o glorietas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 87.1.c).1.º", "img": null}, {"tema": 4, "q": "Tu coche queda parado por fuerza mayor sobre un paso a nivel. ¿Qué debes hacer en primer lugar?", "opts": ["Quedarte dentro del coche e intentar arrancarlo hasta lograrlo", "Alejarte solo tú y avisar a los demás cuando llegue el tren", "Desalojar a los ocupantes y dejar el paso libre cuanto antes"], "a": 2, "expl": "El conductor debe adoptar las medidas para el rápido desalojo de los ocupantes y dejar el paso expedito en el menor tiempo posible; si no lo logra, debe avisar del peligro con antelación.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 97.1", "img": null}, {"tema": 4, "q": "Circulas por un túnel de doble sentido que dispone de dos carriles para tu sentido. ¿Puedes adelantar?", "opts": ["Sí, siempre que no invadas el sentido contrario.", "Sí, invadiendo el sentido contrario si lo ves libre.", "No, en un túnel está prohibido adelantar en todo caso."], "a": 0, "expl": "En túneles con circulación en ambos sentidos se prohíbe adelantar, salvo que haya más de un carril para tu sentido, en cuyo caso se puede adelantar sin invadir el sentido contrario.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 95.6", "img": null}, {"tema": 4, "q": "En una calle de poblado con dos carriles para tu sentido, delimitados por marcas longitudinales, ¿qué carril puede utilizar un turismo?", "opts": ["El que mejor convenga a su destino, sin ser obstáculo", "Obligatoriamente el de la derecha, salvo para adelantar", "El de la izquierda, y solo el de la derecha para parar"], "a": 0, "expl": "En poblado, con al menos dos carriles delimitados para el mismo sentido, el conductor utiliza el que mejor convenga a su destino siempre que no obstaculice a los demás, y solo lo abandona para prepararse a cambiar de dirección, adelantar, parar o estacionar.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 33", "img": null}, {"tema": 4, "q": "Circulas por un carril del sentido normal contiguo a otro habilitado en sentido contrario al habitual. ¿Puedes invadir ese carril habilitado?", "opts": ["Sí, siempre que lo hagas a menos de 80 km/h", "Sí, para adelantar si está libre y con la luz de cruce", "No, tampoco para adelantar"], "a": 2, "expl": "Los conductores de los carriles del sentido normal contiguos al habilitado en sentido contrario tampoco pueden desplazarse lateralmente invadiéndolo.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 41.1", "img": null}, {"tema": 4, "q": "Tras completar un adelantamiento, ¿cómo debes reintegrarte a tu carril?", "opts": ["Únicamente cuando el vehículo adelantado haya reducido por completo su velocidad.", "Gradualmente y cuanto antes, sin obligar a otros a variar su marcha.", "Con un giro brusco, para ocupar el carril del adelantado el menor tiempo posible."], "a": 1, "expl": "El conductor debe reintegrarse tan pronto como le sea posible, de modo gradual, sin obligar a otros usuarios a modificar su trayectoria o velocidad, y avisarlo.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 85.3", "img": null}, {"tema": 4, "q": "En una intersección señalizada con ceda el paso, un vehículo de la vía preferente se acerca por tu izquierda. ¿Debes cederle el paso?", "opts": ["Sí, vengan por el lado que vengan.", "Solo si se aproxima por tu derecha, no por la izquierda.", "No, si tú has llegado antes que él a la intersección."], "a": 0, "expl": "En intersecciones con ceda el paso o stop se cede siempre el paso a los vehículos de la vía preferente, cualquiera que sea el lado por el que se aproximen.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 56.5", "img": null}, {"tema": 4, "q": "El vehículo que te precede indica claramente que va a girar a la izquierda y hay espacio suficiente. ¿Cómo puedes adelantarlo?", "opts": ["Por la izquierda, aprovechando que se desplaza hacia ese lado.", "No puedes adelantarlo; debes esperar detrás hasta que gire.", "Por la derecha, adoptando las máximas precauciones."], "a": 2, "expl": "Por excepción, si hay espacio suficiente, se adelanta por la derecha con las máximas precauciones al vehículo que indica claramente que girará a la izquierda o parará en ese lado.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 82.2", "img": null}, {"tema": 4, "q": "En una vía dividida en dos calzadas por una mediana, ¿por cuál debe circular un vehículo?", "opts": ["Por cualquiera de las dos, mientras mantenga su sentido", "Por la más cercana a la mediana si va más rápido", "Por la calzada de su derecha, según su sentido"], "a": 2, "expl": "En las vías divididas en dos calzadas por medianas o separadores, los vehículos deben utilizar la calzada de la derecha en relación con el sentido de su marcha.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 44.1", "img": null}, {"tema": 4, "q": "En un túnel, un turismo (masa máxima autorizada de 3.500 kg o menos) que no pretende adelantar sigue a otro vehículo. ¿Qué distancia de seguridad mínima debe mantener?", "opts": ["Al menos 100 metros o un intervalo de cuatro segundos.", "Al menos 50 metros o un intervalo de dos segundos.", "Al menos 70 metros o un intervalo de tres segundos."], "a": 0, "expl": "En túneles y pasos inferiores, si no se pretende adelantar, se mantienen al menos 100 metros o cuatro segundos (150 m o seis segundos si la masa máxima autorizada supera 3.500 kg).", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 95.6", "img": null}, {"tema": 4, "q": "Encuentras cerrado un paso a nivel y ya hay otros vehículos esperando. ¿Qué debes hacer?", "opts": ["Adelantar a los vehículos que esperan para cruzar el primero.", "Detenerte detrás del último vehículo, en tu carril, hasta que tengas paso libre.", "Esperar en el carril contrario para cruzar en cuanto se levante la barrera."], "a": 1, "expl": "Quien encuentre cerrado el paso a nivel debe detenerse uno detrás de otro en el carril correspondiente hasta que tenga paso libre.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 95.2", "img": null}, {"tema": 4, "q": "En un tramo estrecho y de gran pendiente, sin señalización, el vehículo que sube puede llegar antes a un apartadero que el que baja. ¿Quién tiene preferencia?", "opts": ["El que sube, salvo que lleve remolque", "El que baja, pues el otro llega antes al apartadero", "El que sube, pues siempre tiene preferencia en pendiente"], "a": 1, "expl": "El vehículo ascendente tiene preferencia salvo si pudiera llegar antes a un apartadero establecido al efecto; en ese caso la tiene el descendente.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 63.1", "img": null}, {"tema": 4, "q": "Circulas por una carretera convencional y percibes las señales especiales de una ambulancia en servicio urgente que se aproxima. ¿Qué debes hacer?", "opts": ["Facilitarle el paso, apartándote normalmente a la derecha o deteniéndote si es preciso", "Mantener posición y velocidad, porque la ambulancia debe adaptarse al tráfico existente", "Acelerar para liberar cuanto antes el carril por el que ella circula hacia delante"], "a": 0, "expl": "Al percibir las señales especiales de un vehículo prioritario hay que facilitarle el paso, apartándose normalmente a la derecha o deteniéndose si fuera preciso.", "fuente": "RGC art. 69 (redacción RD 518/2026)", "img": null}, {"tema": 4, "q": "Una ambulancia en servicio urgente se acerca a un semáforo en rojo. ¿Qué debe hacer antes de saltárselo?", "opts": ["Hacer sonar la sirena unos segundos y cruzar sin reducir la velocidad, pues tiene prioridad", "Extremar la precaución hasta comprobar que no hay riesgo y que los demás ceden el paso", "Ninguna cautela adicional, ya que sus señales especiales eximen de cualquier comprobación"], "a": 1, "expl": "Los vehículos prioritarios no deben vulnerar la prioridad ni los semáforos sin adoptar extremadas precauciones hasta cerciorarse de que no hay riesgo de atropello y de que los demás han detenido su marcha o facilitan la suya.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 67.2", "img": null}, {"tema": 4, "q": "¿Qué puede hacer, con carácter excepcional, un vehículo prioritario en servicio urgente en una autovía si no compromete la seguridad de nadie?", "opts": ["Entrar en la mediana o ir en sentido contrario por el arcén", "Circular en sentido contrario por el carril izquierdo de la calzada", "Cruzar la mediana por cualquier punto aunque haya tráfico en la autovía"], "a": 0, "expl": "En autopista o autovía, en servicio urgente y sin comprometer la seguridad, pueden dar media vuelta o marcha atrás, circular en sentido contrario por el arcén o penetrar en la mediana o en sus pasos transversales.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 68.1", "img": null}, {"tema": 4, "q": "Un conductor debe ceder el paso en una intersección. ¿Cuándo puede iniciar o reanudar la marcha?", "opts": ["Cuando calcula que le da tiempo a cruzar, aunque el conductor con prioridad deba frenar un poco para evitarlo", "Cuando se ha asegurado de que no obligará al prioritario a variar bruscamente su trayectoria o velocidad", "En cuanto reduce la velocidad y avisa con el intermitente, sin esperar a ninguna otra comprobación previa"], "a": 1, "expl": "Quien debe ceder no puede iniciar, continuar ni reanudar la marcha hasta asegurarse de que no obligará al prioritario a cambiar bruscamente de trayectoria o velocidad.", "fuente": "RGC art. 58 (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 4, "q": "Vas a cambiar de carril en una calzada con dos carriles para tu sentido. ¿Quién tiene prioridad?", "opts": ["Quien circula por el carril que vas a ocupar", "El vehículo que activó antes el intermitente de los dos", "El que circule a menor velocidad de los dos vehículos"], "a": 0, "expl": "Toda maniobra de desplazamiento lateral que implique cambio de carril debe respetar la prioridad del que circula por el carril que se pretende ocupar.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 74.2", "img": null}, {"tema": 4, "q": "Circulas por una vía con la señal de calzada con prioridad y llegas a una intersección. ¿Qué prioridad tienes?", "opts": ["La de paso solo sobre los vehículos que se aproximen desde tu lado izquierdo", "Ninguna, pues en toda intersección debes ceder a los que vengan por tu derecha", "La de paso sobre los vehículos que circulen por otra vía o procedan de ella"], "a": 2, "expl": "La señal de calzada con prioridad da preferencia sobre los vehículos de las vías que la cruzan o que proceden de ellas.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 56.4", "img": null}, {"tema": 4, "q": "Has adelantado a un vehículo en una calzada con dos carriles para tu sentido y vas a adelantar a otro. ¿Puedes permanecer en el carril de adelantamiento?", "opts": ["No, debes volver al carril de la derecha tras cada adelantamiento", "Sí, si no molestas a los que circulan detrás más rápido", "Sí, pero solo si vas a la velocidad máxima de la vía"], "a": 1, "expl": "Con al menos dos carriles para el sentido de marcha, se puede permanecer en el carril usado para el adelantamiento anterior si no se molesta indebidamente a los que vienen detrás más velozmente.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 83.1", "img": null}, {"tema": 4, "q": "Llegas a un paso a nivel sin barreras, semibarreras ni semáforos. ¿Qué debes hacer antes de penetrar en él?", "opts": ["Cerciorarte de que no se acerca ningún vehículo sobre raíles.", "Seguir al vehículo que te precede si este cruza sin detenerse.", "Cruzar con rapidez si no oyes ningún tren a lo lejos."], "a": 0, "expl": "Nadie debe entrar en un paso a nivel sin barreras ni semáforos sin cerciorarse antes de que no se acerca ningún vehículo sobre raíles.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 96.2", "img": null}, {"tema": 4, "q": "Una patrulla de seguridad ciudadana establece un control policial en la vía pública. ¿Cuándo puede regular el tráfico?", "opts": ["Siempre, con la misma autoridad que los agentes de tráfico", "Solo cuando el control se realice de noche o con niebla", "Solo si faltan los agentes de vigilancia del tráfico"], "a": 2, "expl": "Las Fuerzas y Cuerpos de Seguridad que establecen controles de seguridad ciudadana pueden regular el tráfico exclusivamente en ausencia de los agentes encargados de la vigilancia del tráfico.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 141.4", "img": null}, {"tema": 4, "q": "¿Se puede adelantar en una curva de visibilidad reducida?", "opts": ["Solo si los sentidos están delimitados y no se invade el contrario.", "No, en ningún caso, aunque los sentidos estén claramente delimitados.", "Sí, si se avisa con la bocina antes de iniciar la maniobra."], "a": 0, "expl": "Se prohíbe adelantar en curvas y cambios de rasante de visibilidad reducida, salvo que los dos sentidos estén claramente delimitados y la maniobra se haga sin invadir el sentido contrario.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 87.1.a)", "img": null}, {"tema": 4, "q": "¿Qué vehículos pueden utilizar un carril habilitado para circular en sentido contrario al habitual por razones de fluidez?", "opts": ["Motocicletas y turismos, sin remolque.", "Cualquier vehículo, salvo los camiones de gran tonelaje.", "Turismos y motocicletas, con o sin remolque."], "a": 0, "expl": "La utilización de estos carriles se limita a motocicletas y turismos y está prohibida al resto de los vehículos, incluidos los turismos con remolque.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 41.1", "img": null}, {"tema": 4, "q": "¿Qué obliga a hacer esta señal a quien llega a ella?", "opts": ["Detenerse únicamente si se acerca algún vehículo por la vía preferente en ese momento", "Reducir la velocidad y cruzar sin detenerse si no se acerca ningún vehículo por ella", "Detenerse siempre y ceder el paso a los vehículos de la vía preferente"], "a": 2, "expl": "Ante la señal de stop hay que detenerse siempre, y ceder el paso a los vehículos que circulan por la vía preferente, vengan de donde vengan.", "fuente": "RGC art. 56.5", "img": "sign:stop"}, {"tema": 4, "q": "¿Puede adelantarse a otro vehículo en las proximidades de un paso a nivel?", "opts": ["Sí, siempre que las barreras estén levantadas y no se vea ningún tren.", "Sí, si el vehículo adelantado es una bicicleta o un ciclomotor.", "No, está prohibido adelantar en los pasos a nivel y sus proximidades."], "a": 2, "expl": "El art. 87.1.b prohíbe adelantar en los pasos a nivel y en sus proximidades, sin excepciones para vehículos de dos ruedas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 87.1.b)", "img": null}, {"tema": 4, "q": "¿Cómo debe mostrar el conductor que va a cederle el paso a otro vehículo?", "opts": ["Con un frenazo brusco que deje clara a los demás su intención de cederles el paso", "Con ráfagas de luz continuadas dirigidas al conductor que tiene la prioridad de paso", "Con su forma de circular, especialmente reduciendo paulatinamente la velocidad"], "a": 2, "expl": "Quien cede debe mostrarlo con antelación por su forma de circular y reduciendo la velocidad de forma paulatina, sin forzar al otro a modificar bruscamente su trayectoria o velocidad.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 58.1", "img": null}, {"tema": 4, "q": "Te has detenido ante una línea de detención continua por un stop, pero desde ahí no ves si se acercan vehículos. ¿Qué debes hacer?", "opts": ["Detenerte de nuevo donde tengas visibilidad, sin poner en peligro a nadie", "Esperar sin moverte a que otro conductor te avise por señas de que puedes pasar", "Avanzar sin detenerte hasta ver la vía, pues ya cumpliste la obligación de parar"], "a": 0, "expl": "Si desde la línea de detención no hay visibilidad suficiente, el conductor debe detenerse de nuevo donde la tenga, sin poner en peligro a nadie.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, 4.2 (M-4.1)", "img": null}, {"tema": 4, "q": "¿Cuándo debe un vehículo prioritario en servicio urgente usar solo la señal luminosa, sin la acústica?", "opts": ["Cuando el servicio sea de menor urgencia que otros servicios", "Cuando omitir las señales acústicas no entrañe peligro", "Siempre que circule de noche por una vía urbana o travesía"], "a": 1, "expl": "Normalmente se usan a la vez la luz y la señal acústica; la luminosa puede usarse aisladamente cuando omitir la acústica no entraña peligro para los demás usuarios.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 68.2", "img": null}, {"tema": 4, "q": "Tienes prioridad de paso en una intersección, pero el tráfico de delante está retenido y previsiblemente quedarías detenido en mitad del cruce. ¿Qué debes hacer?", "opts": ["Entrar, porque tu prioridad te permite ocupar el cruce y los demás deben esperar", "Entrar y avisar con el claxon a quienes circulan en sentido transversal", "No entrar en la intersección hasta tener espacio libre para salir de ella"], "a": 2, "expl": "Aunque se tenga prioridad, no se debe entrar en una intersección si se puede quedar detenido impidiendo u obstruyendo la circulación transversal.", "fuente": "RGC art. 59 (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 4, "q": "En una carretera con arcenes se ha habilitado un carril adicional circunstancial con elementos provisionales de balizamiento. ¿Qué velocidades se aplican, salvo que se señalicen otras inferiores?", "opts": ["Máxima de 80 km/h y mínima de 60 km/h.", "Máxima de 60 km/h y mínima de 40 km/h.", "Máxima de 100 km/h y mínima de 80 km/h."], "a": 0, "expl": "En el carril adicional circunstancial y en los arcenes se circula a una velocidad máxima de 80 km/h y mínima de 60, o inferiores si así está señalizado.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 42.1", "img": null}, {"tema": 4, "q": "Un agente que circula en un vehículo te dirige el brazo extendido hacia abajo, inclinado y fijo. ¿Qué te indica?", "opts": ["Que debes reducir la velocidad y seguir con precaución", "Que debes detenerte en el lado derecho", "Que debes detenerte en el lado izquierdo de la vía"], "a": 1, "expl": "Esta señal desde un vehículo obliga a los usuarios a los que va dirigida a detenerse en el lado derecho.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.2.d)", "img": null}, {"tema": 4, "q": "Circulas por carretera convencional y un vehículo adelanta a otro. Para adelantar a ese vehículo tendrías que invadir el sentido contrario. ¿Puedes hacerlo?", "opts": ["Sí, si aceleras mucho y la visibilidad es buena.", "No, está prohibido si has de invadir el sentido contrario.", "Sí, si el vehículo adelantante lleva puesto el intermitente."], "a": 1, "expl": "Se prohíbe adelantar a los vehículos que ya estén adelantando a otro si el tercer vehículo ha de invadir la parte de calzada del sentido contrario.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 84.2", "img": null}, {"tema": 4, "q": "Por una avería de emergencia tu turismo queda inmovilizado dentro de un túnel. ¿Qué debes hacer con el motor y las luces?", "opts": ["Mantener el motor en marcha y apagar todas las luces del coche", "Apagar el motor y todas las luces, y encender solo las de cruce", "Apagar el motor, poner emergencia y mantener luces de posición"], "a": 2, "expl": "Ante una inmovilización por emergencia en un túnel hay que apagar el motor, conectar la señal de emergencia y mantener encendidas las luces de posición.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 97.3.a)", "img": null}, {"tema": 4, "q": "¿En cuál de estos lugares está prohibido, como regla general, cambiar el sentido de la marcha?", "opts": ["En un paso a nivel.", "En un tramo recto de carretera convencional con buena visibilidad.", "En una calle de poblado con visibilidad suficiente y sin tráfico."], "a": 0, "expl": "Se prohíbe el cambio de sentido en pasos a nivel, túneles, pasos inferiores y autopistas y autovías (salvo lugares habilitados).", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 79.1", "img": null}, {"tema": 4, "q": "En una glorieta sin ninguna señal que regule la prioridad de paso, ¿quién tiene preferencia?", "opts": ["Los vehículos que ya circulan por la vía circular", "Los vehículos que entran, si lo hacen a mayor velocidad", "Los vehículos que se disponen a entrar, por llegar por la derecha"], "a": 0, "expl": "En las glorietas, los que se hallan dentro de la vía circular tienen preferencia de paso sobre los que pretenden acceder a ella.", "fuente": "RGC art. 57 (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 4, "q": "Un ciclomotor adelanta a otro por el arcén. ¿Cuál es el límite de la marcha en paralelo durante la maniobra?", "opts": ["30 segundos o 300 metros de recorrido", "10 segundos o 100 metros de recorrido", "15 segundos o 200 metros de recorrido"], "a": 2, "expl": "No puede adelantarse si la marcha en paralelo excede de 15 segundos o el recorrido así efectuado supera los 200 metros (regla que no se aplica a las bicicletas).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 36.5", "img": null}, {"tema": 4, "q": "Un autobús de más de 3.500 kg de masa máxima autorizada, ocupado solo por su conductor, ¿puede usar un carril VAO?", "opts": ["Sí, con independencia del número de ocupantes", "No, salvo que lleve los ocupantes mínimos del tramo", "No, los autobuses tienen prohibido el carril VAO"], "a": 0, "expl": "Los autobuses de más de 3.500 kg y los articulados pueden usar el carril VAO con independencia de su número de ocupantes, en las mismas condiciones de circulación.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 35.2.a)", "img": null}, {"tema": 4, "q": "Circulas por una calzada de doble sentido con tres carriles separados por líneas discontinuas y ves que un vehículo del sentido contrario ocupa el carril central para adelantar. ¿Puedes adelantar tú?", "opts": ["Sí, pues el carril central es de uso compartido por ambos sentidos", "No, solo cuando los contrarios no han ocupado ese carril central", "Sí, si te desplazas a la izquierda hasta la línea discontinua"], "a": 1, "expl": "En calzadas de doble sentido y tres carriles, solo se puede adelantar cuando los conductores del sentido contrario no hayan ocupado el carril central para adelantar a su vez.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 84.1", "img": null}, {"tema": 4, "q": "En una carretera convencional con un carril por sentido, fuera de poblado, vas a adelantar a un ciclista. ¿Qué separación lateral de seguridad debes guardar como mínimo?", "opts": ["0,5 metros", "1 metro", "1,5 metros"], "a": 2, "expl": "Al adelantar a ciclistas y demás usuarios citados hay que guardar una anchura de seguridad de al menos 1,5 metros, ocupando si es preciso parte del carril contiguo o contrario si es seguro.", "fuente": "RGC art. 85.4 (redacción RD 518/2026)", "img": null}, {"tema": 4, "q": "Una línea transversal discontinua en el pavimento ante una intersección, ¿qué indica?", "opts": ["Que obliga siempre a detener el vehículo por completo antes de franquearla", "Que no debe franquearse al tener que ceder el paso, salvo visibilidad muy reducida", "Que prohíbe franquearla a cualquier vehículo en toda circunstancia, aunque no deba ceder"], "a": 1, "expl": "La marca M-4.2 indica que, salvo circunstancias anormales que reduzcan la visibilidad, no debe franquearse cuando se tiene que ceder el paso (ceda el paso, flecha verde o ámbar intermitente o normas generales).", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, 4.2 (M-4.2)", "img": null}, {"tema": 4, "q": "Circulas por una calle de un solo sentido, sin señalización especial, y vas a girar a la izquierda. ¿Dónde debes colocarte?", "opts": ["En el centro de la calzada, a igual distancia de ambos bordes", "Lo más cerca posible del borde izquierdo de la calzada", "Lo más cerca posible del borde derecho de la calzada"], "a": 1, "expl": "Si el giro es a la izquierda y la calzada es de un solo sentido, hay que ceñirse todo lo posible al borde izquierdo.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 75.1.b)", "img": null}, {"tema": 4, "q": "Conduces un ciclomotor de dos ruedas por una vía interurbana y vas a girar a la izquierda donde no hay carril acondicionado para ello. ¿Qué debes hacer?", "opts": ["Situarte a la derecha, fuera de la calzada si puedes, y girar", "Girar desde el centro de tu carril, con el brazo izquierdo extendido", "Colocarte junto al eje de la calzada y girar cuando no vengan vehículos"], "a": 0, "expl": "En vías interurbanas, ciclos y ciclomotores de dos ruedas sin carril de giro a la izquierda deben situarse a la derecha, fuera de la calzada si es posible, e iniciar el giro desde ese lugar.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 76.2", "img": null}, {"tema": 4, "q": "En un tramo de carretera convencional con adelantamiento prohibido, sin autorización expresa de cambio de sentido, ¿puede invertirse el sentido de la marcha?", "opts": ["No, el cambio de sentido también está prohibido en esos tramos.", "Sí, si hay buena visibilidad y no se acerca ningún vehículo.", "Sí, si se avisa con el intermitente con suficiente antelación."], "a": 0, "expl": "El cambio de sentido se prohíbe en todos los tramos en que está prohibido adelantar, salvo autorización expresa.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 79.1", "img": null}, {"tema": 4, "q": "En un puente estrecho no pueden cruzarse dos vehículos y, en tu extremo, hay una señal de prioridad en sentido contrario. ¿Quién debe retroceder?", "opts": ["Tú, que llegas por ese extremo", "El de menor masa de los dos vehículos", "El que primero haya entrado en el puente"], "a": 0, "expl": "Si en un extremo hay señal de prioridad en sentido contrario o de ceda el paso, el que llega por ese extremo ha de retroceder para dejar paso al otro.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 61.2", "img": null}, {"tema": 4, "q": "Llegas a un paso a nivel abierto, pero al otro lado hay una cola de coches detenidos. ¿Puedes cruzar?", "opts": ["Sí, si cruzas con las luces de emergencia conectadas", "Sí, porque el paso a nivel está abierto y sin tren a la vista", "No, si existe riesgo de quedar inmovilizado dentro del paso"], "a": 2, "expl": "El cruce debe hacerse sin demora y tras cerciorarse de que no existe riesgo de quedar inmovilizado dentro del paso.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 95.3", "img": null}, {"tema": 4, "q": "En un tramo estrecho sin señalización, un autobús de transporte colectivo y un camión no pueden cruzarse y no se sabe quién entró antes. ¿Quién tiene preferencia?", "opts": ["El que lleve más ocupantes a bordo", "El camión", "El autobús"], "a": 2, "expl": "El orden de preferencia en ausencia de señalización sitúa los vehículos de transporte colectivo de viajeros por delante de los camiones, tractocamiones y furgones.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 62.1", "img": null}, {"tema": 4, "q": "En un tramo de gran pendiente, tan estrecho que impide el cruce y sin señalización, ¿qué vehículo tiene preferencia de paso como regla general?", "opts": ["El que lleva mayor masa de los dos", "El que circula en sentido ascendente", "El que circula en sentido descendente"], "a": 1, "expl": "En tramos de gran pendiente (inclinación mínima del 7 %) con estrechez, la preferencia es del vehículo que sube, salvo que el que baja llegue antes a un apartadero.", "fuente": "RGC art. 63", "img": null}, {"tema": 4, "q": "Dos ciclomotores circulan por el arcén de una carretera. ¿Pueden ir en posición paralela?", "opts": ["Sí, siempre que el arcén tenga anchura para ambos", "No, está prohibido ir en paralelo", "Sí, pero solo de día y con buena visibilidad"], "a": 1, "expl": "Se prohíbe la circulación en posición paralela de los vehículos del art. 36.1 (entre ellos los ciclomotores). La excepción de ir en columna de a dos solo se prevé para las bicicletas.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 36.2", "img": null}, {"tema": 4, "q": "Vas a cambiar de carril en una calzada con varios carriles para tu sentido, y por el carril al que quieres pasar circula otro vehículo. ¿Quién tiene prioridad?", "opts": ["El que circule más deprisa de los dos, cualquiera que sea su carril", "El que ya circula por el carril que pretendes ocupar", "El que va a cambiar de carril, si lo señaliza con antelación suficiente"], "a": 1, "expl": "Todo desplazamiento lateral con cambio de carril debe respetar la prioridad del que circula por el carril que se pretende ocupar.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 74.2", "img": null}, {"tema": 4, "q": "¿Puede un turismo que arrastra un remolque circular por un carril VAO habilitado?", "opts": ["Sí, si el remolque no supera los 750 kilogramos de masa.", "No, está prohibido a los turismos con remolque.", "Sí, si el turismo lleva el número de ocupantes exigido."], "a": 1, "expl": "El carril VAO está limitado a motocicletas, turismos y vehículos mixtos adaptables, y prohibido al resto, incluidos los turismos con remolque.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 35.2.a)", "img": null}, {"tema": 4, "q": "Un turismo circula por una vía pavimentada y otro sale a ella desde un camino sin pavimentar, sin señales. ¿Quién tiene preferencia?", "opts": ["El que se aproxima por la derecha del otro.", "El que circula por la vía pavimentada.", "El que llegue antes a la intersección."], "a": 1, "expl": "En defecto de señal se cede a quien viene por la derecha, salvo que quien circula por una vía pavimentada tiene preferencia frente al procedente de otra sin pavimentar.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 57.1.a", "img": null}, {"tema": 4, "q": "¿Qué condición debe cumplir el conductor de un vehículo prioritario en servicio urgente para dejar de aplicar algunas normas de circulación?", "opts": ["Haber avisado por radio a la Jefatura Provincial de Tráfico antes de cada maniobra que haga", "Llevar a bordo al menos a un agente de la autoridad que asuma cada maniobra que realice", "Haberse cerciorado de que no pone en peligro a ningún usuario de la vía"], "a": 2, "expl": "Los conductores de vehículos prioritarios pueden dejar de aplicar ciertas normas bajo su responsabilidad, a condición de haberse cerciorado de que no ponen en peligro a ningún usuario.", "fuente": "RGC art. 68.1", "img": null}, {"tema": 4, "q": "Se habilita un carril adicional circunstancial en una calzada de doble sentido con arcenes. ¿Qué disposición de carriles supone?", "opts": ["Tres carriles en un sentido y ninguno en el contrario", "Dos carriles en cada sentido, usando solo un arcén", "Dos carriles en un sentido y uno en el otro"], "a": 2, "expl": "El carril adicional circunstancial, con elementos provisionales de balizamiento y utilizando ambos arcenes, permite disponer de dos carriles en un sentido y uno en el otro.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 42.1", "img": null}, {"tema": 4, "q": "Como regla general, si las trayectorias de un vehículo y de un peatón se cortan en la calzada, ¿quién tiene prioridad?", "opts": ["El peatón, ya que los vehículos deben dejarlo pasar en cualquier circunstancia", "El conductor, salvo en los casos en que se da prioridad al peatón", "El que haya llegado primero al punto donde se cortan las dos trayectorias"], "a": 1, "expl": "La regla general es la prioridad del conductor en calzada y arcén, con las excepciones de los arts. 65 y 66 (pasos de peatones, giros, etc.).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 64.1", "img": null}, {"tema": 4, "q": "Un semáforo sobre fondo circular negro muestra una franja blanca vertical iluminada. ¿A qué vehículos se refiere y qué permite?", "opts": ["A ciclos y bicicletas únicamente; permite girar a la derecha", "A tranvías y autobuses de línea; permite el paso de frente", "A todos los vehículos que se acerquen; permite el paso de frente"], "a": 1, "expl": "Los semáforos de franja blanca sobre fondo negro se refieren exclusivamente a tranvías y autobuses de líneas regulares (o a los de su carril reservado); la franja vertical permite el paso de frente.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.4.2", "img": null}, {"tema": 4, "q": "Un semáforo muestra luz roja intermitente antes de un paso a nivel. ¿Qué significa?", "opts": ["Que se puede pasar si no se ve aproximarse ningún tren ni tranvía", "Que se debe extremar la precaución y, en su caso, ceder el paso", "Que se prohíbe temporalmente el paso a los vehículos"], "a": 2, "expl": "La luz roja intermitente prohíbe temporalmente el paso a los vehículos antes de un paso a nivel; la amarilla intermitente es la que obliga a extremar la precaución.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, 4.2 b)", "img": null}, {"tema": 4, "q": "Has pasado la salida que querías tomar en una autovía. ¿Puedes retroceder por el arcén hasta ella?", "opts": ["Sí, si lo haces por el arcén con la luz de emergencia.", "No, la marcha atrás está prohibida en autovías y autopistas.", "Sí, si no se aproxima ningún vehículo y el recorrido es corto."], "a": 1, "expl": "Se prohíbe la maniobra de marcha atrás en autovías y autopistas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 80.3", "img": null}, {"tema": 4, "q": "Te acercas a una intersección ordinaria (no glorieta) sin prioridad señalizada para tu calzada. ¿A cuál de estos vehículos puedes adelantar?", "opts": ["A un turismo que circule despacio.", "A una motocicleta.", "A un camión que circule despacio."], "a": 1, "expl": "En las intersecciones y sus proximidades solo se puede adelantar, entre otros supuestos, a vehículos de dos ruedas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 87.1.c).4.º", "img": null}, {"tema": 4, "q": "Un ciclomotor circula por una carretera con arcén derecho transitable y suficiente, y sin vía especialmente destinada a él. ¿Por dónde debe ir?", "opts": ["Por el arcén o por la calzada, a su elección", "Por el arcén de su derecha", "Por el carril derecho de la calzada"], "a": 1, "expl": "Los ciclomotores, si no hay vía destinada a ellos, circulan por el arcén de su derecha cuando es transitable y suficiente; si no lo es, utilizan la parte imprescindible de la calzada.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 36.1", "img": null}, {"tema": 4, "q": "¿Qué inclinación mínima debe tener un tramo para considerarse de gran pendiente a efectos de prioridad de paso?", "opts": ["Un cuatro por ciento.", "Un siete por ciento.", "Un diez por ciento."], "a": 1, "expl": "Se entienden por tramos de gran pendiente los que tienen una inclinación mínima del siete por ciento.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 63.1", "img": null}, {"tema": 4, "q": "Has iniciado un adelantamiento y adviertes que terminarlo puede resultar arriesgado. ¿Qué debes hacer?", "opts": ["Continuar la maniobra y conectar la luz de emergencia del vehículo.", "Acelerar al máximo para terminar cuanto antes la maniobra iniciada.", "Reducir la marcha, volver a tu carril y avisar a quien te sigue."], "a": 2, "expl": "Si surgen circunstancias que dificultan finalizar sin riesgo, se reduce rápidamente la marcha, se regresa al carril y se advierte a los que siguen.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 85.2", "img": null}, {"tema": 4, "q": "Un camión de más de 3.500 kg circula por una calzada de doble sentido con tres carriles separados por líneas discontinuas. ¿Para qué puede utilizar el carril central?", "opts": ["Para circular habitualmente si no viene tráfico en sentido contrario.", "Solo para efectuar los adelantamientos precisos y cambiar de dirección a la izquierda.", "Para circular siempre que se vaya a velocidad superior a la del resto."], "a": 1, "expl": "En esas calzadas el carril central tan solo se utiliza para efectuar los adelantamientos precisos y para cambiar de dirección hacia la izquierda.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 30.1.b)", "img": null}, {"tema": 4, "q": "Un turismo se incorpora a una autovía desde un enlace, sin señales que alteren la prioridad. ¿Quién tiene preferencia?", "opts": ["Los vehículos que ya circulan por la autovía", "Los vehículos que se incorporan desde el enlace", "Los de mayor tamaño, sean de un grupo o del otro"], "a": 0, "expl": "Los vehículos que circulan por autopistas y autovías tienen preferencia sobre quienes pretenden incorporarse a ellas.", "fuente": "RGC art. 57.1.d)", "img": null}, {"tema": 4, "q": "Sales a una vía de uso público desde un camino exclusivamente privado. ¿A quién debes ceder el paso?", "opts": ["Solo a los que circulen en sentido contrario al tuyo en esa vía.", "Solo a los que se aproximen por tu derecha, como en un cruce sin señales.", "A los vehículos de la vía, circulen en el sentido que circulen."], "a": 2, "expl": "Quien sale por un camino privado a una vía pública cede el paso a los vehículos que circulen por ella, cualquiera que sea su sentido.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 72.2", "img": null}, {"tema": 4, "q": "Dentro de poblado, en una calzada con dos carriles para tu sentido delimitados por marcas, ¿se puede adelantar por la derecha?", "opts": ["No, solo se permite adelantar por la izquierda.", "No, salvo que el vehículo adelantado esté parado.", "Sí, tras comprobar previamente que se puede hacer sin peligro."], "a": 2, "expl": "Dentro de los poblados, con al menos dos carriles del mismo sentido delimitados por marcas, se permite adelantar por la derecha tras comprobar que no hay peligro.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 82.3", "img": null}, {"tema": 4, "q": "Vas a cruzar con tu vehículo un arcén por el que caminan peatones que no disponen de zona peatonal. ¿Quién tiene prioridad?", "opts": ["El conductor, pues en el arcén los vehículos siempre tienen prioridad de paso", "Quien llegue antes al punto de cruce, ya sea el vehículo o algún peatón", "Los peatones, por lo que debes dejarlos pasar, deteniéndote si es preciso"], "a": 2, "expl": "Los peatones tienen prioridad cuando el vehículo cruza un arcén por el que circulan peatones sin zona peatonal.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 65.1 c)", "img": null}, {"tema": 4, "q": "En una calzada de doble sentido, ¿qué indican dos líneas discontinuas que delimitan un carril por ambos lados?", "opts": ["Que es un carril reversible, regulable en uno u otro sentido.", "Que es un carril de aceleración para incorporarse a la vía principal.", "Que es un carril reservado exclusivamente para adelantar a otros vehículos."], "a": 0, "expl": "Las marcas dobles discontinuas que delimitan un carril por ambos lados indican que es reversible: la circulación puede regularse en uno u otro sentido con semáforos de carril u otros medios.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 40.1", "img": null}, {"tema": 4, "q": "Dos vehículos que necesitan autorización especial para circular se acercan por sentidos opuestos a un puente de calzada de 5,5 metros. ¿Pueden cruzarse en él?", "opts": ["Sí, siempre que cada uno pueda contar con dos metros de ancho de vía", "Sí, siempre que ambos reduzcan la velocidad al mínimo para cruzarse", "No, porque el ancho de la calzada es inferior a seis metros"], "a": 2, "expl": "Estos vehículos no pueden cruzarse en puentes con calzada de menos de seis metros, para que cada uno disponga de al menos tres metros de ancho.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 61.3", "img": null}, {"tema": 4, "q": "Conduces un camión de 12.000 kg de masa máxima autorizada por un túnel y no vas a adelantar. ¿Qué distancia de seguridad mínima debes guardar?", "opts": ["200 metros o un intervalo de ocho segundos", "150 metros o un intervalo de seis segundos", "100 metros o un intervalo de cuatro segundos"], "a": 1, "expl": "En túneles, los vehículos de más de 3.500 kg deben guardar al menos 150 m o seis segundos con el precedente; los demás, 100 m o cuatro segundos.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 95.6", "img": null}, {"tema": 4, "q": "Un camión de más de 3.500 kg de masa máxima autorizada circula por una autovía con tres carriles en su sentido. ¿Qué carriles puede utilizar?", "opts": ["Cualquiera de los tres, según la velocidad a la que circule.", "Solo el de la derecha, en ningún caso el contiguo a este.", "El de su derecha y, si procede, el inmediato a este."], "a": 2, "expl": "Con tres o más carriles, estos camiones circulan normalmente por el de la derecha y pueden usar el inmediato, con igual condición y circunstancias.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 31.2", "img": null}, {"tema": 4, "q": "Al circular por una glorieta, ¿cómo debe rodearse su centro?", "opts": ["Por el lado que resulte más corto hasta la salida.", "Dejando el centro de la glorieta a la izquierda.", "Dejando el centro de la glorieta a la derecha."], "a": 1, "expl": "En plazas, glorietas y encuentros de vías los vehículos circulan dejando a su izquierda el centro de aquellas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 43.2", "img": null}, {"tema": 4, "q": "Dos camiones se encuentran en un tramo estrecho sin señalizar y no se sabe cuál entró antes. Uno debería retroceder 40 metros y el otro 15. ¿Quién tiene preferencia?", "opts": ["El que tuviera que retroceder 40 metros", "El que tuviera que retroceder 15 metros", "El que circule más cerca del borde derecho"], "a": 0, "expl": "Entre vehículos del mismo tipo, la preferencia es del que tuviera que dar marcha atrás una distancia mayor; si hay igualdad, del de mayor anchura, longitud o masa.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 62.1, último párrafo", "img": null}, {"tema": 4, "q": "Un tramo de la vía está en reparación. ¿Qué vehículos pueden pasar por el trozo en obras, si se hace sin peligro ni daño para la obra?", "opts": ["Los de servicios urgentes que avisen con su señalización", "Los de transporte colectivo de viajeros con horario fijo", "Cualquiera, si no hay personal de obra presente"], "a": 0, "expl": "Siempre que sea posible sin peligro ni daño a la obra, se permite el paso por el trozo en reparación a los vehículos de policía, extinción de incendios, protección civil, salvamento y asistencia sanitaria en servicio urgente que lo adviertan con su señalización.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 60.3", "img": null}, {"tema": 4, "q": "Dos turismos no pueden cruzarse en un tramo estrecho sin señales y no se sabe quién entró antes. ¿A quién se da preferencia?", "opts": ["Al que tenga el motor de mayor potencia total", "Al que tuviera que retroceder más distancia", "Al que ocupe el lado derecho de la calzada"], "a": 1, "expl": "Entre vehículos del mismo tipo, la preferencia se decide a favor del que tuviera que dar marcha atrás mayor distancia y, si hay igualdad, del de mayor anchura, longitud o masa.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 62.1", "img": null}, {"tema": 4, "q": "¿Cuándo está habilitado el uso extraordinario del arcén derecho por motocicletas en los tramos señalizados al efecto?", "opts": ["Solo cuando el tráfico de los carriles está detenido por congestión", "Siempre que la velocidad media de los carriles sea inferior a 60 km/h", "En cualquier momento, siempre que vayan en columna de a uno"], "a": 0, "expl": "Este uso solo está habilitado cuando la circulación de los carriles de la vía está detenida por congestión del tráfico.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 36.3", "img": null}, {"tema": 4, "q": "Dos turismos se encuentran en un estrechamiento que no permite el cruce, sin señalización ni obras y sin dudas sobre la dificultad de maniobra. ¿Quién tiene preferencia?", "opts": ["El que circule a mayor velocidad de los dos en ese momento", "El que lleve más ocupantes en el interior de su vehículo", "El que haya entrado primero en el estrechamiento"], "a": 2, "expl": "Si la estrechez impide o dificulta el cruce y no hay señalización, tiene preferencia el vehículo que hubiese entrado primero.", "fuente": "RGC art. 60.1", "img": null}, {"tema": 4, "q": "Tu vehículo está detenido en una intersección con semáforo y obstaculiza la circulación. ¿Qué debes hacer?", "opts": ["Apagar el motor y conectar la luz de emergencia hasta el cambio de fase.", "Salir de ella sin esperar al verde, si no entorpece a los demás.", "Esperar a que se permita su dirección, aunque estorbe a los demás."], "a": 1, "expl": "Quien tenga el vehículo detenido en una intersección regulada por semáforo y sea un obstáculo debe salir sin esperar a que se permita su dirección, si no entorpece a los demás.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 59.2", "img": null}, {"tema": 4, "q": "Un camión muy alto está adelantando a otro vehículo y te impide ver la parte delantera de la vía. ¿Puedes adelantarlo tú a continuación?", "opts": ["Sí, siempre que ambos camiones vayan a velocidad moderada", "Sí, si señalizas la maniobra con el intermitente izquierdo", "No, está prohibido detrás de un vehículo que tapa la vía"], "a": 2, "expl": "Se prohíbe adelantar detrás de un vehículo que realiza la misma maniobra cuando sus dimensiones impiden ver la parte delantera de la vía.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 87.1.a)", "img": null}, {"tema": 4, "q": "Vas a girar con tu vehículo para entrar en otra vía y hay animales cruzándola, aunque no existe cañada. ¿Quién tiene prioridad?", "opts": ["El conductor, porque sin cañada el vehículo siempre pasa antes", "El que llegue antes, sea el vehículo o el primero de los animales", "Los animales, por lo que debes dejarlos pasar"], "a": 2, "expl": "Cuando el vehículo gira para entrar en otra vía y hay animales cruzándola, estos tienen prioridad aunque no exista paso para ellos.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 66.1 b)", "img": null}, {"tema": 4, "q": "Tu vehículo está estacionado junto al borde de la calzada y vas a incorporarte a la circulación. ¿Qué debes hacer?", "opts": ["Asegurarte de que no hay peligro, cediendo el paso y avisando con las señales debidas", "Incorporarte si no hay ningún vehículo a menos de cincuenta metros, sin otra comprobación", "Avisar con el intermitente y arrancar, ya que los demás conductores deben facilitar tu maniobra"], "a": 0, "expl": "Quien se incorpora debe cerciorarse de que no hay peligro, ceder el paso a los demás teniendo en cuenta posición, trayectoria y velocidad, y advertir la maniobra.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 72.1 y 72.3", "img": null}, {"tema": 4, "q": "Llegas a una obra de reparación de la vía y hay otro vehículo esperando, llegado antes en tu mismo sentido. ¿Qué debes hacer?", "opts": ["Colocarte a su lado para pasar a la vez cuando se abra el paso.", "Colocarte detrás de él, lo más cerca posible del borde derecho, y seguirlo.", "Adelantarlo por la izquierda para ponerte el primero si el tramo está libre."], "a": 1, "expl": "Quien llegue a una obra y encuentre esperando a otro vehículo anterior en su mismo sentido se coloca detrás y no intenta pasar sino siguiéndolo.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 60.4", "img": null}, {"tema": 5, "q": "Un vehículo que carece de luz de marcha atrás va a retroceder. ¿Cómo debe advertirlo el conductor?", "opts": ["Moviendo el brazo de arriba abajo con movimientos cortos y rápidos", "Con el brazo extendido en horizontal y la palma hacia atrás", "Doblando el brazo hacia arriba con la palma de la mano extendida"], "a": 1, "expl": "Sin luz de marcha atrás, se avisa con el brazo extendido en horizontal y la palma hacia atrás.", "fuente": "RGC art. 109.2.b (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un conductor sale de un camino exclusivamente privado a una vía de uso público. ¿Qué debe hacer?", "opts": ["Ceder el paso únicamente a los vehículos que se aproximen por su lado izquierdo", "Salir con rapidez para no entorpecer la marcha de los vehículos de la vía pública", "Asegurarse de que no hay peligro y ceder el paso a todos los vehículos de la vía"], "a": 2, "expl": "Debe salir a velocidad que le permita detenerse en el acto y ceder el paso a los vehículos de la vía, cualquiera que sea su sentido.", "fuente": "RGC art. 72.2", "img": null}, {"tema": 5, "q": "En una autovía de dos carriles por sentido, la nieve dificulta la circulación. ¿Qué debe cumplirse?", "opts": ["Está prohibido adelantar y debe circularse por el carril de la derecha.", "Solo se prohíbe adelantar a camiones y autobuses; el resto de vehículos puede hacerlo.", "Se puede adelantar con precaución por el carril izquierdo, con las luces de cruce encendidas."], "a": 0, "expl": "Con nieve que dificulta la circulación en autopistas y autovías queda prohibido adelantar y se circula por el carril más a la derecha, dejando libres los de la izquierda para vehículos de emergencia y quitanieves.", "fuente": "RGC art. 32.2 (redacción RD 518/2026, en vigor 1-10-2026)", "img": null}, {"tema": 5, "q": "Un camionero que ha calzado su vehículo en una pendiente va a reanudar la marcha. ¿Qué debe hacer con los calzos?", "opts": ["Dejarlos bajo la rueda si no estorban a otros vehículos", "Dejarlos junto al bordillo para otros conductores", "Retirarlos de la vía una vez utilizados"], "a": 2, "expl": "Los calzos, una vez utilizados, deben retirarse de las vías al reanudar la marcha; y no pueden emplearse piedras u otros elementos no destinados a ello.", "fuente": "RGC art. 92.3.d (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "En una autovía, ¿dónde puede un conductor cambiar el sentido de su marcha?", "opts": ["Únicamente en los lugares habilitados al efecto.", "En cualquier punto, si advierte la maniobra con los intermitentes.", "En cualquier tramo recto con buena visibilidad y poco tráfico."], "a": 0, "expl": "El cambio de sentido está prohibido en autopistas y autovías salvo en los lugares habilitados al efecto.", "fuente": "RGC art. 79.1", "img": null}, {"tema": 5, "q": "En una calle de doble sentido con línea continua en el centro, un conductor estaciona dejando 2,5 metros hasta esa línea. ¿Cómo se considera?", "opts": ["Estacionamiento peligroso o que obstaculiza gravemente la circulación", "Estacionamiento correcto, pues la distancia mínima exigida es de dos metros", "Estacionamiento correcto, siempre que lo haga en el lado derecho de la calzada"], "a": 0, "expl": "Es estacionamiento peligroso u obstaculizador cuando la distancia entre el vehículo y una marca longitudinal que prohíba atravesarla es inferior a tres metros.", "fuente": "RGC art. 91.2.a (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "En una autovía, y sin que exista avería ni emergencia, ¿dónde está permitido parar?", "opts": ["En el arcén derecho, siempre que se enciendan las luces de emergencia.", "En cualquier punto del arcén, si la parada dura menos de cinco minutos.", "Únicamente en las zonas habilitadas expresamente para ello."], "a": 2, "expl": "En autopistas y autovías está prohibido parar salvo en las zonas habilitadas para ello.", "fuente": "RGC art. 94.1.g", "img": null}, {"tema": 5, "q": "Un conductor hace con el brazo una indicación válida y perceptible que contradice la que marcan sus luces. ¿Cuál prevalece?", "opts": ["Ninguna de las dos, por lo que debe repetir la maniobra", "La luminosa, porque el brazo solo se usa si no hay luces", "La del brazo, que anula la luminosa contraria"], "a": 2, "expl": "Las advertencias con el brazo, si son perceptibles y correctas, anulan cualquier otra indicación óptica contraria.", "fuente": "RGC art. 108.2 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un turismo con caja de cambios se deja estacionado en una pendiente descendente. ¿Qué marcha debe quedar colocada?", "opts": ["La primera marcha", "El punto muerto", "La marcha atrás"], "a": 2, "expl": "En pendiente ascendente se deja la primera; en descendente, la marcha atrás (o la posición de estacionamiento).", "fuente": "RGC art. 92.3.c)", "img": null}, {"tema": 5, "q": "En una carretera convencional, un conductor para junto a una intersección y su coche tapa la visibilidad de los que llegan. ¿Es correcto?", "opts": ["Sí, siempre que el conductor no abandone el vehículo durante toda la parada", "Sí, porque en vías interurbanas solo se prohíbe parar dentro de la propia intersección", "No, si con ello se genera peligro por falta de visibilidad para los demás"], "a": 2, "expl": "En las intersecciones y sus proximidades está prohibido parar si se dificulta el giro a otros vehículos o, en vías interurbanas, si se genera peligro por falta de visibilidad.", "fuente": "RGC art. 94.1.d (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Una grúa municipal retira un coche de la vía. ¿En qué plazo debe comunicar la Administración la retirada al titular?", "opts": ["En el plazo de siete días naturales", "En el plazo de veinticuatro horas", "En el plazo de cuarenta y ocho horas"], "a": 1, "expl": "La Administración debe comunicar la retirada y depósito del vehículo al titular en el plazo de veinticuatro horas.", "fuente": "Ley de Tráfico RDL 6/2015, art. 105.3", "img": null}, {"tema": 5, "q": "Además de comprobar la velocidad y la distancia de quienes vienen de frente, ¿cuándo debe abstenerse de girar a la izquierda?", "opts": ["Cuando no exista visibilidad suficiente", "Cuando detrás de él circule un vehículo más rápido", "Cuando circule por una calzada de doble sentido"], "a": 0, "expl": "El Reglamento exige abstenerse de un cambio de dirección a la izquierda si no hay visibilidad suficiente.", "fuente": "RGC art. 74.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un repartidor para su furgoneta menos de un minuto en un carril reservado a las bicicletas para descargar un paquete. ¿Es correcto?", "opts": ["Sí, siempre que deje espacio suficiente para el paso de las bicicletas", "Sí, porque la parada breve para carga está permitida en cualquier carril de la vía", "No, porque está prohibido parar en los carriles reservados a bicicletas"], "a": 2, "expl": "El Reglamento prohíbe parar en los carriles destinados al uso exclusivo del transporte público urbano y en los reservados para las bicicletas.", "fuente": "RGC art. 94.1.h (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Un conductor estaciona una autocaravana y despliega un toldo que sobresale del perímetro del vehículo. ¿Es correcto?", "opts": ["Sí, siempre que el toldo no ocupe la calzada ni moleste al paso de peatones", "Sí, porque solo se limita la extensión de elementos propios al estacionar de noche", "No, debe estacionar sin extender elementos que desborden su perímetro"], "a": 2, "expl": "Las autocaravanas deben estacionar sin extender elementos que desborden su perímetro, descansando solo sobre neumáticos y sin verter fluidos del habitáculo.", "fuente": "RGC art. 92.4.a (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "¿Qué ocurre si un vehículo se estaciona sobre una isleta u otro elemento de canalización del tráfico?", "opts": ["Se considera estacionamiento en lugar peligroso o que obstaculiza gravemente", "Está permitido si el conductor permanece dentro del vehículo y no hay peatones cerca", "Está permitido si no se impide el paso de otros vehículos ni la visibilidad de la señalización"], "a": 0, "expl": "Estacionar en medianas, separadores, isletas u otros elementos de canalización es un supuesto de estacionamiento peligroso.", "fuente": "RGC art. 91.2.e)", "img": null}, {"tema": 5, "q": "En poblado, un autobús urbano sale de una parada señalizada. ¿Qué deben hacer los demás conductores?", "o
