repentina de una pieza mecánica se considera un caso de fuerza mayor"], "a": 0, "expl": "En daños a las personas, el conductor solo se exonera por culpa exclusiva del perjudicado o fuerza mayor ajena a la conducción o al funcionamiento del vehículo; los defectos del vehículo y la rotura de piezas no son fuerza mayor.", "fuente": "RDL 8/2004 (seguro obligatorio), art. 1.1", "img": null}, {"tema": 9, "q": "¿Qué ocurre si los amortiguadores de un coche están desajustados?", "opts": ["Mejora la estabilidad en curva, pero aumenta el consumo de combustible", "Las ruedas pierden contacto con el suelo y se reduce el agarre", "Solo empeora el confort de los ocupantes, sin afectar a la seguridad"], "a": 1, "expl": "Con amortiguadores desajustados el coche no se adapta al asfalto y las ruedas pierden contacto con el suelo, lo que reduce el agarre y desgasta antes el neumático.", "fuente": "Revista DGT, \"El triángulo de la seguridad activa\" (29/06/2021), https://revista.dgt.es/es/motor/noticias/2021/06JUNIO/0629-Triangulo-Seguridad.shtml", "img": null}, {"tema": 9, "q": "Una motocicleta de 125 cm³ tiene cinco años desde su primera matriculación. ¿Con qué frecuencia debe pasar la ITV?", "opts": ["Cada año", "Cada cuatro años", "Cada dos años"], "a": 2, "expl": "Las motocicletas (resto de la categoría L) están exentas hasta los 4 años y después tienen ITV bienal.", "fuente": "RD 920/2017 art. 6.1 (tabla)", "img": null}, {"tema": 9, "q": "Se detecta por primera vez que un turismo circula sin seguro obligatorio. ¿Por cuánto tiempo se acuerda cautelarmente su depósito o precinto?", "opts": ["Tres meses", "Un año", "Un mes"], "a": 2, "expl": "El depósito cautelar es de un mes; tres meses en caso de reincidencia y un año si se quebranta el depósito o precinto.", "fuente": "RDL 8/2004 art. 3.1.b", "img": null}, {"tema": 9, "q": "¿Qué ciclos de motor con pedaleo asistido están obligados a contar con seguro de responsabilidad civil?", "opts": ["Únicamente los que superen los 45 km/h con propulsión auxiliar", "Todos, incluso los que no pasen de 25 km/h de velocidad en propulsión auxiliar", "Los de propulsión auxiliar con velocidad máxima superior a 25 km/h"], "a": 2, "expl": "El seguro obligatorio alcanza a los ciclos de motor con propulsión auxiliar de velocidad máxima superior a 25 km/h, no a los que no sobrepasan esa velocidad.", "fuente": "RDL 8/2004 (seguro obligatorio), art. 2.1.a)", "img": null}, {"tema": 9, "q": "Un turismo queda inmovilizado por avería y obstaculiza la calzada. ¿Qué debe emplear el conductor, además de la luz de emergencia?", "opts": ["El dispositivo de preseñalización de peligro reglamentario", "Únicamente las luces de posición y de gálibo, sin ningún otro dispositivo", "La bocina de forma intermitente hasta que llegue un servicio de auxilio"], "a": 0, "expl": "Sin perjuicio de la luz de emergencia y, cuando proceda, las luces de posición y gálibo, todo conductor debe emplear el dispositivo de preseñalización de peligro reglamentario (V-16).", "fuente": "RGC (consolidado con RD 518/2026), art. 130.4", "img": null}, {"tema": 9, "q": "¿Qué se registra en el anverso de la tarjeta ITV?", "opts": ["El certificado de características del vehículo", "El registro de las inspecciones periódicas", "La relación de sanciones pendientes del titular"], "a": 1, "expl": "El anverso recoge las inspecciones periódicas; el reverso contiene el certificado de características del vehículo.", "fuente": "RGV art. 3.g", "img": null}, {"tema": 9, "q": "¿Cómo es la placa de matrícula ordinaria de un ciclomotor?", "opts": ["Fondo amarillo, caracteres rojos y letra E al comienzo de la matrícula", "Fondo blanco, caracteres negros y letra C al comienzo", "Fondo amarillo, caracteres negros y letra C al comienzo"], "a": 2, "expl": "Los ciclomotores y ciclos de motor llevan placa de fondo amarillo retrorreflectante, caracteres negros y un primer grupo con la letra C.", "fuente": "Reglamento General de Vehículos, Anexo XVIII, I.A).d)", "img": null}, {"tema": 9, "q": "¿Qué se entiende por tara de un vehículo?", "opts": ["Su masa sin personal, pasajeros ni carga, pero con combustible y repuestos", "Su masa máxima técnicamente admisible, especificada por el fabricante", "Su masa con la carga máxima autorizada para circular por las vías públicas con seguridad"], "a": 0, "expl": "La tara es la masa del vehículo con su equipo fijo, sin personal de servicio, pasajeros ni carga, y con su dotación completa de agua, combustible, lubricante, repuestos, herramientas y accesorios.", "fuente": "Reglamento General de Vehículos, Anexo IX, 1.1", "img": null}, {"tema": 9, "q": "¿Para qué sirve el sistema ABS de un vehículo?", "opts": ["Reparte la frenada solo entre las ruedas traseras para mayor estabilidad", "Acorta siempre la distancia de frenado, incluso sobre grava o nieve", "Evita el bloqueo de las ruedas al frenar a fondo y mantiene el control"], "a": 2, "expl": "El ABS (sistema antibloqueo de frenos) gestiona la frenada con sensores y actuadores para evitar el bloqueo de las ruedas y mejorar el control del vehículo en momentos críticos.", "fuente": "Revista DGT, \"Frenos, un elemento clave para la seguridad\" (15/10/2025), https://revista.dgt.es/es/motor/tecnologia-seguridad/2025/1015-N275-vehiculo-al-dia-frenos.shtml", "img": null}, {"tema": 10, "q": "Si presencia un accidente en el que no está implicado y hay víctimas, ¿qué está obligado a hacer?", "opts": ["Continuar su camino, pues solo los implicados deben actuar", "Avisar únicamente si hay víctimas mortales", "Auxiliar a las víctimas o solicitar auxilio para ellas"], "a": 2, "expl": "La obligación de auxilio alcanza a quien se ve implicado, presencia el accidente o tiene conocimiento de él.", "fuente": "Ley de Tráfico RDL 6/2015 art. 51.1", "img": null}, {"tema": 10, "q": "Ante una quemadura, ¿cuál de estas actuaciones es incorrecta?", "opts": ["Enfriar la zona con agua fría", "Echar pomada sobre la zona", "Cubrir la quemadura con una gasa limpia"], "a": 1, "expl": "No deben aplicarse ungüentos ni pomadas sobre una quemadura ni reventarse las ampollas; se enfría con agua y se cubre con gasa limpia.", "fuente": "CICR/Cruz Roja, Folleto de primeros auxilios; Manual de Primeros Auxilios (JCyL)", "img": null}, {"tema": 10, "q": "Tras un accidente con heridas claramente leves, circulación restablecida y sin que nadie lo pida, ¿hay que avisar a la autoridad?", "opts": ["No es necesario avisarla ni permanecer allí", "Sí, siempre hay que avisar y esperar a los agentes", "Sí, aunque no es preciso esperar a su llegada"], "a": 0, "expl": "El RGC dispensa de avisar y de permanecer si solo hay heridas claramente leves, la seguridad está restablecida y nadie lo solicita.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 129.2.e)", "img": null}, {"tema": 10, "q": "Su vehículo, tras una avería, puede moverse pero necesita servicio de auxilio. ¿Qué debe hacer en una autovía?", "opts": ["Seguir por el carril izquierdo hasta la próxima área de servicio", "Salir de los carriles y seguir por el arcén derecho hasta la salida", "Detenerse donde esté, en el propio carril, con las luces de emergencia encendidas"], "a": 1, "expl": "Debe abandonar cuanto antes los carriles y dirigirse a la primera salida disponible por el arcén derecho.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 130.2", "img": null}, {"tema": 10, "q": "Una persona inconsciente respira con normalidad, no hay peligro en el lugar y no se sospechan lesiones que desaconsejen moverla. ¿Qué se hace mientras llegan los servicios de emergencia?", "opts": ["Llamar al 112, ponerla de lado (PLS) y vigilar su respiración", "Sentarla y darle agua poco a poco hasta que reaccione y hable", "Zarandearla con fuerza y abofetearla hasta que recobre el conocimiento"], "a": 0, "expl": "Si la víctima respira y no hay traumatismos visibles, se coloca en posición de recuperación (lateral de seguridad), se llama al 112 y se vigila su respiración.", "fuente": "Manual de Primeros Auxilios (Junta de Castilla y León, basado en Cruz Roja/ERC)", "img": null}, {"tema": 10, "q": "Tras un accidente, ¿dónde debe cumplimentarse el parte amistoso con los datos de los implicados?", "opts": ["En un lugar seguro fuera de la vía", "En el propio carril, para no mover los vehículos", "En el arcén, con las luces de emergencia encendidas"], "a": 0, "expl": "Se prohíbe cumplimentar el parte en la plataforma de circulación (calzada y arcenes); debe hacerse en un lugar seguro fuera de la vía.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 130.5", "img": null}, {"tema": 10, "q": "Al presenciar un accidente de tráfico, ¿cuál es el orden correcto de la conducta PAS?", "opts": ["Socorrer, proteger y avisar", "Avisar, socorrer y proteger", "Proteger, avisar y socorrer"], "a": 2, "expl": "La conducta PAS indica primero proteger el lugar (y a uno mismo) para evitar nuevos accidentes, después avisar al 112 y por último socorrer a las víctimas.", "fuente": "DGT, Qué hacer ante un accidente de tráfico; DGT, Unidad didáctica 'Saber actuar en caso de accidente'", "img": null}, {"tema": 10, "q": "Un herido tiene un objeto clavado profundamente en el pecho. ¿Qué debe hacer quien le auxilia?", "opts": ["No sacarlo e inmovilizarlo hasta la llegada de sanitarios", "Extraerlo con rapidez para que el herido pueda respirar mejor", "Extraerlo con cuidado y presionar después sobre la herida"], "a": 0, "expl": "Un objeto clavado no debe sacarse: al retirarlo puede producirse una hemorragia grave; se inmoviliza.", "fuente": "CICR/Cruz Roja, Folleto de primeros auxilios", "img": null}, {"tema": 10, "q": "Al avisar al 112 tras un accidente, ¿qué información debe facilitarse?", "opts": ["Solo la matrícula y los nombres de los implicados en el choque", "Únicamente la hora del accidente y la marca de los coches implicados", "Dónde ocurrió, cuántos heridos hay y qué peligros existen"], "a": 2, "expl": "Hay que indicar el lugar exacto, el número de heridos y vehículos y los peligros especiales, como fuego o mercancías peligrosas.", "fuente": "DGT, conducta PAS (Proteger, Alertar, Socorrer)", "img": null}, {"tema": 10, "q": "Una persona inconsciente no respira o lo hace de forma anormal. ¿Qué debe hacerse?", "opts": ["Esperar a la ambulancia sin tocarla, para no agravar posibles lesiones", "Llamar al 112 y empezar enseguida las compresiones torácicas", "Colocarla de lado y esperar a ver si recupera la respiración"], "a": 1, "expl": "Ante una persona inconsciente que no respira normalmente hay que pedir ayuda al 112 e iniciar la RCP sin demora.", "fuente": "Manual de Primeros Auxilios (Junta de Castilla y León); ERC Guidelines 2021, Basic Life Support", "img": null}, {"tema": 10, "q": "Su vehículo ha quedado inmovilizado en una autovía y no puede reemprender la marcha. Si las condiciones de circulación no permiten a los ocupantes abandonarlo con seguridad, ¿qué deben hacer?", "opts": ["Bajar y esperar de pie delante del vehículo", "Permanecer en el habitáculo con el cinturón abrochado", "Bajar y colocarse en el carril contiguo para pedir ayuda"], "a": 1, "expl": "Si bajarse no es seguro, los ocupantes deben permanecer en el habitáculo con el cinturón abrochado hasta que llegue el auxilio.", "fuente": "RGC art. 130.3", "img": null}, {"tema": 10, "q": "Un herido tiene una herida que sangra abundantemente. ¿Qué debe hacerse en primer lugar?", "opts": ["Presionar directamente sobre la herida de forma firme y mantenida", "Dejar que sangre unos minutos para que se limpie sola", "Retirar el apósito cada pocos segundos para ver si sigue sangrando"], "a": 0, "expl": "La hemorragia externa se controla comprimiendo la herida firmemente y de forma sostenida (Cruz Roja indica unos 10 minutos).", "fuente": "Cruz Roja, 'Por ejemplo... aprende a actuar en un accidente'; DGT, Qué hacer ante un accidente", "img": null}, {"tema": 10, "q": "Hay una persona muerta o gravemente herida en un accidente. Salvo que perjudique a heridos o a la circulación, ¿qué debe procurarse?", "opts": ["Retirar de inmediato los vehículos para reabrir la vía", "Limpiar la calzada de restos antes de que lleguen los agentes", "Evitar que se modifique el estado de las cosas y las huellas"], "a": 2, "expl": "Se debe evitar la modificación del estado de las cosas y de las huellas útiles para determinar responsabilidades, salvo que perjudique a heridos o a la circulación.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 129.2.c)", "img": null}, {"tema": 10, "q": "¿Cuándo debe aplicarse un torniquete en una hemorragia de un miembro?", "opts": ["Nunca, ni aunque la presión directa no detenga el sangrado", "Solo si falla la compresión directa sobre la herida", "Siempre, antes de presionar la herida"], "a": 1, "expl": "La compresión directa es la primera medida; el torniquete se reserva para cuando esta falla, y no debe aflojarse hasta la llegada de los sanitarios.", "fuente": "Manual de Primeros Auxilios (JCyL, apartado Hemorragias)", "img": null}, {"tema": 10, "q": "Un herido consciente en un accidente dice tener mucha sed. ¿Qué debe hacer quien le atiende?", "opts": ["Darle agua en pequeños sorbos", "Darle una bebida azucarada para evitar un desmayo", "No darle de beber ni de comer, ni siquiera agua"], "a": 2, "expl": "No se debe dar de comer ni beber a los heridos, ni siquiera agua, por si requieren intervención sanitaria o pierden el conocimiento.", "fuente": "DGT, Unidad didáctica 'Saber actuar en caso de accidente'; DGT, Qué hacer ante un accidente", "img": null}, {"tema": 10, "q": "En una reanimación cardiopulmonar (RCP) a un adulto con ventilaciones de rescate, ¿qué relación entre compresiones y ventilaciones se aplica?", "opts": ["50 compresiones y 1 ventilación", "15 compresiones y 5 ventilaciones", "30 compresiones y 2 ventilaciones"], "a": 2, "expl": "Las guías del ERC 2021 indican alternar 30 compresiones torácicas con 2 ventilaciones de rescate en el adulto.", "fuente": "ERC Guidelines 2021, Basic Life Support, 'Rescue breaths'", "img": null}, {"tema": 10, "q": "En la RCP de un adulto, ¿a qué frecuencia deben darse las compresiones torácicas?", "opts": ["Entre 100 y 120 por minuto", "Entre 140 y 160 por minuto", "Entre 60 y 80 por minuto"], "a": 0, "expl": "Las guías del ERC 2021 fijan 100-120 compresiones por minuto, a 5-6 cm de profundidad, con las mínimas interrupciones posibles.", "fuente": "ERC Guidelines 2021, Basic Life Support, 'High quality chest compressions'", "img": null}, {"tema": 10, "q": "Una persona sufre una quemadura leve en un brazo. ¿Qué debe hacerse en primer lugar?", "opts": ["Aplicar aceite o una pomada grasa para aislar la piel del aire", "Aplicar hielo directamente sobre la piel quemada y vendarla", "Enfriarla con un chorro suave de agua fría varios minutos"], "a": 2, "expl": "El primer auxilio en una quemadura es enfriarla con agua fría abundante y suave (Cruz Roja: 10-15 minutos).", "fuente": "Cruz Roja (quemaduras: enfriar con agua fría)", "img": null}, {"tema": 10, "q": "Un herido con sospecha de fractura en una pierna no corre peligro en el lugar del accidente. ¿Qué debe hacerse?", "opts": ["Intentar recolocar el hueso en su posición normal con cuidado", "Ayudarle a ponerse en pie para ver si puede apoyar la pierna", "No moverlo e inmovilizar la zona hasta que lleguen"], "a": 2, "expl": "Ante una fractura se evitan las movilizaciones del herido y se inmoviliza la zona; nunca se intenta recolocar el hueso.", "fuente": "Manual de Primeros Auxilios (JCyL); CICR, Folleto de primeros auxilios", "img": null}, {"tema": 10, "q": "Un motorista accidentado yace en el suelo con el casco puesto. Si quien le auxilia no conoce la técnica adecuada, ¿qué debe hacer con el casco?", "opts": ["Quitárselo tirando hacia arriba para ver las lesiones", "No quitárselo y esperar a los servicios sanitarios", "Quitárselo enseguida para que respire mejor"], "a": 1, "expl": "Retirar mal el casco puede agravar lesiones cervicales; solo debe hacerlo quien conozca la técnica.", "fuente": "DGT, Unidad didáctica 'Saber actuar en caso de accidente'; DGT, Qué hacer ante un accidente", "img": null}, {"tema": 11, "q": "Un conductor ha perdido la vigencia de su permiso por pérdida total de puntos. ¿Qué debe hacer para obtener de nuevo el permiso?", "opts": ["Superar de nuevo únicamente la prueba práctica de circulación en vía abierta, sin curso previo", "Esperar dos años sin conducir y solicitar el permiso en la Jefatura Provincial de Tráfico", "Realizar el curso de sensibilización y reeducación vial y superar la prueba de conocimientos"], "a": 2, "expl": "Para recuperar el permiso tras la pérdida total de puntos se exige el curso de sensibilización y reeducación vial y superar la prueba de control de conocimientos, además del plazo de espera.", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 38.1", "img": null}, {"tema": 11, "q": "Un conductor no profesional conserva parte de sus puntos y realiza y supera un curso de sensibilización y reeducación vial. ¿Qué puede recuperar?", "opts": ["Hasta seis puntos, una sola vez cada dos años", "Hasta ocho puntos, una sola vez cada año natural", "Hasta tres puntos, una vez cada seis meses"], "a": 0, "expl": "El curso permite recuperar hasta un máximo de seis puntos, por una sola vez cada dos años (los profesionales pueden hacerlo anualmente).", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 65.4", "img": null}, {"tema": 11, "q": "¿Cuándo se descuentan los puntos tras una sanción firme en vía administrativa?", "opts": ["Desde el momento en que el agente formula la denuncia al conductor", "Cuando el conductor renueve el permiso de conducción en la DGT", "Al anotarse la sanción firme en el registro de conductores"], "a": 2, "expl": "Los puntos se descuentan automáticamente cuando la infracción sancionada en firme se anota en el registro de conductores e infractores.", "fuente": "Ley de Tráfico RDL 6/2015 art. 64.5", "img": null}, {"tema": 11, "q": "Una persona recupera su permiso tras una condena penal de privación del derecho a conducir superior a dos años. ¿Con cuántos puntos empieza?", "opts": ["Con 12 puntos", "Con 8 puntos", "Con 6 puntos"], "a": 1, "expl": "El permiso obtenido tras una condena de más de dos años dispone de un saldo de 8 puntos.", "fuente": "Ley de Tráfico RDL 6/2015 art. 73.1", "img": null}, {"tema": 11, "q": "Un conductor no profesional pierde la vigencia del permiso por perder todos los puntos (primera vez). ¿Cuánto tiempo debe esperar, como mínimo, para poder obtener un nuevo permiso?", "opts": ["Seis meses", "Tres meses", "Nueve meses"], "a": 0, "expl": "Quien pierde la vigencia por pérdida total de puntos no puede obtener un nuevo permiso hasta que transcurran seis meses (tres para profesionales).", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 38.3", "img": null}, {"tema": 11, "q": "Un conductor perdió parte de sus puntos por infracciones graves. Si pasan dos años sin que se le imponga una sanción firme que conlleve pérdida de puntos, ¿qué ocurre?", "opts": ["Recupera solo la mitad de los puntos que había perdido", "Recupera la totalidad del crédito inicial de doce puntos", "Recupera los puntos únicamente si antes realiza un curso"], "a": 1, "expl": "Tras dos años sin sanciones firmes que conlleven pérdida de puntos se recupera la totalidad del crédito inicial de doce puntos, sin necesidad de curso.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 65.1", "img": null}, {"tema": 11, "q": "Una persona obtiene su primer permiso de conducción y nunca ha sido titular de otro. ¿Con cuántos puntos empieza?", "opts": ["Con doce puntos, igual que cualquier otro conductor titular", "Con ocho puntos, por tener menos de tres años de permiso", "Con diez puntos hasta que cumpla su primer año de permiso"], "a": 1, "expl": "Excepcionalmente se asigna un crédito inicial de ocho puntos a quien tiene una antigüedad no superior a tres años.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 63.2.a", "img": null}, {"tema": 11, "q": "Un conductor no profesional obtiene un nuevo permiso tras perder todos sus puntos y, antes de tres años, los vuelve a perder todos. ¿Cuánto debe esperar para obtener otro?", "opts": ["Seis meses desde la notificación de la resolución", "Doce meses desde la notificación del acuerdo", "Tres meses desde la notificación de la resolución"], "a": 1, "expl": "Si la nueva pérdida total se produce en los tres años siguientes, el plazo es de doce meses (seis para profesionales).", "fuente": "Ley de Tráfico RDL 6/2015 art. 71.1", "img": null}, {"tema": 11, "q": "Un conductor mantiene todos sus puntos porque no ha sido sancionado en firme. Con la bonificación, ¿cuál es el máximo de puntos que puede llegar a acumular?", "opts": ["Quince puntos", "Catorce puntos", "Dieciocho puntos"], "a": 0, "expl": "La bonificación (dos puntos en los tres primeros años y uno en los tres siguientes) permite llegar como máximo a quince en lugar de los doce iniciales.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 63.4", "img": null}, {"tema": 11, "q": "Un conductor comete una infracción que acarrea pérdida de puntos mientras circula en bicicleta. ¿Pierde puntos por ella?", "opts": ["Sí, pero únicamente si la infracción cometida es muy grave", "No, la pérdida solo afecta a vehículos que exigen permiso", "Sí, se descuentan igual que si condujera un coche o una moto"], "a": 1, "expl": "La pérdida de puntos solo se produce cuando el hecho se comete conduciendo un vehículo para el que se exige permiso o licencia.", "fuente": "Ley de Tráfico RDL 6/2015 art. 65.3", "img": null}, {"tema": 11, "q": "¿Qué ocurre con el permiso de conducción de quien pierde la totalidad de los puntos asignados?", "opts": ["Queda en suspenso un mes y después se restablece", "Pierde su vigencia y el titular no puede conducir", "Solo le autoriza a conducir por las vías urbanas"], "a": 1, "expl": "La vigencia del permiso está condicionada a no haber perdido el crédito de puntos. Si se pierden todos, se declara la pérdida de vigencia.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 61.3; RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, arts. 12.5 y 37", "img": null}, {"tema": 11, "q": "Un conductor es titular de un permiso B y de un permiso A. ¿Cómo se gestiona su crédito de puntos?", "opts": ["Tiene un crédito de puntos independiente para cada permiso suyo", "Solo cuenta el crédito del permiso que obtuvo en último lugar", "Tiene un único crédito de puntos para todas sus autorizaciones"], "a": 2, "expl": "El crédito de puntos es único para todas las autorizaciones administrativas de las que sea titular el conductor.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 63.3", "img": null}, {"tema": 11, "q": "Un conductor tiene un permiso de conducción con más de tres años de antigüedad y no se da ninguno de los supuestos excepcionales. ¿Qué crédito inicial de puntos se le asigna?", "opts": ["Doce puntos", "Diez puntos", "Quince puntos"], "a": 0, "expl": "El crédito inicial ordinario es de doce puntos. Los quince solo se alcanzan como máximo con la bonificación por no ser sancionado.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 63.1", "img": null}, {"tema": 11, "q": "En un mismo día un conductor comete varias infracciones graves, cada una de las cuales detrae puntos, y la suma supera con mucho los ocho. ¿Cuántos puntos pierde como máximo ese día?", "opts": ["Ocho puntos", "Seis puntos", "Diez puntos"], "a": 0, "expl": "Por acumulación de infracciones en un solo día no se pierden más de ocho puntos, salvo que concurran ciertas infracciones muy graves del art. 77, que no es el caso.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 64.4", "img": null}, {"tema": 11, "q": "¿Qué compensa la superación de un curso de conducción segura y eficiente a quien tiene saldo positivo de puntos?", "opts": ["Un punto adicional, hasta un máximo de doce puntos", "Seis puntos adicionales, por una sola vez cada dos años", "Dos puntos adicionales, hasta un máximo de quince"], "a": 2, "expl": "El curso de conducción segura y eficiente compensa con dos puntos adicionales hasta un máximo de quince.", "fuente": "Ley de Tráfico RDL 6/2015 art. 63.5", "img": null}, {"tema": 12, "q": "¿Cuándo debe el conductor circular a velocidad moderada y detenerse si es preciso en relación con los ciclistas?", "opts": ["Al aproximarse a ciclos circulando y en las proximidades de vías de uso exclusivo de ciclos", "Únicamente cuando el ciclista circule por el centro del carril de su misma vía", "Solo cuando el ciclista le haga señales con el brazo para pedirle paso"], "a": 0, "expl": "Se debe moderar la velocidad al aproximarse a ciclos y junto a vías de uso exclusivo de ciclos.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 46.1.b)", "img": null}, {"tema": 12, "q": "¿Qué dato puede consultar el titular de un permiso en la aplicación miDGT?", "opts": ["La ubicación diaria de los radares móviles", "El saldo de puntos de su permiso", "El historial de sanciones de otros conductores"], "a": 1, "expl": "miDGT permite llevar el permiso y la documentación del vehículo en el móvil y consultar, entre otros datos, el saldo de puntos.", "fuente": "DGT, nota de prensa de la aplicación miDGT", "img": null}, {"tema": 12, "q": "Un peatón camina de noche por el arcén de una carretera interurbana. ¿Qué debe llevar como mínimo?", "opts": ["Un elemento luminoso o reflectante visible a 150 metros", "Ropa de color claro y buena visibilidad, sin otros elementos", "Un elemento luminoso o reflectante visible a solo 50 metros"], "a": 0, "expl": "Entre el ocaso y la salida del sol, el peatón que transita por calzada o arcén en vía interurbana debe llevar un elemento luminoso o reflectante visible a 150 metros.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 123.1", "img": null}, {"tema": 12, "q": "Unos viajeros acaban de bajar de un autobús en una parada señalizada y están entre el autobús y la zona peatonal. ¿Quién tiene prioridad?", "opts": ["El conductor que circula por la calzada", "El primero que llegue al punto de cruce", "Los peatones"], "a": 2, "expl": "Los peatones tienen prioridad cuando van a subir o han bajado de un vehículo de transporte colectivo en una parada señalizada y se encuentran entre este y la zona peatonal o refugio.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 65.1.d)", "img": null}, {"tema": 12, "q": "Va a adelantar a un ciclista fuera de poblado. ¿Qué debe hacer con su velocidad durante la maniobra?", "opts": ["Circular al límite de velocidad de la vía sin sobrepasarlo", "Reducirla 20 km/h como mínimo respecto al límite", "Aumentarla notoriamente para acortar la duración de la maniobra"], "a": 1, "expl": "Fuera de poblado el que adelanta a un ciclista debe reducir la velocidad al menos 20 km/h respecto al límite existente, antes y durante la maniobra.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 85.4", "img": null}, {"tema": 12, "q": "¿Pueden los peatones atravesar una glorieta por su calzada?", "opts": ["No, deben rodearla salvo que haya un paso habilitado", "Sí, siempre que no haya vehículos circulando", "Sí, si lo hacen perpendicularmente al eje de la calzada"], "a": 0, "expl": "Los peatones no podrán atravesar plazas y glorietas por su calzada, debiendo rodearlas, salvo que exista un paso para peatones habilitado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 124.4", "img": null}, {"tema": 12, "q": "Un peatón camina por una carretera convencional fuera de poblado y no dispone de zona peatonal practicable. Como norma general, ¿por dónde debe circular?", "opts": ["Por el centro de la calzada, sobre la línea longitudinal", "Por el arcén izquierdo, si existe y es practicable", "Por el arcén derecho, si existe y es practicable"], "a": 1, "expl": "Sin zona peatonal, el peatón usa el arcén izquierdo si existe y es practicable; si no, la calzada lo más alejado posible del tránsito. Solo por la derecha cuando razones de seguridad lo justifiquen.", "fuente": "RGC art. 122.1 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Según la definición legal introducida con la reforma de 2026, ¿cuál de estos conductores es un usuario vulnerable de la vía?", "opts": ["El conductor de una furgoneta", "El ciclista", "El conductor de un camión de mercancías"], "a": 1, "expl": "La definición de usuarios vulnerables incluye a peatones, ciclistas, conductores de VMP y conductores y pasajeros de motocicletas y ciclomotores.", "fuente": "Ley de Tráfico RDL 6/2015 (consolidada), anexo I, concepto 86 (RD 518/2026, DF 1.ª)", "img": null}, {"tema": 12, "q": "Un conductor de patinete eléctrico circula de noche. ¿Qué elemento debe llevar, como mínimo, para ser visible?", "opts": ["Uno luminoso o reflectante, visible a 150 metros como mínimo", "Uno luminoso o reflectante, visible a 100 metros como mínimo", "Uno luminoso o reflectante, visible a 300 metros como mínimo"], "a": 0, "expl": "Entre el ocaso y la salida del sol, o con poca visibilidad, los conductores de VMP deben llevar al menos un elemento luminoso o reflectante visible a 150 metros como mínimo.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 118.3", "img": null}, {"tema": 12, "q": "Un peatón advierte las señales acústicas y ópticas de un vehículo prioritario. ¿Qué debe hacer?", "opts": ["Cruzar rápidamente la calzada antes de que llegue el vehículo prioritario", "Quedarse quieto en la calzada para que el conductor pueda calcular su trayectoria", "Despejar la calzada y permanecer en refugios o zonas peatonales, si los hay"], "a": 2, "expl": "Los peatones deben despejar la calzada y quedarse en refugios o zonas peatonales, o alejarse de la zona de circulación.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 122.5", "img": null}, {"tema": 12, "q": "¿En qué vías urbanas puede la autoridad municipal permitir que las bicicletas circulen en los dos sentidos?", "opts": ["En cualquier calle de un solo carril, sea cual sea su límite", "En las de un solo carril con límite de 30 km/h o menos", "En todas las calles con un carril por sentido y límite de 50 km/h"], "a": 1, "expl": "Es posible en vías urbanas de un solo carril limitadas a 30 km/h o menos y previa señalización.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 153.6", "img": null}, {"tema": 12, "q": "¿Pueden los peatones circular por autopistas y autovías?", "opts": ["Sí, por el arcén izquierdo, siempre que sea transitable", "Sí, por el arcén derecho, siempre que vayan en fila india", "No, salvo las excepciones previstas en el Reglamento"], "a": 2, "expl": "El art. 125 prohíbe a los peatones circular por autopistas y autovías, salvo en los casos expresamente previstos (por ejemplo, emergencias o personal de servicios).", "fuente": "RGC art. 125.1 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "¿Qué obligación de protección tiene el conductor de un patinete eléctrico?", "opts": ["Usar casco homologado o certificado, bien abrochado", "Usar casco solo cuando circule por vías interurbanas", "Usar casco solo si es menor de dieciséis años"], "a": 0, "expl": "Todos los conductores de vehículos de movilidad personal deben utilizar casco adecuadamente abrochado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 118.3", "img": null}, {"tema": 12, "q": "¿Se puede adelantar a otro vehículo en la intersección de la calzada con una vía ciclista?", "opts": ["No, está prohibido, también en sus proximidades", "Sí, si el ciclista no está a la vista en ese momento", "Sí, siempre que se adelante por el lado derecho"], "a": 0, "expl": "Queda prohibido adelantar en pasos para peatones señalizados, en las intersecciones con vías para ciclistas y en los pasos a nivel, y en sus proximidades.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 87.1.b) (RD 518/2026)", "img": null}, {"tema": 12, "q": "Un turismo debe cruzar un arcén por el que caminan peatones que no disponen de zona peatonal. ¿Quién tiene prioridad?", "opts": ["El primero que llegue al punto en que se cortan sus trayectorias", "El conductor, porque el peatón circula fuera de la calzada", "Los peatones, y el conductor debe detenerse si es necesario"], "a": 2, "expl": "Los peatones tienen prioridad cuando el vehículo cruza un arcén por el que circulan peatones sin zona peatonal; el conductor debe dejarlos pasar, deteniéndose si fuera necesario.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 65.1.c) y 64.1", "img": null}, {"tema": 12, "q": "En una ciudad existe un carril bici junto a la calzada. ¿Está obligado un ciclista a utilizarlo?", "opts": ["Su uso es preferente, y solo es obligatorio si una señal R-407a lo establece", "Sí, siempre es obligatorio usarlo, aunque no haya ninguna señal que lo exija", "No, el ciclista puede elegir libremente, aunque una señal R-407a lo haga obligatorio"], "a": 0, "expl": "Si hay carril bici, su uso es preferente; la autoridad competente puede hacerlo obligatorio mediante la señal R-407a.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 153.1", "img": null}, {"tema": 12, "q": "¿Qué tasa máxima de alcohol en aire espirado puede tener el conductor de un vehículo de transporte escolar?", "opts": ["0,15 miligramos por litro", "0,25 miligramos por litro", "0,50 miligramos por litro"], "a": 0, "expl": "En el transporte escolar y de menores, la tasa máxima es de 0,3 g/l en sangre o 0,15 mg/l en aire espirado.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 20, párrafo 2.º", "img": null}, {"tema": 12, "q": "Un ciclista circula de noche por una carretera interurbana. ¿A qué distancia mínima debe ser visible el elemento luminoso o reflectante que lleva?", "opts": ["A 200 metros, para los conductores que se le aproximen", "A 100 metros, para los conductores que se le aproximen", "A 150 metros, para los conductores que se le aproximen"], "a": 2, "expl": "En vía interurbana, entre el ocaso y la salida del sol o con visibilidad disminuida, el ciclista debe llevar al menos un elemento luminoso o reflectante visible a 150 m.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 118.2", "img": null}, {"tema": 12, "q": "Varios ciclistas de un mismo grupo se van pasando unos a otros en una carretera. ¿Se consideran adelantamientos esas maniobras?", "opts": ["No, los cambios de posición entre ciclistas de un mismo grupo no lo son", "Sí, salvo que se realicen por el arcén de la carretera y a baja velocidad", "Sí, y deben señalizarse con el brazo igual que cualquier otro adelantamiento"], "a": 0, "expl": "El Reglamento excluye del concepto de adelantamiento los cambios de posición entre ciclistas de un mismo grupo.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 84.5", "img": null}, {"tema": 12, "q": "Un peatón va a cruzar por un paso marcado sin semáforo. ¿Cuándo debe entrar en la calzada?", "opts": ["Cuando la distancia y velocidad de los vehículos lo permitan", "Siempre que quiera, porque en un paso tiene preferencia absoluta", "Solo cuando todos los vehículos se hayan detenido por completo"], "a": 0, "expl": "Aunque tengan preferencia, solo deben penetrar en la calzada cuando la distancia y la velocidad de los vehículos que se aproximen permitan hacerlo con seguridad.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 124.1.c)", "img": null}, {"tema": 12, "q": "¿Qué prioridad tiene el peatón en una zona de plataforma única de calzada y acera?", "opts": ["Goza de prioridad de paso en cualquier punto de la calzada", "Solo la tiene en los pasos para peatones marcados en el suelo", "Solo la tiene cuando la zona está regulada por un semáforo"], "a": 0, "expl": "En las zonas con plataforma única de calzada y acera, especialmente diseñadas para el tránsito peatonal, el peatón goza de prioridad de paso en cualquier punto de la calzada.", "fuente": "Ley de Tráfico RDL 6/2015 (consolidada), anexo I, concepto 83 (modificado por RD 518/2026)", "img": null}, {"tema": 12, "q": "Un paso para peatones sin semáforo para ellos está regulado por un semáforo de vehículos en verde. ¿Puede el peatón cruzar?", "opts": ["Sí, porque en un paso señalizado el peatón tiene siempre prioridad", "No, mientras la señal permita circular a los vehículos", "Sí, si los vehículos más próximos están a más de 50 metros"], "a": 1, "expl": "Si no hay semáforo para peatones pero la circulación está regulada por agente o semáforo, no deben penetrar en la calzada mientras la señal permita circular a los vehículos por ella.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 124.1.b)", "img": null}, {"tema": 12, "q": "¿Qué límite de masa se impone al remolque que arrastra una motocicleta?", "opts": ["Que no supere el 50 por ciento de la masa en vacío de la moto", "Que no supere el 75 por ciento de la masa en vacío de la moto", "Que no supere el 50 por ciento de la masa máxima autorizada de la moto"], "a": 0, "expl": "El remolque o semirremolque no puede superar el 50 por ciento de la masa en vacío del vehículo tractor, y además solo se puede circular de día, con velocidad reducida un 10 por ciento y sin personas en el remolque.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 12.3", "img": null}, {"tema": 12, "q": "Fuera de poblado, ¿puede un ciclista superar los 45 km/h, que es la velocidad máxima genérica para ciclos?", "opts": ["Sí, pero solo en vías urbanas cuyo límite genérico sea de 50 km/h", "Sí, donde las circunstancias de la vía permitan una velocidad superior", "No, 45 km/h es un límite absoluto para cualquier ciclo en cualquier vía"], "a": 1, "expl": "Los conductores de bicicletas pueden superar los 45 km/h donde las circunstancias de la vía permitan una velocidad mayor.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48 e)", "img": null}, {"tema": 12, "q": "¿Qué ocurre con la prioridad de paso cuando el primer ciclista de un grupo ya ha iniciado el cruce de una vía?", "opts": ["Solo ese primer ciclista tiene prioridad y todos los demás deben ceder el paso", "El grupo ciclista tiene prioridad de paso respecto a otros vehículos", "Ningún ciclista del grupo tiene prioridad, pues los grupos siguen la norma general"], "a": 1, "expl": "Los ciclistas que circulan en grupo tienen prioridad cuando el primero haya iniciado ya el cruce o haya entrado en una glorieta.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 64.2.c)", "img": null}, {"tema": 12, "q": "Una persona con movilidad reducida se desplaza en un vehículo de movilidad personal al paso de una persona. ¿Qué consideración tiene?", "opts": ["La de peatón", "La de ciclista, obligado a circular por la calzada", "La de conductor de VMP, sujeto a la edad mínima"], "a": 0, "expl": "A efectos del Reglamento, las personas con movilidad reducida que se desplazan en VMP al paso de persona tienen la consideración de peatones.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 155.6", "img": null}, {"tema": 12, "q": "En una plaza peatonal de una ciudad, ¿pueden circular bicicletas junto a los peatones?", "opts": ["No, en las zonas peatonales está prohibida la circulación de cualquier vehículo en todo caso", "Sí, si la autoridad municipal lo autoriza por ordenanza, respetando a los peatones", "Sí, siempre, y los ciclistas tienen prioridad sobre los peatones si circulan despacio"], "a": 1, "expl": "En zonas peatonales distintas de las aceras, la autoridad municipal puede autorizar por ordenanza la coexistencia con ciclistas, respetando la prioridad de los peatones.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 152.1", "img": null}, {"tema": 12, "q": "¿Qué indica la marca vial M-4.4, formada por dos líneas transversales discontinuas y paralelas sobre la calzada?", "opts": ["Un paso para ciclistas en el que los vehículos deben dejarles paso", "Una zona de espera adelantada para ciclistas situada ante un semáforo", "Un paso para peatones en el que los ciclistas deben bajarse de la bicicleta"], "a": 0, "expl": "La marca M-4.4 son dos líneas transversales discontinuas y paralelas e indica un paso para ciclistas.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, marca M-4.4", "img": null}, {"tema": 12, "q": "Un ciclista baja un puerto largo, con muchas curvas, por una carretera convencional. ¿Qué puede hacer si la seguridad lo permite?", "opts": ["Abandonar el arcén y circular por la parte derecha de la calzada que necesite", "Circular por el centro de la calzada, ocupando también parte del sentido contrario", "Ocupar el carril de la izquierda para poder tomar las curvas a más velocidad"], "a": 0, "expl": "En descensos prolongados con curvas, los ciclistas pueden salir del arcén y usar la parte derecha de la calzada que necesiten (salvo en autovías).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 36.1", "img": null}, {"tema": 12, "q": "Un peatón empuja su ciclomotor de dos ruedas por una carretera sin zona peatonal. ¿Por qué lado debe circular?", "opts": ["Siempre por la derecha, en el sentido de su marcha", "Por el arcén izquierdo, como el resto de los peatones", "Por el lado que prefiera, siempre que extreme la precaución"], "a": 0, "expl": "Quienes empujen o arrastren un ciclo, un ciclomotor de dos ruedas o un VMP deben circular siempre por la derecha, a diferencia de la regla general para peatones.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 122.2.a)", "img": null}, {"tema": 12, "q": "¿Puede un patinete eléctrico circular por la acera?", "opts": ["Sí, siempre que la acera tenga una anchura suficiente", "Sí, si el conductor reduce su marcha a paso de peatón", "No, las aceras están reservadas a los peatones"], "a": 2, "expl": "Las aceras son espacio reservado a peatones y se prohíbe circular por ellas con cualquier tipo de vehículo; los VMP y bicicletas no pueden circular por aceras salvo las excepciones reglamentarias.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 152.1 (RD 518/2026) y Ley art. 25.5", "img": null}, {"tema": 12, "q": "Conduce un turismo detrás de un ciclista en el mismo carril. ¿Qué separación mínima debe dejar?", "opts": ["Al menos diez metros", "Al menos tres metros y medio", "Al menos cinco metros"], "a": 2, "expl": "Los conductores de vehículos a motor deben dejar una separación mínima de cinco metros con los ciclistas que les precedan en el mismo carril.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 153.4", "img": null}, {"tema": 12, "q": "¿Qué velocidad máxima tiene fuera de poblado un vehículo especial que arrastra un remolque?", "opts": ["50 km/h", "25 km/h", "40 km/h"], "a": 1, "expl": "Los vehículos especiales que llevan remolque, carecen de señalización de frenado o son motocultores tienen un límite de 25 km/h fuera de poblado.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.c).1.º", "img": null}, {"tema": 12, "q": "Un ciclista circula por una calle urbana de un solo carril por sentido. ¿Por qué parte del carril debe ir preferentemente?", "opts": ["Por la parte izquierda del carril, para ser visto mejor por quienes van detrás", "Por el centro del carril, si su seguridad y la de los demás lo permiten", "Lo más pegado posible al bordillo, para no estorbar a los vehículos de motor"], "a": 1, "expl": "Los ciclistas circulan preferentemente por el centro del carril, siempre que su seguridad y la de otros usuarios lo permita.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 153.3", "img": null}, {"tema": 12, "q": "Una persona camina por el arcén de una carretera empujando su bicicleta. ¿Por qué lado debe ir?", "opts": ["Por la izquierda, como cualquier peatón y sin excepciones", "Por la derecha, en el sentido de su marcha", "Por el lado que prefiera, según el tráfico que vea"], "a": 1, "expl": "Quienes empujan o arrastran un ciclo deben circular obligatoriamente por la derecha.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 122.2.a)", "img": null}, {"tema": 12, "q": "¿Pueden circular los vehículos de movilidad personal (por ejemplo, patinetes eléctricos) por autopistas y autovías?", "opts": ["No, está prohibido que circulen", "Sí, pero únicamente por el arcén derecho de la vía", "Sí, siempre que no superen los 25 km/h"], "a": 0, "expl": "El RGC prohíbe a los vehículos de movilidad personal circular por autopistas y autovías (y por travesías).", "fuente": "RGC art. 38.4 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Un ciclista da una tasa de alcohol en sangre de 0,6 g/l en un control. ¿Puede seguir circulando?", "opts": ["Sí, a los conductores de bicicletas se les permite hasta 0,8 g/l en sangre", "No, para los conductores de bicicletas el máximo es 0,5 g/l en sangre", "Sí, los límites de alcohol no se aplican a quienes conducen bicicletas"], "a": 1, "expl": "Los conductores de bicicletas no pueden circular con más de 0,5 g/l de alcohol en sangre ni 0,25 mg/l en aire espirado.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 20", "img": null}, {"tema": 12, "q": "En una autovía con dos carriles en el mismo sentido hay retención y los vehículos avanzan al paso o están detenidos. Si se aproxima un vehículo prioritario con señales especiales, ¿dónde debe formarse el carril de emergencia?", "opts": ["En el arcén derecho, al que se apartan todos los vehículos", "En el carril de la derecha, que todos los conductores dejan libre", "En el centro de la vía, entre los dos carriles del mismo sentido"], "a": 2, "expl": "Con dos carriles por sentido, los vehículos se orillan hacia los lados y el espacio libre (carril de emergencia) queda en el centro, entre ambos carriles.", "fuente": "RGC art. 32.1 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Va a girar a la derecha para entrar en otra calle y hay peatones cruzándola, aunque no existe paso para peatones señalizado. ¿Quién tiene prioridad?", "opts": ["El primero que llegue a la bocacalle", "Los peatones", "Usted, porque no hay paso señalizado"], "a": 1, "expl": "Los peatones tienen prioridad cuando un vehículo gira para entrar en otra vía y ellos la están cruzando, aunque no exista paso para peatones.", "fuente": "RGC art. 65.1.b) (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Un niño de diez años quiere ir en bicicleta por la acera. ¿En qué caso es posible?", "opts": ["Si no hay peatones en ese momento y va a poca velocidad", "Si lleva casco y circula pegado a las fachadas", "Si la ordenanza lo permite y va con un adulto a pie"], "a": 2, "expl": "Las ordenanzas pueden permitir la circulación por aceras de niños de hasta doce años en bicicleta, a cargo de un adulto que circule a pie.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 152.1", "img": null}, {"tema": 12, "q": "¿Cuándo pueden los ocupantes de un vehículo de tres ruedas prescindir del casco, los guantes y el calzado cerrado?", "opts": ["Si tiene estructura de autoprotección y cinturones, según su ITV", "Si circulan únicamente por vías urbanas y a menos de 50 km/h", "Si el conductor lleva más de cinco años con el permiso y es de día"], "a": 0, "expl": "Quedan exentos si el vehículo tiene estructura de autoprotección y cinturones de seguridad, y así consta en su tarjeta de inspección técnica; entonces deben usar el cinturón en todo tipo de vías.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 118.1, párrafo final", "img": null}, {"tema": 12, "q": "¿Pueden circular animales o vehículos de tracción animal por una autovía?", "opts": ["Sí, si no existe otra vía alternativa en la zona", "No, está prohibido en autopistas y autovías", "Sí, por el arcén y siempre que vayan custodiados"], "a": 1, "expl": "Se prohíbe la circulación de animales por autopistas y autovías, incluida la de vehículos de tracción animal.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 128 y Ley art. 50.2", "img": null}, {"tema": 12, "q": "Un motorista se detiene por avería, baja de la moto y ocupa el arcén de una carretera convencional. ¿Qué debe utilizar?", "opts": ["Una prenda reflectante, pero únicamente si ya ha anochecido", "Un chaleco reflectante de alta visibilidad", "Solo el casco bien abrochado, pues el chaleco no es exigible a motos"], "a": 1, "expl": "Los conductores de motocicletas deben usar el chaleco reflectante de alta visibilidad cuando salgan del vehículo y ocupen la calzada o el arcén de vías interurbanas; las motos deben llevarlo en su dotación.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 118.4 y RGV anexo XII (RD 518/2026, DF 2.ª)", "img": null}, {"tema": 12, "q": "Un peatón cruza la calzada y percibe las señales acústicas de un vehículo prioritario que se aproxima. ¿Qué debe hacer?", "opts": ["Despejar la calzada y quedarse en el refugio o zona peatonal", "Avanzar hacia el vehículo para indicar al conductor por dónde pasar", "Permanecer parado en el lugar de la calzada donde se encuentre"], "a": 0, "expl": "Al apercibirse de las señales ópticas o acústicas de vehículos prioritarios, los peatones deben despejar la calzada y permanecer en refugios o zonas peatonales, o alejarse de la zona de circulación.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 122.5", "img": null}, {"tema": 12, "q": "¿Puede un ciclomotor circular por una autovía o por su arcén?", "opts": ["Sí, siempre que circule por el arcén y lo haga a velocidad reducida", "Sí, si es de día y el arcén es lo bastante ancho para circular", "No, los ciclomotores tienen prohibido circular por autovías"], "a": 2, "expl": "En autopistas y autovías está prohibido circular con ciclomotores; solo los ciclistas mayores de 14 años pueden usar el arcén de las autovías, salvo prohibición señalizada.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 38.1", "img": null}, {"tema": 12, "q": "¿Cómo deben advertir sus maniobras los conductores de vehículos de movilidad personal?", "opts": ["Con el brazo, pero únicamente cuando circulen por vía interurbana", "Siempre con el brazo, en la forma que fija el Reglamento", "Con la luz de freno del patinete, sin necesidad de sacar el brazo"], "a": 1, "expl": "Los conductores de VMP deben utilizar siempre el brazo para advertir las maniobras, según el artículo 109.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 155.4", "img": null}, {"tema": 12, "q": "Se aproxima a una intersección con una vía para ciclistas. ¿Puede adelantar a otro vehículo en ese punto?", "opts": ["No, está prohibido adelantar en las intersecciones con vías para ciclistas", "Sí, si el ciclista aún no ha llegado al cruce y reduce la velocidad al menos 20 km/h", "Sí, siempre que la maniobra se realice sin invadir el carril contrario ni el arcén"], "a": 0, "expl": "Está prohibido adelantar en las intersecciones con vías para ciclistas y en sus proximidades (RGC 87.1.b, modificado por el RD 518/2026).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 87.1.b)", "img": null}, {"tema": 12, "q": "Un ciclista quiere transportar a su perro en un remolque de bicicleta que cumple las especificaciones técnicas. ¿Qué peso máximo puede tener el animal?", "opts": ["25 kg", "15 kg", "22 kg"], "a": 1, "expl": "Los remolques de bicicleta pueden transportar animales de hasta 15 kg de peso.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 154.4", "img": null}, {"tema": 12, "q": "Un ciclomotorista circula a baja velocidad por una calle de una ciudad. ¿Debe llevar casco homologado abrochado?", "opts": ["No, en poblado basta con llevarlo si supera los 30 km/h", "Sí, en todo tipo de vías, también en poblado", "No, en vías urbanas solo es obligatorio para el pasajero"], "a": 1, "expl": "El casco de protección, adecuadamente abrochado, es obligatorio para conductores y pasajeros de ciclomotores y motocicletas en todo tipo de vías, urbanas o interurbanas.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 118.1.a)", "img": null}, {"tema": 12, "q": "¿Desde qué edad pueden los conductores de bicicletas circular por los arcenes de las autovías, salvo prohibición señalizada?", "opts": ["Los mayores de 16 años", "Los mayores de 14 años", "Los mayores de 12 años"], "a": 1, "expl": "El Reglamento permite a los ciclistas mayores de 14 años usar los arcenes de las autovías, salvo prohibición por señalización.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 38.1", "img": null}, {"tema": 12, "q": "Va a adelantar a un ciclista en una carretera interurbana con dos carriles por sentido. ¿Qué exige el Reglamento a partir del 1-oct-2026?", "opts": ["Realizar un cambio completo de carril para rebasarlo", "Mantenerse en su carril si deja un metro de separación lateral", "Rebasarlo por su mismo carril avisando antes con la bocina"], "a": 0, "expl": "Cuando la calzada tiene más de un carril por sentido, el adelantamiento a ciclistas exige cambiar completamente de carril, no basta con apartarse lateralmente.", "fuente": "RGC art. 85.4 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Si por razones de seguridad se prohíbe a las bicicletas circular por el arcén de una autovía, ¿qué debe complementar esa prohibición?", "opts": ["Un panel que informe del itinerario alternativo", "Un panel que indique la velocidad mínima exigida", "Un panel que informe de la distancia a la siguiente salida"], "a": 0, "expl": "La prohibición a ciclistas en arcenes de autovía debe complementarse con un panel (S-860) con el itinerario alternativo.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 38.1", "img": null}, {"tema": 12, "q": "Un grupo de peatones camina de noche por el arcén de una carretera. ¿Qué luces debe llevar, además, en el lado más próximo al centro de la calzada?", "opts": ["Blancas o amarillas hacia delante y rojas hacia atrás", "Rojas hacia delante y blancas o amarillas hacia atrás", "Verdes hacia delante y rojas hacia atrás, siempre fijas"], "a": 0, "expl": "Los grupos de peatones llevan, en el lado más próximo al centro de la calzada, luces blancas o amarillas hacia delante y rojas hacia atrás.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 123.2", "img": null}, {"tema": 12, "q": "Un adulto quiere llevar a su hijo en un asiento adicional de su bicicleta. ¿Qué condición debe cumplir el menor?", "opts": ["Pesar como máximo 15 kg y ser capaz de agarrarse con ambas manos", "Pesar hasta 22 kg y ser capaz de sentarse solo en el asiento", "Tener más de doce años y llevar casco homologado, sin límite de peso"], "a": 1, "expl": "Las bicicletas que no puedan ser ocupadas por más de una persona pueden llevar menores de hasta 22 kg capaces de sentarse solos en asientos adicionales homologados.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 154.2", "img": null}, {"tema": 12, "q": "Un ciclomotor de dos ruedas va a girar a la izquierda en una vía interurbana sin carril de giro. ¿Cómo debe hacerlo?", "opts": ["Situarse a la derecha, fuera de la calzada si puede, y girar desde allí", "Colocarse junto a la línea que separa los sentidos y girar desde el centro", "Detenerse en el centro de su carril y esperar a que no vengan vehículos"], "a": 0, "expl": "En vías interurbanas, sin carril acondicionado para el giro a la izquierda, ciclos y ciclomotores de dos ruedas se sitúan a la derecha, fuera de la calzada si es posible, e inician el giro desde ese lugar.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 76.2", "img": null}, {"tema": 12, "q": "Circula por una zona donde caminan niños y personas mayores. ¿Qué debe hacer el conductor?", "opts": ["Avisar con la bocina de forma continuada", "Mantener la velocidad, pues los peatones deben apartarse solos", "Extremar el cuidado para no poner en riesgo su integridad"], "a": 2, "expl": "Los peatones, en especial niños, mayores y personas con movilidad reducida, gozan de prioridad de paso y estancia, y los conductores deben extremar el cuidado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 121.1", "img": null}, {"tema": 12, "q": "Un grupo de ciclistas circula de a dos por la parte imprescindible de la calzada. ¿En qué casos deben colocarse en hilera?", "opts": ["En tramos sin visibilidad y entre el ocaso y la salida del sol", "Únicamente cuando un agente de la autoridad se lo indique de forma expresa", "Solo en subida y cuando circulen a menos de 20 km/h sin vehículos detrás"], "a": 0, "expl": "Deben ir en hilera en tramos sin visibilidad, cuando afecten a la fluidez, de noche o con condiciones que reduzcan sensiblemente la visibilidad.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 36.2", "img": null}, {"tema": 12, "q": "Un rebaño debidamente conducido circula por una carretera. ¿Qué parte de la calzada puede ocupar como máximo?", "opts": ["Hasta dos tercios de la calzada, siempre que vaya al paso", "Toda la calzada, si va al paso y lo conducen dos personas", "Nunca más de la mitad derecha de la calzada"], "a": 2, "expl": "Los animales en manada o rebaño van al paso, lo más cerca posible del borde derecho y sin ocupar nunca más de la mitad derecha de la calzada, en grupos de longitud moderada.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 127.1.c)", "img": null}, {"tema": 12, "q": "Va a girar con su turismo para entrar en otra vía y hay animales cruzándola, aunque no exista paso para ellos. ¿Quién tiene prioridad?", "opts": ["El conductor, si circula a una velocidad inferior a 30 km/h", "Los animales", "El conductor, porque no hay paso señalizado para animales"], "a": 1, "expl": "El conductor tiene prioridad sobre los animales salvo, entre otros casos, cuando va a girar para entrar en otra vía y hay animales cruzándola, aunque no exista paso para ellos.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 66.1.b)", "img": null}, {"tema": 12, "q": "Salvo que lo prohíba la señalización, ¿por qué vías interurbanas puede circular un patinete eléctrico?", "opts": ["Por carreteras de un carril por sentido, si es de día y sin niebla", "Por vías ciclistas, como carriles bici o sendas ciclables", "Por cualquier carretera con arcén lo bastante ancho para circular"], "a": 1, "expl": "En vías interurbanas y túneles urbanos solo se permiten los VMP en vías ciclistas, carriles bici, pistas bici, sendas ciclables y vías donde esté prohibida la circulación de vehículos de motor.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 38.4.c) (RD 518/2026)", "img": null}, {"tema": 12, "q": "Cuando se habilita el arcén derecho para motocicletas, ¿qué velocidad máxima y formación se exigen?", "opts": ["50 km/h máximo, en columna de a uno", "30 km/h, en columnas de a dos", "30 km/h, en columna de a uno"], "a": 2, "expl": "En los tramos habilitados y señalizados, con la circulación detenida por congestión, la velocidad se limita a 30 km/h y solo se circula en columna de a uno.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 36.3", "img": null}, {"tema": 12, "q": "En una vía con dos carriles por sentido, ¿por cuál circulan los ciclistas, como norma general?", "opts": ["Por el carril izquierdo, para ser más visibles", "Por el que prefieran en cada momento", "Por el carril derecho"], "a": 2, "expl": "En vías con al menos dos carriles por sentido los ciclistas circulan por el carril derecho, y pueden usar otros para cambiar de dirección o por seguridad.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 153.3", "img": null}, {"tema": 12, "q": "¿Qué condición debe cumplir una motocicleta para poder llevar pasajero?", "opts": ["Que así conste en su licencia o permiso de circulación", "Que su conductor tenga el permiso de conducción desde hace más de tres años", "Que tenga una cilindrada superior a 125 centímetros cúbicos como mínimo"], "a": 0, "expl": "El pasajero solo puede viajar en ciclomotores y motocicletas si así consta en la licencia o el permiso de circulación del vehículo, además de cumplir las demás condiciones del artículo 12.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 12.1", "img": null}, {"tema": 12, "q": "Si un peatón dispone de una zona peatonal o refugio, ¿puede esperar un autobús en la calzada?", "opts": ["Sí, siempre que haya poco tráfico y se mantenga a la vista de los conductores", "Sí, si se sitúa en el borde y no entorpece la circulación de los demás", "No, y solo puede invadirla para subir cuando el vehículo ya esté a su altura"], "a": 2, "expl": "Habiendo refugio o zona peatonal, ningún peatón permanece detenido en la calzada ni siquiera esperando un vehículo.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 122.4", "img": null}, {"tema": 12, "q": "Junto a una parada de autobús existe una zona peatonal. ¿Dónde debe esperar el peatón al autobús?", "opts": ["En la calzada, cuando no se vean vehículos aproximándose", "En el arcén, pegado al borde exterior de la calzada", "En la zona peatonal, nunca en la calzada ni en el arcén"], "a": 2, "expl": "Si existe refugio, zona peatonal u otro espacio adecuado, ningún peatón permanece detenido en la calzada ni en el arcén, ni siquiera esperando un vehículo; solo puede invadir la calzada para subir cuando el vehículo esté a su altura.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 122.4", "img": null}, {"tema": 12, "q": "Hay una cola de coches detenidos ante un semáforo en rojo en una calle urbana. ¿Qué puede hacer un ciclista?", "opts": ["Rebasarlos por la derecha o la izquierda para llegar a la zona de espera adelantada", "Esperar detrás del último vehículo, pues no puede rebasar a vehículos que están detenidos", "Rebasarlos únicamente por la izquierda, porque por la derecha le está prohibido hacerlo"], "a": 0, "expl": "Los ciclistas pueden rebasar vehículos detenidos en semáforos y retenciones, por la derecha o la izquierda, para usar la zona de espera adelantada.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 153.5", "img": null}, {"tema": 12, "q": "Un coche averiado ocupa parte de su carril y lo va a rebasar ocupando el sentido contrario. ¿Qué debe cumplir?", "opts": ["Dejar al menos 1 m de anchura de seguridad y reducir la velocidad al menos 10 km/h", "Dejar al menos 2 m de anchura de seguridad y no reducir la velocidad si la vía está despejada", "Dejar al menos 1,5 m de anchura de seguridad y reducir la velocidad al menos 20 km/h respecto al límite de la vía"], "a": 2, "expl": "Al rebasar un vehículo inmovilizado que ocupa el carril se exige anchura de seguridad de 1,5 m y reducir 20 km/h respecto al límite de la vía.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 88.1", "img": null}, {"tema": 12, "q": "Se acerca a un paso para ciclistas debidamente señalizado por el que cruza un ciclista. ¿Quién tiene prioridad de paso?", "opts": ["Quien llegue antes al cruce", "El ciclista", "Usted, por conducir un vehículo de motor"], "a": 1, "expl": "Los ciclistas tienen prioridad cuando circulan por un carril bici, paso para ciclistas o arcén debidamente señalizados.", "fuente": "RGC art. 64.2.a) (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "¿Qué edad mínima se exige para conducir un vehículo de movilidad personal, como un patinete eléctrico?", "opts": ["14 años, si van acompañados", "15 años", "16 años"], "a": 1, "expl": "No pueden conducir vehículos de movilidad personal los menores de quince años.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 155.3", "img": null}, {"tema": 12, "q": "A efectos de adelantamiento, ¿cómo se considera un grupo de ciclistas que circula agrupado?", "opts": ["Como una única unidad móvil", "Como un obstáculo fijo en la calzada", "Como varios ciclistas a adelantar uno a uno"], "a": 0, "expl": "El art. 85.4 establece que los conductores de bicicletas que circulan en grupo se consideran una única unidad móvil, de modo que la maniobra se hace respecto al conjunto.", "fuente": "RGC art. 85.4 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Dos ciclistas quieren circular juntos, uno al lado del otro, por una carretera con arcén transitable. ¿Pueden hacerlo?", "opts": ["No, la circulación en posición paralela está prohibida a todos los ciclos", "Solo si el arcén tiene más de dos metros de ancho y es de día", "Sí, pueden circular en columna de a dos por el arcén"], "a": 2, "expl": "Se prohíbe la marcha en paralelo a los ciclos, pero los conductores de bicicletas pueden circular en columna de a dos por el arcén.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 36.2", "img": null}, {"tema": 12, "q": "En una carretera convencional con un carril por sentido, ¿qué separación lateral mínima debe dejar al adelantar a un ciclista?", "opts": ["1,5 metros", "1 metro como mínimo", "2 metros como mínimo"], "a": 0, "expl": "El adelantamiento exige una anchura de seguridad de al menos 1,5 metros, ocupando parte o la totalidad del carril contiguo o contrario.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 85.4", "img": null}, {"tema": 12, "q": "¿Puede detener un momento su turismo en un carril reservado para bicicletas?", "opts": ["Sí, siempre que conecte las luces de emergencia y deje espacio para pasar", "Sí, si la detención dura menos de dos minutos y el conductor permanece al volante", "No, está prohibida la parada en los carriles reservados para las bicicletas"], "a": 2, "expl": "Queda prohibido parar, y por tanto estacionar, en los carriles reservados para las bicicletas.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 94.1.h)", "img": null}, {"tema": 12, "q": "Un peatón va a atravesar la calzada. ¿Cómo debe caminar al hacerlo?", "opts": ["En diagonal respecto al eje de la calzada, para acortar el tiempo que permanece en ella", "Por el medio de la calzada, deteniéndose para observar el tráfico de ambos sentidos", "Perpendicularmente al eje de la calzada, sin demorarse ni detenerse sin necesidad"], "a": 2, "expl": "Al atravesar la calzada hay que caminar perpendicularmente al eje, sin demorarse ni detenerse en ella sin necesidad.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 124.3", "img": null}, {"tema": 12, "q": "¿En qué vías están obligados los motoristas a ll     return bar("Percepción de riesgo", true) + '<main class="wrap"><div class="card"><p>Cada vídeo se corta en un momento clave y respondes 5 preguntas, como en el entrenamiento oficial de la DGT: si ves el riesgo, qué decisión tomas, dónde estaba, qué lo genera y qué va a pasar. Al final puedes ver el vídeo con la solución.</p><p class="muted">En el examen real hay un vídeo de este tipo con una pregunta de 3 opciones; aquí practicas el análisis completo.</p></div><div class="list">' + rows + '</div></main>';

    if (step === 0) body = '<div class="vidbox">' + cv() + '<button class="vplay" data-act="rplay"><span>&#9654;</span> Ver el vídeo</button></div><p class="muted center">Se reproducirá hasta que se corte. Fíjate bien en todo lo que hay en la vía.</p>';

    else if (step === 3) body = cv(' data-tap="1"') + '<div class="qmeta">Pregunta 3 de 5</div><div class="qt">¿Dónde estaba el riesgo justo cuando se cortó el vídeo?</div><p class="muted">Toca la zona del último fotograma (sin los obstáculos) donde creas haber visto el riesgo.</p><button class="btn" data-act="rzone"' + (R.tap ? "" : " disabled") + '>Confirmar zona</button>';

  function afterRender() {

  function toast(t) { var e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { e.hidden = true; }, 2200); }
  function download(name, obj) { var b = new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

  /* ---------- acciones ---------- */
  var ACT = {
    riesgo: function () { go("riesgo"); },
    rstart: function (el) {
      var id = el.getAttribute("data-id"), fresh = cur().view === "rtrain";

    home: function () { home(); },
    ajustes: function () { go("ajustes"); },

      sheet('<h2>¿Quién estudia?</h2>' + DB.profiles.map(function (p) { return '<button class="btn big ' + (p.id === DB.cur ? "" : "ghost") + '" data-act="sh-p" data-pid="' + p.id + '"><b>' + esc(p.name) + '</b></button>'; }).join(""), function (a, el) { if (a === "sh-p") { DB.cur = el.getAttribute("data-pid"); save(); home(); } });

    admin: function () { go("admin"); },
