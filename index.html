e el carril por el que circula. ¿Qué debe hacer?", "opts": ["Detenerse en el carril hasta que cambie la luz", "Abandonar ese carril en el tiempo más breve posible", "Reducir la velocidad y continuar por el carril con precaución"], "a": 1, "expl": "El aspa roja prohíbe ocupar el carril indicado; los conductores que circulen por él deben abandonarlo en el tiempo más breve posible.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.3.a)", "img": null}, {"tema": 2, "q": "Una señal vertical de forma circular y fondo azul, con símbolo blanco y sin borde rojo, ¿a qué clase de señales pertenece?", "opts": ["A las señales de obligación, que señalan una norma de circulación obligatoria", "A las señales de prioridad, que establecen reglas especiales de prioridad en las intersecciones", "A las señales de indicación, que facilitan al usuario datos que pueden serle de utilidad"], "a": 0, "expl": "Las señales circulares de fondo azul con símbolo blanco son de obligación. Las de indicación son cuadradas o rectangulares y las de prioridad tienen formas propias (octógono, triángulo invertido, rombo).", "fuente": "RGC art. 145.2.e) y Anexo I, apartado 5", "img": null}, {"tema": 2, "q": "¿Qué significa para un conductor la luz amarilla no intermitente de un semáforo circular?", "opts": ["Detenerse como ante luz roja, salvo que ya no pueda hacerlo con seguridad suficiente", "Debe detenerse en todo caso, sin ninguna excepción, aunque ello suponga un peligro para otros usuarios", "Puede continuar siempre, porque todavía no se ha encendido la luz roja y conserva la prioridad de paso"], "a": 0, "expl": "La luz amarilla fija obliga a detenerse en las mismas condiciones que la roja, a no ser que, al encenderse, el vehículo esté tan cerca que no pueda detenerse con seguridad suficiente.", "fuente": "RGC Anexo I, apartado 4.2.c)", "img": null}, {"tema": 2, "q": "Los «dientes de dragón» pintados en la calzada, ¿de qué advierten?", "opts": ["De una travesía cercana donde debe reducirse la velocidad", "De un tramo de carretera en el que está prohibido adelantar a otros", "De la proximidad de un lecho de frenado para vehículos sin frenos"], "a": 0, "expl": "Los dientes de dragón (M-8.1) advierten de la aproximación a una travesía o vía urbana en la que debe reducirse sensiblemente la velocidad y extremar la precaución.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.7", "img": null}, {"tema": 2, "q": "Un semáforo para tranvías y autobuses muestra una franja blanca vertical iluminada de forma intermitente. ¿Qué deben hacer?", "opts": ["Detenerse como con la luz amarilla fija", "Extremar la precaución y seguir sin detenerse", "Detenerse siempre, igual que con la luz roja fija"], "a": 0, "expl": "La franja blanca vertical u oblicua intermitente obliga a detenerse como si fuera una luz amarilla fija.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.4.2.d)", "img": null}, {"tema": 2, "q": "Hay semáforos con indicaciones distintas a la derecha y a la izquierda de la calzada. Si va a seguir de frente, ¿cuál obedece?", "opts": ["El que muestre la indicación más restrictiva", "El situado inmediatamente a su izquierda", "El situado inmediatamente a su derecha"], "a": 1, "expl": "Quienes pretendan girar a la izquierda o seguir de frente solo deben obedecer los semáforos situados inmediatamente a su izquierda cuando las indicaciones difieran.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 132.3", "img": null}, {"tema": 2, "q": "En una autovía donde se prohíbe circular con bicicletas, ¿qué debe indicar el panel S-860 bajo la señal de prohibición?", "opts": ["La carretera o carreteras del itinerario alternativo", "La distancia hasta el siguiente tramo con carril bici", "El horario en que queda sin efecto la prohibición para ciclistas"], "a": 0, "expl": "Bajo la señal que prohíbe las bicicletas en una autovía debe disponerse un panel S-860 que indique con claridad el itinerario alternativo.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de señales, apartado 2.11", "img": null}, {"tema": 2, "q": "¿Qué indica una línea transversal discontinua dispuesta a lo ancho de un carril?", "opts": ["Que no debe franquearse con el semáforo en rojo, como la continua", "Que no debe franquearse si hay que ceder el paso", "Que debe detenerse siempre antes de franquearla, como en un STOP"], "a": 1, "expl": "La marca transversal discontinua indica que ningún vehículo debe franquearla cuando tenga que ceder el paso (señal de ceda el paso, flecha intermitente, o normas generales de prioridad).", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.2", "img": null}, {"tema": 2, "q": "Una señal de prohibición lleva debajo un panel con el pictograma de una motocicleta y la palabra «EXCEPTO». ¿A quién no afecta?", "opts": ["Solo a las motocicletas; el resto de vehículos puede ignorarla", "A las motocicletas; sí afecta al resto de vehículos", "A ningún vehículo, pues el panel es meramente informativo"], "a": 1, "expl": "El panel con la palabra «EXCEPTO» sobre el pictograma de un vehículo indica que la señal afecta a todos los tipos de vehículos salvo ese.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, catálogo, apartado 2.3", "img": null}, {"tema": 2, "q": "Un conductor se ha detenido ante una señal que le obliga a ello. ¿Cuándo puede reanudar la marcha?", "opts": ["En cuanto se detenga, aunque aún no haya cedido el paso", "Pasados unos segundos, si no ve ningún vehículo cerca", "Cuando haya cumplido lo que la señal prescribe"], "a": 2, "expl": "Quien se detiene por una señal no puede reanudar la marcha hasta haber cumplido la prescripción que esta establece (por ejemplo, ceder el paso).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 132.1", "img": null}, {"tema": 2, "q": "Sobre el pavimento hay una flecha de retorno. ¿Qué anuncia?", "opts": ["Una línea continua próxima; debe desistir de adelantar o acabar ya", "Una glorieta de radio reducido y el sentido de circulación en ella", "El final del carril; debe cambiar al carril contiguo respetando su prioridad"], "a": 0, "expl": "La flecha de retorno anuncia la proximidad de una línea continua que prohíbe circular por su izquierda, por lo que se debe desistir de adelantar o finalizar lo antes posible si ya se ha iniciado.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, catálogo de marcas viales, 4.3", "img": null}, {"tema": 2, "q": "En un semáforo de carril aparece una flecha blanca o amarilla, apuntada oblicuamente hacia abajo. ¿Qué debe hacer el conductor de ese carril?", "opts": ["Seguir por su carril, que queda reservado a vehículos lentos", "Incorporarse con seguridad al carril que señala la flecha", "Detenerse hasta que la flecha desaparezca del semáforo"], "a": 1, "expl": "La flecha oblicua indica la necesidad de irse incorporando con seguridad al carril señalado, porque el actual va a cerrarse en corto espacio.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.3.c)", "img": null}, {"tema": 2, "q": "Un agente extiende los brazos horizontalmente y, sin cambiar de posición, los baja. ¿Qué debe hacer el conductor que debía detenerse?", "opts": ["Reanudar la marcha con precaución, cediendo el paso a los vehículos que circulen por la vía", "Seguir detenido, pues la señal sigue en vigor mientras el agente no cambie de posición", "Reanudar la marcha, porque al bajar los brazos el agente ya no emite ninguna señal"], "a": 1, "expl": "La señal de brazos extendidos permanece en vigor aunque el agente los baje, mientras no cambie de posición ni haga otra señal.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.1.b)", "img": null}, {"tema": 2, "q": "Un semáforo muestra luz roja fija y, a la vez, una flecha verde hacia la derecha sobre fondo circular negro. ¿Qué puede hacer un vehículo que circula por ese carril?", "opts": ["Girar a la derecha con prioridad absoluta, sin tener que ceder el paso a ningún otro vehículo ni peatón", "Girar a la derecha con precaución, dejando pasar a los vehículos del carril al que se incorpora", "Permanecer detenido mientras la luz roja siga encendida, aunque la flecha verde esté iluminada a su lado"], "a": 1, "expl": "La flecha verde permite tomar la dirección indicada cualquiera que sea la luz encendida, pero con precaución, dejando pasar a los vehículos del carril al que se incorpora y sin poner en peligro a los usuarios que cruzan.", "fuente": "RGC Anexo I, apartado 4.2.g)", "img": null}, {"tema": 2, "q": "Un semáforo muestra la silueta iluminada de una bicicleta. ¿A quién se refieren sus indicaciones?", "opts": ["A los ciclos y a los ciclomotores", "Exclusivamente a los ciclos", "A todos los vehículos, con preferencia de los ciclos"], "a": 1, "expl": "Cuando las luces del semáforo presentan la silueta iluminada de un ciclo, sus indicaciones se refieren exclusivamente a ellos.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.4.1", "img": null}, {"tema": 2, "q": "¿Qué función tienen las marcas de separación de seguridad entre vehículos en un túnel?", "opts": ["Indicar la velocidad máxima recomendada en el interior del túnel", "Servir de referencia para mantener la separación mínima", "Marcar el punto a partir del cual se permite adelantar"], "a": 1, "expl": "Facilitan, como referencia, el mantenimiento de la separación mínima con el vehículo que precede en túneles, secciones especiales y tramos con más riesgo de alcance.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.7", "img": null}, {"tema": 2, "q": "¿Qué semáforos y señales verticales debe obedecer, en primer lugar, el conductor?", "opts": ["Los situados inmediatamente a su izquierda, sea cual sea su maniobra", "Los de mayor tamaño, esté donde esté su emplazamiento en la vía", "Los situados a su derecha, sobre la calzada o sobre su carril"], "a": 2, "expl": "Se obedecen los semáforos y señales situados inmediatamente a la derecha, encima de la calzada o encima del carril; los de la izquierda se aplican en los casos y condiciones del art. 132.3 (giro a la izquierda o seguir de frente).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 132.3", "img": null}, {"tema": 2, "q": "¿Qué prohíbe esta señal?", "opts": ["El acceso de cualquier vehículo a quienes la ven de frente en su marcha", "La circulación de cualquier vehículo en los dos sentidos de la vía en la que está situada", "El acceso únicamente a los vehículos de mercancías que la ven de frente en su marcha"], "a": 0, "expl": "La señal de entrada prohibida es una señal de prohibición de entrada: se dirige a quienes se la encuentran de frente, no a los que circulan en sentido contrario.", "fuente": "RGC art. 145.2.b y Anexo I, catálogo de señales (R-101)", "img": "sign:entrada_prohibida"}, {"tema": 2, "q": "En su carril hay pintada una flecha que incluye la dirección de frente. ¿Puede cambiar de carril?", "opts": ["No, salvo que lo haga justo antes de llegar a la intersección siguiente", "Sí, mientras mantenga la dirección y las líneas lo permitan", "No, la flecha le obliga a permanecer en ese carril hasta pasar la intersección"], "a": 1, "expl": "Las flechas que incluyen la dirección de frente no impiden el cambio de carril mientras se mantenga la dirección y las líneas longitudinales lo permitan.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.3", "img": null}, {"tema": 2, "q": "¿Qué advierte esta señal triangular con un signo de exclamación?", "opts": ["Que es obligatorio detenerse a continuación por existir un peligro inmediato en la vía", "Que queda prohibida la circulación de vehículos a causa de un peligro en la calzada", "La proximidad de un peligro distinto de los que tienen señal propia"], "a": 2, "expl": "Las señales de peligro advierten de la proximidad y naturaleza de un peligro; la del signo de exclamación (otros peligros) señala un peligro sin señal específica, y un panel puede precisarlo.", "fuente": "RGC art. 144.1 y Anexo I, catálogo de señales (P-50 Otros peligros)", "img": "sign:peligro_generico"}, {"tema": 2, "q": "Una marca en zigzag amarilla en el borde de la calzada junto a una parada de autobús, ¿qué indica?", "opts": ["Parada y estacionamiento permitidos a cualquier vehículo siempre que deje pasar a los autobuses", "Estacionamiento permitido durante un máximo de dos horas seguidas en esa zona", "Estacionamiento prohibido, por ser zona de uso especial sin larga estancia"], "a": 2, "expl": "La marca en zigzag indica el lugar de la calzada donde el estacionamiento está prohibido a los vehículos en general por estar reservado para un uso especial sin larga permanencia, como paradas de autobús o carga y descarga.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, catálogo de marcas viales, 4.7 (M-7.9)", "img": null}, {"tema": 2, "q": "Un semáforo de franja blanca iluminada sobre fondo circular negro, para tranvías y autobuses de líneas regulares, muestra una franja blanca vertical fija. ¿Qué indica?", "opts": ["Que está permitido el paso de frente", "Que deben detenerse como con luz amarilla fija", "Que el paso queda prohibido como con luz roja fija"], "a": 0, "expl": "La franja blanca vertical iluminada permite el paso de frente; la horizontal lo prohíbe como la luz roja.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.4.2.b)", "img": null}, {"tema": 2, "q": "Un agente de tráfico extiende los brazos horizontalmente. ¿A quiénes obliga a detenerse?", "opts": ["Únicamente a los que circulan en la misma dirección que señalan sus brazos extendidos", "A todos los que se acerquen al agente, sea cual sea la dirección de su marcha, por igual", "A los que llegan desde direcciones que cortan la de sus brazos, en cualquier sentido"], "a": 2, "expl": "Los brazos extendidos obligan a detenerse a quienes llegan desde direcciones que cortan la indicada por los brazos, circulen en el sentido que circulen; quienes circulan en la dirección de los brazos no están obligados a parar.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.1.b)", "img": null}, {"tema": 2, "q": "Un semáforo situado al otro lado de una intersección muestra luz roja fija. ¿Puede el vehículo entrar en la intersección?", "opts": ["Sí, siempre que no haya vehículos cruzando en ese preciso momento", "Sí, pero sin rebasar el semáforo mientras permanezca en rojo, hasta que cambie", "No; no debe internarse ni rebasar la línea de detención anterior, si existe"], "a": 2, "expl": "Si el semáforo está dentro o al lado opuesto de una intersección, con luz roja fija los vehículos no deben internarse en ella ni rebasar la línea de detención situada antes.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.2.a)", "img": null}, {"tema": 2, "q": "En autopistas y autovías, ¿a qué distancia de la intersección se colocan, como norma general, las señales de preseñalización?", "opts": ["A 500 metros", "A 1.000 metros", "A 250 metros"], "a": 0, "expl": "Las señales de preseñalización se colocan a una distancia adecuada de la intersección; en autopistas y autovías, como norma general, a 500 metros (en poblados puede reducirse a unos 50 metros).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 146.2.d).1.ª", "img": null}, {"tema": 2, "q": "En un semáforo para peatones, la figura verde en marcha pasa a intermitente. ¿Qué significa?", "opts": ["Que queda poco tiempo para terminar de cruzar", "Que los peatones deben regresar a la acera de partida", "Que los vehículos ya pueden avanzar cediendo el paso"], "a": 0, "expl": "La luz verde intermitente avisa de que el tiempo para terminar de atravesar la calzada está a punto de finalizar y se va a encender la roja.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.1.b)", "img": null}, {"tema": 2, "q": "¿Para qué sirve un hito de arista?", "opts": ["Para indicar el punto donde se separan dos corrientes de tráfico", "Para balizar los bordes de la carretera, sobre todo de noche", "Para marcar el trazado de una curva e indicar el sentido de circulación"], "a": 1, "expl": "El hito de arista baliza los bordes de las carreteras, principalmente en horas nocturnas o de baja visibilidad. Separar corrientes de tráfico es función del hito de vértice, y marcar curvas, de los paneles direccionales.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 3.1.2", "img": null}, {"tema": 2, "q": "Un vehículo de la autoridad lleva una bandera roja. ¿Qué indica?", "opts": ["Que debe extremarse la atención porque se aproxima un peligro en la calzada", "Que, tras su paso, la calzada queda temporalmente cerrada al tráfico", "Que, tras su paso, la calzada queda de nuevo abierta al tráfico de vehículos"], "a": 1, "expl": "La bandera roja indica que, a partir del paso del vehículo que la porta, la calzada queda temporalmente cerrada (salvo vehículos acompañados o escoltados por los agentes). La verde indica reapertura y la amarilla, precaución.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.2.a)", "img": null}, {"tema": 2, "q": "Un cruce tiene pintada en la calzada una cuadrícula amarilla. ¿Qué recuerda?", "opts": ["Prohibido entrar en el cruce cuando el semáforo está en rojo, pero no cuando está en verde", "Prohibido entrar si puede quedar detenido y obstruir el paso transversal", "Obligación de detenerse siempre antes de entrar en el cruce y ceder el paso a todos"], "a": 1, "expl": "La cuadrícula amarilla recuerda la prohibición de penetrar en una intersección, aunque el semáforo lo permita o se goce de prioridad, si puede quedar detenido de forma que obstruya la circulación transversal.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, catálogo de marcas viales, 4.7 (M-7.10)", "img": null}, {"tema": 2, "q": "¿Qué prohíbe esta señal a los conductores?", "opts": ["Adelantar a vehículos de motor, excepto a las motocicletas de dos ruedas", "Circular por el carril de la izquierda cuando la vía tiene varios carriles", "Superar la velocidad a la que circulan los vehículos que van delante"], "a": 0, "expl": "La señal de adelantamiento prohibido veta adelantar a otros vehículos de motor (salvo motocicletas de dos ruedas) a partir de la sección transversal donde está colocada.", "fuente": "RGC art. 145.2.d y Anexo I, catálogo de señales (R-305)", "img": "sign:adelantar_prohibido"}, {"tema": 2, "q": "¿Qué significa una luz roja intermitente antes de un paso a nivel?", "opts": ["Que debe reducirse la velocidad y pasar si no se aproxima ningún tren", "Que el paso está temporalmente prohibido a los vehículos", "Que se puede pasar extremando la precaución y cediendo el paso"], "a": 1, "expl": "Una luz roja intermitente, o dos alternativamente intermitentes, prohíben temporalmente el paso antes de un paso a nivel, puente móvil, salida de vehículos de extinción de incendios o aproximación de aeronave a baja altura.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.2.b)", "img": null}, {"tema": 2, "q": "Unas balizas luminosas colocadas sobre la calzada emiten luz verde, naranja o roja. ¿Cuál se puede franquear?", "opts": ["Cualquiera, si hay buena visibilidad", "Únicamente la verde", "La verde y la naranja"], "a": 1, "expl": "Las balizas luminosas horizontales pueden delimitar carriles u orientar la circulación; emiten luz verde, naranja o roja, siendo la verde la única franqueable.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 3.1.4, 1.º", "img": null}, {"tema": 2, "q": "Un agente levanta verticalmente un brazo en una intersección cuando usted ya ha entrado en ella. ¿Qué debe hacer?", "opts": ["Continuar y despejar la intersección, pues no está obligado a detenerse quien ya ha entrado en ella", "Detenerse en el acto en el lugar donde se encuentre, aunque su vehículo quede bloqueando la intersección", "Retroceder hasta la línea de detención situada antes de la intersección y esperar nuevas indicaciones"], "a": 0, "expl": "El brazo levantado verticalmente obliga a detenerse a los usuarios que se acercan al agente, pero en una intersección no obliga a detenerse a los conductores que ya han entrado en ella.", "fuente": "RGC Anexo I, apartado 1.1.a)", "img": null}, {"tema": 2, "q": "Una zona de la calzada está marcada con franjas oblicuas paralelas enmarcadas por una línea continua (cebreado). ¿Qué indica a los conductores?", "opts": ["Que solo se puede entrar en ella para adelantar a otro vehículo", "Que es un carril reservado a los vehículos de transporte público", "Que ningún conductor debe entrar con su vehículo en esa zona"], "a": 2, "expl": "El cebreado delimita una zona en la que ningún conductor debe entrar con su vehículo (salvo quienes deban circular por el arcén).", "fuente": "RGC art. 147.2.d)", "img": null}, {"tema": 2, "q": "Durante unas obras, una señal permanente existente deja de ser aplicable. ¿Qué debe hacerse con ella?", "opts": ["Girarla noventa grados para que deje de ser visible", "Dejarla visible y colocar bajo ella un panel amarillo", "Taparla con materiales adhesivos negros"], "a": 2, "expl": "Las señales previas que no sean de aplicación mientras duran las obras deben taparse adecuadamente con materiales adhesivos negros.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de señales, apartado 2.5", "img": null}, {"tema": 2, "q": "Un agente de tráfico emite un toque largo de silbato. ¿Qué ordena?", "opts": ["Disminuir la velocidad al acercarse al agente", "La detención inmediata de los vehículos", "La reanudación de la marcha"], "a": 2, "expl": "Un toque largo de silbato ordena la reanudación de la marcha; la serie de toques cortos y frecuentes ordena la detención.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.1.e)", "img": null}, {"tema": 2, "q": "Un agente levanta verticalmente un brazo. Usted no está en una intersección y no hay línea de detención. ¿Dónde debe detenerse?", "opts": ["Inmediatamente antes del agente", "A unos diez metros antes del agente", "Junto al agente, en el lado derecho"], "a": 0, "expl": "La detención se efectúa ante la línea de detención más cercana o, en su defecto, inmediatamente antes del agente.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.1.a)", "img": null}, {"tema": 2, "q": "Un semáforo y una señal vertical de circulación parecen contradecirse. ¿Cuál prevalece?", "opts": ["El semáforo", "La señal vertical, por ser permanente", "La más restrictiva de las dos"], "a": 0, "expl": "El orden de preferencia sitúa a los semáforos por delante de las señales verticales de circulación; solo entre señales del mismo tipo se aplica la más restrictiva.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 133.1 y 133.2", "img": null}, {"tema": 2, "q": "¿A qué vehículos afectan los semáforos cuadrados de ocupación de carril?", "opts": ["Exclusivamente a los del carril sobre el que están", "Únicamente a autobuses y vehículos pesados de ese sentido", "A todos los vehículos que circulen por esa calzada y sentido"], "a": 0, "expl": "Los semáforos de ocupación de carril afectan exclusivamente a los vehículos del carril sobre el que están situados o el indicado en el panel de señalización variable.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.3", "img": null}, {"tema": 2, "q": "Un semáforo con una franja blanca vertical iluminada sobre fondo circular negro, ¿qué permite a tranvías y autobuses de línea regular?", "opts": ["Girar únicamente a la izquierda", "Detenerse, como con la luz roja", "El paso de frente"], "a": 2, "expl": "La franja blanca vertical iluminada permite el paso de frente; la horizontal lo prohíbe.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.4.2.b)", "img": null}, {"tema": 2, "q": "Un vehículo policial circula detrás del suyo con luz roja intermitente dirigida hacia delante y megafonía. ¿Qué debe hacer?", "opts": ["Dejarle paso circulando por el carril izquierdo sin reducir la marcha", "Detenerse a la derecha, delante del vehículo policial", "Detenerse en el mismo carril para que el policía le adelante"], "a": 1, "expl": "Esa señal indica al conductor precedente que debe detenerse en el lado derecho, delante del vehículo policial, donde no genere mayores riesgos, y seguir las instrucciones del agente.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.2.e)", "img": null}, {"tema": 2, "q": "Un semáforo de carril muestra una flecha verde hacia abajo, pero hay un semáforo circular en rojo. ¿Qué debe hacer?", "opts": ["Continuar, ya que la flecha solo se desobedece ante un agente", "Detenerse, porque esa autorización no exime de obedecer la luz roja circular", "Continuar, pues la flecha verde de carril prevalece sobre el semáforo circular"], "a": 1, "expl": "La flecha verde de carril permite circular por él, pero no exime de la obligación de detenerse ante una luz roja circular.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.3.b)", "img": null}, {"tema": 2, "q": "Dentro de un túnel, ¿qué indicaciones debe obedecer el conductor en todo momento?", "opts": ["Las de semáforos, paneles de mensaje variable y megafonía", "Solo las de los agentes de la autoridad presentes", "Solo las de los semáforos, pues los paneles son orientativos"], "a": 0, "expl": "En todo momento deben obedecerse las indicaciones de semáforos y paneles de mensaje variable y seguirse las instrucciones por megafonía o cualquier otro medio.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 95.7", "img": null}, {"tema": 2, "q": "Circula por un carril con una flecha de seguir de frente y la marca longitudinal contigua es discontinua. ¿Puede cambiar de carril?", "opts": ["No, la flecha le obliga a permanecer en ese carril", "Sí, si mantiene la dirección y las marcas lo permiten", "Sí, pero solo si con el cambio también modifica su dirección"], "a": 1, "expl": "Las flechas que incluyen la dirección de frente no impiden el cambio de carril, siempre que se mantenga la dirección y las marcas longitudinales lo permitan.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.3", "img": null}, {"tema": 2, "q": "¿Qué indican las señales de carriles, dentro de las señales de indicación?", "opts": ["Una reglamentación especial para uno o más carriles", "Un servicio de posible utilidad para los usuarios de la vía", "Los destinos de referencia de la vía y la distancia a cada uno"], "a": 0, "expl": "Las señales de carriles indican una reglamentación especial para uno o más carriles de la calzada.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 146.2.b)", "img": null}, {"tema": 2, "q": "Delante de una señal de ceda el paso hay una línea transversal discontinua en su carril. ¿Qué significa?", "opts": ["Que no debe franquearse mientras se tenga que ceder el paso", "Que debe detenerse siempre sobre ella, aunque no circule nadie", "Que solo deben respetarla los vehículos de dos ruedas"], "a": 0, "expl": "La línea transversal discontinua indica que ningún vehículo debe franquearla cuando tenga que ceder el paso, en cumplimiento de la señal R-1 o de la marca de ceda el paso.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.2", "img": null}, {"tema": 2, "q": "¿Qué puede indicar un panel complementario con una distancia colocado bajo una señal de advertencia de peligro?", "opts": ["La distancia entre la señal y el principio del tramo peligroso", "La distancia entre la señal y el final del tramo peligroso", "La velocidad máxima permitida hasta llegar al peligro señalizado"], "a": 0, "expl": "Un panel complementario puede indicar la distancia entre la señal de peligro y el principio del tramo peligroso.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 144.2", "img": null}, {"tema": 2, "q": "Bajo una señal de peligro hay un panel complementario que informa de la longitud. ¿Qué indica?", "opts": ["La longitud a lo largo de la cual existe el peligro señalizado", "La distancia desde la señal hasta el comienzo del peligro", "La longitud máxima de los vehículos que pueden pasar por el tramo"], "a": 0, "expl": "Mediante un panel complementario puede indicarse la longitud a lo largo de la cual existe el peligro que advierte la señal.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 144.3", "img": null}, {"tema": 2, "q": "Si hacen falta nuevos carteles de orientación por unas obras en la carretera, ¿cómo serán?", "opts": ["Con fondo amarillo y caracteres negros en cualquier carretera", "Con el mismo color de fondo que el de la vía en que se instalen", "Con fondo naranja y caracteres blancos, salvo en autopistas"], "a": 0, "expl": "Los carteles de orientación nuevos por obras llevan fondo amarillo y caracteres negros con independencia del tipo de carretera.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 2.5 del Tomo I", "img": null}, {"tema": 2, "q": "¿Qué indica un damero de cuadrados blancos y rojos pintado en la calzada?", "opts": ["Un tramo de calzada donde se permite estacionar", "Dónde empieza una zona de frenado de emergencia", "El inicio de una zona de reducción de velocidad con resaltes"], "a": 1, "expl": "El damero blanco y rojo indica dónde empieza una zona de frenado de emergencia, prohibiendo la parada, el estacionamiento o su uso con otros fines.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.7", "img": null}, {"tema": 2, "q": "En un tramo en obras se colocan señales de carriles. ¿Cómo son?", "opts": ["Con el fondo azul habitual y símbolos amarillos", "Con fondo naranja y símbolos negros, igual que en cualquier obra", "Con fondo amarillo en lugar de azul y símbolos negros"], "a": 2, "expl": "En obras, las señales de carriles (S-50 a S-73) llevan fondo amarillo en lugar de azul y símbolos negros en lugar de blancos.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 2.5 del Tomo I", "img": null}, {"tema": 2, "q": "Antes de una intersección con semáforo hay un espacio reservado (avanza-bici) delimitado por dos líneas transversales continuas. Con el semáforo en rojo, ¿quién puede ocuparlo?", "opts": ["Cualquier vehículo, si deja libre el paso de peatones", "Solo determinados vehículos, como ciclos, vehículos de movilidad personal, motocicletas o ciclomotores", "Únicamente los vehículos de cuatro ruedas, que son los más estables"], "a": 1, "expl": "El avanza-bici o avanza-motos es un espacio inmediatamente anterior a una intersección o paso de peatones con semáforo en el que, con luz roja, solo pueden situarse determinados vehículos, como ciclos, VMP, motocicletas o ciclomotores.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, catálogo de marcas viales, 4.7 (avanza-bici)", "img": null}, {"tema": 2, "q": "En un tramo con obras hay una señal circunstancial que modifica el régimen normal de la vía y contradice a una señal vertical permanente. ¿Cuál debe obedecerse?", "opts": ["Ninguna de las dos, hasta que un agente de la circulación indique lo que hacer", "La señal vertical permanente, porque está instalada de forma estable en la vía", "La señal circunstancial, que tiene preferencia sobre la vertical permanente"], "a": 2, "expl": "La señalización y el balizamiento circunstanciales que modifican el régimen normal de la vía están por encima de los semáforos y de las señales verticales.", "fuente": "RGC art. 133.1.b)", "img": null}, {"tema": 2, "q": "Un semáforo muestra luz roja no intermitente y existe una línea de detención antes de él. ¿Dónde debe detenerse el vehículo?", "opts": ["Junto al semáforo, aunque la línea de detención quede por detrás", "Antes de la línea de detención, sin rebasarla", "Sobre la línea de detención, con la parte delantera del vehículo rebasándola"], "a": 1, "expl": "La luz roja no intermitente prohíbe el paso: los vehículos no deben rebasar el semáforo ni, si existe, la línea de detención anterior más próxima a él.", "fuente": "RGC Anexo I, apartado 4.2.a)", "img": null}, {"tema": 2, "q": "Debe permanecer más de dos minutos detenido dentro de un túnel. ¿Qué debe hacer con el motor y las luces?", "opts": ["Mantener el motor en marcha y apagar todas las luces del vehículo", "Parar el motor y apagar también las luces de posición del vehículo", "Parar el motor y mantener la luz de posición encendida"], "a": 2, "expl": "Si debe permanecer detenido más de dos minutos en un túnel, interrumpirá el funcionamiento del motor conservando encendido el alumbrado de posición.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 115.2", "img": null}, {"tema": 2, "q": "¿A qué distancia mínima deben poder distinguirse, gracias a sus prendas llamativas y retrorreflectantes, los agentes y el personal que regula el paso en una obra?", "opts": ["A 150 metros como mínimo", "A 100 metros como mínimo, siempre de noche", "A 300 metros como mínimo, sea de día o de noche"], "a": 0, "expl": "Las prendas de colores llamativos y los elementos retrorreflectantes deben permitir distinguirlos a una distancia mínima de 150 metros.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 141.1", "img": null}, {"tema": 2, "q": "Dos luces rojas alternativamente intermitentes junto a la salida de un parque de bomberos, ¿qué indican?", "opts": ["Que puede pasar extremando la precaución", "Que el paso queda prohibido temporalmente", "Que puede pasar, pero cediendo el paso a los bomberos"], "a": 1, "expl": "Estas luces prohíben temporalmente el paso, entre otros casos, en las proximidades de una salida de vehículos de extinción de incendios.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.2.b)", "img": null}, {"tema": 2, "q": "Una luz roja fija colocada como elemento de balizamiento en la vía, ¿qué indica?", "opts": ["Que la calzada está totalmente cerrada al tránsito", "Que puede pasar por el lado de la luz con precaución", "Que el paso está prohibido solo a los vehículos pesados"], "a": 0, "expl": "Entre los dispositivos delimitadores, la luz roja fija indica que la calzada está totalmente cerrada al tránsito.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 3.1.1.5.º", "img": null}, {"tema": 2, "q": "¿Qué obliga a hacer esta señal?", "opts": ["A estacionar el vehículo en el lado derecho de la calzada en la que está situada", "A ceder el paso en la próxima intersección a los vehículos que vengan por la derecha", "A seguir la dirección y el sentido de la flecha, en este caso hacia la derecha"], "a": 2, "expl": "Es una señal de obligación (sentido obligatorio): los vehículos tienen la obligación de seguir la dirección y el sentido de la flecha.", "fuente": "RGC art. 145.2.e y Anexo I, catálogo de señales (R-400 Sentido obligatorio)", "img": "sign:obligatoria_derecha"}, {"tema": 2, "q": "¿Qué función tienen los jalones de nieve?", "opts": ["Delimitar la plataforma cuando la cubre la nieve", "Avisar de que es obligatorio el uso de cadenas en el tramo", "Indicar el espesor máximo de nieve que admite la calzada"], "a": 0, "expl": "Los jalones de nieve delimitan la plataforma cuando esta no es visible por estar cubierta de nieve, favoreciendo el guiado óptico.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 3.1.2", "img": null}, {"tema": 2, "q": "¿Qué obliga a hacer un agente que mueve un brazo extendido alternativamente de arriba abajo?", "opts": ["A detenerse todos los vehículos que se acerquen al agente, vengan de donde vengan", "A disminuir la velocidad a quien se acerca por el lado de ese brazo y perpendicularmente", "A reanudar la marcha los vehículos que estuvieran detenidos ante el agente en ese momento"], "a": 1, "expl": "Esa señal obliga a disminuir la velocidad a los conductores que se acercan al agente por el lado del brazo que la ejecuta y perpendicularmente a dicho brazo.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.1.d)", "img": null}, {"tema": 2, "q": "En un tramo con obras, ¿de qué color es el fondo de las señales de peligro que normalmente son blancas?", "opts": ["Naranja", "Amarillo", "Blanco, como siempre"], "a": 1, "expl": "En tramos con obras las señales de peligro y otras de reglamentación cuyo fondo es blanco tienen fondo amarillo.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, catálogo, apartado 2.5", "img": null}, {"tema": 2, "q": "Se enciende la luz amarilla fija cuando su vehículo está tan cerca del semáforo que no puede detenerse en condiciones de seguridad suficientes. ¿Qué debe hacer?", "opts": ["Frenar a fondo para detenerse, aunque rebase la línea de detención del semáforo", "Detenerse siempre, sea cual sea la distancia a la que se encuentre del semáforo", "Continuar, pues no puede detenerse antes del semáforo con seguridad"], "a": 2, "expl": "La luz amarilla fija obliga a detenerse como la roja, salvo que al encenderse el vehículo esté tan cerca que no pueda hacerlo antes del semáforo en condiciones de seguridad suficientes.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.2.c)", "img": null}, {"tema": 2, "q": "¿Qué órdenes debe cumplir siempre el conductor de un vehículo prioritario en servicio urgente?", "opts": ["Las órdenes y señales de los agentes de la autoridad", "Las limitaciones de velocidad de la vía en cualquier caso", "Las señales de los semáforos, aunque estén en fase roja"], "a": 0, "expl": "Los conductores de vehículos prioritarios pueden dejar de cumplir ciertas normas, salvo las órdenes y señales de los agentes, que son siempre de obligado cumplimiento.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 68.1", "img": null}, {"tema": 2, "q": "Una línea continua de eje queda interrumpida por una marca discontinua a la altura de un acceso. ¿Qué permite?", "opts": ["Detener el vehículo sobre la marca discontinua del acceso", "Adelantar a otros vehículos mientras dure la interrupción", "Traspasarla para girar hacia o desde ese acceso"], "a": 2, "expl": "Las marcas discontinuas de interrupción de marca continua permiten traspasar la línea para realizar un giro hacia o desde un acceso.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, catálogo de marcas viales, 4.1 (M-1.12)", "img": null}, {"tema": 2, "q": "En un paso de peatones con semáforo para peatones, ¿qué ocurre como norma general con la luz amarilla intermitente para vehículos?", "opts": ["Va precedida de la roja y no coincide con el verde de peatones", "Debe coincidir siempre con la luz verde fija de los peatones", "Puede mostrarse sin que antes se encienda la luz roja de vehículos"], "a": 0, "expl": "La amarilla intermitente de vehículos no podrá coincidir con el verde no intermitente de peatones y deberá ir precedida de la luz roja no intermitente.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.2.d)", "img": null}, {"tema": 2, "q": "Como norma general, ¿a qué parte de la calzada se aplica una señal?", "opts": ["Solo al carril situado más a la derecha, que es el de circulación normal de la vía", "Únicamente al carril más próximo al lugar donde está colocada la propia señal vertical", "A toda la anchura de la calzada que los conductores destinatarios puedan utilizar"], "a": 2, "expl": "Toda señal se aplica a toda la anchura de la calzada que puedan utilizar los conductores a quienes se dirige, aunque puede limitarse a uno o más carriles mediante marcas en la calzada.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 135", "img": null}, {"tema": 2, "q": "Esta señal es circular, de fondo azul y con flechas blancas dispuestas en círculo. ¿Qué significa?", "opts": ["Advertencia de glorieta próxima, sin obligación alguna de seguir el sentido de las flechas", "Prohibición de girar a la izquierda en la próxima intersección y obligación de seguir recto", "Intersección de sentido giratorio obligatorio: se circula en el sentido de las flechas"], "a": 2, "expl": "Es una señal de obligación (circular azul): obliga a seguir el movimiento giratorio indicado por las flechas en la intersección.", "fuente": "RGC art. 145.2.e y Anexo I, catálogo de señales (R-402)", "img": "sign:rotonda"}, {"tema": 2, "q": "¿Cuándo deben estar balizadas luminosamente unas obras que alteran la circulación?", "opts": ["De noche o cuando el tiempo o el entorno lo exijan", "Solo cuando haya niebla densa o nieve sobre la calzada", "Únicamente si la obra ocupa por completo algún carril"], "a": 0, "expl": "Las obras deben estar señalizadas de día y de noche y balizadas luminosamente de noche o cuando las condiciones meteorológicas o ambientales lo exijan.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 148", "img": null}, {"tema": 2, "q": "¿Qué diferencia supone, respecto al uso del arcén, que una línea de borde de calzada sea continua o discontinua?", "opts": ["La discontinua permite estacionar en el arcén de forma libre", "La continua prohíbe a cualquier vehículo circular por el arcén", "Ninguna respecto al uso del arcén establecido"], "a": 2, "expl": "Las líneas de borde de calzada delimitan la calzada, y que sean continuas o discontinuas no cambia el uso del arcén establecido reglamentariamente.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.1", "img": null}, {"tema": 2, "q": "Un semáforo presenta luz roja con una flecha negra hacia la izquierda. ¿Qué significa?", "opts": ["La prohibición de paso se aplica a todos los movimientos, excepto el giro a la izquierda", "Se permite el giro a la izquierda, pero se prohíbe seguir recto", "La prohibición de paso se limita al movimiento de giro a la izquierda"], "a": 2, "expl": "Una flecha negra sobre luz roja no cambia el significado de esta, pero lo limita exclusivamente al movimiento indicado por la flecha.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.2.f)", "img": null}, {"tema": 2, "q": "Se ha detenido ante la línea de detención, pero desde allí no ve la vía a la que accede. ¿Qué debe hacer?", "opts": ["Esperar a que otro conductor le indique que puede pasar sin riesgo", "Avanzar sin volver a detenerse, pues ya cumplió la obligación de parar", "Detenerse de nuevo donde vea bien, sin poner en peligro a nadie"], "a": 2, "expl": "Si desde el lugar de la detención no hay visibilidad suficiente, debe detenerse de nuevo en el punto desde el que tenga visibilidad, sin poner en peligro a ningún usuario.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.2", "img": null}, {"tema": 2, "q": "¿Dónde se emplean los atenuadores de impacto?", "opts": ["Como separación entre los dos carriles de un túnel", "Al inicio de una divergencia o bifurcación", "Delante de todos los pasos a nivel con barreras"], "a": 1, "expl": "Son dispositivos diseñados para el inicio de una divergencia o bifurcación, capaces al menos de contener los vehículos que impactan contra ellos.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 3.2", "img": null}, {"tema": 2, "q": "¿Qué indica un hito de vértice?", "opts": ["El borde de la calzada, para guiar de noche o con poca visibilidad", "Un estrechamiento de la plataforma o un obstáculo junto a ella", "El punto en que se separan dos corrientes de tráfico"], "a": 2, "expl": "El hito de vértice, de forma semicilíndrica con triángulos retrorreflectantes, señala el punto de separación de dos corrientes de tráfico.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 3.1.2.1.º", "img": null}, {"tema": 2, "q": "Sobre su carril hay un semáforo con una flecha blanca o amarilla oblicua apuntada hacia abajo. ¿Qué debe hacer?", "opts": ["Abandonar el carril de inmediato sin atender a la prioridad ajena", "Irse incorporando con seguridad al carril que señala la flecha", "Mantenerse en su carril, que seguirá abierto a la circulación normal"], "a": 1, "expl": "Esta flecha indica la necesidad de irse incorporando en condiciones de seguridad al carril hacia el que apunta, porque el actual quedará cerrado en corto espacio.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.3.c)", "img": null}, {"tema": 2, "q": "¿Qué anuncia esta señal con forma de rombo cruzado por bandas diagonales negras?", "opts": ["Que termina la zona en que estaba prohibido adelantar a los vehículos de motor", "Que termina la prioridad de la calzada por la que se circula respecto de otra", "Que la calzada por la que se circula pasa a ser de sentido único obligatorio"], "a": 1, "expl": "Es la señal de fin de prioridad: indica que la calzada deja de tener la prioridad de que gozaba.", "fuente": "RGC art. 145.2.a y Anexo I, catálogo de señales (R-4 Fin de prioridad)", "img": "sign:fin_prioridad"}, {"tema": 2, "q": "Un semáforo muestra luz amarilla intermitente y en el mismo punto hay una señal de STOP. ¿Qué debe hacer?", "opts": ["Pasar sin detenerse, pues el semáforo anula la señal vertical", "Detenerse ante el STOP; el semáforo no lo anula", "Pasar con prioridad, porque el semáforo prevalece siempre"], "a": 1, "expl": "La luz amarilla intermitente obliga a extremar la precaución y, en su caso, ceder el paso, pero no exime del cumplimiento de otras señales que obliguen a detenerse.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.2.d)", "img": null}, {"tema": 2, "q": "En un tramo con esta señal (círculo azul con borde rojo y una sola barra roja), ¿qué está prohibido?", "opts": ["Circular por ese tramo, quedando el espacio reservado a peatones", "Estacionar el vehículo, sin que quede prohibida la parada", "Parar y estacionar el vehículo, sea cual sea el tiempo de permanencia"], "a": 1, "expl": "La señal de estacionamiento prohibido (una barra) solo prohíbe estacionar; la de parada y estacionamiento prohibidos lleva dos barras cruzadas (aspa).", "fuente": "RGC art. 145.2.d y Anexo I, catálogo de señales (R-308 Estacionamiento prohibido)", "img": "sign:estacionar_prohibido"}, {"tema": 2, "q": "Un peatón ve que la luz verde de un semáforo para peatones pasa a intermitente. ¿Qué significa?", "opts": ["Que el semáforo está averiado y rige la prioridad general", "Que ya puede comenzar a cruzar con precaución", "Que el tiempo para cruzar está a punto de acabar"], "a": 2, "expl": "El verde intermitente avisa de que el tiempo que aún queda para terminar de cruzar está a punto de finalizar.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 4.1", "img": null}, {"tema": 2, "q": "Un agente de tráfico balancea una luz roja o amarilla en dirección a su vehículo. ¿Qué debe hacer?", "opts": ["Detenerse, porque la señal se dirige a su vehículo", "Apartarse hacia la derecha y seguir sin detenerse por completo", "Reducir la velocidad y continuar con precaución si no viene nadie"], "a": 0, "expl": "El balanceo de una luz roja o amarilla obliga a detenerse a los usuarios hacia los que el agente dirige la luz.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.1.c)", "img": null}, {"tema": 2, "q": "¿Qué indica una línea amarilla continua pintada junto al bordillo?", "opts": ["La prohibición de estacionar, aunque permite parar un momento", "Una zona reservada para la carga y descarga de mercancías", "Prohibido parar y estacionar en toda su longitud"], "a": 2, "expl": "La marca longitudinal continua amarilla (M-7.8) indica la prohibición de parada y estacionamiento a lo largo de toda su longitud en el lado de la calzada donde esté situada.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, Catálogo de marcas viales, apartado 4.7", "img": null}, {"tema": 2, "q": "¿Dónde debe detenerse el conductor que se aproxima a esta señal?", "opts": ["En el centro de la intersección, ocupando parte de la vía transversal para ver mejor", "Pasada la intersección, una vez comprobado que no se acerca ningún vehículo por la vía transversal", "Ante la línea de detención o, si no existe, justo antes de la intersección"], "a": 2, "expl": "La señal de detención obligatoria (STOP) obliga a detenerse ante la línea de detención más próxima o, si no la hay, inmediatamente antes de la intersección, y a ceder el paso.", "fuente": "RGC art. 132.1 y Anexo I, 5.2 (marca M-6.3 STOP) y catálogo R-2", "img": "sign:stop"}, {"tema": 2, "q": "¿Qué indica una bandera amarilla portada por un vehículo o por el personal auxiliar habilitado?", "opts": ["Que la calzada queda cerrada temporalmente a todo el tráfico", "Que debe detenerse en el lado derecho de la calzada de inmediato", "La necesidad de extremar la atención o un peligro próximo"], "a": 2, "expl": "La bandera amarilla advierte a los demás usuarios de que deben extremar la atención o de que hay un peligro cerca; no cierra la calzada (eso es la roja).", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, apartado 1.2.c)", "img": null}, {"tema": 2, "q": "En una comunidad autónoma con lengua cooficial, ¿en qué idioma deben figurar las indicaciones escritas de los paneles de señalización?", "opts": ["En castellano y, además, en la lengua cooficial", "Únicamente en la lengua cooficial dentro de su territorio", "Únicamente en castellano, en todo el territorio nacional"], "a": 0, "expl": "Los textos van en castellano y, además, en la lengua oficial de la comunidad cuando la señal está en su ámbito territorial.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 138", "img": null}, {"tema": 3, "q": "El límite genérico en una travesía es de 50 km/h. ¿Cómo puede rebajarse?", "opts": ["Por decisión de la Autoridad municipal sin contar con el titular de la vía", "No puede rebajarse, porque en travesías el límite es fijo", "Por acuerdo con el titular de la vía y con señalización"], "a": 2, "expl": "El límite de 50 km/h de las travesías puede rebajarse por acuerdo entre la Autoridad municipal y el titular de la vía, previa señalización específica.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 50.5", "img": null}, {"tema": 3, "q": "Una autovía atraviesa un tramo urbano. Sin señal específica que lo modifique, ¿cuál es el límite genérico dentro de poblado?", "opts": ["80 km/h", "60 km/h", "100 km/h"], "a": 0, "expl": "En autopistas y autovías situadas dentro de poblado el límite genérico es de 80 km/h; puede ampliarse por acuerdo del ayuntamiento y el titular de la vía, con señalización específica y sin superar los límites de fuera de poblado.", "fuente": "RGC art. 50.6", "img": null}, {"tema": 3, "q": "Un vehículo con mercancías peligrosas circula por una vía urbana de dos o más carriles por sentido. ¿Cuál es su velocidad máxima?", "opts": ["40 km/h", "50 km/h", "30 km/h"], "a": 0, "expl": "En esas vías urbanas y en travesías, los vehículos con mercancías peligrosas circulan como máximo a 40 km/h.", "fuente": "RGC art. 50.4", "img": null}, {"tema": 3, "q": "En una autovía fuera de poblado hay una señal de limitación a 80 km/h. ¿Qué velocidad máxima debe respetar un turismo?", "opts": ["80 km/h, porque la señal prevalece sobre la genérica", "120 km/h, porque la señal no modifica el límite genérico", "100 km/h, como media entre la señal y la genérica"], "a": 0, "expl": "Las velocidades fijadas mediante señales prevalecen sobre las genéricas.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 52.1.a)", "img": null}, {"tema": 3, "q": "¿Con qué criterio debe adecuar su velocidad el conductor a las circunstancias de la vía y del tráfico?", "opts": ["Debe ajustarla solo cuando haya agentes o señales que indiquen expresamente que debe reducirla", "Basta con no superar nunca el límite máximo señalizado, aunque la visibilidad sea muy reducida en la vía", "Debe poder detener el vehículo siempre dentro de su campo de visión ante cualquier obstáculo previsible"], "a": 2, "expl": "Además de respetar los límites, el conductor debe adecuar la velocidad a sus condiciones y a las de la vía, de modo que siempre pueda detenerse dentro de su campo de visión.", "fuente": "RGC art. 45 y Ley de Tráfico art. 21", "img": null}, {"tema": 3, "q": "En una carretera convencional con separación física de los dos sentidos, ¿qué límite máximo puede fijar su titular para los turismos?", "opts": ["120 km/h", "100 km/h", "110 km/h"], "a": 1, "expl": "Por excepción al genérico de 90, el titular puede fijar hasta 100 km/h en convencionales con separación física de sentidos para turismos, motocicletas y autocaravanas de hasta 3.500 kg.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.a).1.º", "img": null}, {"tema": 3, "q": "Un camión articulado de más de 10 metros de longitud sigue a otro vehículo por una carretera convencional de un carril por sentido, fuera de poblado, con adelantamiento permitido y tráfico fluido. ¿Qué separación mínima debe dejar si no va a adelantar?", "opts": ["100 metros", "50 metros", "25 metros"], "a": 1, "expl": "Los vehículos de más de 3.500 kg de MMA o de más de 10 m de longitud deben dejar al menos 50 m de separación para permitir que los adelanten, salvo donde no se puede adelantar, hay varios carriles por sentido o el tráfico es intenso.", "fuente": "RGC art. 54.2 y Ley de Tráfico art. 22.3", "img": null}, {"tema": 3, "q": "Un vehículo con frenos y neumáticos desgastados, ¿cómo frena respecto a otro con buen mantenimiento?", "opts": ["Necesita una distancia de frenado mayor", "Necesita la misma distancia si la velocidad es igual", "Necesita una distancia de frenado menor"], "a": 0, "expl": "El desgaste de frenos y neumáticos alarga la distancia de frenado (la DGT cita un 25 % más con frenos desgastados y al menos un 6 % con neumáticos desgastados).", "fuente": "DGT, Revista Tráfico y Seguridad Vial (revista.dgt.es, 09/2020, «Velocidad y riesgo al frenar»)", "img": null}, {"tema": 3, "q": "Un autobús con todos sus pasajeros sentados y con cinturón realiza transporte escolar por una autovía fuera de poblado. ¿Qué velocidad máxima tiene?", "opts": ["100 km/h", "90 km/h", "80 km/h"], "a": 1, "expl": "El autobús tiene 100 km/h en autovía, y el transporte escolar reduce ese límite en 10 km/h.", "fuente": "RGC art. 48.1.b)", "img": null}, {"tema": 3, "q": "Un ciclista desciende en bicicleta por un puerto de una carretera convencional. ¿Puede superar los 45 km/h que se fijan para los ciclos?", "opts": ["No, 45 km/h es un tope absoluto para toda bicicleta", "Sí, si las circunstancias de la vía lo permiten", "Sí, pero solo si circula en grupo y con alumbrado puesto"], "a": 1, "expl": "Los conductores de bicicletas pueden superar los 45 km/h en tramos cuyas circunstancias permitan una velocidad superior.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.e)", "img": null}, {"tema": 3, "q": "En una vía urbana de plataforma única, es decir, con calzada y acera al mismo nivel, y sin señal específica, ¿cuál es el límite genérico de velocidad?", "opts": ["25 km/h", "20 km/h", "10 km/h"], "a": 1, "expl": "En las vías urbanas con plataforma única de calzada y acera, el límite genérico es de 20 km/h.", "fuente": "RGC art. 50.1.a)", "img": null}, {"tema": 3, "q": "En una vía urbana de un único carril por sentido, con límite genérico de 30 km/h, ¿qué puede hacer excepcionalmente la Autoridad municipal?", "opts": ["Elevarlo hasta 40 km/h, sin necesidad de señal específica", "Elevarlo hasta 60 km/h, previa señalización específica", "Elevarlo hasta 50 km/h, previa señalización específica"], "a": 2, "expl": "Excepcionalmente, y previa señalización específica, puede subirse hasta 50 km/h en vías de un único carril por sentido.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 50.3", "img": null}, {"tema": 3, "q": "En una vía urbana con tres carriles de circulación para cada sentido, sin carriles reservados ni señal específica, ¿cuál es el límite genérico?", "opts": ["50 km/h", "30 km/h", "20 km/h"], "a": 0, "expl": "En vías urbanas de dos o más carriles por sentido el límite genérico es 50 km/h.", "fuente": "RGC art. 50.1.c)", "img": null}, {"tema": 3, "q": "Un vehículo no puede alcanzar la velocidad mínima exigida y existe peligro de alcance. ¿Qué debe hacer durante la circulación?", "opts": ["Hacer sonar la bocina de forma repetida para avisar al que le sigue", "Utilizar los indicadores de dirección con señal de emergencia", "Encender la luz de largo alcance de forma intermitente cada pocos segundos"], "a": 1, "expl": "Si no alcanza la velocidad mínima y hay peligro de alcance, debe circular con las luces indicadoras de dirección en emergencia.", "fuente": "RGC art. 49.3", "img": null}, {"tema": 3, "q": "¿En cuál de estas circunstancias debe circularse a velocidad moderada según el Reglamento?", "opts": ["Cuando pueda salpicarse agua o gravilla a otros usuarios", "Cuando se circule por un carril con las luces de cruce encendidas", "Cuando el pavimento esté seco, limpio y sin tráfico alrededor"], "a": 0, "expl": "El pavimento deslizante y la posibilidad de salpicar o proyectar agua, gravilla u otras materias a los demás usuarios obligan a moderar la velocidad.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 46.1.g)", "img": null}, {"tema": 3, "q": "Respecto a la separación entre vehículos que circulan uno detrás de otro, ¿qué excepción prevé el Reglamento para los ciclistas?", "opts": ["Deben mantener siempre 50 metros entre bicicletas, también cuando circulan en grupo en carretera", "Están obligados a mantener una separación fija de diez metros, también al subir puertos de montaña", "Pueden circular en grupo sin mantenerla, extremando la atención para evitar alcances entre ellos"], "a": 2, "expl": "Los ciclistas pueden circular en grupo sin guardar la distancia general, pero deben prestar especial atención para evitar alcances entre ellos.", "fuente": "RGC art. 54.1 y Ley de Tráfico art. 22.2", "img": null}, {"tema": 3, "q": "Un camión de más de 3.500 kg circula por una travesía sin señal específica de velocidad. ¿Cuál es el límite genérico?", "opts": ["40 km/h", "70 km/h", "50 km/h"], "a": 2, "expl": "El límite genérico en travesías es de 50 km/h para todo tipo de vehículos.", "fuente": "RGC art. 50.5", "img": null}, {"tema": 3, "q": "Un turismo circula por una carretera convencional fuera de poblado, cuyo límite genérico es 90 km/h. ¿Por debajo de qué velocidad no puede circular sin causa justificada?", "opts": ["60 km/h", "45 km/h", "30 km/h"], "a": 1, "expl": "En las vías que no son autopista ni autovía, la mínima es la mitad de la genérica (45 km/h con 90 km/h); en autopistas y autovías, 60 km/h.", "fuente": "RGC art. 49.1", "img": null}, {"tema": 3, "q": "Un turismo circula por una autopista, fuera de poblado, sin ninguna señal que modifique el límite genérico. ¿Cuál es su velocidad máxima?", "opts": ["130 km/h", "110 km/h", "120 km/h"], "a": 2, "expl": "El límite genérico de turismos y motocicletas es de 120 km/h en autopistas y autovías, y de 90 km/h en carreteras convencionales.", "fuente": "RGC art. 48.1.a) (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 3, "q": "La distancia de detención de un vehículo es la suma de dos distancias. ¿Cuáles?", "opts": ["La de reacción y la de adelantamiento", "La de reacción y la de frenado", "La de frenado y la de seguridad"], "a": 1, "expl": "La distancia de parada o detención se obtiene sumando la recorrida durante el tiempo de reacción y la recorrida frenando hasta la parada total.", "fuente": "DGT, Revista Tráfico y Seguridad Vial (revista.dgt.es, 09/2020, «Velocidad y riesgo al frenar»)", "img": null}, {"tema": 3, "q": "Te aproximas a un autobús escolar detenido en una parada. ¿Cómo debes circular?", "opts": ["Avisando con la bocina y manteniendo tu velocidad actual", "Moderando la velocidad y parando si fuera preciso", "A la velocidad máxima de la vía si no ves niños cerca"], "a": 1, "expl": "Al aproximarse a un autobús en situación de parada, principalmente escolar, se debe moderar la velocidad y detener el vehículo si las circunstancias lo exigen.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 46.1.e)", "img": null}, {"tema": 3, "q": "Te acercas a un paso de peatones no regulado por semáforo ni por agente. ¿Cómo debes circular?", "opts": ["A velocidad moderada y, si fuera preciso, deteniéndote", "Aumentando la velocidad para despejar el paso cuanto antes", "A velocidad normal, pues el peatón debe esperar su turno"], "a": 0, "expl": "Debe moderarse la velocidad, y detenerse si es necesario, en las proximidades de los pasos de peatones no regulados por semáforo o agentes de la circulación.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 46.1.b)", "img": null}, {"tema": 3, "q": "Un turismo circula fuera de poblado por una vía sin pavimentar y sin señal de velocidad. ¿Cuál es el límite máximo?", "opts": ["50 km/h", "30 km/h", "40 km/h"], "a": 1, "expl": "En vías sin pavimentar el límite máximo es de 30 km/h.", "fuente": "RGC art. 48.1.f)", "img": null}, {"tema": 3, "q": "En una vía urbana con un único carril por sentido de circulación, sin señal específica de velocidad y con calzada y acera diferenciadas, ¿cuál es el límite genérico?", "opts": ["60 km/h", "70 km/h", "30 km/h"], "a": 2, "expl": "El límite genérico urbano es de 20 km/h en vías de plataforma única, 30 km/h en vías con un carril por sentido y 50 km/h en vías con dos o más carriles por sentido.", "fuente": "RGC art. 50.1.b)", "img": null}, {"tema": 3, "q": "Una vía urbana tiene un carril por sentido, más un carril reservado al transporte público en cada sentido. Sin señal específica, ¿cuál es el límite genérico?", "opts": ["30 km/h", "20 km/h", "50 km/h"], "a": 0, "expl": "Los carriles reservados a determinados usuarios o al transporte público no se cuentan; queda un carril por sentido: 30 km/h.", "fuente": "RGC art. 50.1", "img": null}, {"tema": 3, "q": "Un ciclomotor de dos ruedas circula por una carretera convencional, fuera de poblado y sin señal específica. ¿Cuál es su velocidad máxima?", "opts": ["45 km/h", "50 km/h", "40 km/h"], "a": 0, "expl": "Ciclos, ciclomotores de dos y tres ruedas y cuadriciclos ligeros tienen un máximo de 45 km/h.", "fuente": "RGC art. 48.1.e)", "img": null}, {"tema": 3, "q": "Un autobús con todos los pasajeros sentados y con cinturón circula por una autovía fuera de poblado, sin transporte escolar ni señal específica. ¿Qué velocidad máxima tiene?", "opts": ["90 km/h", "100 km/h", "120 km/h"], "a": 1, "expl": "La columna de autobuses, vehículos derivados de turismo y mixtos adaptables fija 100 km/h en autopista y autovía (90 en convencional). Los 80 km/h solo se aplican si hay pasajeros de pie o faltan cinturones.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.a)", "img": null}, {"tema": 3, "q": "¿En qué caso puede un vehículo circular por debajo de la velocidad mínima exigida?", "opts": ["Cuando el conductor quiera ahorrar combustible durante el trayecto", "Cuando el tráfico, el vehículo o la vía lo impidan sin riesgo", "Siempre que lleve encendidas las luces de emergencia del vehículo"], "a": 1, "expl": "Se permite circular por debajo de los mínimos cuando las circunstancias del tráfico, del vehículo o de la vía impidan mantener una velocidad superior sin riesgo, y en otros supuestos tasados.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 49.2", "img": null}, {"tema": 3, "q": "Existe un carril bici junto a la calzada. ¿Qué régimen de uso tiene para las bicicletas?", "opts": ["Voluntario, sin que la autoridad pueda hacerlo obligatorio", "Preferente, u obligatorio si se señaliza con la R-407a", "Siempre obligatorio, aunque no exista señal que lo establezca"], "a": 1, "expl": "Si hay carril bici su uso es preferente, aunque la autoridad competente puede hacerlo obligatorio mediante la señal R-407a.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 153.1", "img": null}, {"tema": 3, "q": "Un autobús sin cinturones de seguridad circula fuera de poblado por una autovía. ¿Cuál es su velocidad máxima?", "opts": ["100 km/h", "90 km/h", "80 km/h"], "a": 2, "expl": "Si el autobús no está dotado de cinturón, su máximo fuera de poblado es 80 km/h, sea cual sea la vía.", "fuente": "RGC art. 48.1.b)", "img": null}, {"tema": 3, "q": "Un vehículo especial que carece de señalización de frenado circula por una vía fuera de poblado. ¿Qué velocidad máxima tiene?", "opts": ["25 km/h", "50 km/h", "40 km/h"], "a": 0, "expl": "Los vehículos especiales sin señalización de frenado, con remolque o los motocultores están limitados a 25 km/h.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.c).1.º", "img": null}, {"tema": 3, "q": "Un vehículo que transporta mercancías peligrosas circula fuera de poblado. ¿Cómo afecta esto a su límite de velocidad?", "opts": ["Se reduce en 10 km/h el límite que le corresponde por su tipo de vehículo y de vía", "Se reduce en 20 km/h el límite que le corresponde por su tipo de vehículo y de vía", "Se mantiene el mismo límite que tienen los demás vehículos de su categoría"], "a": 0, "expl": "El artículo 48.1.b) reduce en 10 km/h la velocidad máxima fijada en el párrafo a) para el transporte escolar, de menores y de mercancías peligrosas.", "fuente": "RGC art. 48.1.b) (redacción RD 518/2026)", "img": null}, {"tema": 3, "q": "Salvo causa justificada, ¿por debajo de qué velocidad no pueden circular los vehículos de motor por una autopista o una autovía?", "opts": ["60 km/h", "50 km/h", "40 km/h"], "a": 0, "expl": "En autopistas y autovías no se puede circular a menos de 60 km/h, salvo vehículos especiales o de acompañamiento y situaciones justificadas.", "fuente": "RGC art. 49 (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 3, "q": "Un autobús con cinturones y sin pasajeros de pie circula por una carretera convencional fuera de poblado, sin señal específica. ¿Cuál es su límite de velocidad?", "opts": ["80 km/h", "100 km/h", "90 km/h"], "a": 2, "expl": "El autobús, en carretera convencional, tiene un límite de 90 km/h. Los 80 km/h son solo para autobuses con pasajeros de pie autorizados o sin cinturón.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.a)", "img": null}, {"tema": 3, "q": "Fuera de poblado, en una carretera con un carril por sentido y adelantamiento permitido, circulas detrás de otro vehículo sin intención de adelantarlo. Además de poder frenar sin colisionar, ¿qué debe permitir tu separación?", "opts": ["Que ningún otro vehículo pueda intercalarse entre ambos", "Que puedas ver las luces de freno del segundo vehículo delante", "Que el vehículo que te sigue pueda adelantarte con seguridad"], "a": 2, "expl": "Además de poder frenar sin colisionar, la separación debe permitir al que sigue adelantar con seguridad (salvo ciclistas en grupo).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 54.2", "img": null}, {"tema": 3, "q": "Fuera de poblado vas a adelantar a un ciclista. ¿Qué reducción de velocidad exige como mínimo el Reglamento respecto al límite existente en la vía?", "opts": ["Al menos 15 km/h", "Al menos 20 km/h", "Al menos 10 km/h"], "a": 1, "expl": "Al adelantar a peatones, animales, ciclomotores, VMP o ciclistas fuera de poblado hay que reducir la velocidad en al menos 20 km/h respecto al límite de la vía, antes y durante la maniobra.", "fuente": "RGC art. 85.4 (redacción RD 518/2026)", "img": null}, {"tema": 3, "q": "Fuera de poblado, ¿en cuál de estos casos exige el Reglamento moderar la velocidad?", "opts": ["Al circular tras un vehículo que mantiene su velocidad", "Al acercarse a vehículos inmovilizados en la calzada", "Al transitar por un tramo despejado con buena visibilidad"], "a": 1, "expl": "Fuera de poblado debe moderarse la velocidad al acercarse a vehículos inmovilizados en la calzada, a vehículos de auxilio prestando servicio y a ciclos que circulan por ella o por su arcén.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 46.1.f)", "img": null}, {"tema": 3, "q": "¿Cómo se determina la distancia de seguridad que debe guardar un conductor respecto al vehículo que va delante?", "opts": ["Debe permitirle detenerse sin colisionar si el de delante frena bruscamente, según velocidad y adherencia", "Debe ser de un metro por cada diez kilómetros por hora, con independencia del estado de la calzada o del frenado", "Debe ser siempre de 100 metros en cualquier vía fuera de poblado, sea cual sea la velocidad o la adherencia"], "a": 0, "expl": "El conductor debe dejar un espacio libre que le permita detenerse, en caso de frenado brusco, sin colisionar, teniendo en cuenta velocidad, adherencia y frenado.", "fuente": "RGC art. 54.1 y Ley de Tráfico art. 22.2", "img": null}, {"tema": 3, "q": "Para reducir considerablemente la velocidad, salvo peligro inminente, ¿qué debe hacer el conductor?", "opts": ["Reducir la velocidad sin avisar para no distraer a los conductores de detrás", "Frenar de forma enérgica para detener el vehículo en el menor espacio posible", "Cerciorarse de que no hay riesgo y avisar antes, sin frenar bruscamente"], "a": 2, "expl": "Debe cerciorarse de que no hay riesgo, avisar previamente (luces de freno o brazo) y no frenar de forma brusca.", "fuente": "RGC art. 53.1", "img": null}, {"tema": 3, "q": "Un motorista adelanta fuera de poblado a un camión. ¿Qué espacio lateral mínimo debe quedar entre la moto y las partes más salientes del camión?", "opts": ["1,00 metros", "1,50 metros", "2,00 metros"], "a": 1, "expl": "El conductor de un vehículo de dos ruedas que adelanta fuera de poblado debe dejar al menos 1,50 m.", "fuente": "RGC art. 85.5", "img": null}, {"tema": 3, "q": "Una autovía atraviesa un núcleo urbano con límite genérico de 80 km/h. ¿Hasta dónde puede ampliarse ese límite?", "opts": ["Hasta 120 km/h para todos los vehículos, sin acuerdo con el titular", "Hasta 100 km/h, por decisión municipal y sin señalización", "Hasta los genéricos fuera de poblado, con acuerdo y señal"], "a": 2, "expl": "Puede ampliarse por acuerdo de la Autoridad municipal y el titular de la vía, con señalización específica, sin rebasar los límites genéricos fuera de poblado.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 50.6", "img": null}, {"tema": 3, "q": "¿En cuál de estos casos no es exigible a un camión de más de 3.500 kg la separación mínima de 50 metros respecto al vehículo que le precede, para permitir ser adelantado?", "opts": ["Cuando hay más de un carril para su mismo sentido de circulación", "Cuando circula por carretera convencional con adelantamiento permitido", "Cuando circula fuera de poblado con el tráfico fluido en ambos sentidos"], "a": 0, "expl": "Esa separación no se aplica en poblado, donde esté prohibido adelantar, con más de un carril en su sentido o con circulación saturada.", "fuente": "RGC art. 54.3", "img": null}, {"tema": 3, "q": "Un camión de más de 3.500 kg de masa máxima autorizada circula por una carretera convencional, fuera de poblado y sin señal específica de velocidad. ¿Qué velocidad máxima tiene?", "opts": ["80 km/h", "100 km/h", "60 km/h"], "a": 0, "expl": "Los camiones y tractocamiones tienen un límite genérico de 90 km/h en autopista y autovía y de 80 km/h en carretera convencional.", "fuente": "RGC art. 48.1.a) (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 3, "q": "Una autocaravana de 4.200 kg de masa máxima autorizada circula por una carretera convencional fuera de poblado, sin señal específica. ¿Qué límite tiene?", "opts": ["80 km/h", "100 km/h", "90 km/h"], "a": 0, "expl": "Las autocaravanas de más de 3.500 kg se rigen por la columna de camiones: 90 en autopista y autovía y 80 en convencional.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.a)", "img": null}, {"tema": 3, "q": "Un autobús con pasajeros de pie autorizados circula fuera de poblado. ¿Qué velocidad máxima tiene, sea cual sea el tipo de vía?", "opts": ["80 km/h", "60 km/h", "100 km/h"], "a": 0, "expl": "Para autobuses con pasajeros de pie autorizados o sin cinturones de seguridad, la velocidad máxima es de 80 km/h en cualquier vía fuera de poblado.", "fuente": "RGC art. 48.1.b) (redacción RD 518/2026)", "img": null}, {"tema": 3, "q": "Una motocicleta arrastra un remolque, de acuerdo con el Reglamento. ¿Cómo debe ajustar su velocidad?", "opts": ["Reducirla un 10 % respecto a las genéricas", "No reducirla si el remolque pesa menos que la moto", "Reducirla un 25 % respecto a las genéricas aplicables"], "a": 0, "expl": "Para arrastrar remolque, la moto debe circular de día, sin visibilidad disminuida, a una velocidad un 10 % inferior a las genéricas del artículo 48 y sin personas en el remolque.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 12.3.b)", "img": null}, {"tema": 3, "q": "Un vehículo derivado de turismo circula por una autovía fuera de poblado, sin señal específica. ¿Cuál es su velocidad máxima?", "opts": ["100 km/h", "120 km/h", "110 km/h"], "a": 0, "expl": "Los vehículos derivados de turismo comparten columna con los autobuses: 100 km/h en autopista y autovía y 90 en convencional.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.a)", "img": null}, {"tema": 3, "q": "Una intersección está debidamente señalizada y la visibilidad es prácticamente nula. ¿Qué velocidad no deberá exceder el vehículo?", "opts": ["30 km/h", "70 km/h", "50 km/h"], "a": 2, "expl": "En esas condiciones la velocidad no debe exceder de 50 km/h.", "fuente": "RGC art. 46.1.h)", "img": null}, {"tema": 3, "q": "¿Cómo se llama la distancia que recorre un vehículo desde que el conductor percibe el peligro hasta que empieza a pisar el freno?", "opts": ["Distancia de seguridad", "Distancia de frenado", "Distancia de reacción"], "a": 2, "expl": "La distancia de reacción es la recorrida hasta que el conductor comienza a pisar el freno desde que observa el peligro.", "fuente": "DGT, Revista Tráfico y Seguridad Vial (revista.dgt.es, 09/2020, «Velocidad y riesgo al frenar»)", "img": null}, {"tema": 3, "q": "Un turismo arrastra un remolque y circula por una autopista fuera de poblado, sin señal específica. ¿Qué velocidad máxima tiene?", "opts": ["90 km/h", "100 km/h", "120 km/h"], "a": 0, "expl": "Los automóviles con remolque se incluyen en la columna de 90 km/h para autopista y autovía (80 en convencional).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 48.1.a)", "img": null}, {"tema": 4, "q": "Esperas en la calzada para cambiar de sentido y tu presencia impide avanzar a los vehículos que circulan detrás. Si es posible, ¿qué debes hacer?", "opts": ["Seguir esperando en el carril con la luz de emergencia conectada.", "Girar de inmediato aunque se aproxime algún vehículo.", "Salir de la calzada por tu lado derecho, si es posible, hasta poder maniobrar."], "a": 2, "expl": "Si la espera impide continuar a los de detrás, el conductor debe salir de la calzada por su lado derecho, si es posible, hasta que las condiciones permitan la maniobra.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 78.1", "img": null}, {"tema": 4, "q": "En un cruce sin señales entre una calle y una vía de tranvía a nivel, ¿quién tiene prioridad de paso?", "opts": ["El vehículo que se acerque por la derecha.", "El vehículo que llegue antes al cruce.", "El tranvía."], "a": 2, "expl": "Los vehículos que circulan por raíles tienen prioridad de paso sobre los demás usuarios cuando no hay señal que regule la preferencia.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 57.1.b", "img": null}, {"tema": 4, "q": "En un tramo estrecho sin señalizar, un turismo con remolque de 600 kg de masa máxima autorizada y un camión deben decidir quién retrocede. ¿Quién tiene preferencia?", "opts": ["El que sea más corto de los dos, por poder retroceder con menos riesgo", "El camión, por lo que debe retroceder el turismo con el remolque", "El turismo con el remolque, por lo que debe retroceder el camión"], "a": 2, "expl": "Los turismos con remolque de hasta 750 kg de masa máxima autorizada preceden a los camiones en el orden de preferencia para la marcha atrás.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 62.1 d) y f)", "img": null}, {"tema": 4, "q": "Un turismo y una motocicleta se encuentran en un tramo estrecho, sin señales ni obras, y uno debe retroceder. Si no se sabe quién entró antes, ¿quién tiene preferencia?", "opts": ["El turismo.", "El que circule a mayor velocidad.", "La motocicleta, por maniobrar con más facilidad."], "a": 0, "expl": "En el orden de preferencia del art. 62, los turismos preceden a las motocicletas, ciclomotores de dos ruedas y bicicletas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 62.1", "img": null}, {"tema": 4, "q": "¿Qué indica la marca vial M-7.5, de paso a nivel?", "opts": ["La prohibición de parar sobre los raíles del tranvía o del tren", "Un paso a nivel próximo donde se cede el paso al tren o tranvía", "Un carril reservado para tranvías y autobuses de líneas regulares"], "a": 1, "expl": "La marca M-7.5 indica la proximidad de un paso a nivel de ferrocarril o tranvía, en el que los vehículos de la calzada deben ceder el paso cuando se aproxime un tren o tranvía.", "fuente": "RGC (texto consolidado con RD 518/2026), Anexo I, marcas viales, M-7.5", "img": null}, {"tema": 4, "q": "Una cañada debidamente señalizada cruza la carretera y un rebaño la está atravesando. ¿Quién tiene prioridad de paso?", "opts": ["El ganado, por tratarse de una cañada debidamente señalizada", "El vehículo, pues los animales nunca tienen prioridad sobre ellos", "El que llegue antes, sea el rebaño o el vehículo que se acerca"], "a": 0, "expl": "Los conductores tienen prioridad sobre los animales, salvo en las cañadas debidamente señalizadas, al girar con animales cruzando la vía y al cruzar un arcén por el que circulen sin cañada.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 66.1 a)", "img": null}, {"tema": 4, "q": "Circulas por un paso inferior de doble sentido que tiene un único carril para tu sentido. ¿Puedes adelantar a otro vehículo?", "opts": ["Sí, siempre que el paso inferior sea de poca longitud", "Sí, si no viene ningún vehículo en sentido contrario", "No, el adelantamiento está prohibido en ese caso"], "a": 2, "expl": "En túneles y pasos inferiores con circulación en ambos sentidos está prohibido adelantar, salvo que haya más de un carril para tu sentido.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 95.6 y 87.1.d)", "img": null}, {"tema": 4, "q": "Debido a una avería de emergencia debes circular por una autovía a velocidad anormalmente reducida. ¿Qué obliga el Reglamento?", "opts": ["Continuar por el carril derecho hasta tu destino", "Abandonarla por la primera salida", "Seguir con las luces de emergencia hasta el área de servicio"], "a": 1, "expl": "Quien por razones de emergencia circule por una autopista o autovía a velocidad anormalmente reducida debe abandonarla por la primera salida.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 38.2", "img": null}, {"tema": 4, "q": "¿Cómo se señalizan las cañadas o pasos de ganado de carácter general?", "opts": ["Con un panel “cañada” bajo la señal de animales domésticos", "Con una marca vial amarilla de zigzag junto al arcén derecho de la vía", "Con un panel “ganado” bajo la señal de peligro indefinido en la calzada"], "a": 0, "expl": "Las cañadas se señalizan con paneles complementarios con la inscripción “cañada” colocados debajo de la señal de paso de animales domésticos.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 66.2", "img": null}, {"tema": 4, "q": "Una ambulancia en servicio urgente, con sus señales activadas, llega a un tramo de vía en reparación. ¿Puede pasar por el trozo en obras?", "opts": ["Sí, siempre que pueda hacerlo sin peligro ni daño a la obra realizada", "Sí, sin condición alguna, porque los vehículos prioritarios ignoran las obras", "N
