    rstart: function (el) {
      var id = el.getAttribute("data-id"), fresh = cur().view === "rtrain";
      R = { id: id, step: 0, ans: [], res: [], pts: 0, tap: null, p4: shuffle([0, 1, 2]), p5: shuffle([0, 1, 2]) };
      if (fresh) stack.pop();
      go("rtrain");
    },
    rplay: function () {
      var sc = RISK.byId[R.id], cv = $("vcan"); if (!cv) return;
      var b = document.querySelector(".vplay"); if (b) b.style.display = "none";
      var p = new RISK.Player(cv, sc); activeP = p;
      p.play(0, sc.cut, null, function () { activeP = null; R.step = 1; render(); window.scrollTo(0, 0); }, null);
    },
    rans: function (el) {
      var d = +el.getAttribute("data-d"), sc = RISK.byId[R.id], s = R.step, ok = 0;
      if (s === 1) ok = d === RQ[0].ok ? 1 : 0; else if (s === 2) ok = d === RQ[1].ok ? 1 : 0; else if (s === 4) ok = d === 0 ? 1 : 0; else if (s === 5) ok = d === 0 ? 1 : 0;
      R.res[s === 1 ? 0 : s === 2 ? 1 : s === 4 ? 3 : 4] = ok;
      R.step++;
      if (R.step === 6) finishRisk();
      render(); window.scrollTo(0, 0);
    },
    rzone: function () {
      var z = zoneOf(RISK.byId[R.id]), t = R.tap, ok = t && t.x >= z.x0 && t.x <= z.x1 && t.y >= z.y0 && t.y <= z.y1 ? 1 : 0;
      R.res[2] = ok; R.step = 4; render(); window.scrollTo(0, 0);
    },
    rsol: function () { var cv = $("vcan"); if (cv) playSolution(cv, RISK.byId[R.id]); },
    vplay: function () {
      var id = Z.ids[Z.i], q = QID[id], st = Z.st[id];
      if ((st.views || 0) >= 3) return;
      var sc = RISK.byId[q.vid], cv = document.querySelector(".vcan"); if (!cv) return;
      var b = document.querySelector(".vplay"); if (b) b.style.display = "none";
      var p = new RISK.Player(cv, sc); activeP = p;
      p.play(0, sc.cut, null, function () { activeP = null; st.views = (st.views || 0) + 1; persistZ(); render(); }, null);
    },
    vsol: function (el) {
      var sc = RISK.byId[el.getAttribute("data-sc")], cv = el.closest(".card") ? el.closest(".card").querySelector(".vcan") : document.querySelector(".vcan");
      if (cv) playSolution(cv, sc);
    },
    back: function () { if (cur().view === "quiz") { sheet('<h2>¿Salir del test?</h2><p class="muted">Se guardará tu avance para continuar después.</p><button class="btn" data-act="sh-ok">Salir y guardar</button><button class="btn ghost" data-act="sh-del">Abandonar sin guardar</button>', function (a) { if (a === "sh-ok") { persistZ(); Z = null; stopTimer(); home(); } else if (a === "sh-del") { clearZ(); Z = null; stopTimer(); home(); } }); } else back(); },
    home: function () { home(); },
    ajustes: function () { go("ajustes"); },
    perfil: function () {
      sheet('<h2>¿Quién estudia?</h2>' + DB.profiles.map(function (p) { return '<button class="btn big ' + (p.id === DB.cur ? "" : "ghost") + '" data-act="sh-p" data-pid="' + p.id + '"><b>' + esc(p.name) + '</b></button>'; }).join(""), function (a, el) { if (a === "sh-p") { DB.cur = el.getAttribute("data-pid"); save(); home(); } });
    },
    exam: function () { startQuiz("examen", "Test de examen", examIds(), "exam"); },
    repaso: function () { var ids = smartReview(20); startQuiz("repaso", "Repaso inteligente", ids, "study"); },
    numerados: function () { go("numerados"); },
    temas: function () { go("temas"); },
    random: function () { pickMode(function (m) { startQuiz("aleatorio", "Test aleatorio", sample(allIds(), EXAM_N), m); }, "Test aleatorio"); },
    calientes: function () { var ids = hotIds().slice(0, 30); if (!ids.length) { toast("Aún no tienes preguntas falladas"); return; } pickMode(function (m) { startQuiz("calientes", "Preguntas calientes", shuffle(ids), m); }, "Tus preguntas calientes"); },
    fallos: function () { go("fallos"); },
    resultados: function () { go("resultados"); },
    "start-num": function (el) { var i = +el.getAttribute("data-i"), ids = numberedTests()[i]; pickMode(function (m) { startQuiz("numerado", "Test " + (i + 1 < 10 ? "0" : "") + (i + 1), shuffle(ids), m, "num" + (i + 1)); }, "Test " + (i + 1)); },
    "start-tema": function (el) { var t = el.getAttribute("data-t"), ids = QS.filter(function (q) { return String(q.tema) === t; }).map(function (q) { return q.id; }); pickMode(function (m) { startQuiz("tema", "Tema " + t, sample(ids, EXAM_N), m); }, "Tema " + t + " · " + TEMAS[t]); },
    "practicar-fallos": function () { var ids = hotIds().slice(0, 30); pickMode(function (m) { startQuiz("fallos", "Repaso de fallos", shuffle(ids), m); }, "Repasar tus fallos"); },
    "ver-q": function (el) { go("verq", { id: el.getAttribute("data-id") }); },
    "ver-intento": function (el) { go("intento", { ts: el.getAttribute("data-ts") }); },
    again: function (el) {
      var a = PD().attempts.filter(function (x) { return String(x.ts) === el.getAttribute("data-ts"); })[0]; if (!a) return;
      var ids = a.items.map(function (x) { return x[0]; });
      startQuiz(a.kind, a.title, a.kind === "examen" ? examIds() : shuffle(ids), a.mode, a.key);
    },
    opt: function (el) {
      var d = +el.getAttribute("data-d"), id = Z.ids[Z.i], st = Z.st[id], q = QID[id];
      if (st.revealed) return;
      st.sel = d;
      if (Z.mode === "study") { st.revealed = true; if (!st.counted) { record(id, st.perm[d] === q.a); st.counted = true; save(); } }
      persistZ(); render();
    },
    next: function () { if (Z.i < Z.ids.length - 1) { Z.i++; persistZ(); render(); window.scrollTo(0, 0); } },
    prev: function () { if (Z.i > 0) { Z.i--; persistZ(); render(); window.scrollTo(0, 0); } },
    indice: function () { go("indice"); },
    goq: function (el) { Z.i = +el.getAttribute("data-i"); persistZ(); stack.pop(); render(); window.scrollTo(0, 0); },
    finish: function () {
      var un = Z.ids.filter(function (x) { return Z.st[x].sel == null; }).length;
      if (un) sheet('<h2>Tienes ' + un + ' sin contestar</h2><p class="muted">' + (Z.mode === "exam" ? "Las preguntas en blanco cuentan como fallo en el examen." : "Las que dejes en blanco no puntúan.") + '</p><button class="btn" data-act="sh-ok">Finalizar igualmente</button>', function (a) { if (a === "sh-ok") finishQuiz(); });
      else finishQuiz();
    },
    "rv-f": function (el) { rvFilter = el.getAttribute("data-f"); render(); },
    theme: function (el) { DB.theme = el.getAttribute("data-t"); save(); render(); },
    export: function () { download("apruebab-progreso-" + new Date().toISOString().slice(0, 10) + ".json", DB); },
    reset: function () { sheet('<h2>¿Borrar el progreso?</h2><p class="muted">Se borrará el historial y los fallos del perfil activo.</p><button class="btn danger" data-act="sh-ok">Sí, borrar</button>', function (a) { if (a === "sh-ok") { DB.data[DB.cur] = { attempts: [], qs: {} }; save(); toast("Progreso borrado"); render(); } }); },
    admin: function () { go("admin"); },
    "exp-bank": function () { download("banco-" + BANK.version + ".json", { version: BANK.version, preguntas: QS.map(function (q) { return { tema: q.tema, q: q.q, opts: q.opts, a: q.a, expl: q.expl, fuente: q.fuente, img: q.img }; }) }); },
    "exp-rep": function () { download("reportes.json", DB.reports); },
    "clr-rep": function () { DB.reports = []; save(); render(); },
    reportar: function (el) {
      var id = el.getAttribute("data-id");
      sheet('<h2>Reportar un error</h2><textarea id="rep-note" rows="3" placeholder="¿Qué está mal? (opcional)"></textarea><button class="btn" data-act="sh-ok">Enviar</button>', function (a) { if (a === "sh-ok") { DB.reports.push({ id: id, note: ($("rep-note") || {}).value || "", ts: Date.now() }); save(); toast("Gracias, reporte guardado"); } });
    }
  };
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "sh-close") { sheetClose(); return; }
    if (sheetCb && !$("sheet").hidden && $("sheet").contains(el)) { var cb = sheetCb; sheetClose(); cb(a, el); return; }
    if (ACT[a]) ACT[a](el);
  });

  /* ---------- arranque ---------- */
  stack = [{ view: "home", params: {} }];
  render();
  try {
    var saved = JSON.parse(lsGet(KEYCUR) || "null");
    if (saved && saved.pid === DB.cur && saved.Z && saved.Z.ids && saved.Z.ids.every(function (id) { return QID[id]; })) {
      Z = saved.Z;
      sheet('<h2>Tienes un test sin terminar</h2><p class="muted">' + esc(Z.title) + ' · pregunta ' + (Z.i + 1) + ' de ' + Z.ids.length + '</p><button class="btn" data-act="sh-ok">Continuar</button><button class="btn ghost" data-act="sh-del">Descartarlo</button>', function (a) {
        if (a === "sh-ok") { stack = [{ view: "home", params: {} }, { view: "quiz", params: {} }]; render(); } else { clearZ(); Z = null; home(); }
      });
    }
  } catch (e) { }
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () { });
  window.__ab = { QS: QS, DB: function () { return DB; }, Z: function () { return Z; } };
})();
</script>
