 "Mayores de diez años, con casco homologado y guantes", "Mayores de siete años, con casco homologado"], "a": 2, "expl": "Excepcionalmente los mayores de siete años pueden viajar en motocicletas o ciclomotores conducidos por su padre, madre o tutor, con casco homologado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 12.2", "img": null}, {"tema": 7, "q": "Con el vehículo en movimiento, ¿cuál de estos dispositivos puede utilizar legalmente el conductor?", "opts": ["Un reproductor de vídeo o de DVD", "Un dispositivo GPS de navegación", "Una pantalla con acceso a internet"], "a": 1, "expl": "El reglamento considera incompatibles con la atención permanente las pantallas con acceso a internet, los monitores de televisión y los reproductores de vídeo o DVD; se exceptúa el GPS.", "fuente": "RGC art. 18.1, párrafo segundo (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Conduciendo un turismo por una autovía, ¿cuándo se admite mantener una conversación telefónica?", "opts": ["Cuando se usa un solo auricular con volumen muy bajo", "Cuando se sostiene el móvil con la mano y el tráfico es fluido", "Cuando se hace sin emplear las manos ni usar auriculares"], "a": 2, "expl": "Está prohibido usar el móvil u otro sistema de comunicación durante la conducción, salvo si la comunicación se desarrolla sin emplear las manos ni cascos, auriculares o similares.", "fuente": "RGC art. 18.2 (redacción vigente desde 01/10/2026)", "img": null}, {"tema": 7, "q": "Un peatón se ve implicado en un accidente de tráfico. ¿Debe someterse a la prueba de alcohol si el agente se lo exige?", "opts": ["Sí, los implicados en un accidente están obligados", "No, solo están obligados los conductores de vehículos", "Solo si ha resultado herido de gravedad"], "a": 0, "expl": "Los demás usuarios de la vía implicados en un accidente también están obligados a someterse a las pruebas.", "fuente": "Ley de Tráfico RDL 6/2015 art. 14.2", "img": null}, {"tema": 7, "q": "Una madre conduce un turismo de cinco plazas con su hijo de 9 años, que mide 125 cm. Si no concurre ninguna circunstancia excepcional, ¿cómo debe viajar el niño?", "opts": ["En cualquier plaza del coche, siempre con el cinturón abrochado", "En el asiento delantero, con el cinturón y un adulto a su lado", "En un asiento trasero, con un sistema de retención homologado"], "a": 2, "expl": "Los menores de estatura igual o inferior a 135 cm deben usar un sistema de retención infantil homologado adaptado a su talla y peso y situarse en los asientos traseros; solo excepcionalmente pueden ir delante.", "fuente": "RGC art. 117.1 y 117.3 (no modificado por RD 518/2026)", "img": null}, {"tema": 7, "q": "Un taxi circula en tráfico urbano de una gran ciudad con un pasajero de 120 cm de estatura. ¿Qué condición debe cumplirse para que ese pasajero no necesite sistema de retención infantil?", "opts": ["Que viaje con un adulto a su lado", "Que sea mayor de ocho años", "Que ocupe un asiento trasero"], "a": 2, "expl": "El taxi puede transportar en tráfico urbano o áreas urbanas de grandes ciudades a personas de menos de 135 cm sin dispositivo de retención homologado, siempre que ocupen un asiento trasero.", "fuente": "RGC art. 119.2 (redacción RD 518/2026, en vigor desde 01/10/2026)", "img": null}, {"tema": 7, "q": "¿Cuál de estos dispositivos está prohibido llevar en el vehículo?", "opts": ["Un navegador GPS con mapas de carretera", "Un detector de radares o cinemómetros", "Una aplicación que avisa de la posición de los radares fijos"], "a": 1, "expl": "Se prohíben los inhibidores y detectores de radares; quedan excluidos de la prohibición los mecanismos de aviso de la posición de los sistemas de vigilancia.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 18.3", "img": null}, {"tema": 7, "q": "Un joven de 16 años conduce un ciclomotor. ¿Qué tasa de alcohol en aire espirado tiene permitida?", "opts": ["Ninguna: 0 miligramos por litro", "Hasta 0,25 miligramos por litro", "Hasta 0,15 miligramos por litro"], "a": 0, "expl": "La Ley de Tráfico impide a los conductores menores de edad circular con una tasa superior a 0 g/l en sangre o 0 mg/l en aire espirado.", "fuente": "Ley de Tráfico (RDL 6/2015) art. 14.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 8, "q": "Según la guía de conducción eficiente del IDAE, tras arrancar en primera, ¿cuándo conviene cambiar a segunda marcha?", "opts": ["Rápidamente, a los 2 segundos aproximadamente", "A los 10 segundos de iniciar la marcha", "Cuando el motor alcance las 4.000 revoluciones"], "a": 0, "expl": "La conducción eficiente usa la primera solo para arrancar y pasa a segunda hacia los 2 segundos (unos 6 m), circulando en la marcha más larga posible y a bajas revoluciones.", "fuente": "IDAE, Manual de conducción eficiente para vehículos turismo, ap. 4.2.3 (ed. EVE/IDAE)", "img": null}, {"tema": 8, "q": "Notas bostezos repetidos y los párpados pesados durante un viaje largo. Según la DGT, ¿qué es lo más seguro?", "opts": ["Parar en un lugar adecuado y descansar o dormir", "Tomar un café fuerte y continuar hasta el destino", "Subir el volumen de la radio y bajar la ventanilla"], "a": 0, "expl": "Según la DGT, lo más seguro es parar a dormir en un lugar adecuado unos 20-30 minutos; la radio o el café pueden dar un estímulo breve, pero no sustituyen al descanso.", "fuente": "DGT, Conducir con sueño o cansancio (https://www.dgt.es/muevete-con-seguridad/evita-conductas-de-riesgo/Conducir-con-sueno-o-cansancio)", "img": null}, {"tema": 8, "q": "De los siguientes factores, ¿cuál aumenta la distancia de reacción (la recorrida desde que se percibe el peligro hasta que se empieza a frenar)?", "opts": ["El cansancio o el sueño del conductor", "El pavimento mojado o deslizante", "El desgaste de los frenos del vehículo"], "a": 0, "expl": "La distancia de reacción depende de la velocidad y del tiempo de reacción del conductor, que aumenta con el sueño, la fatiga, el alcohol o el móvil. Frenos y pavimento influyen en la distancia de frenado.", "fuente": "RACE (Distancias de reacción, de frenado y de detención), con datos de la DGT", "img": null}, {"tema": 8, "q": "Según la DGT, ¿cuánto reduce el cinturón de seguridad el riesgo de morir en un accidente?", "opts": ["Lo reduce a la mitad", "Lo reduce en una cuarta parte", "Solo lo reduce a partir de 90 km/h"], "a": 0, "expl": "La DGT indica que el cinturón reduce a la mitad el riesgo de fallecimiento en caso de accidente.", "fuente": "DGT, nota de prensa campaña cinturón y SRI (marzo 2026) y revista DGT '10 razones para usarlo'", "img": null}, {"tema": 8, "q": "En una curva, la parte trasera del vehículo derrapa hacia un lado (sobreviraje). ¿Qué debe hacer el conductor?", "opts": ["Girar el volante hacia el lado del derrape y soltar el acelerador", "Acelerar con decisión y mantener el volante completamente inmóvil", "Frenar a fondo y girar el volante hacia el lado contrario al derrape"], "a": 0, "expl": "Ante un sobreviraje se dirige la mirada a donde se quiere ir, se gira el volante hacia el mismo lado que derrapa, se levanta suavemente el acelerador y no se frena bruscamente.", "fuente": "DGT, noticia 'Cómo reaccionar a subvirajes, sobrevirajes y frenadas de emergencia' (20/07/2026)", "img": null}, {"tema": 8, "q": "Un turismo transporta una carga indivisible que sobresale por la parte posterior. ¿Cuánto puede sobresalir como máximo respecto a la longitud del vehículo?", "opts": ["Un tercio de la longitud del vehículo", "El 10 por ciento de su longitud", "El 15 por ciento de su longitud"], "a": 2, "expl": "En vehículos no destinados exclusivamente a mercancías, la carga puede sobresalir por detrás un 10 % de su longitud, y un 15 % si es indivisible.", "fuente": "RGC art. 15.3 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Según la DGT, ¿qué consejo es adecuado para un conductor mayor al planificar sus desplazamientos?", "opts": ["Circular con poco tráfico y evitar la lluvia y las zonas mal iluminadas", "Preferir la noche, cuando hay menos tráfico y menos prisas", "Evitar las paradas en viajes largos para no perder el ritmo"], "a": 0, "expl": "La DGT recomienda circular en horas de menor tráfico, evitar la lluvia y las zonas poco iluminadas, y hacer más paradas en los viajes largos.", "fuente": "DGT, Consejos para personas mayores (https://www.dgt.es/muevete-con-seguridad/viaja-seguro/personas-mayores/)", "img": null}, {"tema": 8, "q": "Un turismo lleva una carga que sobresale por detrás, de día y con buena visibilidad. ¿Cómo debe señalizarse esa carga?", "opts": ["Con una luz roja fija colocada en el extremo posterior de la carga", "Con la señal V-20 colocada en el extremo posterior de la carga", "Con una luz amarilla intermitente en el extremo posterior de la carga"], "a": 1, "expl": "La carga que sobresale por detrás debe señalizarse siempre con la señal V-20; la luz roja se añade solo entre el ocaso y la salida del sol o con visibilidad disminuida.", "fuente": "RGC art. 15.6 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Un camión de 12.000 kg de masa máxima autorizada circula por un túnel sin intención de adelantar. ¿Qué separación mínima debe guardar con el precedente?", "opts": ["Al menos 150 metros o un intervalo de seis segundos", "Al menos 100 metros o un intervalo de cuatro segundos", "Al menos 50 metros, como en cualquier carretera convencional"], "a": 0, "expl": "En túneles, los vehículos de más de 3.500 kg de MMA deben guardar al menos 150 metros o seis segundos.", "fuente": "RGC art. 95.6 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "En una curva de reducida visibilidad sin marcas que delimiten la calzada, ¿qué debe dejar libre quien no adelanta?", "opts": ["Una franja de un metro y medio a su izquierda", "El arcén de su derecha, por si otro vehículo lo necesita", "Toda la mitad de calzada del sentido contrario"], "a": 2, "expl": "Aun sin señalización, en curvas y cambios de rasante de reducida visibilidad se debe dejar completamente libre la mitad de la calzada del sentido contrario.", "fuente": "RGC art. 29.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "En un viaje largo, ¿cada cuánto recomienda la DGT parar para descansar?", "opts": ["Cada 6 horas o cada 600 kilómetros", "Cada 4 horas o cada 400 kilómetros", "Cada 2 horas o cada 200 kilómetros"], "a": 2, "expl": "Para prevenir la fatiga, la DGT aconseja parar y descansar cada 2 horas o cada 200 km, y parar de inmediato ante cualquier síntoma de cansancio.", "fuente": "DGT, Revista Tráfico y Seguridad Vial, '7 consejos para evitar la fatiga' (2015)", "img": null}, {"tema": 8, "q": "Sobre calzada mojada, ¿qué ocurre con la distancia de frenado respecto a calzada seca?", "opts": ["Disminuye, porque el agua refrigera los frenos", "Es la misma si los neumáticos son nuevos", "Aumenta"], "a": 2, "expl": "Con el asfalto mojado la frenada se alarga, aunque los neumáticos estén en buen estado.", "fuente": "DGT, Todo lo que necesitas saber para circular bajo la lluvia (https://www.dgt.es/comunicacion/noticias/todo-lo-que-necesitas-saber-para-circular-bajo-la-lluvia/)", "img": null}, {"tema": 8, "q": "Vas a entrar con un turismo en una curva cerrada. ¿Dónde conviene realizar la frenada?", "opts": ["Antes de la curva, en recta, y nunca dentro de ella", "A la salida, cuando ya se ha enderezado el volante", "En mitad de la curva, para ajustar la velocidad"], "a": 0, "expl": "La frenada debe hacerse antes de entrar en la curva, en recta; dentro de ella solo se acelera lo justo para que el motor siga trabajando.", "fuente": "DGT Revista, ¡Atención, vienen curvas! (https://revista.dgt.es/es/educacion-formacion/conducir-mejor/2017/0419-Conducir-en-curvas.shtml)", "img": null}, {"tema": 8, "q": "¿Qué advierte el pictograma de un triángulo rojo con un coche negro en el envase de un medicamento?", "opts": ["Que puede afectar a la conducción y conviene consultar el prospecto", "Que está prohibido conducir durante todo el tratamiento", "Que el medicamento es apto para conductores profesionales"], "a": 0, "expl": "El pictograma («Conducción: ver prospecto») no prohíbe conducir; solo advierte de que el medicamento puede afectar a la capacidad de conducir.", "fuente": "RACE, Medicamentos que afectan a la conducción (https://www.race.es/medicamentos-afectan-conduccion)", "img": null}, {"tema": 8, "q": "¿En cuál de estos casos puede un menor de 1,20 m, con su sistema de retención adecuado, viajar en el asiento delantero de un turismo?", "opts": ["Cuando el menor ya ha cumplido los siete años de edad", "Cuando todos los traseros ya están ocupados por otros menores", "Cuando el trayecto es corto y transcurre únicamente por vías urbanas"], "a": 1, "expl": "El asiento delantero solo es posible, con retención adecuada, si no hay asientos traseros, si todos están ya ocupados por menores obligados o si no caben todos los sistemas de retención.", "fuente": "RGC art. 117.3 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Al circular detrás de otro vehículo, ¿qué circunstancias debe tener en cuenta especialmente el conductor para dejar el espacio libre necesario?", "opts": ["La hora del día y el número de ocupantes de ambos vehículos", "El tamaño y el color del vehículo que le precede", "La velocidad y las condiciones de adherencia y frenado"], "a": 2, "expl": "El espacio entre vehículos debe permitir detenerse ante un frenado brusco sin colisionar, teniendo en cuenta la velocidad y las condiciones de adherencia y frenado.", "fuente": "RGC art. 54.1", "img": null}, {"tema": 8, "q": "Has cambiado a luz de cruce para cruzarte con otro vehículo. ¿Cuándo puedes volver a utilizar la luz de carretera?", "opts": ["Cuando hayas rebasado en el cruce la posición del otro vehículo", "En cuanto te encuentres a más de 50 metros del otro vehículo", "Cuando el otro conductor haya apagado también su luz de carretera"], "a": 0, "expl": "No se restablece el alumbrado de carretera hasta rebasar, en el cruce, la posición del vehículo cruzado, aunque el otro conductor no cumpla la norma.", "fuente": "RGC art. 102.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "¿Cuándo debe medirse la presión de los neumáticos para obtener un valor fiable?", "opts": ["Solo en el taller, con el motor en marcha", "Con los neumáticos calientes, justo tras un trayecto largo", "Con los neumáticos fríos, usando un manómetro calibrado"], "a": 2, "expl": "La presión se revisa con manómetro calibrado, en frío y con regularidad (una vez al mes), según la presión recomendada por el fabricante.", "fuente": "DGT Revista, Las reglas de oro del mantenimiento del neumático (https://revista.dgt.es/es/motor/noticias/2016/0613Consejos-mantenimiento-neumaticos.shtml)", "img": null}, {"tema": 8, "q": "¿Cuál es la afirmación correcta sobre hablar por teléfono con un sistema de manos libres mientras se conduce?", "opts": ["Está permitido, pero reduce notablemente la concentración del conductor", "Solo reduce la concentración en conductores mayores de 65 años", "Es tan seguro como no hablar, porque no se usan las manos"], "a": 0, "expl": "El manos libres es legal, pero la DGT advierte de que, aun usándolo, la capacidad de concentración ante el volante se pierde en gran medida.", "fuente": "Ley de Tráfico art. 13.3 (permiso del uso sin manos ni auriculares) y DGT, Distracciones al volante (https://www.dgt.es/export/sites/web-DGT/.galleries/downloads/conoce_la_dgt/que-hacemos/educacion-vial/adultos/no-formal/Distracciones_al_volante.pdf)", "img": null}, {"tema": 8, "q": "En una frenada de emergencia con ABS notas vibraciones en el pedal. ¿Qué debes hacer?", "opts": ["Soltar y volver a pisar el pedal para evitar que se bloquee", "Mantener el pedal a fondo y el volante firme y recto", "Aflojar la presión hasta que cese la vibración del pedal"], "a": 1, "expl": "La vibración es normal en vehículos con ABS: hay que pisar el freno a fondo, mantener la presión y sujetar el volante con firmeza y recto.", "fuente": "DGT, noticia 'Cómo reaccionar a subvirajes, sobrevirajes y frenadas de emergencia' (20/07/2026)", "img": null}, {"tema": 8, "q": "En un túnel con circulación en ambos sentidos, ¿cuándo se puede adelantar sin invadir el sentido contrario?", "opts": ["Cuando el vehículo precedente circule a menos de 60 km/h", "Siempre que no se aproxime ningún vehículo en sentido contrario", "Solo si existe más de un carril para su sentido de circulación"], "a": 2, "expl": "En túneles con circulación en ambos sentidos el adelantamiento está prohibido, salvo que haya más de un carril para el sentido propio.", "fuente": "RGC art. 95.6 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Si es inexcusable realizar una operación de carga o descarga en la vía, ¿cómo debe efectuarse, en lo posible?", "opts": ["Depositando la mercancía en el arcén hasta terminar la operación", "Por el lado más próximo al centro de la calzada para ganar tiempo", "Por el lado más cercano al borde de la calzada, sin peligros"], "a": 2, "expl": "Las operaciones de carga y descarga se hacen fuera de la vía; si no, por el lado más próximo al borde de la calzada, y queda prohibido depositar mercancía en calzada, arcén y zonas peatonales.", "fuente": "RGC art. 16 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Un coche con detector de fatiga muestra una taza humeante en el salpicadero. ¿Qué debe hacer el conductor?", "opts": ["Ignorarlo si todavía no se siente cansado", "Parar en cuanto pueda hacerlo con seguridad para descansar", "Seguir con normalidad, pues el aviso indica un fallo del sistema"], "a": 1, "expl": "El detector de fatiga avisa de que el conductor pierde la concentración (con un mensaje, una taza humeante o vibraciones) para que pare a descansar.", "fuente": "DGT, Sistemas avanzados de ayuda a la conducción (ADAS) (https://www.dgt.es/muevete-con-seguridad/sistemas-avanzados-ayuda-conduccion/Sistemas-avanzados-de-ayuda-a-la-conduccion-ADAS-/)", "img": null}, {"tema": 8, "q": "Para conducir de forma eficiente y ahorrar combustible, ¿qué se recomienda respecto a la velocidad?", "opts": ["Mantenerla lo más uniforme posible, con anticipación", "Circular en marchas cortas con el motor muy revolucionado", "Alternar acelerones y frenadas para aprovechar la inercia"], "a": 0, "expl": "La conducción eficiente (IDAE) recomienda mantener la velocidad lo más uniforme posible, con previsión y anticipación, usando más las marchas largas.", "fuente": "IDAE-EREN, guía de conducción eficiente (recogida por MITECO, 2009)", "img": null}, {"tema": 8, "q": "Según las recomendaciones de la DGT, ¿cómo debe ser la distancia de seguridad en calzada mojada por lluvia respecto a la de calzada seca?", "opts": ["La misma, si los neumáticos están en buen estado", "Algo menor, pues se circula más despacio", "Aproximadamente el doble"], "a": 2, "expl": "La DGT recomienda duplicar la distancia de seguridad con lluvia, porque aumenta la distancia de frenado al disminuir la adherencia.", "fuente": "DGT, Operación Especial Constitución-Inmaculada 2023, Consejos y normas de seguridad vial, ap. 4.7 Lluvia", "img": null}, {"tema": 8, "q": "Circulas de noche con la luz de carretera y otro vehículo te sigue de cerca. ¿Qué debes hacer?", "opts": ["Apagar todo el alumbrado unos segundos para que pueda adelantarte", "Cambiar a la luz de cruce para no deslumbrarle por el retrovisor", "Mantenerla, pues solo hay que cambiarla ante vehículos que vienen de frente"], "a": 1, "expl": "La luz de largo alcance debe sustituirse por la de cruce también respecto a vehículos del mismo sentido cuyos conductores puedan ser deslumbrados a través del espejo retrovisor.", "fuente": "RGC art. 102.2 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "El semáforo situado en la boca de un túnel no permite el paso. ¿Quién puede penetrar en él?", "opts": ["Los turismos de menos de 3.500 kg, reduciendo la velocidad", "Cualquier vehículo, si no se aprecia tráfico en sentido contrario", "Solo los equipos de urgencia, asistencia mecánica y conservación"], "a": 2, "expl": "Ningún usuario debe penetrar en un túnel si el semáforo de su boca no le permite el paso, salvo los equipos de servicios de urgencia, asistencia mecánica y conservación de carreteras.", "fuente": "RGC art. 96.3 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Un turismo de tracción delantera monta cadenas para circular por nieve. ¿En qué ruedas se colocan?", "opts": ["En las delanteras, que son las que traccionan", "En las cuatro, siendo obligatorio en cualquier caso", "En las traseras, para mejorar la estabilidad"], "a": 0, "expl": "Las cadenas se montan en las ruedas motrices; en un vehículo de tracción delantera, en las delanteras, y deben ser de la medida del neumático.", "fuente": "DGT, Hielo y nieve: con la adherencia al límite (https://www.dgt.es/comunicacion/noticias/hielo-y-nieve-con-la-adherencia-al-limite/)", "img": null}, {"tema": 8, "q": "Según el Reglamento General de Circulación, con niebla densa que reduce mucho la visibilidad, ¿a qué velocidad debe circular el conductor?", "opts": ["A la que le permita detenerse dentro de su campo de visión", "A la mitad del límite de la vía, sea cual sea la visibilidad", "A la velocidad máxima de la vía, si lleva las antiniebla encendidas"], "a": 0, "expl": "La velocidad debe adecuarse a las circunstancias (visibilidad, meteorología, estado de la vía) de forma que siempre pueda detenerse dentro del campo de visión.", "fuente": "RGC art. 45 (adecuación de la velocidad a las circunstancias); art. 46.1.k", "img": null}, {"tema": 8, "q": "Te aproximas a un peatón anciano que cruza con evidente dificultad. ¿Qué debes hacer?", "opts": ["Rebasarle rápidamente por detrás para no entorpecerle", "Adoptar precauciones y moderar la velocidad o detenerte si es preciso", "Mantener la velocidad y avisarle con el claxon para que se apresure"], "a": 1, "expl": "Ante niños, ancianos u otras personas manifiestamente impedidas hay que extremar las precauciones y circular a velocidad moderada, deteniéndose si hace falta.", "fuente": "RGC art. 17.1 y 46.1.a (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "¿Qué efectos de los ansiolíticos influyen negativamente en la conducción?", "opts": ["Mayor agudeza visual y reflejos más rápidos", "Ninguno, porque solo actúan sobre el estado de ánimo", "Somnolencia y disminución de la atención y de la capacidad de reacción"], "a": 2, "expl": "Los ansiolíticos producen somnolencia, menor atención y menor capacidad de reacción, lo que aumenta el riesgo de accidente.", "fuente": "RACE, Medicamentos que afectan a la conducción (https://www.race.es/medicamentos-afectan-conduccion)", "img": null}, {"tema": 8, "q": "¿Cómo debe regularse el reposacabezas de un turismo?", "opts": ["Con su centro a la altura de la parte trasera de la cabeza", "Subido al máximo, por encima de la cabeza, para apoyarla al viajar", "Bajado del todo, a la altura de los hombros, para ver mejor atrás"], "a": 0, "expl": "El reposacabezas es un elemento de seguridad, no de confort: la parte trasera de la cabeza debe quedar sobre su centro.", "fuente": "DGT citada por Motorpasión (https://www.motorpasion.com/seguridad/dgt-indica-cual-postura-correcta-al-volante-para-evitar-lesiones-temido-efecto-submarino) y DGT, En coche", "img": null}, {"tema": 8, "q": "Según la conducción eficiente, ¿qué efecto tiene llevar objetos innecesarios en el portaequipajes o la baca?", "opts": ["Reduce el consumo porque estabiliza el vehículo a alta velocidad", "No influye en el consumo si se circula a velocidad constante", "Aumenta peso y resistencia aerodinámica, y con ello el consumo"], "a": 2, "expl": "Los objetos innecesarios añaden peso y las baca y accesorios exteriores aumentan la resistencia aerodinámica, por lo que sube el consumo.", "fuente": "IDAE-EREN, guía de conducción eficiente (recogida por MITECO, 2009)", "img": null}, {"tema": 8, "q": "¿Por qué son especialmente peligrosos los microsueños al volante?", "opts": ["Porque solo se producen tras conducir más de diez horas seguidas", "Porque aparecen únicamente en vías sin tráfico, por la monotonía", "Porque suelen pasar completamente inadvertidos para el conductor"], "a": 2, "expl": "Los microsueños son uno de los efectos más negativos de la somnolencia y suelen pasar completamente inadvertidos.", "fuente": "DGT, Conducir con sueño o cansancio (https://www.dgt.es/muevete-con-seguridad/evita-conductas-de-riesgo/Conducir-con-sueno-o-cansancio)", "img": null}, {"tema": 8, "q": "Un turismo con cinturones instalados en todas sus plazas hace un trayecto corto por ciudad. ¿Quién debe llevarlo abrochado?", "opts": ["Todos los ocupantes, tanto en vías urbanas como interurbanas", "Los ocupantes de las plazas traseras solo en vías interurbanas", "Solo el conductor y el acompañante, al ser un trayecto urbano"], "a": 0, "expl": "La obligación afecta al conductor y a todos los ocupantes, tanto en vías urbanas como interurbanas, si el vehículo tiene cinturones instalados.", "fuente": "RGC art. 117.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Te aproximas a una intersección señalizada en la que no tienes prioridad y la visibilidad es prácticamente nula. ¿Qué velocidad no debes exceder?", "opts": ["50 km/h", "60 km/h", "40 km/h"], "a": 0, "expl": "En intersecciones debidamente señalizadas con visibilidad prácticamente nula, la velocidad no deberá exceder de 50 km/h.", "fuente": "RGC art. 46.1.h (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "En una curva, el coche tiende a seguir recto aunque se gire el volante (subviraje). ¿Qué debe hacer el conductor?", "opts": ["Soltar suavemente el acelerador y no girar más el volante", "Frenar a fondo y bruscamente para recuperar la adherencia de las ruedas", "Girar más el volante para cerrar la trayectoria de la curva"], "a": 0, "expl": "Ante un subviraje se reduce la velocidad soltando el acelerador con suavidad, sin girar más el volante, y sin frenar bruscamente.", "fuente": "DGT, noticia 'Cómo reaccionar a subvirajes, sobrevirajes y frenadas de emergencia' (20/07/2026)", "img": null}, {"tema": 8, "q": "Circulas con un turismo por un túnel y no vas a adelantar. ¿Qué separación mínima debes mantener con el vehículo precedente?", "opts": ["Un mínimo de 50 metros o de tres segundos de intervalo", "Un mínimo de 150 metros o de seis segundos de intervalo", "Un mínimo de 100 metros o de cuatro segundos"], "a": 2, "expl": "En túneles, sin intención de adelantar, la separación mínima es de 100 metros o cuatro segundos; 150 m o seis segundos solo para vehículos de más de 3.500 kg.", "fuente": "RGC art. 95.6 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Según la DGT, ¿cómo afecta al riesgo de sufrir un accidente usar el móvil mientras se conduce?", "opts": ["Lo duplica solo si se escribe", "Lo multiplica por cuatro", "Lo aumenta únicamente de noche"], "a": 1, "expl": "La DGT indica que el uso del móvil al volante multiplica por cuatro el riesgo de accidente, comparable al de conducir con exceso de alcohol.", "fuente": "DGT, nota de prensa campaña distracciones (septiembre 2021)", "img": null}, {"tema": 8, "q": "Si el vehículo sufre aquaplaning al atravesar una zona con agua acumulada, ¿cuál es la actuación correcta?", "opts": ["Acelerar con decisión para que los neumáticos recuperen el agarre", "Volante firme, soltar suavemente el acelerador y no frenar bruscamente", "Frenar a fondo para detener el vehículo cuanto antes y recuperar el control"], "a": 1, "expl": "En aquaplaning los neumáticos pierden contacto con el asfalto; hay que mantener la dirección recta, soltar suavemente el acelerador y evitar frenar bruscamente.", "fuente": "DGT, Consejos Operación Especial 2023 (ap. 4.7 Lluvia) y RACE, Aquaplaning", "img": null}, {"tema": 8, "q": "¿Para qué sirve el sistema ISA (asistente inteligente de velocidad) de un vehículo?", "opts": ["Para ayudar al conductor a respetar el límite de velocidad de la vía", "Para avisar cuando el coche se sale del carril sin usar el intermitente", "Para mantener automáticamente la distancia con el vehículo precedente"], "a": 0, "expl": "El ISA ayuda a respetar el límite de velocidad y adapta la marcha a la señalización de la vía; el aviso de salida de carril es otro sistema (LDW).", "fuente": "DGT, Sistemas avanzados de ayuda a la conducción (ADAS) (https://www.dgt.es/muevete-con-seguridad/sistemas-avanzados-ayuda-conduccion/Sistemas-avanzados-de-ayuda-a-la-conduccion-ADAS-/)", "img": null}, {"tema": 8, "q": "Un vehículo tiene activados sistemas de ayuda a la conducción. ¿Debe el conductor mantener la atención permanente?", "opts": ["Sí, la obligación de atención permanente sigue siendo suya", "Solo en vías urbanas, pues en carretera los sistemas lo sustituyen", "No, mientras estén activados puede dedicar su atención a otras tareas"], "a": 0, "expl": "Las ayudas a la conducción (ADAS) apoyan al conductor pero no lo sustituyen: debe mantener en todo momento la atención permanente a la conducción.", "fuente": "RGC art. 18.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Según el IDAE, en una parada que se prevé superior a cierto tiempo conviene apagar el motor. ¿A partir de cuánto?", "opts": ["Más de 5 segundos seguidos", "Más de 10 minutos seguidos", "Más de 60 segundos"], "a": 2, "expl": "La guía de conducción eficiente recomienda parar el motor en detenciones previstas de más de 60 segundos, para no gastar combustible en ralentí.", "fuente": "IDAE, Manual de conducción eficiente para vehículos turismo, ap. 5.7 (ed. EVE/IDAE)", "img": null}, {"tema": 8, "q": "Un turismo queda inmovilizado en un túnel por una avería de emergencia. ¿Qué debe hacer el conductor nada más detenerse?", "opts": ["Apagar el motor y todas las luces para evitar un cortocircuito", "Dejar el motor en marcha y encender las luces de cruce y de carretera", "Apagar el motor, conectar la señal de emergencia y mantener encendidas las luces de posición"], "a": 2, "expl": "Ante una inmovilización por emergencia en un túnel se apaga el motor, se conecta la señal de emergencia y se mantienen encendidas las luces de posición.", "fuente": "RGC art. 97.3.a) (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Se declara un incendio en tu vehículo dentro de un túnel. ¿Qué debes hacer tras apagar el motor?", "opts": ["Cerrar las puertas con llave y dirigirte al refugio en el sentido del fuego", "Dejar la llave puesta y las puertas abiertas y alejarte del fuego a pie", "Llevarte la llave y esperar dentro del vehículo la llegada de los bomberos"], "a": 1, "expl": "En caso de incendio: acercar el vehículo a la derecha, apagar el motor, dejar la llave puesta y las puertas abiertas, y dirigirse al refugio o salida más próximos en sentido contrario al del fuego.", "fuente": "RGC art. 97.3, último apartado (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Según la DGT, ¿en qué medida pueden reducir los sistemas de retención infantil el riesgo de muerte o lesiones graves?", "opts": ["Entre un 55 % y un 60 %", "Entre un 90 % y un 95 %", "Entre un 15 % y un 20 %, según el modelo"], "a": 0, "expl": "La DGT señala que los sistemas de retención infantil pueden reducir entre un 55 % y un 60 % el riesgo de muerte o lesiones graves.", "fuente": "DGT, nota de prensa campaña cinturón y SRI (9 marzo 2026)", "img": null}, {"tema": 8, "q": "Un conductor toma un medicamento recetado que le produce mucha somnolencia. ¿Puede conducir?", "opts": ["No, mientras su efecto le impida circular sin peligro", "Sí, porque la receta médica le autoriza a conducir en cualquier caso", "Sí, siempre que no supere la tasa de alcohol permitida"], "a": 0, "expl": "Los medicamentos bajo cuyo efecto se altere el estado físico o mental apropiado para circular sin peligro impiden conducir.", "fuente": "RGC art. 27.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Un vehículo queda inmovilizado en un túnel por una retención, sin avería ni incendio. ¿Qué deben hacer el conductor y los pasajeros?", "opts": ["Salir del vehículo y caminar por la calzada hasta la salida más cercana", "Salir y esperar junto al vehículo, apoyados en la pared del túnel", "No abandonar el vehículo y detenerse lo más lejos del precedente"], "a": 2, "expl": "Si la inmovilización es por necesidades de la circulación, no se debe abandonar el vehículo: se conecta temporalmente la señal de emergencia, se mantienen las luces de posición y se apaga el motor.", "fuente": "RGC art. 97.3, último párrafo (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Si el tiempo de reacción no cambia y se duplica la velocidad, ¿qué ocurre con la distancia de reacción?", "opts": ["Se cuadruplica aproximadamente", "Se duplica aproximadamente", "Se mantiene prácticamente igual"], "a": 1, "expl": "La distancia de reacción es la recorrida durante el tiempo de reacción a velocidad constante, así que crece de forma proporcional a la velocidad (la de frenado crece más deprisa).", "fuente": "DGT Revista, Velocidad y riesgo al frenar (https://revista.dgt.es/es/reportajes/2020/09SEPTIEMBRE/0922-Excesos-velocidad-distancia-detencion-y-mantenimiento.shtml)", "img": null}, {"tema": 8, "q": "Con niebla muy cerrada y sin avería, ¿qué se aconseja respecto a detenerse en el arcén?", "opts": ["Hacerlo y apagar las luces para no deslumbrar", "Evitarlo, porque supone un peligro añadido para otros vehículos", "Hacerlo siempre que la visibilidad sea escasa, con las luces de posición"], "a": 1, "expl": "La DGT advierte de que pararse en el arcén con niebla cerrada es una de las peores ideas por el peligro que entraña.", "fuente": "DGT, Niebla: visibilidad bajo mínimos (https://www.dgt.es/comunicacion/noticias/niebla-visibilidad-bajo-minimos/)", "img": null}, {"tema": 8, "q": "Circulas con fuertes rachas de viento. ¿Cómo conviene sujetar el volante?", "opts": ["Con firmeza, con las dos manos", "Con holgura, dejando que el viento lo mueva ligeramente", "Con una sola mano, para corregir la trayectoria con rapidez"], "a": 0, "expl": "Con rachas fuertes hay que sujetar con firmeza el volante con las dos manos y evitar movimientos bruscos.", "fuente": "DGT, Conducir con el viento en contra (https://www.dgt.es/comunicacion/noticias/conducir-con-el-viento-en-contra/)", "img": null}, {"tema": 8, "q": "Antes de empezar un viaje largo, ¿qué conviene evitar para prevenir la somnolencia al volante?", "opts": ["Las comidas abundantes antes de conducir", "Programar paradas de descanso en el recorrido", "Dormir bien la noche anterior a salir de viaje"], "a": 0, "expl": "La DGT recomienda descansar bien, evitar alcohol y drogas y moderar las comidas abundantes y ciertos medicamentos antes de conducir.", "fuente": "DGT, Conducir con sueño o cansancio (dgt.es)", "img": null}, {"tema": 8, "q": "Al circular por una placa de hielo, el vehículo pierde adherencia. ¿Qué debe hacer el conductor?", "opts": ["Girar el volante con decisión para salir de la placa", "Levantar el pie del acelerador y no frenar hasta recuperar la adherencia", "Frenar a fondo para detenerse cuanto antes"], "a": 1, "expl": "Sobre hielo hay que soltar el acelerador sin frenar hasta recuperar adherencia, y corregir la trayectoria con suavidad.", "fuente": "DGT, Hielo y nieve: con la adherencia al límite (https://www.dgt.es/comunicacion/noticias/hielo-y-nieve-con-la-adherencia-al-limite/)", "img": null}, {"tema": 8, "q": "Si la velocidad de un vehículo se duplica, ¿qué ocurre con la energía que se libera en un choque?", "opts": ["Se multiplica por ocho aproximadamente", "Se multiplica por cuatro", "Se duplica"], "a": 1, "expl": "La energía cinética es proporcional al cuadrado de la velocidad (Ec = 1/2·m·v²): al duplicar la velocidad se multiplica por cuatro.", "fuente": "Física elemental, divulgada por la DGT (energía cinética)", "img": null}, {"tema": 8, "q": "¿Cuál es la profundidad mínima legal del dibujo en las ranuras principales de la banda de rodadura de los neumáticos de un turismo?", "opts": ["0,6 mm", "3 mm", "1,6 mm"], "a": 2, "expl": "El Reglamento General de Vehículos exige como mínimo 1,6 mm de profundidad en las ranuras principales de la banda de rodadura en turismos (categoría M1).", "fuente": "RGV (RD 2822/1998), Anexo VII, ap. 2", "img": null}, {"tema": 8, "q": "¿Qué condición debe cumplir la carga transportada en un vehículo?", "opts": ["Evitar el ruido, aunque pueda desplazarse un poco en las curvas", "No poder desplazarse peligrosamente ni comprometer la estabilidad", "Poder tapar la placa de matrícula trasera si va perfectamente sujeta"], "a": 1, "expl": "La carga debe ir dispuesta y, si es preciso, sujeta de modo que no pueda desplazarse de manera peligrosa ni comprometer la estabilidad, ni ocultar luces o placas.", "fuente": "RGC art. 14.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Según el IDAE, para decelerar sin frenar al acercarse a una detención, ¿qué conviene hacer?", "opts": ["Reducir de marcha cuanto antes y mantener el motor revolucionado", "Poner punto muerto y dejar rodar el vehículo para ahorrar combustible", "Levantar el pie del acelerador y dejar rodar con la marcha engranada"], "a": 2, "expl": "En conducción eficiente se levanta el pie del acelerador y se deja rodar con la marcha engranada, reduciendo de marcha lo más tarde posible.", "fuente": "IDAE, 10 reglas de oro de la conducción eficiente (https://www.idae.es/movilidad-sostenible/10-reglas-de-oro-de-la-conduccion-eficiente)", "img": null}, {"tema": 9, "q": "Una persona vende su turismo y no notifica la transmisión a Tráfico. ¿Qué ocurre a efectos de la normativa de tráfico?", "opts": ["Sigue siendo titular hasta que se inscriba a nombre del comprador", "La titularidad pasa al comprador desde que éste paga el precio", "Deja de ser titular desde la fecha firmada en el contrato de venta"], "a": 0, "expl": "Si el transmitente no notifica, sigue considerado titular mientras el vehículo no se inscriba a nombre de otra persona.", "fuente": "RGV art. 32.1", "img": null}, {"tema": 9, "q": "¿Qué dotación obligatoria establece el Reglamento General de Vehículos para una motocicleta?", "opts": ["Un chaleco reflectante de alta visibilidad", "Un extintor homologado y un triángulo de preseñalización", "Un dispositivo V-16 y un extintor de bolsillo"], "a": 0, "expl": "Para las motocicletas el anexo XII solo exige un chaleco reflectante de alta visibilidad.", "fuente": "RGV anexo XII, apartado 3", "img": null}, {"tema": 9, "q": "Un turismo con ITV desfavorable por un defecto grave se presenta a la segunda inspección fuera del plazo de dos meses concedido. ¿Qué inspección se realiza?", "opts": ["Solo se revisan los elementos que presentaban el defecto grave", "Una inspección técnica completa del vehículo", "Una inspección parcial, con un recargo en la tasa por el retraso"], "a": 1, "expl": "Si se supera el plazo concedido para reparar, hay que repetir una inspección técnica completa, sin perjuicio de las posibles sanciones.", "fuente": "RD 920/2017 (ITV), art. 11.4", "img": null}, {"tema": 9, "q": "Se enciende un testigo de color ámbar (amarillo) en el cuadro de instrumentos. ¿Qué indica con carácter general?", "opts": ["Que un elemento debe revisarse al detener el vehículo", "Un fallo grave que obliga a apagar el motor de forma inmediata", "Una información de funcionamiento normal que no requiere ninguna acción"], "a": 0, "expl": "Los testigos amarillos indican que el elemento afectado debe revisarse al detener el vehículo; los rojos exigen actuar sin demora y los verdes solo informan.", "fuente": "Mapfre Motor, \"Significado de los testigos del coche\" (https://www.motor.mapfre.es/consejos-practicos/consejos-de-mantenimiento/testigos-luminosos-coche/)", "img": null}, {"tema": 9, "q": "Una persona de un país no perteneciente a la UE conduce en España con su permiso extranjero válido y fija aquí su residencia normal. ¿Hasta cuándo puede seguir conduciendo con él, salvo convenio específico?", "opts": ["Mientras el permiso siga vigente en su país de origen", "Un año desde que adquiere la residencia en España", "Seis meses como máximo desde que fija su residencia"], "a": 2, "expl": "Pasados seis meses desde la residencia normal, esos permisos carecen de validez y hay que obtener el permiso español (o canjearlo, si procede).", "fuente": "RGC (Conductores) art. 21.2.c y 21.3", "img": null}, {"tema": 9, "q": "¿Qué anchura máxima, incluida la carga, puede tener como regla general un vehículo para circular?", "opts": ["2,70 metros", "2,55 metros", "2,40 metros"], "a": 1, "expl": "La anchura máxima autorizada como regla general es de 2,55 m; solo ciertos vehículos acondicionados o especiales pueden llegar a 2,60 m.", "fuente": "Reglamento General de Vehículos, Anexo IX, Tabla 3", "img": null}, {"tema": 9, "q": "El titular de un vehículo cambia de domicilio, sin que cambie la titularidad del vehículo. ¿De qué plazo dispone para comunicarlo a la Jefatura de Tráfico para renovar el permiso de circulación?", "opts": ["Seis meses desde que se produjo el cambio", "Tres meses desde que se produjo el cambio", "Quince días desde que se produjo el cambio"], "a": 2, "expl": "El cambio de nombre, apellidos o domicilio del titular que no modifica la titularidad registral debe comunicarse en quince días desde que se produce, para renovar el permiso de circulación.", "fuente": "Reglamento General de Vehículos (RD 2822/1998), art. 30.2", "img": null}, {"tema": 9, "q": "¿Cómo puede acreditar el conductor ante un agente que dispone de la autorización administrativa para circular?", "opts": ["Mediante su presentación física o digital", "Únicamente mediante la presentación del documento original en papel", "Solo con una fotocopia simple, aunque no esté cotejada ni sellada"], "a": 0, "expl": "La tenencia de la autorización administrativa puede acreditarse tanto mostrando el documento físico como su versión digital.", "fuente": "Ley de Tráfico (RDL 6/2015), art. 59.1", "img": null}, {"tema": 9, "q": "¿Qué caracteriza a un híbrido enchufable (PHEV)?", "opts": ["No puede circular nunca solo con el motor eléctrico", "Puede recargar su batería desde la red eléctrica", "Solo carga su batería con el motor térmico y las frenadas"], "a": 1, "expl": "Los híbridos enchufables pueden recargarse desde la red eléctrica y ofrecen más autonomía eléctrica si se recargan con regularidad.", "fuente": "Revista DGT, \"El misterio de los vehículos híbridos\" (23/03/2026), https://revista.dgt.es/es/motor/tecnologia-seguridad/2026/0323_277_vehiculo_al_dia.shtml", "img": null}, {"tema": 9, "q": "Un turismo de hasta 3.500 kg de MMA opta por neumáticos para cumplir una restricción de movilidad invernal. ¿Cuáles debe equipar?", "opts": ["Neumáticos certificados 3PMSF en todos sus ejes", "Neumáticos con marcado M+S solo en el eje motor", "Neumáticos con cualquier dibujo mientras superen los 3 mm de profundidad"], "a": 0, "expl": "Para vehículos de MMA ≤ 3.500 kg, la conformidad con las restricciones de movilidad invernal exige neumáticos certificados 3PMSF (montaña de tres picos con copo) en todos sus ejes.", "fuente": "Reglamento General de Vehículos, Anexo VII, apartado 5", "img": null}, {"tema": 9, "q": "¿Con qué periodicidad debe pasar la ITV un turismo de uso particular con doce años desde su primera matriculación?", "opts": ["Cada año", "Cada dos años", "Cada seis meses"], "a": 0, "expl": "A partir de más de 10 años de antigüedad, la frecuencia de la ITV de los turismos es anual.", "fuente": "RD 920/2017 inspección técnica de vehículos, texto consolidado BOE, art. 6.1", "img": null}, {"tema": 9, "q": "Un conductor causa un accidente y resulta herido. ¿Cubre sus lesiones el seguro obligatorio de responsabilidad civil?", "opts": ["No, el seguro obligatorio no cubre las lesiones del conductor causante", "Sí, siempre que llevara abrochado el cinturón y no diera positivo en alcohol", "Sí, hasta el límite legal, igual que las de los demás ocupantes del vehículo"], "a": 0, "expl": "La cobertura del seguro de suscripción obligatoria no alcanza a las lesiones o el fallecimiento del conductor del vehículo causante del accidente.", "fuente": "RDL 8/2004 (seguro obligatorio), art. 5.1", "img": null}, {"tema": 9, "q": "¿En qué caso se permite circular con láminas adhesivas o cortinillas contra el sol en las ventanillas posteriores?", "opts": ["Si lleva dos espejos retrovisores exteriores que cumplan lo exigido", "Solo si circula de día, en vía urbana y con buena visibilidad", "Si lleva el retrovisor interior y un solo espejo retrovisor exterior"], "a": 0, "expl": "Solo se permiten en las ventanillas posteriores cuando el vehículo lleva dos espejos retrovisores exteriores con las especificaciones técnicas necesarias.", "fuente": "RGC art. 19.1", "img": null}, {"tema": 9, "q": "Un turismo sufre en un accidente un daño importante en la dirección y en los frenos. ¿Qué se exige antes de ponerlo de nuevo en circulación?", "opts": ["Bastará con repararlo en un taller y comunicarlo a la aseguradora", "Presentarlo a inspección técnica que dictamine su aptitud para circular", "La inspección solo es necesaria si la aseguradora la pide al tasar los daños"], "a": 1, "expl": "Si el accidente daña elementos de seguridad como dirección, suspensión, transmisión o frenado, el vehículo debe presentarse a inspección antes de su nueva puesta en circulación.", "fuente": "RD 920/2017 (ITV), art. 6.7.a)", "img": null}, {"tema": 9, "q": "Un turismo de uso particular fue matriculado por primera vez hace tres años. ¿Debe pasar ya la inspección técnica periódica?", "opts": ["Sí, debe pasarla cada año desde su primera matriculación", "No, los turismos están exentos hasta superar los cuatro años", "Sí, debe pasarla cada dos años desde su primera matriculación"], "a": 1, "expl": "En la tabla de periodicidad, los turismos (M1) están exentos hasta los 4 años; después, bienal, y anual a partir de los 10.", "fuente": "RD 920/2017 inspección técnica de vehículos, texto consolidado BOE, art. 6.1", "img": null}, {"tema": 9, "q": "Se compra un turismo cuya ITV está caducada. ¿Qué hace la Jefatura de Tráfico al tramitar el cambio de titularidad?", "opts": ["Renueva el permiso a nombre del comprador y le concede un año para pasar la ITV", "Rechaza anotar el cambio de titular mientras el vehículo no pase la inspección", "Anota el cambio, pero no renueva el permiso hasta que la ITV sea favorable"], "a": 2, "expl": "Si el vehículo no está al corriente de la ITV, la Jefatura anota el cambio de titular en el Registro, pero no renueva el permiso de circulación hasta que se acredite una revisión favorable.", "fuente": "Reglamento General de Vehículos, art. 32.7", "img": null}, {"tema": 9, "q": "¿En qué consiste la frenada regenerativa de los vehículos eléctricos e híbridos?", "opts": ["La batería se descarga para frenar más rápido en las frenadas de emergencia", "El motor eléctrico genera electricidad al frenar y la guarda en la batería", "Las pastillas de freno recuperan energía y la devuelven al motor de combustión"], "a": 1, "expl": "En la frenada regenerativa el motor eléctrico actúa como generador y transforma la energía cinética de la frenada en energía eléctrica, que se almacena en la batería.", "fuente": "Revista DGT, \"¿Qué es y cómo funciona la frenada regenerativa?\" (14/03/2023), https://revista.dgt.es/es/motor/tecnologia-seguridad/2023/0314-VAD-Sistemas-recuperacion-energia-frenada.shtml", "img": null}, {"tema": 9, "q": "El titular de un turismo obtiene un duplicado del permiso de circulación extraviado y después aparece el original. ¿Qué ocurre?", "opts": ["El original quedó anulado al expedirse el duplicado y debe destruirse", "El duplicado queda anulado y vuelve a ser válido el documento original", "Puede usar indistintamente el original o el duplicado, pues ambos son válidos"], "a": 0, "expl": "La expedición del duplicado anula por sí sola el original; si se recupera después, se procede a su inmediata destrucción.", "fuente": "Reglamento General de Vehículos, art. 30.1", "img": null}, {"tema": 9, "q": "¿Qué indica, con carácter general, un testigo de color rojo en el cuadro de instrumentos?", "opts": ["Que el elemento solo debe revisarse en la próxima visita periódica al taller mecánico", "Que el sistema está activado y funciona con normalidad, sin avería alguna", "Que requiere atención inmediata: conviene parar cuanto antes de forma segura"], "a": 2, "expl": "Los testigos rojos indican una anomalía grave que requiere atención inmediata; los amarillos, que el elemento debe revisarse al detener el vehículo; los verdes son meramente informativos.", "fuente": "Mapfre Motor, \"Significado de los testigos del coche\" (https://www.motor.mapfre.es/consejos-practicos/consejos-de-mantenimiento/testigos-luminosos-coche/)", "img": null}, {"tema": 9, "q": "¿Cuál de estos vehículos debe llevar, como dotación obligatoria, un equipo homologado de extinción de incendios?", "opts": ["Un turismo de cinco plazas destinado a uso particular", "Una furgoneta de mercancías de 3.000 kg de masa máxima autorizada", "Un camión de mercancías de 7.500 kg de masa máxima autorizada"], "a": 2, "expl": "El anexo XII exige extintor a autobuses y a mixtos y camiones de más de 3.500 kg de MMA, no a turismos ni a vehículos de hasta 3.500 kg.", "fuente": "RGV anexo XII, apartado 2", "img": null}, {"tema": 9, "q": "¿Qué debe acreditarse como condición previa a la realización de cualquier inspección técnica de un vehículo?", "opts": ["El seguro obligatorio del vehículo", "La ausencia de multas de tráfico pendientes del titular", "Un informe del taller sobre el estado de los frenos y la dirección"], "a": 0, "expl": "La estación ITV exige acreditar el seguro obligatorio del vehículo antes de realizar cualquier inspección técnica.", "fuente": "RD 920/2017 (ITV), art. 8.3; Ley de Tráfico, art. 78.2", "img": null}, {"tema": 9, "q": "¿Debe llevar siempre un turismo una rueda de repuesto completa?", "opts": ["No, vale una rueda de uso temporal o un sistema alternativo suficiente", "Sí, es obligatorio llevar siempre una rueda completa, sin excepciones ni alternativas", "Sí, salvo en los turismos que tengan más de diez años de antigüedad"], "a": 0, "expl": "El anexo XII admite rueda completa, rueda de uso temporal con herramientas o un sistema alternativo que garantice la movilidad (respetando sus limitaciones).", "fuente": "RGV anexo XII, apartado 1.c", "img": null}, {"tema": 9, "q": "¿Está permitido el resculturado de los neumáticos de un turismo?", "opts": ["Sí, pero únicamente una vez durante la vida útil del neumático", "Sí, siempre que quede dibujo suficiente en todas las ranuras principales de la banda", "No, solo se permite en vehículos de más de 3,5 toneladas con neumáticos Regroovable"], "a": 2, "expl": "El resculturado no está permitido, salvo en neumáticos de vehículos de más de 3,5 toneladas de peso máximo autorizado marcados como Regroovable o con el símbolo correspondiente.", "fuente": "Reglamento General de Vehículos, Anexo VII, apartado 4", "img": null}, {"tema": 9, "q": "¿Con qué frecuencia envía la baliza V-16 la ubicación del vehículo a la plataforma de la DGT mientras permanece activada?", "opts": ["Cada 10 segundos", "Cada 10 minutos", "Cada 100 segundos"], "a": 2, "expl": "La V-16 comunica su activación, desactivación y geoposicionamiento; la ubicación se envía cada 100 segundos y deja de enviarse al comunicar la desactivación.", "fuente": "Reglamento General de Vehículos, Anexo XI, V-16, apartado 4", "img": null}, {"tema": 9, "q": "¿Con qué periodicidad debe pasar la ITV un turismo de uso particular que tiene siete años desde su primera matriculación?", "opts": ["Cada año", "Cada cuatro años", "Cada dos años"], "a": 2, "expl": "Entre más de 4 y 10 años de antigüedad, los turismos pasan la inspección con frecuencia bienal.", "fuente": "RD 920/2017 inspección técnica de vehículos, texto consolidado BOE, art. 6.1", "img": null}, {"tema": 9, "q": "¿Quién está obligado a suscribir y mantener en vigor el seguro obligatorio de responsabilidad civil de un turismo cuyo estacionamiento habitual está en España?", "opts": ["Únicamente el fabricante o el importador del vehículo", "El conductor que lo utilice, en cada trayecto que realice", "El propietario del vehículo, con un contrato por vehículo"], "a": 2, "expl": "La obligación recae sobre todo propietario de vehículos a motor con estacionamiento habitual en España.", "fuente": "RDL 8/2004 (seguro obligatorio), texto consolidado BOE, art. 2.1", "img": null}, {"tema": 9, "q": "Un conductor tiene el permiso B desde hace cuatro años y sin limitaciones. ¿Qué motocicletas puede conducir en España sin otro permiso?", "opts": ["Las del permiso A1, solo dentro del territorio nacional", "Cualquier motocicleta de hasta 35 kW de potencia", "Ninguna, el permiso B no autoriza a conducir motocicletas"], "a": 0, "expl": "Con más de tres años de antigüedad, el permiso B permite conducir en España las motocicletas de la clase A1 (hasta 125 cm³ y 11 kW).", "fuente": "RGC (Conductores) art. 4.2 (tabla, clase B)", "img": null}, {"tema": 9, "q": "¿Qué elemento de mantenimiento no necesita un coche eléctrico, a diferencia de uno de gasolina o diésel?", "opts": ["La revisión de los neumáticos", "El cambio del líquido de frenos", "El cambio del aceite del motor"], "a": 2, "expl": "Aceite del motor, filtros, embrague y bujías son propios de los motores de combustión; neumáticos, amortiguadores y frenos (incluido el líquido) también requieren mantenimiento en un eléctrico.", "fuente": "Revista DGT, \"Simple y económico\" (06/10/2020), https://revista.dgt.es/es/motor/tecnologia-seguridad/2020/1006-Mantenimiento-electricos.shtml", "img": null}, {"tema": 9, "q": "Un remolque de 1.200 kg de MMA no lleva sistema que asegure su frenado si se rompe el enganche. ¿Qué debe llevar además del enganche principal?", "opts": ["Una segunda rueda de repuesto del mismo tamaño que las del remolque", "Una señal V-4 de limitación de velocidad colocada en su parte posterior", "Un dispositivo de acoplamiento secundario, como una cadena o un cable"], "a": 2, "expl": "Los remolques de hasta 1.500 kg de MMA sin frenado automático ante la rotura del enganche deben llevar un acoplamiento secundario que impida que la barra toque el suelo.", "fuente": "Reglamento General de Vehículos, art. 13.4", "img": null}, {"tema": 9, "q": "¿Qué dotación obligatoria mínima debe llevar un turismo?", "opts": ["Extintor, chaleco reflectante y dos triángulos de preseñalización", "V-16, chaleco reflectante y rueda de repuesto o alternativa", "V-16, extintor y botiquín de primeros auxilios"], "a": 1, "expl": "La dotación de los turismos es: dispositivo luminoso V-16, chaleco reflectante de alta visibilidad y rueda de repuesto, rueda de uso temporal o sistema alternativo. El extintor solo se exige a vehículos más pesados y autobuses.", "fuente": "RGV anexo XII, apartado 1", "img": null}, {"tema": 9, "q": "¿Qué documentos del vehículo debe llevar y exhibir a los agentes el conductor de un turismo que circula sin remolque?", "opts": ["La tarjeta de inspección técnica y el recibo del impuesto de circulación", "El permiso de circulación y la tarjeta de inspección técnica", "El permiso de circulación y el libro de mantenimiento"], "a": 1, "expl": "El conductor debe llevar el permiso de circulación y la tarjeta ITV (certificado de características técnicas en ciclomotores).", "fuente": "RD 2822/1998 Reglamento General de Vehículos (texto consolidado 26/06/2026), art. 26.1", "img": null}, {"tema": 9, "q": "¿Qué consecuencia tiene para un propietario circular con un vehículo sin seguro obligatorio?", "opts": ["La retirada del permiso de conducción durante un año", "Solo una multa, pudiendo seguir circulando mientras la recurre", "Prohibición de circular y depósito del vehículo a su costa"], "a": 2, "expl": "La falta de seguro implica prohibición de circular, depósito o precinto del vehículo con cargo al propietario y multa.", "fuente": "RDL 8/2004 art. 3.1", "img": null}, {"tema": 9, "q": "Un ocupante sufre lesiones más graves por no llevar abrochado el cinturón. ¿Cómo puede afectar eso a su indemnización?", "opts": ["Pierde por completo el derecho a cualquier indemnización por los daños", "No se reduce, porque el seguro obligatorio cubre siempre el cien por cien", "Puede reducirse por su culpa concurrente, hasta un máximo del 75 %"], "a": 2, "expl": "Si la víctima capaz de culpa civil incumple la normativa de seguridad (por ejemplo, no usa el cinturón) y eso agrava el daño, la indemnización se reduce en atención a su culpa concurrente hasta un máximo del 75 %.", "fuente": "RDL 8/2004 (seguro obligatorio), art. 1.2", "img": null}, {"tema": 9, "q": "¿Debe matricularse un remolque de 1.000 kg de masa máxima autorizada?", "opts": ["No, usa la matrícula del vehículo tractor", "Solo si supera los 3.500 kg de masa máxima", "Sí, y llevar placa de matrícula propia"], "a": 2, "expl": "Los remolques y semirremolques de más de 750 kg de MMA deben matricularse y llevar placas de matrícula.", "fuente": "RGV art. 25.1", "img": null}, {"tema": 9, "q": "¿Qué periodo de vigencia tiene el permiso de conducción de la clase B de un titular de 40 años?", "opts": ["Cinco años", "Quince años", "Diez años"], "a": 2, "expl": "El permiso B tiene un periodo de vigencia de diez años mientras su titular no cumpla los sesenta y cinco; desde esa edad, cinco años.", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 12.2", "img": null}, {"tema": 9, "q": "Un conductor cubre la carga con una lona que tapa parcialmente la placa de matrícula trasera. ¿Es correcto?", "opts": ["No, la carga no puede ocultar las placas ni los distintivos obligatorios", "Sí, mientras la carga quede bien sujeta y no pueda desplazarse al circular", "Sí, siempre que las luces traseras permanezcan totalmente visibles para los demás"], "a": 0, "expl": "La carga y sus accesorios deben disponerse de modo que no oculten las luces, las placas o distintivos obligatorios ni las advertencias manuales del conductor.", "fuente": "RGC (consolidado con RD 518/2026), art. 14.1.d)", "img": null}, {"tema": 9, "q": "Una furgoneta de categoría N1, con masa máxima de 3,5 toneladas, tiene ocho años desde su primera matriculación. ¿Con qué frecuencia debe pasar la ITV?", "opts": ["Cada seis meses", "Anualmente", "Cada dos años"], "a": 1, "expl": "Para los vehículos N1, la tabla fija: hasta 2 años exento, de 2 a 6 años bienal, de 6 a 10 años anual y de más de 10 años semestral.", "fuente": "RD 920/2017 (ITV), art. 6.1 (tabla de frecuencias)", "img": null}, {"tema": 9, "q": "¿Qué requisitos de edad y de permiso previo exige el permiso de la clase A?", "opts": ["18 años cumplidos y permiso B con dos años de antigüedad", "20 años cumplidos y permiso A2 con 2 años de antigüedad", "21 años cumplidos y permiso A1 con un año de antigüedad"], "a": 1, "expl": "El permiso A requiere 20 años y ser titular del A2 con al menos dos años de antigüedad (además de superar la formación exigida).", "fuente": "RGC (Conductores) arts. 4 y 5.1.a", "img": null}, {"tema": 9, "q": "Un conductor de turismo baja del vehículo y pisa el arcén de una vía interurbana. ¿Debe utilizar el chaleco reflectante?", "opts": ["Solo si se trata de una autopista o una autovía", "Sí, también de día y con buena visibilidad", "Solo si es de noche o hay poca visibilidad"], "a": 1, "expl": "Debe usarlo siempre que salga del vehículo y ocupe la calzada o el arcén de una vía interurbana, sin distinción de hora ni visibilidad.", "fuente": "RGC art. 118.4 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 9, "q": "¿Puede una baliza V-16 homologada necesitar una aplicación del teléfono móvil para funcionar?", "opts": ["Sí, la aplicación es necesaria para enviar la ubicación a la DGT", "Sí, siempre que el conductor lleve el teléfono con cobertura y la aplicación", "No, lleva dentro de su carcasa todos los elementos que necesita"], "a": 2, "expl": "El dispositivo debe incluir en su carcasa todos los elementos necesarios para su operación, incluidos los de comunicaciones, sin depender de aplicaciones móviles.", "fuente": "Reglamento General de Vehículos, Anexo XI, V-16, apartado 6", "img": null}, {"tema": 9, "q": "¿Qué ocurre con un vehículo que circula sin permiso de circulación?", "opts": ["Puede seguir circulando si tiene seguro e ITV en vigor", "Se le concede un plazo de un mes para regularizarlo", "Se inmoviliza hasta que se disponga del permiso"], "a": 2, "expl": "La circulación sin permiso de circulación da lugar a la inmovilización del vehículo hasta que se disponga de él.", "fuente": "RDL 6/2015 art. 66.3", "img": null}, {"tema": 9, "q": "¿Qué letras no se utilizan en las matrículas ordinarias de los automóviles?", "opts": ["Las cinco vocales y las letras Ñ y Q", "Únicamente las cinco vocales; el resto del alfabeto sí se utiliza", "Las cinco vocales y las letras K y W, por su escasa utilización"], "a": 0, "expl": "Las tres letras de la matrícula van de BBB a ZZZ, suprimiendo las cinco vocales y las letras Ñ y Q.", "fuente": "Reglamento General de Vehículos, Anexo XVIII, I.A).a)", "img": null}, {"tema": 9, "q": "Con el permiso B+E y un vehículo tractor de la clase B, ¿cuál es la masa máxima autorizada del remolque o semirremolque que puede llevarse?", "opts": ["4.250 kg", "3.500 kg", "750 kg"], "a": 1, "expl": "El B+E autoriza remolques o semirremolques de hasta 3.500 kg de MMA; 750 kg es el límite del remolque ligero con el permiso B.", "fuente": "RGC (Conductores) art. 4.2 (tabla, clase B+E)", "img": null}, {"tema": 9, "q": "Una persona compra un turismo ya matriculado a un particular. ¿En qué plazo debe solicitar la renovación del permiso de circulación a su nombre?", "opts": ["Dentro de los tres meses siguientes a la adquisición", "Dentro del año siguiente a la adquisición del vehículo", "Dentro de los treinta días desde la adquisición"], "a": 2, "expl": "El adquirente debe solicitar la renovación del permiso de circulación dentro del plazo de treinta días desde la adquisición.", "fuente": "RD 2822/1998 Reglamento General de Vehículos (texto consolidado 26/06/2026), art. 32.3", "img": null}, {"tema": 9, "q": "Un conductor de turismo muestra a un agente fotocopias en papel de los documentos del vehículo. ¿Son válidas?", "opts": ["Sí, bastando con que las fotocopias sean legibles y recientes", "Sí, siempre que estén debidamente cotejadas", "No, solo se admiten los originales sin ninguna excepción"], "a": 1, "expl": "Los documentos del vehículo han de ser originales, pero pueden sustituirse por fotocopias si están debidamente cotejadas.", "fuente": "Reglamento General de Vehículos (RD 2822/1998), art. 26.2", "img": null}, {"tema": 9, "q": "Un turismo destinado al servicio de taxi tiene siete años desde su primera matriculación. ¿Con qué frecuencia debe pasar la ITV?", "opts": ["Cada dos años", "Semestralmente", "Anualmente"], "a": 1, "expl": "Los turismos (M1) usados como taxi o ambulancia no siguen la tabla general: hasta cinco años pasan la ITV anualmente y, con más de cinco años, cada semestre.", "fuente": "RD 920/2017 (ITV), art. 6.1.b)", "img": null}, {"tema": 9, "q": "¿Qué profundidad mínima deben tener las ranuras principales del dibujo de los neumáticos de un camión de más de 3.500 kg?", "opts": ["1,6 mm", "2,0 mm", "1,0 mm"], "a": 2, "expl": "En las categorías M2, M3, N2, N3, O3 y O4 el mínimo es 1,0 mm; los 1,6 mm son para M1, N1, O1 y O2 (turismos, furgonetas ligeras y remolques ligeros).", "fuente": "RGV anexo VII, apartado 2", "img": null}, {"tema": 9, "q": "El titular de un turismo solicita la baja temporal voluntaria y no pide prórroga. ¿Qué ocurre al cumplirse un año desde la solicitud?", "opts": ["Termina la baja y el vehículo vuelve a estar activo", "Se prorroga automáticamente otro año", "Pasa automáticamente a baja definitiva en el Registro"], "a": 0, "expl": "La baja temporal voluntaria dura un año como máximo; si no se solicita prórroga, termina y el vehículo vuelve a estar activo.", "fuente": "RGV art. 36.1.a", "img": null}, {"tema": 9, "q": "¿De qué color son el fondo y los caracteres de la placa de matrícula trasera de un automóvil destinado al servicio de taxi?", "opts": ["Fondo amarillo y caracteres negros", "Fondo blanco y caracteres azules", "Fondo azul y caracteres blancos"], "a": 2, "expl": "Las placas traseras de los taxis y de los vehículos de alquiler con conductor de hasta nueve plazas llevan fondo retrorreflectante azul y caracteres blancos.", "fuente": "Reglamento General de Vehículos, Anexo XVIII, I.A).a)", "img": null}, {"tema": 9, "q": "¿Qué color de fondo tienen las placas de matrícula de los remolques y semirremolques?", "opts": ["Rojo retrorreflectante, con caracteres negros", "Amarillo retrorreflectante, con caracteres negros", "Blanco retrorreflectante, con caracteres negros"], "a": 0, "expl": "Remolques y semirremolques llevan fondo rojo y caracteres negros, con la letra R inicial; el blanco es de los automóviles y el amarillo de los ciclomotores.", "fuente": "RGV anexo XVIII, A) c)", "img": null}, {"tema": 9, "q": "Un turismo español con bandera europea y letra E en la placa circula por Francia. ¿Debe llevar además detrás el distintivo de nacionalidad V-7?", "opts": ["Sí, pero solo si permanece más de tres meses en el país", "Sí, en una placa separada, siempre que salga de España", "No, la propia placa de matrícula ya cumple esa función"], "a": 2, "expl": "Si la placa lleva la bandera europea y la sigla E, al circular por los demás países de la UE no es necesario el signo distintivo V-7 en la parte posterior.", "fuente": "Reglamento General de Vehículos, Anexo XVIII, I.A).a)", "img": null}, {"tema": 9, "q": "¿Cada cuánto suele recomendarse sustituir el líquido de frenos?", "opts": ["En torno a cada dos años", "Una sola vez en toda la vida útil del vehículo", "Cada diez años, aunque el nivel sea correcto"], "a": 0, "expl": "El líquido de frenos sigue pautas habituales de sustitución, en torno a cada dos años (incluso en coches eléctricos).", "fuente": "Revista DGT, \"Simple y económico\" (06/10/2020), https://revista.dgt.es/es/motor/tecnologia-seguridad/2020/1006-Mantenimiento-electricos.shtml", "img": null}, {"tema": 9, "q": "¿Qué se suma a la tara de un turismo para obtener su masa en orden de marcha?", "opts": ["La masa estándar del conductor, fijada en 75 kg", "La masa estándar del conductor, fijada en 60 kg", "La masa del conductor y de un acompañante, fijada en 150 kg"], "a": 0, "expl": "La masa en orden de marcha es la tara más la masa estándar del conductor, que se fija en 75 kg (en autobuses y autocares, más 75 kg del acompañante si lo lleva).", "fuente": "Reglamento General de Vehículos, Anexo IX, 1.2", "img": null}, {"tema": 9, "q": "Según la DGT, ¿qué tres elementos forman el triángulo de la seguridad activa del vehículo?", "opts": ["Neumáticos, batería y limpiaparabrisas", "Frenos, dirección y alumbrado", "Neumáticos, amortiguadores y frenos"], "a": 2, "expl": "Neumáticos, amortiguadores y frenos trabajan juntos: si uno falla, los demás tampoco rinden bien al frenar o tomar curvas.", "fuente": "Revista DGT, \"El triángulo de la seguridad activa\" (29/06/2021), https://revista.dgt.es/es/motor/noticias/2021/06JUNIO/0629-Triangulo-Seguridad.shtml", "img": null}, {"tema": 9, "q": "Cuando es obligatorio el uso de cadenas en un turismo, ¿dónde deben colocarse?", "opts": ["Al menos en una rueda motriz de cada lado del vehículo", "Sobre una sola rueda motriz, la del lado del arcén", "Sobre las dos ruedas delanteras, sea cual sea la tracción"], "a": 0, "expl": "Hay que colocar las cadenas o dispositivos antideslizantes, como mínimo, en una rueda motriz de cada lado, o usar neumáticos especiales.", "fuente": "RGV art. 12.5.2", "img": null}, {"tema": 9, "q": "Un particular entrega su turismo a un compraventa de vehículos para su posterior venta. ¿Qué debe solicitar en el plazo de diez días?", "opts": ["El cambio de titularidad a nombre del compraventa", "La baja definitiva del vehículo en el Registro de Vehículos", "La baja temporal del vehículo en el Registro de Vehículos"], "a": 2, "expl": "Quien entrega el vehículo a un vendedor profesional para su transmisión debe pedir la baja temporal en diez días desde la entrega.", "fuente": "RGV art. 33.1", "img": null}, {"tema": 9, "q": "¿Cuál es la edad mínima para obtener el permiso AM, que autoriza a conducir ciclomotores?", "opts": ["15 años cumplidos", "16 años cumplidos", "14 años cumplidos"], "a": 0, "expl": "El permiso AM se obtiene a los 15 años cumplidos; A1 a los 16 y A2 a los 18.", "fuente": "RGC (Conductores) art. 4.2 (tabla)", "img": null}, {"tema": 9, "q": "Según la DGT, ¿con qué frecuencia mínima conviene comprobar la presión de los neumáticos?", "opts": ["Cada seis meses, aprovechando el cambio de estación del año", "Una vez al año, coincidiendo con el paso por la ITV del vehículo", "Al menos una vez al mes y antes de un viaje largo"], "a": 2, "expl": "La DGT recomienda comprobar la presión con frecuencia, como mínimo una vez al mes y siempre antes de emprender un viaje largo.", "fuente": "Revista DGT, \"Neumáticos: presión, la justa\" (30/09/2019), https://revista.dgt.es/es/motor/noticias/2019/09SEPTIEMBRE/0930-Presion-Neumaticos.shtml", "img": null}, {"tema": 9, "q": "Un turismo obtiene resultado negativo en la ITV por un defecto muy grave. ¿Cómo debe trasladarse desde la estación hasta su destino?", "opts": ["Por medios ajenos al propio vehículo, sin conducirlo", "Conduciéndolo despacio y con la luz de emergencia conectada", "Conduciéndolo de forma directa hasta el taller más cercano"], "a": 0, "expl": "Los defectos muy graves inhabilitan para circular y el traslado desde la estación se hace por medios ajenos al propio vehículo.", "fuente": "RD 920/2017 art. 11.3", "img": null}, {"tema": 9, "q": "Un turismo sin seguro obligatorio, conducido por un conocido del propietario, causa daños a terceros. ¿Responde civilmente el propietario no conductor?", "opts": ["No, siempre que pruebe que ignoraba que el seguro del vehículo había caducado", "Sí, junto con el conductor, salvo que pruebe que el vehículo le fue sustraído", "No, responde únicamente el conductor, que es quien provocó los daños causados a terceros"], "a": 1, "expl": "El propietario no conductor de un vehículo sin seguro obligatorio responde civilmente con el conductor, salvo que acredite que el vehículo le había sido sustraído.", "fuente": "RDL 8/2004 (seguro obligatorio), art. 1.3, párrafo 2.º", "img": null}, {"tema": 9, "q": "Si en una ITV solo se detectan defectos leves, ¿cuál es el resultado y qué debe hacerse?", "opts": ["Es negativo y el vehículo queda inhabilitado hasta repararlo", "Es favorable y hay que reparar los defectos en dos meses", "Es desfavorable y hay que repetir la inspección completa en un mes"], "a": 1, "expl": "Solo defectos leves dan resultado favorable; deben repararse en dos meses como máximo y no exigen nueva inspección.", "fuente": "RD 920/2017 arts. 9.4 y 11.1", "img": null}, {"tema": 9, "q": "Un turismo arrastra un remolque de 700 kg de masa máxima autorizada. ¿Qué documento del remolque debe llevar el conductor?", "opts": ["Su permiso de circulación, con matrícula propia", "Su tarjeta de inspección técnica", "Ninguno, bastan los documentos del turismo"], "a": 1, "expl": "Con remolques de hasta 750 kg el conductor debe llevar la tarjeta ITV del remolque y en la del turismo debe constar un acoplamiento compatible.", "fuente": "RGV art. 26.1.c", "img": null}, {"tema": 9, "q": "¿Qué sistema de frenado debe llevar toda motocicleta?", "opts": ["Uno solo, que actúe simultáneamente sobre las dos ruedas del vehículo", "Dos, ambos sobre la rueda delantera, que es la que más frena en una frenada", "Dos dispositivos, uno sobre la rueda trasera y otro sobre la delantera"], "a": 2, "expl": "Toda motocicleta debe tener dos dispositivos de frenado: uno, por lo menos, sobre la rueda trasera y otro sobre la delantera; la rueda del sidecar no necesita freno.", "fuente": "Reglamento General de Vehículos, art. 12.8.4", "img": null}, {"tema": 9, "q": "¿Qué presión de inflado deben llevar los neumáticos de un turismo?", "opts": ["La que recomienda el fabricante del vehículo", "La misma en todas las ruedas, sea cual sea la carga", "La máxima que figura grabada en el flanco del neumático"], "a": 0, "expl": "La presión de las ruedas depende de cada vehículo y la fija el fabricante.", "fuente": "Revista DGT, \"Neumáticos: presión, la justa\" (30/09/2019), https://revista.dgt.es/es/motor/noticias/2019/09SEPTIEMBRE/0930-Presion-Neumaticos.shtml", "img": null}, {"tema": 9, "q": "¿Con cuánta antelación máxima puede solicitarse la prórroga de vigencia de un permiso de conducción respecto a su fecha de caducidad?", "opts": ["Seis meses", "Nueve meses", "Tres meses"], "a": 2, "expl": "La solicitud de prórroga puede presentarse con una antelación máxima de tres meses a la fecha de caducidad.", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 13.1", "img": null}, {"tema": 9, "q": "Un propietario reincide en circular con su turismo sin seguro obligatorio. ¿Por cuánto tiempo se acuerda cautelarmente el depósito o precinto del vehículo?", "opts": ["Un año", "Un mes", "Tres meses"], "a": 2, "expl": "El depósito o precinto cautelar es de un mes la primera vez, de tres meses en caso de reincidencia y de un año si se quebranta el depósito o precinto.", "fuente": "RDL 8/2004 (seguro obligatorio), art. 3.1.b)", "img": null}, {"tema": 9, "q": "Una conductora de 68 años renueva su permiso de la clase B. ¿Qué vigencia le corresponde?", "opts": ["5 años", "10 años", "3 años"], "a": 0, "expl": "Los permisos no profesionales (como el B) duran diez años hasta los 65 y cinco años a partir de esa edad; los de las clases C1, C, D1 y D (y sus +E) duran cinco años y tres desde los 65.", "fuente": "RGC (Conductores) art. 12.2", "img": null}, {"tema": 9, "q": "¿Qué clasificaciones ambientales de los vehículos cuentan con distintivo?", "opts": ["0 emisiones, ECO, C, B y A", "0 emisiones, ECO, C y B", "0 emisiones, ECO, B y A"], "a": 1, "expl": "El distintivo identifica la clasificación del vehículo en el Registro: 0 emisiones, ECO, C y B. No existe distintivo para la categoría A.", "fuente": "Reglamento General de Vehículos, Anexo XI, V-25, apartado 1", "img": null}, {"tema": 9, "q": "Un conductor circula con un permiso de conducción cuya vigencia ya ha vencido. ¿Qué establece el Reglamento General de Conductores?", "opts": ["No le autoriza a conducir y su uso da lugar a su intervención inmediata", "Le autoriza a conducir, pero solo por vías urbanas y a menos de 50 km/h", "Le autoriza a conducir hasta tres meses más mientras solicita la prórroga"], "a": 0, "expl": "El permiso vencido no autoriza a su titular a conducir y su utilización da lugar a su intervención inmediata.", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 12.4", "img": null}, {"tema": 9, "q": "¿Para qué sirven los indicadores de desgaste de los neumáticos de un turismo?", "opts": ["Señalan que las ranuras principales han llegado a la profundidad mínima", "Señalan la presión de inflado que el fabricante recomienda para ese neumático", "Señalan que el neumático ha cumplido la antigüedad máxima que fija el fabricante"], "a": 0, "expl": "Los indicadores de desgaste señalan que las ranuras principales de la banda de rodamiento han alcanzado la profundidad mínima de dibujo (1,6 mm en turismos); entonces hay que cambiar el neumático.", "fuente": "Reglamento General de Vehículos, Anexo VII, apartado 3", "img": null}, {"tema": 9, "q": "Una persona vende a otra su turismo, matriculado en España. ¿En qué plazo debe el vendedor notificar la transmisión a la Jefatura de Tráfico?", "opts": ["En cuarenta y ocho horas desde la transmisión", "En tres meses desde la transmisión", "En diez días desde la transmisión"], "a": 2, "expl": "El transmitente debe notificarlo a la Jefatura de Tráfico en el plazo de diez días desde la transmisión; si no lo hace, sigue siendo considerado titular.", "fuente": "RGV art. 30.2", "img": null}, {"tema": 9, "q": "Un turismo supera la ITV con resultado favorable 20 días antes de que venza la inspección anterior. ¿Desde cuándo se cuenta el nuevo plazo de validez?", "opts": ["Desde la fecha de primera matriculación del vehículo", "Desde el vencimiento de la inspección anterior", "Desde el mismo día en que se supera la inspección"], "a": 1, "expl": "Si la inspección favorable se hace en los 30 días naturales anteriores al vencimiento, la nueva validez se suma a la fecha de expiración de la anterior.", "fuente": "RD 920/2017 art. 6.5", "img": null}, {"tema": 9, "q": "Un turismo recibe un resultado desfavorable en la ITV por un defecto grave. ¿Qué puede hacer?", "opts": ["No circular bajo ningún concepto, ni siquiera para ir al taller", "Circular solo hasta el taller y volver a la ITV en un máximo de dos meses", "Circular con normalidad durante dos meses hasta la nueva inspección"], "a": 1, "expl": "Los defectos graves inhabilitan para circular, salvo para el traslado al taller y la vuelta a la estación ITV en un plazo no superior a dos meses.", "fuente": "RD 920/2017 art. 11.2", "img": null}, {"tema": 9, "q": "¿Cuál de estos neumáticos no puede utilizarse en la vía pública?", "opts": ["Uno con ampollas, deformaciones anormales o cables al descubierto", "Uno recauchutado que conserva sus inscripciones reglamentarias", "Uno nuevo, de las dimensiones previstas por el fabricante del vehículo"], "a": 0, "expl": "Los neumáticos, nuevos o recauchutados, no deben presentar ampollas, deformaciones, roturas ni cables al descubierto, y deben conservar las inscripciones reglamentarias.", "fuente": "RGV anexo VII, apartado 4", "img": null}, {"tema": 9, "q": "Un agente de tráfico detecta un turismo con la ITV caducada y lo denuncia. ¿Qué plazo concede al titular para someterlo a inspección?", "opts": ["10 días", "2 meses", "30 días"], "a": 0, "expl": "Además de denunciar, el agente concede 10 días; si pasado ese plazo no se acredita la inspección, la Jefatura de Tráfico inicia el procedimiento de baja de oficio del vehículo.", "fuente": "RD 920/2017 (ITV), art. 6.9", "img": null}, {"tema": 9, "q": "¿Qué efecto tiene inflar los neumáticos por encima de la presión recomendada?", "opts": ["No afecta al agarre, solo reduce el confort de los ocupantes", "Disminuye el agarre, al reducirse la superficie en contacto con el asfalto", "Aumenta el agarre, porque el neumático queda más rígido y firme sobre la calzada"], "a": 1, "expl": "Con más presión de la recomendada disminuye el agarre porque se reduce la superficie de neumático que contacta con el asfalto.", "fuente": "Revista DGT, \"Neumáticos: presión, la justa\" (30/09/2019), https://revista.dgt.es/es/motor/noticias/2019/09SEPTIEMBRE/0930-Presion-Neumaticos.shtml", "img": null}, {"tema": 9, "q": "¿Puede el titular de un turismo matriculado en España elegir libremente la estación ITV donde inspeccionarlo?", "opts": ["Sí, pero solo en la primera; las siguientes deben hacerse en la misma estación", "Sí, cualquiera del territorio nacional, en la primera y en las siguientes", "Solo puede utilizar una estación de la provincia donde está matriculado el vehículo"], "a": 1, "expl": "El usuario elige libremente la estación ITV de todo el territorio nacional, tanto para la primera inspección como para las sucesivas tras subsanar defectos.", "fuente": "RD 920/2017 (ITV), arts. 17 y 11.8", "img": null}, {"tema": 9, "q": "A un conductor se le rompe el sistema de frenos y atropella a un peatón. ¿Puede eximirse de responsabilidad alegando fuerza mayor?", "opts": ["No, el fallo de una pieza o un defecto del vehículo no es fuerza mayor", "Sí, si el vehículo había superado la ITV y estaba correctamente mantenido", "Sí, la rotura
