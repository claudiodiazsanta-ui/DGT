, "opts": ["80 km/h", "90 km/h", "100 km/h"], "a": 1, "expl": "El autobús tiene 100 km/h en autovía, y el transporte escolar reduce ese límite en 10 km/h.", "fuente": "RGC art. 48.1.b)", "img": null}, {"tema": 3, "q": "Un turismo circula por una autopista, fuera de poblado, sin ninguna señal que modifique el límite genérico. ¿Cuál es su velocidad máxima?", "opts": ["110 km/h", "120 km/h", "130 km/h"], "a": 1, "expl": "El límite genérico de turismos y motocicletas es de 120 km/h en autopistas y autovías, y de 90 km/h en carreteras convencionales.", "fuente": "RGC art. 48.1.a) (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 3, "q": "Un camión de más de 3.500 kg de masa máxima autorizada circula por una carretera convencional, fuera de poblado y sin señal específica de velocidad. ¿Qué velocidad máxima tiene?", "opts": ["60 km/h", "100 km/h", "80 km/h"], "a": 2, "expl": "Los camiones y tractocamiones tienen un límite genérico de 90 km/h en autopista y autovía y de 80 km/h en carretera convencional.", "fuente": "RGC art. 48.1.a) (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 3, "q": "Un autobús sin cinturones de seguridad circula fuera de poblado por una autovía. ¿Cuál es su velocidad máxima?", "opts": ["100 km/h", "90 km/h", "80 km/h"], "a": 2, "expl": "Si el autobús no está dotado de cinturón, su máximo fuera de poblado es 80 km/h, sea cual sea la vía.", "fuente": "RGC art. 48.1.b)", "img": null}, {"tema": 3, "q": "Respecto a la separación entre vehículos que circulan uno detrás de otro, ¿qué excepción prevé el Reglamento para los ciclistas?", "opts": ["Están obligados a mantener una separación fija de diez metros, también al subir puertos de montaña", "Pueden circular en grupo sin mantenerla, extremando la atención para evitar alcances entre ellos", "Deben mantener siempre 50 metros entre bicicletas, también cuando circulan en grupo en carretera"], "a": 1, "expl": "Los ciclistas pueden circular en grupo sin guardar la distancia general, pero deben prestar especial atención para evitar alcances entre ellos.", "fuente": "RGC art. 54.1 y Ley de Tráfico art. 22.2", "img": null}, {"tema": 3, "q": "Una intersección está debidamente señalizada y la visibilidad es prácticamente nula. ¿Qué velocidad no deberá exceder el vehículo?", "opts": ["50 km/h", "30 km/h", "70 km/h"], "a": 0, "expl": "En esas condiciones la velocidad no debe exceder de 50 km/h.", "fuente": "RGC art. 46.1.h)", "img": null}, {"tema": 3, "q": "En una vía urbana con tres carriles de circulación para cada sentido, sin carriles reservados ni señal específica, ¿cuál es el límite genérico?", "opts": ["20 km/h", "30 km/h", "50 km/h"], "a": 2, "expl": "En vías urbanas de dos o más carriles por sentido el límite genérico es 50 km/h.", "fuente": "RGC art. 50.1.c)", "img": null}, {"tema": 3, "q": "Un turismo circula por una carretera convencional fuera de poblado, cuyo límite genérico es 90 km/h. ¿Por debajo de qué velocidad no puede circular sin causa justificada?", "opts": ["45 km/h", "60 km/h", "30 km/h"], "a": 0, "expl": "En las vías que no son autopista ni autovía, la mínima es la mitad de la genérica (45 km/h con 90 km/h); en autopistas y autovías, 60 km/h.", "fuente": "RGC art. 49.1", "img": null}, {"tema": 4, "q": "¿Qué vehículos pueden utilizar un carril habilitado para circular en sentido contrario al habitual por razones de fluidez?", "opts": ["Cualquier vehículo, salvo los camiones de gran tonelaje.", "Motocicletas y turismos, sin remolque.", "Turismos y motocicletas, con o sin remolque."], "a": 1, "expl": "La utilización de estos carriles se limita a motocicletas y turismos y está prohibida al resto de los vehículos, incluidos los turismos con remolque.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 41.1", "img": null}, {"tema": 4, "q": "En una calzada de doble sentido, ¿qué indican dos líneas discontinuas que delimitan un carril por ambos lados?", "opts": ["Que es un carril de aceleración para incorporarse a la vía principal.", "Que es un carril reversible, regulable en uno u otro sentido.", "Que es un carril reservado exclusivamente para adelantar a otros vehículos."], "a": 1, "expl": "Las marcas dobles discontinuas que delimitan un carril por ambos lados indican que es reversible: la circulación puede regularse en uno u otro sentido con semáforos de carril u otros medios.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 40.1", "img": null}, {"tema": 4, "q": "¿Qué inclinación mínima debe tener un tramo para considerarse de gran pendiente a efectos de prioridad de paso?", "opts": ["Un siete por ciento.", "Un cuatro por ciento.", "Un diez por ciento."], "a": 0, "expl": "Se entienden por tramos de gran pendiente los que tienen una inclinación mínima del siete por ciento.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 63.1", "img": null}, {"tema": 4, "q": "El tráfico es tan denso que los vehículos ocupan toda la anchura de la calzada, y los de un carril avanzan más deprisa que los de otro. ¿Se considera adelantamiento?", "opts": ["Sí, y se permite si se avisa antes con el intermitente.", "Sí, pero solo si se efectúa por el lado izquierdo.", "No, y ningún conductor debe cambiar de carril para adelantar."], "a": 2, "expl": "Con esa densidad, que unos carriles avancen más rápido que otros no es adelantamiento, y ningún conductor debe cambiar de carril para adelantar.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 83.2", "img": null}, {"tema": 4, "q": "Has pasado la salida que querías tomar en una autovía. ¿Puedes retroceder por el arcén hasta ella?", "opts": ["No, la marcha atrás está prohibida en autovías y autopistas.", "Sí, si no se aproxima ningún vehículo y el recorrido es corto.", "Sí, si lo haces por el arcén con la luz de emergencia."], "a": 0, "expl": "Se prohíbe la maniobra de marcha atrás en autovías y autopistas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 80.3", "img": null}, {"tema": 4, "q": "Un conductor sin vehículo prioritario debe trasladar con urgencia a un herido grave sin otro medio. ¿Qué debe hacer respecto a las normas de circulación?", "opts": ["Superar los límites de velocidad si utiliza el avisador acústico en continuo.", "Respetarlas, sobre todo en las intersecciones, y avisar de su situación.", "Ignorar los semáforos si utiliza la luz de emergencia conectada siempre."], "a": 1, "expl": "El vehículo no prioritario que realiza un servicio urgente debe respetar las normas de circulación, sobre todo en las intersecciones, y avisar con avisador intermitente y luz de emergencia.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 70.2", "img": null}, {"tema": 4, "q": "El vehículo que te precede indica claramente que va a girar a la izquierda y hay espacio suficiente. ¿Cómo puedes adelantarlo?", "opts": ["No puedes adelantarlo; debes esperar detrás hasta que gire.", "Por la izquierda, aprovechando que se desplaza hacia ese lado.", "Por la derecha, adoptando las máximas precauciones."], "a": 2, "expl": "Por excepción, si hay espacio suficiente, se adelanta por la derecha con las máximas precauciones al vehículo que indica claramente que girará a la izquierda o parará en ese lado.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 82.2", "img": null}, {"tema": 4, "q": "Circulas por carretera convencional y un vehículo adelanta a otro. Para adelantar a ese vehículo tendrías que invadir el sentido contrario. ¿Puedes hacerlo?", "opts": ["Sí, si aceleras mucho y la visibilidad es buena.", "No, está prohibido si has de invadir el sentido contrario.", "Sí, si el vehículo adelantante lleva puesto el intermitente."], "a": 1, "expl": "Se prohíbe adelantar a los vehículos que ya estén adelantando a otro si el tercer vehículo ha de invadir la parte de calzada del sentido contrario.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 84.2", "img": null}, {"tema": 4, "q": "En un tramo de gran pendiente, tan estrecho que impide el cruce y sin señalización, ¿qué vehículo tiene preferencia de paso como regla general?", "opts": ["El que circula en sentido ascendente", "El que lleva mayor masa de los dos", "El que circula en sentido descendente"], "a": 0, "expl": "En tramos de gran pendiente (inclinación mínima del 7 %) con estrechez, la preferencia es del vehículo que sube, salvo que el que baja llegue antes a un apartadero.", "fuente": "RGC art. 63", "img": null}, {"tema": 4, "q": "Te acercas a una intersección ordinaria (no glorieta) sin prioridad señalizada para tu calzada. ¿A cuál de estos vehículos puedes adelantar?", "opts": ["A un camión que circule despacio.", "A una motocicleta.", "A un turismo que circule despacio."], "a": 1, "expl": "En las intersecciones y sus proximidades solo se puede adelantar, entre otros supuestos, a vehículos de dos ruedas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 87.1.c).4.º", "img": null}, {"tema": 4, "q": "Llegas a una obra de reparación de la vía y hay otro vehículo esperando, llegado antes en tu mismo sentido. ¿Qué debes hacer?", "opts": ["Colocarte detrás de él, lo más cerca posible del borde derecho, y seguirlo.", "Adelantarlo por la izquierda para ponerte el primero si el tramo está libre.", "Colocarte a su lado para pasar a la vez cuando se abra el paso."], "a": 0, "expl": "Quien llegue a una obra y encuentre esperando a otro vehículo anterior en su mismo sentido se coloca detrás y no intenta pasar sino siguiéndolo.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 60.4", "img": null}, {"tema": 4, "q": "¿Qué obliga a hacer esta señal a quien llega a ella?", "opts": ["Detenerse siempre y ceder el paso a los vehículos de la vía preferente", "Reducir la velocidad y cruzar sin detenerse si no se acerca ningún vehículo por ella", "Detenerse únicamente si se acerca algún vehículo por la vía preferente en ese momento"], "a": 0, "expl": "Ante la señal de stop hay que detenerse siempre, y ceder el paso a los vehículos que circulan por la vía preferente, vengan de donde vengan.", "fuente": "RGC art. 56.5", "img": "sign:stop"}, {"tema": 4, "q": "¿Qué condición debe cumplir el conductor de un vehículo prioritario en servicio urgente para dejar de aplicar algunas normas de circulación?", "opts": ["Haberse cerciorado de que no pone en peligro a ningún usuario de la vía", "Llevar a bordo al menos a un agente de la autoridad que asuma cada maniobra que realice", "Haber avisado por radio a la Jefatura Provincial de Tráfico antes de cada maniobra que haga"], "a": 0, "expl": "Los conductores de vehículos prioritarios pueden dejar de aplicar ciertas normas bajo su responsabilidad, a condición de haberse cerciorado de que no ponen en peligro a ningún usuario.", "fuente": "RGC art. 68.1", "img": null}, {"tema": 4, "q": "Conduces un vehículo pesado por una calzada estrecha en la que no pueden adelantarte con facilidad por el tráfico contrario. ¿Qué debes hacer?", "opts": ["Acelerar para llegar antes a un tramo más ancho.", "Aminorar la marcha o apartarte al arcén, si es practicable, para dejar paso.", "Mantener tu velocidad y trayectoria, pues adelantar es cosa de quien te sigue."], "a": 1, "expl": "Los conductores de vehículos pesados deben aminorar o apartarse cuanto antes al arcén, si resulta practicable, cuando no puedan ser adelantados con facilidad y sin peligro.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 86.3", "img": null}, {"tema": 4, "q": "Un turismo se incorpora a una autovía desde un enlace, sin señales que alteren la prioridad. ¿Quién tiene preferencia?", "opts": ["Los vehículos que ya circulan por la autovía", "Los de mayor tamaño, sean de un grupo o del otro", "Los vehículos que se incorporan desde el enlace"], "a": 0, "expl": "Los vehículos que circulan por autopistas y autovías tienen preferencia sobre quienes pretenden incorporarse a ellas.", "fuente": "RGC art. 57.1.d)", "img": null}, {"tema": 4, "q": "¿En cuál de estos lugares está prohibido, como regla general, cambiar el sentido de la marcha?", "opts": ["En un tramo recto de carretera convencional con buena visibilidad.", "En un paso a nivel.", "En una calle de poblado con visibilidad suficiente y sin tráfico."], "a": 1, "expl": "Se prohíbe el cambio de sentido en pasos a nivel, túneles, pasos inferiores y autopistas y autovías (salvo lugares habilitados).", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 79.1", "img": null}, {"tema": 4, "q": "Circulas por un carril habilitado en sentido contrario al habitual. ¿Puedes invadir el carril del sentido normal para adelantar?", "opts": ["No, ni siquiera para adelantar.", "Sí, si el carril contiguo está libre y la maniobra es segura.", "Sí, pero solo para adelantar a vehículos de dos ruedas."], "a": 0, "expl": "Los usuarios de estos carriles no pueden desplazarse lateralmente invadiendo el carril o carriles del sentido normal, ni siquiera para adelantar.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 41.1", "img": null}, {"tema": 4, "q": "Un camión de más de 3.500 kg circula por una calzada de doble sentido con tres carriles separados por líneas discontinuas. ¿Para qué puede utilizar el carril central?", "opts": ["Solo para efectuar los adelantamientos precisos y cambiar de dirección a la izquierda.", "Para circular habitualmente si no viene tráfico en sentido contrario.", "Para circular siempre que se vaya a velocidad superior a la del resto."], "a": 0, "expl": "En esas calzadas el carril central tan solo se utiliza para efectuar los adelantamientos precisos y para cambiar de dirección hacia la izquierda.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 30.1.b)", "img": null}, {"tema": 4, "q": "Dos turismos llegan a una intersección entre vías pavimentadas, sin señales de prioridad, sin semáforos ni agentes y sin raíles. ¿Quién debe ceder el paso?", "opts": ["El que ve acercarse al otro por su derecha", "El que ve acercarse al otro por su izquierda", "El que circula a menor velocidad de los dos"], "a": 0, "expl": "En defecto de señal que regule la preferencia, se cede el paso a los vehículos que se aproximan por la derecha.", "fuente": "RGC art. 57.1", "img": null}, {"tema": 4, "q": "Esperas en la calzada para cambiar de sentido y tu presencia impide avanzar a los vehículos que circulan detrás. Si es posible, ¿qué debes hacer?", "opts": ["Salir de la calzada por tu lado derecho, si es posible, hasta poder maniobrar.", "Girar de inmediato aunque se aproxime algún vehículo.", "Seguir esperando en el carril con la luz de emergencia conectada."], "a": 0, "expl": "Si la espera impide continuar a los de detrás, el conductor debe salir de la calzada por su lado derecho, si es posible, hasta que las condiciones permitan la maniobra.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 78.1", "img": null}, {"tema": 4, "q": "En un túnel, un turismo (masa máxima autorizada de 3.500 kg o menos) que no pretende adelantar sigue a otro vehículo. ¿Qué distancia de seguridad mínima debe mantener?", "opts": ["Al menos 70 metros o un intervalo de tres segundos.", "Al menos 100 metros o un intervalo de cuatro segundos.", "Al menos 50 metros o un intervalo de dos segundos."], "a": 1, "expl": "En túneles y pasos inferiores, si no se pretende adelantar, se mantienen al menos 100 metros o cuatro segundos (150 m o seis segundos si la masa máxima autorizada supera 3.500 kg).", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 95.6", "img": null}, {"tema": 4, "q": "¿Puede un turismo que arrastra un remolque circular por un carril VAO habilitado?", "opts": ["No, está prohibido a los turismos con remolque.", "Sí, si el turismo lleva el número de ocupantes exigido.", "Sí, si el remolque no supera los 750 kilogramos de masa."], "a": 0, "expl": "El carril VAO está limitado a motocicletas, turismos y vehículos mixtos adaptables, y prohibido al resto, incluidos los turismos con remolque.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 35.2.a)", "img": null}, {"tema": 4, "q": "Un conductor debe ceder el paso en una intersección. ¿Cuándo puede iniciar o reanudar la marcha?", "opts": ["Cuando se ha asegurado de que no obligará al prioritario a variar bruscamente su trayectoria o velocidad", "En cuanto reduce la velocidad y avisa con el intermitente, sin esperar a ninguna otra comprobación previa", "Cuando calcula que le da tiempo a cruzar, aunque el conductor con prioridad deba frenar un poco para evitarlo"], "a": 0, "expl": "Quien debe ceder no puede iniciar, continuar ni reanudar la marcha hasta asegurarse de que no obligará al prioritario a cambiar bruscamente de trayectoria o velocidad.", "fuente": "RGC art. 58 (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 4, "q": "En una glorieta sin ninguna señal que regule la prioridad de paso, ¿quién tiene preferencia?", "opts": ["Los vehículos que se disponen a entrar, por llegar por la derecha", "Los vehículos que ya circulan por la vía circular", "Los vehículos que entran, si lo hacen a mayor velocidad"], "a": 1, "expl": "En las glorietas, los que se hallan dentro de la vía circular tienen preferencia de paso sobre los que pretenden acceder a ella.", "fuente": "RGC art. 57 (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 4, "q": "¿Puede adelantarse a otro vehículo en las proximidades de un paso a nivel?", "opts": ["Sí, si el vehículo adelantado es una bicicleta o un ciclomotor.", "Sí, siempre que las barreras estén levantadas y no se vea ningún tren.", "No, está prohibido adelantar en los pasos a nivel y sus proximidades."], "a": 2, "expl": "El art. 87.1.b prohíbe adelantar en los pasos a nivel y en sus proximidades, sin excepciones para vehículos de dos ruedas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 87.1.b)", "img": null}, {"tema": 4, "q": "En una carretera convencional con un carril por sentido, fuera de poblado, vas a adelantar a un ciclista. ¿Qué separación lateral de seguridad debes guardar como mínimo?", "opts": ["1,5 metros", "1 metro", "0,5 metros"], "a": 0, "expl": "Al adelantar a ciclistas y demás usuarios citados hay que guardar una anchura de seguridad de al menos 1,5 metros, ocupando si es preciso parte del carril contiguo o contrario si es seguro.", "fuente": "RGC art. 85.4 (redacción RD 518/2026)", "img": null}, {"tema": 4, "q": "Tu vehículo está detenido en una intersección con semáforo y obstaculiza la circulación. ¿Qué debes hacer?", "opts": ["Esperar a que se permita su dirección, aunque estorbe a los demás.", "Salir de ella sin esperar al verde, si no entorpece a los demás.", "Apagar el motor y conectar la luz de emergencia hasta el cambio de fase."], "a": 1, "expl": "Quien tenga el vehículo detenido en una intersección regulada por semáforo y sea un obstáculo debe salir sin esperar a que se permita su dirección, si no entorpece a los demás.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 59.2", "img": null}, {"tema": 4, "q": "Tienes prioridad de paso en una intersección, pero el tráfico de delante está retenido y previsiblemente quedarías detenido en mitad del cruce. ¿Qué debes hacer?", "opts": ["No entrar en la intersección hasta tener espacio libre para salir de ella", "Entrar y avisar con el claxon a quienes circulan en sentido transversal", "Entrar, porque tu prioridad te permite ocupar el cruce y los demás deben esperar"], "a": 0, "expl": "Aunque se tenga prioridad, no se debe entrar en una intersección si se puede quedar detenido impidiendo u obstruyendo la circulación transversal.", "fuente": "RGC art. 59 (texto consolidado 26/06/2026 con RD 518/2026)", "img": null}, {"tema": 4, "q": "¿Qué deben hacer todos los conductores al aproximarse a un paso a nivel?", "opts": ["Extremar la prudencia y reducir la velocidad por debajo de la máxima permitida.", "Acelerar para cruzar cuanto antes si la vía está libre.", "Mantener la velocidad máxima permitida si no se ve ningún tren."], "a": 0, "expl": "Al aproximarse a un paso a nivel o a un puente móvil hay que extremar la prudencia y reducir la velocidad por debajo de la máxima permitida.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 95.1", "img": null}, {"tema": 4, "q": "Un camión de más de 3.500 kg de masa máxima autorizada circula por una autovía con tres carriles en su sentido. ¿Qué carriles puede utilizar?", "opts": ["El de su derecha y, si procede, el inmediato a este.", "Cualquiera de los tres, según la velocidad a la que circule.", "Solo el de la derecha, en ningún caso el contiguo a este."], "a": 0, "expl": "Con tres o más carriles, estos camiones circulan normalmente por el de la derecha y pueden usar el inmediato, con igual condición y circunstancias.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 31.2", "img": null}, {"tema": 4, "q": "Un turismo y una motocicleta se encuentran en un tramo estrecho, sin señales ni obras, y uno debe retroceder. Si no se sabe quién entró antes, ¿quién tiene preferencia?", "opts": ["El que circule a mayor velocidad.", "El turismo.", "La motocicleta, por maniobrar con más facilidad."], "a": 1, "expl": "En el orden de preferencia del art. 62, los turismos preceden a las motocicletas, ciclomotores de dos ruedas y bicicletas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 62.1", "img": null}, {"tema": 4, "q": "¿Se puede adelantar en una curva de visibilidad reducida?", "opts": ["Solo si los sentidos están delimitados y no se invade el contrario.", "No, en ningún caso, aunque los sentidos estén claramente delimitados.", "Sí, si se avisa con la bocina antes de iniciar la maniobra."], "a": 0, "expl": "Se prohíbe adelantar en curvas y cambios de rasante de visibilidad reducida, salvo que los dos sentidos estén claramente delimitados y la maniobra se haga sin invadir el sentido contrario.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 87.1.a)", "img": null}, {"tema": 4, "q": "Tras completar un adelantamiento, ¿cómo debes reintegrarte a tu carril?", "opts": ["Únicamente cuando el vehículo adelantado haya reducido por completo su velocidad.", "Gradualmente y cuanto antes, sin obligar a otros a variar su marcha.", "Con un giro brusco, para ocupar el carril del adelantado el menor tiempo posible."], "a": 1, "expl": "El conductor debe reintegrarse tan pronto como le sea posible, de modo gradual, sin obligar a otros usuarios a modificar su trayectoria o velocidad, y avisarlo.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 85.3", "img": null}, {"tema": 4, "q": "En una intersección señalizada con ceda el paso, un vehículo de la vía preferente se acerca por tu izquierda. ¿Debes cederle el paso?", "opts": ["Sí, vengan por el lado que vengan.", "No, si tú has llegado antes que él a la intersección.", "Solo si se aproxima por tu derecha, no por la izquierda."], "a": 0, "expl": "En intersecciones con ceda el paso o stop se cede siempre el paso a los vehículos de la vía preferente, cualquiera que sea el lado por el que se aproximen.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 56.5", "img": null}, {"tema": 4, "q": "Circulas por un túnel de doble sentido que dispone de dos carriles para tu sentido. ¿Puedes adelantar?", "opts": ["No, en un túnel está prohibido adelantar en todo caso.", "Sí, siempre que no invadas el sentido contrario.", "Sí, invadiendo el sentido contrario si lo ves libre."], "a": 1, "expl": "En túneles con circulación en ambos sentidos se prohíbe adelantar, salvo que haya más de un carril para tu sentido, en cuyo caso se puede adelantar sin invadir el sentido contrario.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 95.6", "img": null}, {"tema": 4, "q": "Al circular por una glorieta, ¿cómo debe rodearse su centro?", "opts": ["Dejando el centro de la glorieta a la derecha.", "Dejando el centro de la glorieta a la izquierda.", "Por el lado que resulte más corto hasta la salida."], "a": 1, "expl": "En plazas, glorietas y encuentros de vías los vehículos circulan dejando a su izquierda el centro de aquellas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 43.2", "img": null}, {"tema": 4, "q": "Dentro de poblado, en una calzada con dos carriles para tu sentido delimitados por marcas, ¿se puede adelantar por la derecha?", "opts": ["Sí, tras comprobar previamente que se puede hacer sin peligro.", "No, salvo que el vehículo adelantado esté parado.", "No, solo se permite adelantar por la izquierda."], "a": 0, "expl": "Dentro de los poblados, con al menos dos carriles del mismo sentido delimitados por marcas, se permite adelantar por la derecha tras comprobar que no hay peligro.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 82.3", "img": null}, {"tema": 4, "q": "Un vehículo de policía situado detrás del tuyo muestra sus señales especiales y una luz roja intermitente hacia delante. ¿Qué debes hacer?", "opts": ["Detenerte en tu carril, bajar del vehículo y esperar junto a la puerta trasera.", "Seguir hasta el siguiente área de servicio y detenerte allí con total calma.", "Detenerte a la derecha, delante del vehículo policial, y no salir del tuyo."], "a": 2, "expl": "Debes detener el vehículo a la derecha, delante del policial, en un lugar sin riesgo, permanecer en su interior y seguir las instrucciones del agente.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 69", "img": null}, {"tema": 4, "q": "Sales a una vía de uso público desde un camino exclusivamente privado. ¿A quién debes ceder el paso?", "opts": ["Solo a los que se aproximen por tu derecha, como en un cruce sin señales.", "Solo a los que circulen en sentido contrario al tuyo en esa vía.", "A los vehículos de la vía, circulen en el sentido que circulen."], "a": 2, "expl": "Quien sale por un camino privado a una vía pública cede el paso a los vehículos que circulen por ella, cualquiera que sea su sentido.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 72.2", "img": null}, {"tema": 4, "q": "¿Puede adelantarse a otro vehículo dentro de una glorieta?", "opts": ["Sí, la prohibición en intersecciones no se aplica a las glorietas.", "Solo si el vehículo adelantado es una bicicleta o un ciclomotor.", "No, está prohibido adelantar en cualquier intersección, glorietas incluidas."], "a": 0, "expl": "El art. 87 prohíbe adelantar en las intersecciones y sus proximidades, pero exceptúa las plazas de circulación giratoria o glorietas.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 87.1.c).1.º", "img": null}, {"tema": 4, "q": "En una carretera con arcenes se ha habilitado un carril adicional circunstancial con elementos provisionales de balizamiento. ¿Qué velocidades se aplican, salvo que se señalicen otras inferiores?", "opts": ["Máxima de 60 km/h y mínima de 40 km/h.", "Máxima de 80 km/h y mínima de 60 km/h.", "Máxima de 100 km/h y mínima de 80 km/h."], "a": 1, "expl": "En el carril adicional circunstancial y en los arcenes se circula a una velocidad máxima de 80 km/h y mínima de 60, o inferiores si así está señalizado.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 42.1", "img": null}, {"tema": 4, "q": "Un turismo circula por una vía pavimentada y otro sale a ella desde un camino sin pavimentar, sin señales. ¿Quién tiene preferencia?", "opts": ["El que llegue antes a la intersección.", "El que se aproxima por la derecha del otro.", "El que circula por la vía pavimentada."], "a": 2, "expl": "En defecto de señal se cede a quien viene por la derecha, salvo que quien circula por una vía pavimentada tiene preferencia frente al procedente de otra sin pavimentar.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 57.1.a", "img": null}, {"tema": 4, "q": "Llegas a un paso a nivel sin barreras, semibarreras ni semáforos. ¿Qué debes hacer antes de penetrar en él?", "opts": ["Seguir al vehículo que te precede si este cruza sin detenerse.", "Cruzar con rapidez si no oyes ningún tren a lo lejos.", "Cerciorarte de que no se acerca ningún vehículo sobre raíles."], "a": 2, "expl": "Nadie debe entrar en un paso a nivel sin barreras ni semáforos sin cerciorarse antes de que no se acerca ningún vehículo sobre raíles.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 96.2", "img": null}, {"tema": 4, "q": "Dos turismos se encuentran en un estrechamiento que no permite el cruce, sin señalización ni obras y sin dudas sobre la dificultad de maniobra. ¿Quién tiene preferencia?", "opts": ["El que lleve más ocupantes en el interior de su vehículo", "El que circule a mayor velocidad de los dos en ese momento", "El que haya entrado primero en el estrechamiento"], "a": 2, "expl": "Si la estrechez impide o dificulta el cruce y no hay señalización, tiene preferencia el vehículo que hubiese entrado primero.", "fuente": "RGC art. 60.1", "img": null}, {"tema": 4, "q": "En una vía de doble sentido, un tranvía circula por la zona central de la calzada. ¿Por qué lado debe adelantarse?", "opts": ["No está permitido adelantar a los tranvías en ningún caso.", "Por la derecha, con máximas precauciones.", "Por la izquierda, como a cualquier otro vehículo."], "a": 1, "expl": "Por excepción, en vías con circulación en ambos sentidos se adelanta por la derecha a los tranvías que marchan por la zona central.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 82.2", "img": null}, {"tema": 4, "q": "Te acercas a un paso a nivel con barreras, y estas empiezan a bajar mientras el tren aún no ha llegado. ¿Qué debes hacer?", "opts": ["Entrar solo si puedes pasar a velocidad moderada rodeando las barreras por el carril contrario", "Cruzar con rapidez si no ves el tren, antes de que las barreras terminen de cerrarse del todo", "No entrar en el paso a nivel y esperar hasta que se levanten las barreras"], "a": 2, "expl": "Está prohibido entrar en un paso a nivel con barreras o semibarreras atravesadas en la vía o en movimiento, o con semáforo que ordene detenerse.", "fuente": "RGC art. 96.1", "img": null}, {"tema": 4, "q": "Circulas por una carretera convencional y percibes las señales especiales de una ambulancia en servicio urgente que se aproxima. ¿Qué debes hacer?", "opts": ["Acelerar para liberar cuanto antes el carril por el que ella circula hacia delante", "Facilitarle el paso, apartándote normalmente a la derecha o deteniéndote si es preciso", "Mantener posición y velocidad, porque la ambulancia debe adaptarse al tráfico existente"], "a": 1, "expl": "Al percibir las señales especiales de un vehículo prioritario hay que facilitarle el paso, apartándose normalmente a la derecha o deteniéndose si fuera preciso.", "fuente": "RGC art. 69 (redacción RD 518/2026)", "img": null}, {"tema": 4, "q": "Encuentras cerrado un paso a nivel y ya hay otros vehículos esperando. ¿Qué debes hacer?", "opts": ["Adelantar a los vehículos que esperan para cruzar el primero.", "Detenerte detrás del último vehículo, en tu carril, hasta que tengas paso libre.", "Esperar en el carril contrario para cruzar en cuanto se levante la barrera."], "a": 1, "expl": "Quien encuentre cerrado el paso a nivel debe detenerse uno detrás de otro en el carril correspondiente hasta que tenga paso libre.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 95.2", "img": null}, {"tema": 4, "q": "En un cruce sin señales entre una calle y una vía de tranvía a nivel, ¿quién tiene prioridad de paso?", "opts": ["El vehículo que llegue antes al cruce.", "El vehículo que se acerque por la derecha.", "El tranvía."], "a": 2, "expl": "Los vehículos que circulan por raíles tienen prioridad de paso sobre los demás usuarios cuando no hay señal que regule la preferencia.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 57.1.b", "img": null}, {"tema": 4, "q": "Un camión de más de 3.500 kg circula fuera de poblado por una calzada con dos carriles para su sentido. ¿Por cuál debe circular normalmente?", "opts": ["Por el que prefiera, sin necesidad de volver nunca al de la derecha.", "Por el de la derecha, usando el otro si no entorpece a quien le siga.", "Por el de la izquierda, reservado siempre a los vehículos más rápidos."], "a": 1, "expl": "Se circula normalmente por el carril más a la derecha, pudiendo usar los demás cuando las circunstancias lo aconsejen y sin entorpecer la marcha de otro vehículo que siga.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 31.1", "img": null}, {"tema": 4, "q": "En un tramo de carretera convencional con adelantamiento prohibido, sin autorización expresa de cambio de sentido, ¿puede invertirse el sentido de la marcha?", "opts": ["No, el cambio de sentido también está prohibido en esos tramos.", "Sí, si se avisa con el intermitente con suficiente antelación.", "Sí, si hay buena visibilidad y no se acerca ningún vehículo."], "a": 0, "expl": "El cambio de sentido se prohíbe en todos los tramos en que está prohibido adelantar, salvo autorización expresa.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 79.1", "img": null}, {"tema": 4, "q": "Has iniciado un adelantamiento y adviertes que terminarlo puede resultar arriesgado. ¿Qué debes hacer?", "opts": ["Continuar la maniobra y conectar la luz de emergencia del vehículo.", "Acelerar al máximo para terminar cuanto antes la maniobra iniciada.", "Reducir la marcha, volver a tu carril y avisar a quien te sigue."], "a": 2, "expl": "Si surgen circunstancias que dificultan finalizar sin riesgo, se reduce rápidamente la marcha, se regresa al carril y se advierte a los que siguen.", "fuente": "RGC (RD 1428/2003, texto consolidado con RD 518/2026) art. 85.2", "img": null}, {"tema": 5, "q": "¿En cuál de estos lugares queda prohibido parar?", "opts": ["En una calle urbana de doble sentido, junto al bordillo derecho", "En túneles, pasos inferiores y tramos con la señal «Túnel»", "En una zona de estacionamiento regulado con limitación horaria"], "a": 1, "expl": "Parar está prohibido en túneles, pasos inferiores y tramos con la señal «Túnel»; también en pasos a nivel, de ciclistas y de peatones.", "fuente": "RGC art. 94.1.a)", "img": null}, {"tema": 5, "q": "En una calzada de doble sentido, con un carril por sentido, ¿cómo se prepara el conductor que va a girar a la izquierda?", "opts": ["Se ciñe a la marca de separación o al eje, sin invadir el sentido contrario", "Se ciñe al borde derecho de la calzada para no estorbar a los que vienen detrás", "Invade ligeramente el sentido contrario para facilitar el giro"], "a": 0, "expl": "En calzada de doble sentido se ciñe a la marca de separación o al eje, sin invadir la zona del sentido contrario.", "fuente": "RGC art. 75.1.b)", "img": null}, {"tema": 5, "q": "Para abandonar una autovía por una salida con carril de deceleración, ¿cómo debe actuar el conductor?", "opts": ["Frenar en el carril por el que circula y entrar en el carril de deceleración solo cuando llegue al final de este.", "Circular con antelación por el carril más próximo a la salida y entrar cuanto antes en el carril de deceleración.", "Mantenerse en el carril central a la velocidad de la vía y entrar en el carril de deceleración lo más tarde posible."], "a": 1, "expl": "Hay que situarse con antelación en el carril más próximo a la salida y penetrar lo antes posible en el carril de deceleración.", "fuente": "RGC art. 77", "img": null}, {"tema": 5, "q": "¿Puede estacionarse un turismo delante de un vado correctamente señalizado si en ese momento nadie entra ni sale por él?", "opts": ["Sí, si deja visible un teléfono de contacto para poder mover el vehículo.", "Sí, mientras no haya ningún vehículo entrando o saliendo del vado en ese instante.", "No, está prohibido estacionar delante de un vado correctamente señalizado."], "a": 2, "expl": "Está prohibido estacionar delante de un vado señalizado correctamente, aunque en ese momento nadie lo esté usando.", "fuente": "RGC art. 94.2.f", "img": null}, {"tema": 5, "q": "Fuera de poblado, sin que exista ninguna emergencia, ¿dónde debe parar o estacionar un vehículo?", "opts": ["Sobre la calzada, en el lado derecho, siempre que se enciendan las luces de posición.", "Fuera de la calzada, en el lado derecho, dejando libre la parte transitable del arcén.", "En el arcén derecho, ocupando la parte transitable del mismo para no estorbar a la calzada."], "a": 1, "expl": "En vías interurbanas la parada y el estacionamiento se hacen fuera de la calzada, a la derecha y sin ocupar la parte transitable del arcén.", "fuente": "RGC art. 90.1", "img": null}, {"tema": 5, "q": "¿Puede un conductor dar marcha atrás en una autovía para tomar una salida que ha rebasado?", "opts": ["No, está prohibido en autovías y autopistas", "Sí, si lo hace lentamente y con las luces de emergencia", "Sí, siempre que circule por el carril de la derecha"], "a": 0, "expl": "Se prohíbe la maniobra de marcha atrás en autovías y autopistas, sin excepciones.", "fuente": "RGC art. 80.3", "img": null}, {"tema": 5, "q": "¿Puede hacerse un cambio de sentido en un tramo donde esté prohibido adelantar?", "opts": ["Sí, siempre que no se vea ningún vehículo en ese momento", "No, salvo autorización expresa del cambio de sentido", "Sí, si se hace con las luces intermitentes encendidas"], "a": 1, "expl": "El cambio de sentido se prohíbe en todos los tramos donde esté prohibido adelantar, salvo autorización expresa.", "fuente": "RGC art. 79.1", "img": null}, {"tema": 5, "q": "Un conductor deja su coche en una zona de estacionamiento con limitación horaria, con el distintivo colocado, pero rebasa el tiempo máximo. ¿Qué ocurre?", "opts": ["Se admite hasta media hora más sin necesidad de renovar el distintivo", "Se admite si no hay otro vehículo esperando para ocupar el sitio", "Queda prohibido estacionar en exceso sobre el tiempo máximo"], "a": 2, "expl": "Estacionar en zona con limitación horaria sin distintivo, o excediendo el tiempo máximo con él colocado, está prohibido.", "fuente": "RGC art. 94.2.b)", "img": null}, {"tema": 5, "q": "En una calzada de doble sentido con tres carriles separados por líneas discontinuas, ¿dónde se coloca quien va a girar a la izquierda?", "opts": ["En el carril situado más a la derecha", "En el carril central", "En el carril situado más a la izquierda"], "a": 1, "expl": "En calzada de doble sentido y tres carriles separados por líneas discontinuas, quien va a girar a la izquierda se coloca en el carril central, que solo se usa para adelantar y para cambiar de dirección hacia la izquierda.", "fuente": "RGC art. 75.1.b) y 30.1.b)", "img": null}, {"tema": 5, "q": "En una calzada de doble sentido hay una isleta que separa ambos sentidos. ¿Por qué parte debe circularse?", "opts": ["Por la parte que quede a la izquierda de la isleta, en el sentido de la marcha", "Por cualquiera de los dos lados, según la densidad de tráfico", "Por la parte que quede a la derecha de la isleta, en el sentido de la marcha"], "a": 2, "expl": "Con refugios, isletas o dispositivos de guía se circula por la parte que queda a su derecha; solo en vías de sentido único o dentro de un sentido puede hacerse por cualquier lado.", "fuente": "RGC art. 43.1", "img": null}, {"tema": 5, "q": "En una autovía de dos carriles por sentido, la nieve dificulta la circulación. ¿Qué debe cumplirse?", "opts": ["Se puede adelantar con precaución por el carril izquierdo, con las luces de cruce encendidas.", "Solo se prohíbe adelantar a camiones y autobuses; el resto de vehículos puede hacerlo.", "Está prohibido adelantar y debe circularse por el carril de la derecha."], "a": 2, "expl": "Con nieve que dificulta la circulación en autopistas y autovías queda prohibido adelantar y se circula por el carril más a la derecha, dejando libres los de la izquierda para vehículos de emergencia y quitanieves.", "fuente": "RGC art. 32.2 (redacción RD 518/2026, en vigor 1-10-2026)", "img": null}, {"tema": 5, "q": "Un vehículo averiado ocupa parcialmente el carril por el que circulamos. Al rebasarlo, ¿qué exige el Reglamento?", "opts": ["Separarse 1,5 metros como mínimo y reducir al menos 20 km/h respecto al límite de la vía.", "Separarse 1 metro como mínimo y reducir al menos 10 km/h respecto al límite de la vía, si hay tráfico.", "Avisar con la bocina y pasar sin modificar la velocidad cuando el sentido contrario esté libre."], "a": 0, "expl": "Desde el RD 518/2026, rebasar un vehículo inmovilizado exige mantener una anchura de seguridad de al menos 1,5 m y reducir la velocidad al menos 20 km/h respecto al límite de la vía.", "fuente": "RGC art. 88.1 (redacción RD 518/2026, en vigor 1-10-2026)", "img": null}, {"tema": 5, "q": "¿Cuál de estos estacionamientos se considera en lugar peligroso o que obstaculiza gravemente la circulación?", "opts": ["El que obstaculiza un paso rebajado para personas con discapacidad", "El que se hace junto a la acera, a más de tres metros de la línea continua", "El que se hace paralelo al bordillo, dejando libre el paso de otros vehículos"], "a": 0, "expl": "El art. 91.2.d) incluye expresamente obstaculizar los pasos rebajados para disminuidos físicos.", "fuente": "RGC art. 91.2.d)", "img": null}, {"tema": 5, "q": "Un conductor da marcha atrás como maniobra complementaria para estacionar. ¿Qué recorrido máximo puede hacer hacia atrás?", "opts": ["15 metros como máximo, sin invadir un cruce de vías.", "30 metros como máximo, pudiendo atravesar un cruce si no se acerca ningún vehículo.", "50 metros como máximo, siempre que no invada ningún cruce de vías."], "a": 0, "expl": "El recorrido hacia atrás como maniobra complementaria de la parada, el estacionamiento o la incorporación no puede superar los 15 metros ni invadir un cruce de vías.", "fuente": "RGC art. 80.2", "img": null}, {"tema": 5, "q": "Un turismo con caja de cambios se deja estacionado en una pendiente descendente. ¿Qué marcha debe quedar colocada?", "opts": ["La marcha atrás", "La primera marcha", "El punto muerto"], "a": 0, "expl": "En pendiente ascendente se deja la primera; en descendente, la marcha atrás (o la posición de estacionamiento).", "fuente": "RGC art. 92.3.c)", "img": null}, {"tema": 5, "q": "En una autovía con tres carriles por sentido, el tráfico avanza muy despacio o está detenido por una retención. ¿Entre qué carriles debe formarse el carril de emergencia?", "opts": ["Entre el carril central y el carril situado más a la derecha de la calzada.", "Entre el carril situado más a la izquierda y el contiguo.", "En el arcén derecho, que deben ocupar los vehículos del carril situado más a la derecha."], "a": 1, "expl": "Con tres o más carriles por sentido, el espacio libre para vehículos de emergencia se forma entre el carril más a la izquierda y el contiguo; los del carril izquierdo se pegan a la izquierda y los demás a la derecha.", "fuente": "RGC art. 32.1 (redacción RD 518/2026, en vigor 1-10-2026)", "img": null}, {"tema": 5, "q": "Un conductor espera en la calzada para cambiar de sentido y su permanencia impide avanzar a los vehículos de detrás. ¿Qué debe hacer, si es posible?", "opts": ["Hacer sonar el claxon para que los de atrás esperen", "Mantenerse en su sitio con las luces de emergencia encendidas hasta poder girar", "Salir de la calzada por su lado derecho hasta poder hacer la maniobra"], "a": 2, "expl": "Si su espera impide continuar a los de atrás, debe salir por su lado derecho hasta que las condiciones permitan el cambio de sentido.", "fuente": "RGC art. 78.1", "img": null}, {"tema": 5, "q": "En poblado, un autobús urbano sale de una parada señalizada. ¿Qué deben hacer los demás conductores?", "opts": ["Acelerar para pasar antes de que el autobús se incorpore a la circulación", "Desplazarse lateralmente o reducir la velocidad, deteniéndose si hace falta", "Mantener su marcha normal, pues el autobús debe ceder el paso al resto del tráfico"], "a": 1, "expl": "En poblado deben facilitar la maniobra del transporte colectivo desplazándose o reduciendo la velocidad hasta detenerse si es preciso.", "fuente": "RGC art. 73.2", "img": null}, {"tema": 5, "q": "¿En qué casos está permitido circular hacia atrás, además de en maniobras complementarias de otra que lo exija?", "opts": ["Cuando la vía sea de un solo sentido y no circulen otros vehículos", "Cuando el conductor prefiera evitar un giro a la izquierda complicado", "Cuando no pueda avanzar ni cambiar de dirección o de sentido"], "a": 2, "expl": "Solo se permite si no se puede avanzar ni cambiar de dirección o sentido, y con el recorrido mínimo indispensable.", "fuente": "RGC art. 80.1", "img": null}, {"tema": 5, "q": "En una autovía, y sin que exista avería ni emergencia, ¿dónde está permitido parar?", "opts": ["En el arcén derecho, siempre que se enciendan las luces de emergencia.", "Únicamente en las zonas habilitadas expresamente para ello.", "En cualquier punto del arcén, si la parada dura menos de cinco minutos."], "a": 1, "expl": "En autopistas y autovías está prohibido parar salvo en las zonas habilitadas para ello.", "fuente": "RGC art. 94.1.g", "img": null}, {"tema": 5, "q": "Un conductor sale de un camino exclusivamente privado a una vía de uso público. ¿Qué debe hacer?", "opts": ["Ceder el paso únicamente a los vehículos que se aproximen por su lado izquierdo", "Asegurarse de que no hay peligro y ceder el paso a todos los vehículos de la vía", "Salir con rapidez para no entorpecer la marcha de los vehículos de la vía pública"], "a": 1, "expl": "Debe salir a velocidad que le permita detenerse en el acto y ceder el paso a los vehículos de la vía, cualquiera que sea su sentido.", "fuente": "RGC art. 72.2", "img": null}, {"tema": 5, "q": "En una autovía, ¿dónde puede un conductor cambiar el sentido de su marcha?", "opts": ["En cualquier punto, si advierte la maniobra con los intermitentes.", "En cualquier tramo recto con buena visibilidad y poco tráfico.", "Únicamente en los lugares habilitados al efecto."], "a": 2, "expl": "El cambio de sentido está prohibido en autopistas y autovías salvo en los lugares habilitados al efecto.", "fuente": "RGC art. 79.1", "img": null}, {"tema": 5, "q": "¿Qué ocurre si un vehículo se estaciona sobre una isleta u otro elemento de canalización del tráfico?", "opts": ["Está permitido si el conductor permanece dentro del vehículo y no hay peatones cerca", "Se considera estacionamiento en lugar peligroso o que obstaculiza gravemente", "Está permitido si no se impide el paso de otros vehículos ni la visibilidad de la señalización"], "a": 1, "expl": "Estacionar en medianas, separadores, isletas u otros elementos de canalización es un supuesto de estacionamiento peligroso.", "fuente": "RGC art. 91.2.e)", "img": null}, {"tema": 5, "q": "Una vía dispone de carril de aceleración. ¿Cómo debe actuar el conductor que lo utiliza para incorporarse a la calzada?", "opts": ["Esperar detenido al comienzo del carril hasta que la calzada quede completamente libre y acelerar después a fondo.", "Cerciorarse al comienzo del carril de que puede incorporarse sin peligro y acelerar hasta la velocidad adecuada.", "Incorporarse sin comprobar nada, porque la ley obliga a los demás vehículos de la calzada a cederle siempre el paso."], "a": 1, "expl": "Debe comprobar al principio del carril (incluso deteniéndose si es necesario) que no pone en peligro a nadie y después acelerar hasta la velocidad adecuada para incorporarse.", "fuente": "RGC art. 72.4", "img": null}, {"tema": 5, "q": "Como regla general, ¿cómo debe colocarse un vehículo al parar o estacionar?", "opts": ["En espiga cuando haya espacio libre, aunque la vía admita la colocación en línea", "En batería, para aprovechar mejor el espacio, salvo que esté prohibido", "Paralelamente al borde de la calzada, salvo excepciones justificadas"], "a": 2, "expl": "La regla es la colocación paralela al borde de la calzada, con excepciones justificadas por la vía o las circunstancias.", "fuente": "RGC art. 92.1", "img": null}, {"tema": 5, "q": "Si al dar marcha atrás no puede comprobar bien el espacio libre, ¿qué prevé el Reglamento?", "opts": ["Avisar con el claxon y retroceder con la mayor rapidez posible", "Cerciorarse, incluso apeándose o con indicaciones de otra persona", "Confiar en los retrovisores y retroceder con las luces de emergencia"], "a": 1, "expl": "La maniobra se hace lentamente y tras cerciorarse de que no hay peligro, incluso bajando del vehículo o con ayuda de otra persona.", "fuente": "RGC art. 81.1", "img": null}, {"tema": 5, "q": "Respecto al estacionamiento en doble fila, ¿qué establece el Reglamento General de Circulación?", "opts": ["Queda prohibido estacionar en doble fila", "Se permite si no se obstaculiza a otros vehículos", "Se permite si se encienden las luces de emergencia"], "a": 0, "expl": "Estacionar en doble fila está prohibido y, si se hace sin conductor, se considera estacionamiento en lugar peligroso o que obstaculiza gravemente la circulación.", "fuente": "RGC art. 94.2.g) y 91.2.h)", "img": null}, {"tema": 5, "q": "En una vía urbana de un solo sentido de circulación, sin ordenanza municipal que disponga otra cosa, ¿en qué lado de la calzada puede estacionarse?", "opts": ["Solo en el borde izquierdo, para dejar libre el derecho al transporte público.", "En el borde derecho y también en el izquierdo.", "Solo en el borde derecho, igual que en las vías de doble sentido."], "a": 1, "expl": "En vías urbanas se estaciona lo más cerca posible del borde derecho, pero en las de único sentido se puede hacer también en el lado izquierdo.", "fuente": "RGC art. 90.2", "img": null}, {"tema": 5, "q": "Un camión de más de 3.500 kg de masa máxima autorizada se estaciona en un lugar de pendiente acusada. ¿Qué debe hacer, además de las medidas generales?", "opts": ["Basta con accionar el freno de estacionamiento, porque el calzado es voluntario en estos casos.", "Usar como calzos piedras u otros objetos que encuentre a mano junto a la calzada.", "Dejarlo calzado con calzos específicos o apoyando una rueda directriz en el bordillo."], "a": 2, "expl": "En pendiente sensible los vehículos de más de 3.500 kg, autobuses y conjuntos deben calzarse con calzos (no piedras u otros elementos) o apoyando una rueda directriz en el bordillo, y retirar los calzos al reanudar la marcha.", "fuente": "RGC art. 92.3.d", "img": null}, {"tema": 6, "q": "En poblado, ¿puede un conductor advertir de un peligro con destellos de las luces de cruce o de largo alcance en lugar de la bocina?", "opts": ["No, en poblado solo puede advertirse con señales acústicas", "Sí, pero únicamente con la luz de largo alcance y a intervalos largos", "Sí, de modo intermitente, a intervalos muy cortos y sin deslumbrar"], "a": 2, "expl": "Las advertencias luminosas pueden sustituir a las acústicas, incluso en poblado, evitando deslumbrar.", "fuente": "RGC art. 109.3", "img": null}, {"tema": 6, "q": "Si un conductor sufre deslumbramiento por otro vehículo, ¿qué debe hacer?", "opts": ["Mantener la velocidad y devolver el deslumbramiento con la luz de largo alcance un instante.", "Acelerar para salir cuanto antes de la zona en la que se produce el deslumbramiento.", "Reducir la velocidad lo necesario, incluso hasta detenerse, para no alcanzar a nadie."], "a": 2, "expl": "Quien sufre deslumbramiento debe reducir la velocidad lo necesario, incluso hasta la detención total, para evitar alcances.", "fuente": "RGC art. 102.3", "img": null}, {"tema": 6, "q": "Un conductor va a detener su vehículo para estacionar a su derecha. ¿Qué indicador luminoso debe usar, además de advertir que frena?", "opts": ["Ninguno, porque bastan las luces de freno para advertir a los demás usuarios.", "Las dos luces de emergencia, sea cual sea el lado en el que vaya a estacionar.", "El indicador de dirección del lado en el que se vaya a inmovilizar."], "a": 2, "expl": "Si la inmovilización es para parar o estacionar debe emplearse, además de las luces de freno, el indicador luminoso de dirección correspondiente al lado hacia el que se vaya a efectuar.", "fuente": "RGC art. 109.2", "img": null}, {"tema": 6, "q": "De día, ¿qué vehículos deben llevar encendida la luz de cruce al circular por un carril reversible?", "opts": ["Ninguno, pues de día su uso es voluntario también en esos carriles.", "Todos los vehículos que circulen por él.", "Solo los vehículos de más de 3.500 kg de masa máxima autorizada."], "a": 1, "expl": "Deben llevar la luz de corto alcance de día todos los vehículos que circulen por un carril reversible, un carril adicional circunstancial o uno habilitado en sentido contrario.", "fuente": "RGC art. 104.b", "img": null}, {"tema": 6, "q": "Además de los vehículos que circulan en sentido contrario, ¿con qué otros vehículos debe cambiarse de largo alcance a cruce para evitar deslumbrar?", "opts": ["Con los del mismo sentido que puedan deslumbrarse por el retrovisor", "Con ninguno más: la obligación afecta solo a los de sentido contrario", "Con los que circulan a menos de 40 km/h en el mismo sentido"], "a": 0, "expl": "La misma precaución rige para los vehículos que van en el mismo sentido y pueden ser deslumbrados a través del retrovisor.", "fuente": "RGC art. 102.2", "img": null}, {"tema": 6, "q": "Por una avería irreparable en ruta, un conductor debe circular con un alumbrado de intensidad inferior a la correspondiente. ¿Qué debe hacer?", "opts": ["Circular solo por el arcén con las luces de emergencia hasta llegar a destino", "Mantener la velocidad y utilizar la bocina para avisar a los demás usuarios", "Reducir la velocidad hasta poder detenerse dentro de la zona iluminada"], "a": 2, "expl": "Debe reducir la velocidad hasta la que permita detener el vehículo dentro de la zona iluminada.", "fuente": "RGC art. 107", "img": null}, {"tema": 6, "q": "¿Cuándo debe llevarse encendida la luz antiniebla trasera?", "opts": ["Solo con condiciones especialmente desfavorables, como niebla espesa o nevada fuerte.", "Siempre que se circule de noche por vías interurbanas, para ser más visible desde atrás.", "Siempre que llueva, con independencia de la intensidad de la lluvia y de la visibilidad que haya."], "a": 0, "expl": "La antiniebla trasera solo debe encenderse con condiciones meteorológicas o ambientales especialmente desfavorables (niebla espesa, lluvia muy intensa, fuerte nevada, nubes densas de polvo o humo).", "fuente": "RGC art. 106.2", "img": null}, {"tema": 6, "q": "¿Qué se entiende por vía insuficientemente iluminada?", "opts": ["Aquella en la que no se lee la matrícula a 50 m o no se ve un vehículo oscuro a 10 m", "Aquella en la que no se lee la matrícula a 10 m o no se ve un vehículo oscuro a 50 m", "Aquella en la que ningún vehículo se distingue a más de 100 metros con vista normal"], "a": 1, "expl": "El Reglamento fija dos criterios con vista normal: matrícula a 10 metros y vehículo pintado de oscuro a 50 metros.", "fuente": "RGC art. 100.3", "img": null}, {"tema": 6, "q": "Al activar la señal V-16 tras una avería, ¿dónde debe colocarse?", "opts": ["En el interior del vehículo, apoyada en la luneta trasera.", "En el suelo, sobre la calzada, unos 50 metros detrás del vehículo.", "En la parte más alta posible del vehículo, normalmente el techo."], "a": 2, "expl": "La V-16 se coloca en la parte más alta posible del vehículo inmovilizado, para garantizar su máxima visibilidad.", "fuente": "RGV anexo XI, V-16 ap. 2", "img": null}, {"tema": 6, "q": "Un turismo con luz de largo alcance circula a 60 km/h, de día, por un túnel insuficientemente iluminado y sin tráfico delante. ¿Qué luz debe llevar encendida?", "opts": ["La de largo alcance", "Solo la antiniebla delantera", "Solo las luces de posición"], "a": 0, "expl": "Debe llevar la luz de largo alcance en túneles insuficientemente iluminados, salvo que deba usarse la de cruce.", "fuente": "RGC art. 100.1", "img": null}, {"tema": 6, "q": "Un turismo circula a 90 km/h, de noche, fuera de poblado, por una carretera sin iluminación y sin ningún vehículo a la vista. ¿Qué alumbrado debe llevar?", "opts": ["Únicamente la luz de corto alcance, que es la única permitida fuera de poblado.", "La luz de largo alcance o carretera, además de la de posición.", "Solo las luces de posición, pues las de carretera se reservan para la niebla."], "a": 1, "expl": "A más de 40 km/h, de noche, fuera de poblado y por vías insuficientemente iluminadas debe llevarse la luz de largo alcance, salvo que deba usarse la de cruce para evitar deslumbrar.", "fuente": "RGC art. 100.1", "img": null}, {"tema": 6, "q": "Fuera de poblado, de noche y por una vía insuficientemente iluminada, ¿a partir de qué velocidad es obligatoria la luz de largo alcance, si el vehículo la lleva?", "opts": ["A más de 30 km/h", "A más de 40 km/h", "A más de 50 km/h"], "a": 1, "expl": "Es obligatoria cuando se circula a más de 40 km/h, salvo que haya que usar la de cruce.", "fuente": "RGC art. 100.1", "img": null}, {"tema": 6, "q": "Un vehículo queda inmovilizado por una emergencia dentro de un túnel. ¿Cómo debe solicitar auxilio su conductor?", "opts": ["Esperando dentro del vehículo a que algún conductor que pase avise a los servicios de emergencia.", "Saliendo a la calzada para parar a otros vehículos y pedirles que avisen a los servicios de auxilio.", "Sin demora, desde el poste de socorro (SOS) más próximo, si existe."], "a": 2, "expl": "El conductor debe solicitar auxilio sin demora desde el poste SOS más próximo, si existe, y seguir las instrucciones que se le den.", "fuente": "RGC art. 97.3", "img": null}, {"tema": 6, "q": "Además de en condiciones que disminuyen la visibilidad, ¿en qué otro caso puede usarse la luz antiniebla delantera?", "opts": ["En vías con muchas curvas, sea cual sea la anchura de la calzada", "En cualquier carretera de montaña, de noche, aunque la visibilidad sea buena y haya curvas", "En tramos estrechos con muchas curvas, de calzada de 6,50 m o menos, señalizados"], "a": 2, "expl": "También puede usarse en tramos estrechos (calzada de 6,50 m o menos) con señales de sucesión de curvas próximas.", "fuente": "RGC art. 106.2", "img": null}, {"tema": 6, "q": "¿Cuándo puede encenderse la luz antiniebla trasera de un vehículo?", "opts": ["Siempre que haya niebla, aunque no lleve ninguna otra luz de las anteriores encendida", "Solo si lo están también las de carretera, las de cruce o las antiniebla delanteras", "Cuando estén encendidas las luces de posición, aunque no haya ninguna otra luz"], "a": 1, "expl": "La antiniebla trasera exige que estén encendidas la de carretera, la de cruce o la antiniebla delantera.", "fuente": "RGV art. 15.3 (RD 2822/1998, texto consolidado)", "img": null}, {"tema": 6, "q": "Según el anexo XII del Reglamento General de Vehículos, ¿qué dispositivo de preseñalización de peligro forma parte de la dotación obligatoria de un turismo?", "opts": ["Un chaleco reflectante colocado sobre el techo", "La señal V-16, con geolocalización", "Dos triángulos de preseñalización de peligro"], "a": 1, "expl": "El anexo XII incluye como dotación el dispositivo luminoso de preseñalización V-16, que comunica su activación y posición a la DGT; los triángulos ya no figuran en la dotación.", "fuente": "RGV anexo XII, ap. 1.a) y anexo XI (V-16)", "img": null}, {"tema": 6, "q": "¿Puede llevarse encendida la luz de largo alcance cuando el vehículo está parado o estacionado?", "opts": ["Sí, si el motor permanece en marcha", "Sí, si es de noche y la vía está poco iluminada", "No, su uso está prohibido en esa situación"], "a": 2, "expl": "Se prohíbe la luz de largo alcance siempre que el vehículo esté parado o estacionado.", "fuente": "RGC art. 100.2", "img": null}, {"tema": 6, "q": "¿Cuándo deben llevar encendido el alumbrado que corresponda los vehículos que circulan por una vía?", "opts": ["Entre el ocaso y la salida del sol, y siempre en túneles y tramos con señal «Túnel».", "Entre el ocaso y la salida del sol, pero no en túneles cuando tengan iluminación propia suficiente.", "Solo desde una hora después del ocaso hasta una hora antes de la salida del sol, en cualquier vía."], "a": 0, "expl": "El alumbrado es obligatorio entre el ocaso y la salida del sol y, a cualquier hora del día, en túneles, pasos inferiores y tramos afectados por la señal «Túnel» (S-5).", "fuente": "RGC art. 98.1", "img": null}, {"tema": 6, "q": "De noche, un turismo está estacionado en una vía urbana (no travesía) cuya iluminación permite distinguirlo a suficiente distancia. ¿Qué ocurre con las luces de posición?", "opts": ["Debe llevar encendida la luz de cruce", "Debe llevar siempre encendidas las dos de posición traseras", "No es obligatorio que las tenga encendidas"], "a": 2, "expl": "En vías urbanas que no sean travesías no es obligatorio si la iluminación permite distinguir los vehículos estacionados.", "fuente": "RGC art. 105.3", "img": null}, {"tema": 6, "q": "De día, la lluvia intensa disminuye sensiblemente la visibilidad. ¿Es obligatorio utilizar el alumbrado?", "opts": ["Solo si el conductor circula por una vía interurbana de noche", "Sí, es obligatorio cuando la visibilidad disminuye sensiblemente", "No, el alumbrado es obligatorio solo entre el ocaso y la salida del sol"], "a": 1, "expl": "El alumbrado es obligatorio también con niebla, lluvia intensa, nevada o nubes de humo o polvo.", "fuente": "RGC art. 106.1", "img": null}, {"tema": 6, "q": "Un conductor avisa con el intermitente de un desplazamiento lateral. ¿Cuándo debe concluir la advertencia?", "opts": ["Tan pronto como el vehículo adopte su nueva trayectoria", "Cuando el vehículo que le sigue haya concluido su propia maniobra", "Cuando haya recorrido al menos cien metros tras la maniobra"], "a": 0, "expl": "Se avisa solo el desplazamiento lateral, por lo que la advertencia termina al adoptar la nueva trayectoria.", "fuente": "RGC art. 109.2.a)", "img": null}, {"tema": 6, "q": "De noche y con la luz de largo alcance encendida, se acerca un vehículo en sentido contrario. ¿Cuándo debe cambiarse a la luz de cruce?", "opts": ["Cuando los dos vehículos estén a punto de cruzarse, nunca antes.", "Tan pronto como se aprecie la posibilidad de deslumbrar al otro conductor.", "Solo cuando el otro conductor haga ráfagas o cambie él primero a la de cruce."], "a": 1, "expl": "La luz de largo alcance debe sustituirse por la de cruce en cuanto se aprecie la posibilidad de deslumbrar, muy especialmente a conductores que circulan en sentido contrario.", "fuente": "RGC art. 102.1", "img": null}, {"tema": 6, "q": "De día, un turismo entra en un túnel suficientemente iluminado señalizado con la S-5. ¿Qué alumbrado debe llevar?", "opts": ["Solo las luces de posición, al ser un túnel iluminado", "La luz de largo alcance, por ser un túnel iluminado", "Las luces de posición y la de cruce"], "a": 2, "expl": "En túneles suficientemente iluminados se lleva, a cualquier hora, el alumbrado de posición y el de cruce.", "fuente": "RGC art. 101.1", "img": null}, {"tema": 6, "q": "¿Cuándo debe llevar encendida la luz de corto alcance o de cruce una motocicleta?", "opts": ["Solo de día y por vías interurbanas", "Solo de noche, tanto en poblado como fuera de él", "Siempre, también de día y por cualquier vía"], "a": 2, "expl": "Las motocicletas deben llevar la luz de cruce encendida durante el día por cualquier vía.", "fuente": "RGC art. 104.a)", "img": null}, {"tema": 6, "q": "Un turismo queda inmovilizado por una avería en el arcén de una carretera, de noche. ¿Qué alumbrado debe tener encendido?", "opts": ["Las luces de posición y, en su caso, las de gálibo.", "Únicamente las luces de cruce, pues las de posición no son necesarias.", "Las luces de largo alcance, para que se vea desde lejos."], "a": 0, "expl": "Todo vehículo inmovilizado entre la puesta y la salida del sol en calzada o arcén debe tener encendidas las luces de posición y, en su caso, las de gálibo; además la luz de largo alcance está prohibida con el vehículo parado.", "fuente": "RGC art. 105.1 y art. 100.2", "img": null}, {"tema": 6, "q": "Cuando debe llevarse alumbrado, ¿a partir de qué anchura del vehículo son obligatorias también las luces de gálibo, además de las de posición?", "opts": ["Cuando la anchura del vehículo excede de 2,10 metros.", "Cuando la anchura del vehículo excede de 2,55 metros, que es el máximo legal.", "Cuando la anchura del vehículo excede de 1,80 metros, en todo caso."], "a": 0, "expl": "Las luces de gálibo se añaden a las de posición si la anchura del vehículo supera 2,10 metros.", "fuente": "RGC art. 99.1", "img": null}, {"tema": 7, "q": "¿Están obligados los ciclistas a someterse a las pruebas de detección de alcohol que ordene un agente?", "opts": ["Sí, igual que los conductores de vehículos", "No, solo se exige a los conductores de vehículos a motor", "Solo si han provocado un accidente"], "a": 0, "expl": "El RGC obliga a someterse a las pruebas de alcohol a todos los conductores de vehículos y de bicicletas.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 21", "img": null}, {"tema": 7, "q": "Conduciendo un turismo por una autovía, ¿cuándo se admite mantener una conversación telefónica?", "opts": ["Cuando se usa un solo auricular con volumen muy bajo", "Cuando se sostiene el móvil con la mano y el tráfico es fluido", "Cuando se hace sin emplear las manos ni usar auriculares"], "a": 2, "expl": "Está prohibido usar el móvil u otro sistema de comunicación durante la conducción, salvo si la comunicación se desarrolla sin emplear las manos ni cascos, auriculares o similares.", "fuente": "RGC art. 18.2 (redacción vigente desde 01/10/2026)", "img": null}, {"tema": 7, "q": "Un conductor se niega a realizar la prueba de alcoholemia que le requiere un agente. ¿Qué puede hacer el agente con su vehículo?", "opts": ["Precintarlo durante un año como mínimo en depósito", "Inmovilizarlo por la negativa a la prueba", "Nada, solo puede formular la denuncia al conductor"], "a": 1, "expl": "La negativa a efectuar las pruebas de detección alcohólica permite también inmovilizar el vehículo, igual que un resultado positivo.", "fuente": "RGC art. 25.2 (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Excepcionalmente, un menor puede ir de pasajero en una moto conducida por su padre, madre o tutor. ¿Qué edad debe superar?", "opts": ["Mayores de cinco años, con casco homologado y guantes", "Mayores de siete años, con casco homologado", "Mayores de diez años, con casco homologado y guantes"], "a": 1, "expl": "Excepcionalmente los mayores de siete años pueden viajar en motocicletas o ciclomotores conducidos por su padre, madre o tutor, con casco homologado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 12.2", "img": null}, {"tema": 7, "q": "Con el vehículo en movimiento, ¿cuál de estos dispositivos puede utilizar legalmente el conductor?", "opts": ["Un reproductor de vídeo o de DVD", "Un dispositivo GPS de navegación", "Una pantalla con acceso a internet"], "a": 1, "expl": "El reglamento considera incompatibles con la atención permanente las pantallas con acceso a internet, los monitores de televisión y los reproductores de vídeo o DVD; se exceptúa el GPS.", "fuente": "RGC art. 18.1, párrafo segundo (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Un conductor ha bebido de más y quiere reducir su tasa de alcohol antes de volver a conducir. ¿Qué es realmente eficaz?", "opts": ["Esperar el tiempo necesario sin conducir", "Respirar aire fresco con la ventanilla bajada", "Tomar un café bien cargado y comer algo"], "a": 0, "expl": "El alcohol solo se elimina con el tiempo, a un ritmo que varía según la persona; el café, la comida o el aire fresco no reducen la tasa.", "fuente": "DGT, consejos sobre alcohol y falsos mitos", "img": null}, {"tema": 7, "q": "Un menor de baja estatura viaja excepcionalmente en el asiento delantero de un turismo que tiene airbag frontal. ¿Cuándo puede usar un sistema de retención orientado hacia atrás?", "opts": ["Solo si el menor tiene más de tres años de edad", "Siempre, porque el airbag no afecta a estos sistemas", "Solo si el airbag frontal ha sido desactivado"], "a": 2, "expl": "En el asiento delantero con airbag frontal, el sistema de retención orientado hacia atrás solo puede utilizarse si el airbag está desactivado.", "fuente": "RGC art. 117.3 (no modificado por RD 518/2026)", "img": null}, {"tema": 7, "q": "Una madre conduce un turismo de cinco plazas con su hijo de 9 años, que mide 125 cm. Si no concurre ninguna circunstancia excepcional, ¿cómo debe viajar el niño?", "opts": ["En cualquier plaza del coche, siempre con el cinturón abrochado", "En el asiento delantero, con el cinturón y un adulto a su lado", "En un asiento trasero, con un sistema de retención homologado"], "a": 2, "expl": "Los menores de estatura igual o inferior a 135 cm deben usar un sistema de retención infantil homologado adaptado a su talla y peso y situarse en los asientos traseros; solo excepcionalmente pueden ir delante.", "fuente": "RGC art. 117.1 y 117.3 (no modificado por RD 518/2026)", "img": null}, {"tema": 7, "q": "¿Qué calzado deben llevar los conductores y pasajeros de motocicletas en todo tipo de vías?", "opts": ["Cualquier calzado, si llevan casco y guantes", "Calzado cerrado, pero solo en vías interurbanas", "Calzado cerrado que cubra todo el pie"], "a": 2, "expl": "El RGC exige calzado cerrado que cubra todo el pie en todo tipo de vías.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 118.1.c)", "img": null}, {"tema": 7, "q": "¿Cuál de estos dispositivos está prohibido llevar en el vehículo?", "opts": ["Un navegador GPS con mapas de carretera", "Un detector de radares o cinemómetros", "Una aplicación que avisa de la posición de los radares fijos"], "a": 1, "expl": "Se prohíben los inhibidores y detectores de radares; quedan excluidos de la prohibición los mecanismos de aviso de la posición de los sistemas de vigilancia.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 18.3", "img": null}, {"tema": 7, "q": "¿En cuál de estos casos puede el conductor de un turismo circular sin cinturón sin tener certificado médico?", "opts": ["En trayectos urbanos de menos de un kilómetro", "Al hacer marcha atrás o al estacionar", "En vías urbanas con límite de 30 km/h"], "a": 1, "expl": "La exención por maniobra afecta a la marcha atrás y al estacionamiento; no existe exención por distancia ni por velocidad de la vía.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 119.1.a)", "img": null}, {"tema": 7, "q": "El conductor de un taxi lleva años con el permiso. ¿Qué tasa máxima de alcohol en aire espirado se le permite?", "opts": ["0,25 mg/l, como cualquier conductor", "0,15 mg/l", "0,30 mg/l"], "a": 1, "expl": "Los conductores de vehículos de servicio público (taxi) no pueden superar 0,3 g/l en sangre ni 0,15 mg/l en aire espirado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 20", "img": null}, {"tema": 7, "q": "Si la primera prueba de alcohol en aire espirado supera los límites, se practica una segunda prueba de contraste. ¿Qué tiempo mínimo debe transcurrir entre ambas?", "opts": ["Diez minutos", "Treinta minutos", "Una hora"], "a": 0, "expl": "El reglamento exige un mínimo de 10 minutos entre la primera y la segunda prueba de detección alcohólica.", "fuente": "RGC art. 23 (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Respecto a la presencia de drogas en el organismo del conductor, ¿qué ocurre con las sustancias usadas bajo prescripción médica y con finalidad terapéutica?", "opts": ["Quedan permitidas siempre, aunque disminuyan su capacidad de conducir", "Quedan prohibidas igual que cualquier droga, sin excepción alguna", "Quedan excluidas de la prohibición si puede conducir con la diligencia exigida"], "a": 2, "expl": "La Ley excluye de la prohibición las sustancias bajo prescripción facultativa con finalidad terapéutica, siempre que el conductor esté en condiciones de conducir con diligencia, precaución y sin distraerse.", "fuente": "Ley de Tráfico (RDL 6/2015) art. 14.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "¿Cómo debe ir colocado el pasajero de una motocicleta autorizada para llevarlo?", "opts": ["Detrás del conductor, sentado de lado y agarrado a su cintura", "Detrás del conductor, a horcajadas y con pies en los reposapiés", "Entre el conductor y el manillar, siempre que sea un niño pequeño"], "a": 1, "expl": "El pasajero va a horcajadas, con los pies en los reposapiés laterales y en el asiento detrás del conductor; nunca entre el conductor y el manillar.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 12.1", "img": null}, {"tema": 7, "q": "Un joven de 16 años conduce un ciclomotor. ¿Qué tasa de alcohol en aire espirado tiene permitida?", "opts": ["Hasta 0,25 miligramos por litro", "Hasta 0,15 miligramos por litro", "Ninguna: 0 miligramos por litro"], "a": 2, "expl": "La Ley de Tráfico impide a los conductores menores de edad circular con una tasa superior a 0 g/l en sangre o 0 mg/l en aire espirado.", "fuente": "Ley de Tráfico (RDL 6/2015) art. 14.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "¿Puede el conductor de un turismo circular con auriculares conectados a un reproductor de música?", "opts": ["Sí, siempre que el volumen sea bajo y no circule por autovía", "No, están prohibidos los auriculares con aparatos de sonido", "Sí, siempre que lleve puesto uno solo de los dos auriculares"], "a": 1, "expl": "Queda prohibido conducir con cualquier tipo de casco de audio o auriculares conectados a aparatos receptores o reproductores de sonido que disminuyan la atención permanente a la conducción.", "fuente": "RGC art. 18.2 (redacción vigente desde 01/10/2026)", "img": null}, {"tema": 7, "q": "El conductor de un camión de transporte de mercancías con masa máxima autorizada de 7.500 kg lleva años con el permiso. ¿Qué tasa máxima de alcohol en sangre se le permite?", "opts": ["0,3 gramos por litro", "0,8 gramos por litro", "0,5 gramos por litro"], "a": 0, "expl": "En vehículos de mercancías de más de 3.500 kg de MMA el límite baja a 0,3 g/l en sangre (0,15 mg/l en aire espirado).", "fuente": "RGC art. 20, párrafo segundo (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "¿En qué consiste la prueba de detección de drogas que practican los agentes de tráfico?", "opts": ["Una prueba de aire espirado con etilómetro autorizado", "Prueba salival y análisis posterior de la muestra", "Un análisis de sangre realizado en el propio control"], "a": 1, "expl": "La Ley prevé una prueba salival con dispositivo autorizado y un posterior análisis de una muestra salival suficiente.", "fuente": "Ley de Tráfico RDL 6/2015 art. 14.3", "img": null}, {"tema": 7, "q": "Un ciclista adulto circula por una carretera convencional. ¿Está obligado a llevar casco?", "opts": ["Sí, adecuadamente abrochado, por ser vía interurbana", "No, solo es obligatorio para los menores de dieciséis años", "Solo si circula por la calzada y no por el arcén"], "a": 0, "expl": "En vías interurbanas el casco es obligatorio para el ciclista; en todo tipo de vías lo es para menores de dieciséis años.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 118.2", "img": null}, {"tema": 7, "q": "Un peatón se ve implicado en un accidente de tráfico. ¿Debe someterse a la prueba de alcohol si el agente se lo exige?", "opts": ["Solo si ha resultado herido de gravedad", "No, solo están obligados los conductores de vehículos", "Sí, los implicados en un accidente están obligados"], "a": 2, "expl": "Los demás usuarios de la vía implicados en un accidente también están obligados a someterse a las pruebas.", "fuente": "Ley de Tráfico RDL 6/2015 art. 14.2", "img": null}, {"tema": 7, "q": "Un taxi circula en tráfico urbano de una gran ciudad con un pasajero de 120 cm de estatura. ¿Qué condición debe cumplirse para que ese pasajero no necesite sistema de retención infantil?", "opts": ["Que sea mayor de ocho años", "Que ocupe un asiento trasero", "Que viaje con un adulto a su lado"], "a": 1, "expl": "El taxi puede transportar en tráfico urbano o áreas urbanas de grandes ciudades a personas de menos de 135 cm sin dispositivo de retención homologado, siempre que ocupen un asiento trasero.", "fuente": "RGC art. 119.2 (redacción RD 518/2026, en vigor desde 01/10/2026)", "img": null}, {"tema": 7, "q": "Un conductor de turismo, con permiso desde hace diez años, circula por una carretera convencional. ¿Cuál es la tasa máxima de alcohol en aire espirado con la que puede conducir?", "opts": ["0,25 miligramos por litro", "0,15 miligramos por litro", "0,50 miligramos por litro"], "a": 0, "expl": "Para los conductores en general el límite es 0,5 g/l en sangre o 0,25 mg/l en aire espirado. El 0,15 mg/l solo rige para profesionales de ciertos vehículos y para noveles.", "fuente": "RGC art. 20, párrafo primero (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Una chica de 15 años va en bicicleta por una calle de una ciudad. ¿Está obligada a llevar casco?", "opts": ["Sí, es obligatorio para menores de 16 años en toda vía", "Sí, pero solo si circula por un carril de uso compartido", "No, en las vías urbanas el casco no es nunca obligatorio"], "a": 0, "expl": "El casco es obligatorio para los ciclistas en vías interurbanas, y para los menores de dieciséis años en todo tipo de vías, urbanas incluidas.", "fuente": "RGC art. 118.2 (redacción RD 518/2026)", "img": null}, {"tema": 7, "q": "Una conductora mayor de edad obtuvo el permiso B hace catorce meses. ¿Qué tasa máxima de alcohol en sangre puede tener al conducir su turismo?", "opts": ["0,0 gramos por litro", "0,3 gramos por litro", "0,5 gramos por litro"], "a": 1, "expl": "Durante los dos años siguientes a obtener el permiso se aplica el límite reducido de 0,3 g/l en sangre y 0,15 mg/l en aire espirado. La tasa 0 es la de los menores de edad.", "fuente": "RGC art. 20, párrafo tercero (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Un motorista lleva en el casco un dispositivo inalámbrico certificado. ¿Para qué fines se permite su uso?", "opts": ["Solo intercomunicación o navegación, sin restar seguridad", "Para cualquier uso si mantiene el volumen bajo", "Para hablar por teléfono y escuchar música mientras conduce"], "a": 0, "expl": "Solo se exceptúan los dispositivos integrados en el casco con fines exclusivos de intercomunicación o navegación y sin afectar a la seguridad.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 18.2.a)", "img": null}, {"tema": 8, "q": "¿Cuál es la afirmación correcta sobre hablar por teléfono con un sistema de manos libres mientras se conduce?", "opts": ["Está permitido, pero reduce notablemente la concentración del conductor", "Solo reduce la concentración en conductores mayores de 65 años", "Es tan seguro como no hablar, porque no se usan las manos"], "a": 0, "expl": "El manos libres es legal, pero la DGT advierte de que, aun usándolo, la capacidad de concentración ante el volante se pierde en gran medida.", "fuente": "Ley de Tráfico art. 13.3 (permiso del uso sin manos ni auriculares) y DGT, Distracciones al volante (https://www.dgt.es/export/sites/web-DGT/.galleries/downloads/conoce_la_dgt/que-hacemos/educacion-vial/adultos/no-formal/Distracciones_al_volante.pdf)", "img": null}, {"tema": 8, "q": "Te aproximas a una intersección señalizada en la que no tienes prioridad y la visibilidad es prácticamente nula. ¿Qué velocidad no debes exceder?", "opts": ["40 km/h", "50 km/h", "60 km/h"], "a": 1, "expl": "En intersecciones debidamente señalizadas con visibilidad prácticamente nula, la velocidad no deberá exceder de 50 km/h.", "fuente": "RGC art. 46.1.h (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Según las recomendaciones de la DGT, ¿cómo debe ser la distancia de seguridad en calzada mojada por lluvia respecto a la de calzada seca?", "opts": ["Aproximadamente el doble"
