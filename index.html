, "La misma, si los neumáticos están en buen estado", "Algo menor, pues se circula más despacio"], "a": 0, "expl": "La DGT recomienda duplicar la distancia de seguridad con lluvia, porque aumenta la distancia de frenado al disminuir la adherencia.", "fuente": "DGT, Operación Especial Constitución-Inmaculada 2023, Consejos y normas de seguridad vial, ap. 4.7 Lluvia", "img": null}, {"tema": 8, "q": "Notas bostezos repetidos y los párpados pesados durante un viaje largo. Según la DGT, ¿qué es lo más seguro?", "opts": ["Parar en un lugar adecuado y descansar o dormir", "Tomar un café fuerte y continuar hasta el destino", "Subir el volumen de la radio y bajar la ventanilla"], "a": 0, "expl": "Según la DGT, lo más seguro es parar a dormir en un lugar adecuado unos 20-30 minutos; la radio o el café pueden dar un estímulo breve, pero no sustituyen al descanso.", "fuente": "DGT, Conducir con sueño o cansancio (https://www.dgt.es/muevete-con-seguridad/evita-conductas-de-riesgo/Conducir-con-sueno-o-cansancio)", "img": null}, {"tema": 8, "q": "Sobre calzada mojada, ¿qué ocurre con la distancia de frenado respecto a calzada seca?", "opts": ["Disminuye, porque el agua refrigera los frenos", "Aumenta", "Es la misma si los neumáticos son nuevos"], "a": 1, "expl": "Con el asfalto mojado la frenada se alarga, aunque los neumáticos estén en buen estado.", "fuente": "DGT, Todo lo que necesitas saber para circular bajo la lluvia (https://www.dgt.es/comunicacion/noticias/todo-lo-que-necesitas-saber-para-circular-bajo-la-lluvia/)", "img": null}, {"tema": 8, "q": "Un coche con detector de fatiga muestra una taza humeante en el salpicadero. ¿Qué debe hacer el conductor?", "opts": ["Ignorarlo si todavía no se siente cansado", "Seguir con normalidad, pues el aviso indica un fallo del sistema", "Parar en cuanto pueda hacerlo con seguridad para descansar"], "a": 2, "expl": "El detector de fatiga avisa de que el conductor pierde la concentración (con un mensaje, una taza humeante o vibraciones) para que pare a descansar.", "fuente": "DGT, Sistemas avanzados de ayuda a la conducción (ADAS) (https://www.dgt.es/muevete-con-seguridad/sistemas-avanzados-ayuda-conduccion/Sistemas-avanzados-de-ayuda-a-la-conduccion-ADAS-/)", "img": null}, {"tema": 8, "q": "De los siguientes factores, ¿cuál aumenta la distancia de reacción (la recorrida desde que se percibe el peligro hasta que se empieza a frenar)?", "opts": ["El pavimento mojado o deslizante", "El desgaste de los frenos del vehículo", "El cansancio o el sueño del conductor"], "a": 2, "expl": "La distancia de reacción depende de la velocidad y del tiempo de reacción del conductor, que aumenta con el sueño, la fatiga, el alcohol o el móvil. Frenos y pavimento influyen en la distancia de frenado.", "fuente": "RACE (Distancias de reacción, de frenado y de detención), con datos de la DGT", "img": null}, {"tema": 8, "q": "Según el IDAE, en una parada que se prevé superior a cierto tiempo conviene apagar el motor. ¿A partir de cuánto?", "opts": ["Más de 60 segundos", "Más de 5 segundos seguidos", "Más de 10 minutos seguidos"], "a": 0, "expl": "La guía de conducción eficiente recomienda parar el motor en detenciones previstas de más de 60 segundos, para no gastar combustible en ralentí.", "fuente": "IDAE, Manual de conducción eficiente para vehículos turismo, ap. 5.7 (ed. EVE/IDAE)", "img": null}, {"tema": 8, "q": "En una curva de reducida visibilidad sin marcas que delimiten la calzada, ¿qué debe dejar libre quien no adelanta?", "opts": ["Toda la mitad de calzada del sentido contrario", "Una franja de un metro y medio a su izquierda", "El arcén de su derecha, por si otro vehículo lo necesita"], "a": 0, "expl": "Aun sin señalización, en curvas y cambios de rasante de reducida visibilidad se debe dejar completamente libre la mitad de la calzada del sentido contrario.", "fuente": "RGC art. 29.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "¿Cuándo debe medirse la presión de los neumáticos para obtener un valor fiable?", "opts": ["Solo en el taller, con el motor en marcha", "Con los neumáticos calientes, justo tras un trayecto largo", "Con los neumáticos fríos, usando un manómetro calibrado"], "a": 2, "expl": "La presión se revisa con manómetro calibrado, en frío y con regularidad (una vez al mes), según la presión recomendada por el fabricante.", "fuente": "DGT Revista, Las reglas de oro del mantenimiento del neumático (https://revista.dgt.es/es/motor/noticias/2016/0613Consejos-mantenimiento-neumaticos.shtml)", "img": null}, {"tema": 8, "q": "Si el vehículo sufre aquaplaning al atravesar una zona con agua acumulada, ¿cuál es la actuación correcta?", "opts": ["Volante firme, soltar suavemente el acelerador y no frenar bruscamente", "Acelerar con decisión para que los neumáticos recuperen el agarre", "Frenar a fondo para detener el vehículo cuanto antes y recuperar el control"], "a": 0, "expl": "En aquaplaning los neumáticos pierden contacto con el asfalto; hay que mantener la dirección recta, soltar suavemente el acelerador y evitar frenar bruscamente.", "fuente": "DGT, Consejos Operación Especial 2023 (ap. 4.7 Lluvia) y RACE, Aquaplaning", "img": null}, {"tema": 8, "q": "Te aproximas a un peatón anciano que cruza con evidente dificultad. ¿Qué debes hacer?", "opts": ["Mantener la velocidad y avisarle con el claxon para que se apresure", "Adoptar precauciones y moderar la velocidad o detenerte si es preciso", "Rebasarle rápidamente por detrás para no entorpecerle"], "a": 1, "expl": "Ante niños, ancianos u otras personas manifiestamente impedidas hay que extremar las precauciones y circular a velocidad moderada, deteniéndose si hace falta.", "fuente": "RGC art. 17.1 y 46.1.a (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "¿Para qué sirve el sistema ISA (asistente inteligente de velocidad) de un vehículo?", "opts": ["Para ayudar al conductor a respetar el límite de velocidad de la vía", "Para avisar cuando el coche se sale del carril sin usar el intermitente", "Para mantener automáticamente la distancia con el vehículo precedente"], "a": 0, "expl": "El ISA ayuda a respetar el límite de velocidad y adapta la marcha a la señalización de la vía; el aviso de salida de carril es otro sistema (LDW).", "fuente": "DGT, Sistemas avanzados de ayuda a la conducción (ADAS) (https://www.dgt.es/muevete-con-seguridad/sistemas-avanzados-ayuda-conduccion/Sistemas-avanzados-de-ayuda-a-la-conduccion-ADAS-/)", "img": null}, {"tema": 8, "q": "Según la guía de conducción eficiente del IDAE, tras arrancar en primera, ¿cuándo conviene cambiar a segunda marcha?", "opts": ["Cuando el motor alcance las 4.000 revoluciones", "A los 10 segundos de iniciar la marcha", "Rápidamente, a los 2 segundos aproximadamente"], "a": 2, "expl": "La conducción eficiente usa la primera solo para arrancar y pasa a segunda hacia los 2 segundos (unos 6 m), circulando en la marcha más larga posible y a bajas revoluciones.", "fuente": "IDAE, Manual de conducción eficiente para vehículos turismo, ap. 4.2.3 (ed. EVE/IDAE)", "img": null}, {"tema": 8, "q": "Si el tiempo de reacción no cambia y se duplica la velocidad, ¿qué ocurre con la distancia de reacción?", "opts": ["Se cuadruplica aproximadamente", "Se mantiene prácticamente igual", "Se duplica aproximadamente"], "a": 2, "expl": "La distancia de reacción es la recorrida durante el tiempo de reacción a velocidad constante, así que crece de forma proporcional a la velocidad (la de frenado crece más deprisa).", "fuente": "DGT Revista, Velocidad y riesgo al frenar (https://revista.dgt.es/es/reportajes/2020/09SEPTIEMBRE/0922-Excesos-velocidad-distancia-detencion-y-mantenimiento.shtml)", "img": null}, {"tema": 8, "q": "¿Por qué son especialmente peligrosos los microsueños al volante?", "opts": ["Porque aparecen únicamente en vías sin tráfico, por la monotonía", "Porque solo se producen tras conducir más de diez horas seguidas", "Porque suelen pasar completamente inadvertidos para el conductor"], "a": 2, "expl": "Los microsueños son uno de los efectos más negativos de la somnolencia y suelen pasar completamente inadvertidos.", "fuente": "DGT, Conducir con sueño o cansancio (https://www.dgt.es/muevete-con-seguridad/evita-conductas-de-riesgo/Conducir-con-sueno-o-cansancio)", "img": null}, {"tema": 8, "q": "Un turismo de tracción delantera monta cadenas para circular por nieve. ¿En qué ruedas se colocan?", "opts": ["En las traseras, para mejorar la estabilidad", "En las delanteras, que son las que traccionan", "En las cuatro, siendo obligatorio en cualquier caso"], "a": 1, "expl": "Las cadenas se montan en las ruedas motrices; en un vehículo de tracción delantera, en las delanteras, y deben ser de la medida del neumático.", "fuente": "DGT, Hielo y nieve: con la adherencia al límite (https://www.dgt.es/comunicacion/noticias/hielo-y-nieve-con-la-adherencia-al-limite/)", "img": null}, {"tema": 8, "q": "Al circular por una placa de hielo, el vehículo pierde adherencia. ¿Qué debe hacer el conductor?", "opts": ["Levantar el pie del acelerador y no frenar hasta recuperar la adherencia", "Frenar a fondo para detenerse cuanto antes", "Girar el volante con decisión para salir de la placa"], "a": 0, "expl": "Sobre hielo hay que soltar el acelerador sin frenar hasta recuperar adherencia, y corregir la trayectoria con suavidad.", "fuente": "DGT, Hielo y nieve: con la adherencia al límite (https://www.dgt.es/comunicacion/noticias/hielo-y-nieve-con-la-adherencia-al-limite/)", "img": null}, {"tema": 8, "q": "¿Cómo debe regularse el reposacabezas de un turismo?", "opts": ["Con su centro a la altura de la parte trasera de la cabeza", "Subido al máximo, por encima de la cabeza, para apoyarla al viajar", "Bajado del todo, a la altura de los hombros, para ver mejor atrás"], "a": 0, "expl": "El reposacabezas es un elemento de seguridad, no de confort: la parte trasera de la cabeza debe quedar sobre su centro.", "fuente": "DGT citada por Motorpasión (https://www.motorpasion.com/seguridad/dgt-indica-cual-postura-correcta-al-volante-para-evitar-lesiones-temido-efecto-submarino) y DGT, En coche", "img": null}, {"tema": 8, "q": "¿Qué efectos de los ansiolíticos influyen negativamente en la conducción?", "opts": ["Mayor agudeza visual y reflejos más rápidos", "Ninguno, porque solo actúan sobre el estado de ánimo", "Somnolencia y disminución de la atención y de la capacidad de reacción"], "a": 2, "expl": "Los ansiolíticos producen somnolencia, menor atención y menor capacidad de reacción, lo que aumenta el riesgo de accidente.", "fuente": "RACE, Medicamentos que afectan a la conducción (https://www.race.es/medicamentos-afectan-conduccion)", "img": null}, {"tema": 8, "q": "Un conductor toma un medicamento recetado que le produce mucha somnolencia. ¿Puede conducir?", "opts": ["Sí, siempre que no supere la tasa de alcohol permitida", "Sí, porque la receta médica le autoriza a conducir en cualquier caso", "No, mientras su efecto le impida circular sin peligro"], "a": 2, "expl": "Los medicamentos bajo cuyo efecto se altere el estado físico o mental apropiado para circular sin peligro impiden conducir.", "fuente": "RGC art. 27.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Según la DGT, ¿qué consejo es adecuado para un conductor mayor al planificar sus desplazamientos?", "opts": ["Circular con poco tráfico y evitar la lluvia y las zonas mal iluminadas", "Evitar las paradas en viajes largos para no perder el ritmo", "Preferir la noche, cuando hay menos tráfico y menos prisas"], "a": 0, "expl": "La DGT recomienda circular en horas de menor tráfico, evitar la lluvia y las zonas poco iluminadas, y hacer más paradas en los viajes largos.", "fuente": "DGT, Consejos para personas mayores (https://www.dgt.es/muevete-con-seguridad/viaja-seguro/personas-mayores/)", "img": null}, {"tema": 8, "q": "Según el Reglamento General de Circulación, con niebla densa que reduce mucho la visibilidad, ¿a qué velocidad debe circular el conductor?", "opts": ["A la que le permita detenerse dentro de su campo de visión", "A la velocidad máxima de la vía, si lleva las antiniebla encendidas", "A la mitad del límite de la vía, sea cual sea la visibilidad"], "a": 0, "expl": "La velocidad debe adecuarse a las circunstancias (visibilidad, meteorología, estado de la vía) de forma que siempre pueda detenerse dentro del campo de visión.", "fuente": "RGC art. 45 (adecuación de la velocidad a las circunstancias); art. 46.1.k", "img": null}, {"tema": 8, "q": "Circulas con fuertes rachas de viento. ¿Cómo conviene sujetar el volante?", "opts": ["Con holgura, dejando que el viento lo mueva ligeramente", "Con firmeza, con las dos manos", "Con una sola mano, para corregir la trayectoria con rapidez"], "a": 1, "expl": "Con rachas fuertes hay que sujetar con firmeza el volante con las dos manos y evitar movimientos bruscos.", "fuente": "DGT, Conducir con el viento en contra (https://www.dgt.es/comunicacion/noticias/conducir-con-el-viento-en-contra/)", "img": null}, {"tema": 8, "q": "Al circular detrás de otro vehículo, ¿qué circunstancias debe tener en cuenta especialmente el conductor para dejar el espacio libre necesario?", "opts": ["La hora del día y el número de ocupantes de ambos vehículos", "La velocidad y las condiciones de adherencia y frenado", "El tamaño y el color del vehículo que le precede"], "a": 1, "expl": "El espacio entre vehículos debe permitir detenerse ante un frenado brusco sin colisionar, teniendo en cuenta la velocidad y las condiciones de adherencia y frenado.", "fuente": "RGC art. 54.1", "img": null}, {"tema": 8, "q": "¿Cuál es la profundidad mínima legal del dibujo en las ranuras principales de la banda de rodadura de los neumáticos de un turismo?", "opts": ["3 mm", "0,6 mm", "1,6 mm"], "a": 2, "expl": "El Reglamento General de Vehículos exige como mínimo 1,6 mm de profundidad en las ranuras principales de la banda de rodadura en turismos (categoría M1).", "fuente": "RGV (RD 2822/1998), Anexo VII, ap. 2", "img": null}, {"tema": 8, "q": "¿Qué advierte el pictograma de un triángulo rojo con un coche negro en el envase de un medicamento?", "opts": ["Que puede afectar a la conducción y conviene consultar el prospecto", "Que está prohibido conducir durante todo el tratamiento", "Que el medicamento es apto para conductores profesionales"], "a": 0, "expl": "El pictograma («Conducción: ver prospecto») no prohíbe conducir; solo advierte de que el medicamento puede afectar a la capacidad de conducir.", "fuente": "RACE, Medicamentos que afectan a la conducción (https://www.race.es/medicamentos-afectan-conduccion)", "img": null}, {"tema": 8, "q": "Según el IDAE, para decelerar sin frenar al acercarse a una detención, ¿qué conviene hacer?", "opts": ["Poner punto muerto y dejar rodar el vehículo para ahorrar combustible", "Reducir de marcha cuanto antes y mantener el motor revolucionado", "Levantar el pie del acelerador y dejar rodar con la marcha engranada"], "a": 2, "expl": "En conducción eficiente se levanta el pie del acelerador y se deja rodar con la marcha engranada, reduciendo de marcha lo más tarde posible.", "fuente": "IDAE, 10 reglas de oro de la conducción eficiente (https://www.idae.es/movilidad-sostenible/10-reglas-de-oro-de-la-conduccion-eficiente)", "img": null}, {"tema": 8, "q": "Un vehículo tiene activados sistemas de ayuda a la conducción. ¿Debe el conductor mantener la atención permanente?", "opts": ["Solo en vías urbanas, pues en carretera los sistemas lo sustituyen", "No, mientras estén activados puede dedicar su atención a otras tareas", "Sí, la obligación de atención permanente sigue siendo suya"], "a": 2, "expl": "Las ayudas a la conducción (ADAS) apoyan al conductor pero no lo sustituyen: debe mantener en todo momento la atención permanente a la conducción.", "fuente": "RGC art. 18.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "Vas a entrar con un turismo en una curva cerrada. ¿Dónde conviene realizar la frenada?", "opts": ["Antes de la curva, en recta, y nunca dentro de ella", "A la salida, cuando ya se ha enderezado el volante", "En mitad de la curva, para ajustar la velocidad"], "a": 0, "expl": "La frenada debe hacerse antes de entrar en la curva, en recta; dentro de ella solo se acelera lo justo para que el motor siga trabajando.", "fuente": "DGT Revista, ¡Atención, vienen curvas! (https://revista.dgt.es/es/educacion-formacion/conducir-mejor/2017/0419-Conducir-en-curvas.shtml)", "img": null}, {"tema": 8, "q": "Circulas de noche con la luz de carretera y otro vehículo te sigue de cerca. ¿Qué debes hacer?", "opts": ["Mantenerla, pues solo hay que cambiarla ante vehículos que vienen de frente", "Apagar todo el alumbrado unos segundos para que pueda adelantarte", "Cambiar a la luz de cruce para no deslumbrarle por el retrovisor"], "a": 2, "expl": "La luz de largo alcance debe sustituirse por la de cruce también respecto a vehículos del mismo sentido cuyos conductores puedan ser deslumbrados a través del espejo retrovisor.", "fuente": "RGC art. 102.2 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 8, "q": "En un viaje largo, ¿cada cuánto recomienda la DGT parar para descansar?", "opts": ["Cada 6 horas o cada 600 kilómetros", "Cada 4 horas o cada 400 kilómetros", "Cada 2 horas o cada 200 kilómetros"], "a": 2, "expl": "Para prevenir la fatiga, la DGT aconseja parar y descansar cada 2 horas o cada 200 km, y parar de inmediato ante cualquier síntoma de cansancio.", "fuente": "DGT, Revista Tráfico y Seguridad Vial, '7 consejos para evitar la fatiga' (2015)", "img": null}, {"tema": 8, "q": "Con niebla muy cerrada y sin avería, ¿qué se aconseja respecto a detenerse en el arcén?", "opts": ["Hacerlo siempre que la visibilidad sea escasa, con las luces de posición", "Hacerlo y apagar las luces para no deslumbrar", "Evitarlo, porque supone un peligro añadido para otros vehículos"], "a": 2, "expl": "La DGT advierte de que pararse en el arcén con niebla cerrada es una de las peores ideas por el peligro que entraña.", "fuente": "DGT, Niebla: visibilidad bajo mínimos (https://www.dgt.es/comunicacion/noticias/niebla-visibilidad-bajo-minimos/)", "img": null}, {"tema": 9, "q": "Un turismo obtiene resultado negativo en la ITV por un defecto muy grave. ¿Cómo debe trasladarse desde la estación hasta su destino?", "opts": ["Por medios ajenos al propio vehículo, sin conducirlo", "Conduciéndolo despacio y con la luz de emergencia conectada", "Conduciéndolo de forma directa hasta el taller más cercano"], "a": 0, "expl": "Los defectos muy graves inhabilitan para circular y el traslado desde la estación se hace por medios ajenos al propio vehículo.", "fuente": "RD 920/2017 art. 11.3", "img": null}, {"tema": 9, "q": "Cuando es obligatorio el uso de cadenas en un turismo, ¿dónde deben colocarse?", "opts": ["Al menos en una rueda motriz de cada lado del vehículo", "Sobre una sola rueda motriz, la del lado del arcén", "Sobre las dos ruedas delanteras, sea cual sea la tracción"], "a": 0, "expl": "Hay que colocar las cadenas o dispositivos antideslizantes, como mínimo, en una rueda motriz de cada lado, o usar neumáticos especiales.", "fuente": "RGV art. 12.5.2", "img": null}, {"tema": 9, "q": "¿Debe llevar siempre un turismo una rueda de repuesto completa?", "opts": ["Sí, es obligatorio llevar siempre una rueda completa, sin excepciones ni alternativas", "Sí, salvo en los turismos que tengan más de diez años de antigüedad", "No, vale una rueda de uso temporal o un sistema alternativo suficiente"], "a": 2, "expl": "El anexo XII admite rueda completa, rueda de uso temporal con herramientas o un sistema alternativo que garantice la movilidad (respetando sus limitaciones).", "fuente": "RGV anexo XII, apartado 1.c", "img": null}, {"tema": 9, "q": "Un particular entrega su turismo a un compraventa de vehículos para su posterior venta. ¿Qué debe solicitar en el plazo de diez días?", "opts": ["El cambio de titularidad a nombre del compraventa", "La baja temporal del vehículo en el Registro de Vehículos", "La baja definitiva del vehículo en el Registro de Vehículos"], "a": 1, "expl": "Quien entrega el vehículo a un vendedor profesional para su transmisión debe pedir la baja temporal en diez días desde la entrega.", "fuente": "RGV art. 33.1", "img": null}, {"tema": 9, "q": "Con el permiso B+E y un vehículo tractor de la clase B, ¿cuál es la masa máxima autorizada del remolque o semirremolque que puede llevarse?", "opts": ["3.500 kg", "750 kg", "4.250 kg"], "a": 0, "expl": "El B+E autoriza remolques o semirremolques de hasta 3.500 kg de MMA; 750 kg es el límite del remolque ligero con el permiso B.", "fuente": "RGC (Conductores) art. 4.2 (tabla, clase B+E)", "img": null}, {"tema": 9, "q": "¿Qué ocurre con un vehículo que circula sin permiso de circulación?", "opts": ["Puede seguir circulando si tiene seguro e ITV en vigor", "Se le concede un plazo de un mes para regularizarlo", "Se inmoviliza hasta que se disponga del permiso"], "a": 2, "expl": "La circulación sin permiso de circulación da lugar a la inmovilización del vehículo hasta que se disponga de él.", "fuente": "RDL 6/2015 art. 66.3", "img": null}, {"tema": 9, "q": "Un conductor circula con un permiso de conducción cuya vigencia ya ha vencido. ¿Qué establece el Reglamento General de Conductores?", "opts": ["Le autoriza a conducir hasta tres meses más mientras solicita la prórroga", "Le autoriza a conducir, pero solo por vías urbanas y a menos de 50 km/h", "No le autoriza a conducir y su uso da lugar a su intervención inmediata"], "a": 2, "expl": "El permiso vencido no autoriza a su titular a conducir y su utilización da lugar a su intervención inmediata.", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 12.4", "img": null}, {"tema": 9, "q": "¿Cuál es la edad mínima para obtener el permiso AM, que autoriza a conducir ciclomotores?", "opts": ["14 años cumplidos", "16 años cumplidos", "15 años cumplidos"], "a": 2, "expl": "El permiso AM se obtiene a los 15 años cumplidos; A1 a los 16 y A2 a los 18.", "fuente": "RGC (Conductores) art. 4.2 (tabla)", "img": null}, {"tema": 9, "q": "¿Qué requisitos de edad y de permiso previo exige el permiso de la clase A?", "opts": ["18 años cumplidos y permiso B con dos años de antigüedad", "21 años cumplidos y permiso A1 con un año de antigüedad", "20 años cumplidos y permiso A2 con 2 años de antigüedad"], "a": 2, "expl": "El permiso A requiere 20 años y ser titular del A2 con al menos dos años de antigüedad (además de superar la formación exigida).", "fuente": "RGC (Conductores) arts. 4 y 5.1.a", "img": null}, {"tema": 9, "q": "¿Debe matricularse un remolque de 1.000 kg de masa máxima autorizada?", "opts": ["Sí, y llevar placa de matrícula propia", "Solo si supera los 3.500 kg de masa máxima", "No, usa la matrícula del vehículo tractor"], "a": 0, "expl": "Los remolques y semirremolques de más de 750 kg de MMA deben matricularse y llevar placas de matrícula.", "fuente": "RGV art. 25.1", "img": null}, {"tema": 9, "q": "Una persona vende su turismo y no notifica la transmisión a Tráfico. ¿Qué ocurre a efectos de la normativa de tráfico?", "opts": ["La titularidad pasa al comprador desde que éste paga el precio", "Deja de ser titular desde la fecha firmada en el contrato de venta", "Sigue siendo titular hasta que se inscriba a nombre del comprador"], "a": 2, "expl": "Si el transmitente no notifica, sigue considerado titular mientras el vehículo no se inscriba a nombre de otra persona.", "fuente": "RGV art. 32.1", "img": null}, {"tema": 9, "q": "Si en una ITV solo se detectan defectos leves, ¿cuál es el resultado y qué debe hacerse?", "opts": ["Es negativo y el vehículo queda inhabilitado hasta repararlo", "Es desfavorable y hay que repetir la inspección completa en un mes", "Es favorable y hay que reparar los defectos en dos meses"], "a": 2, "expl": "Solo defectos leves dan resultado favorable; deben repararse en dos meses como máximo y no exigen nueva inspección.", "fuente": "RD 920/2017 arts. 9.4 y 11.1", "img": null}, {"tema": 9, "q": "Una persona de un país no perteneciente a la UE conduce en España con su permiso extranjero válido y fija aquí su residencia normal. ¿Hasta cuándo puede seguir conduciendo con él, salvo convenio específico?", "opts": ["Un año desde que adquiere la residencia en España", "Mientras el permiso siga vigente en su país de origen", "Seis meses como máximo desde que fija su residencia"], "a": 2, "expl": "Pasados seis meses desde la residencia normal, esos permisos carecen de validez y hay que obtener el permiso español (o canjearlo, si procede).", "fuente": "RGC (Conductores) art. 21.2.c y 21.3", "img": null}, {"tema": 9, "q": "¿Qué documentos del vehículo debe llevar y exhibir a los agentes el conductor de un turismo que circula sin remolque?", "opts": ["El permiso de circulación y el libro de mantenimiento", "El permiso de circulación y la tarjeta de inspección técnica", "La tarjeta de inspección técnica y el recibo del impuesto de circulación"], "a": 1, "expl": "El conductor debe llevar el permiso de circulación y la tarjeta ITV (certificado de características técnicas en ciclomotores).", "fuente": "RD 2822/1998 Reglamento General de Vehículos (texto consolidado 26/06/2026), art. 26.1", "img": null}, {"tema": 9, "q": "¿Qué dotación obligatoria mínima debe llevar un turismo?", "opts": ["Extintor, chaleco reflectante y dos triángulos de preseñalización", "V-16, chaleco reflectante y rueda de repuesto o alternativa", "V-16, extintor y botiquín de primeros auxilios"], "a": 1, "expl": "La dotación de los turismos es: dispositivo luminoso V-16, chaleco reflectante de alta visibilidad y rueda de repuesto, rueda de uso temporal o sistema alternativo. El extintor solo se exige a vehículos más pesados y autobuses.", "fuente": "RGV anexo XII, apartado 1", "img": null}, {"tema": 9, "q": "Un turismo de uso particular fue matriculado por primera vez hace tres años. ¿Debe pasar ya la inspección técnica periódica?", "opts": ["No, los turismos están exentos hasta superar los cuatro años", "Sí, debe pasarla cada dos años desde su primera matriculación", "Sí, debe pasarla cada año desde su primera matriculación"], "a": 0, "expl": "En la tabla de periodicidad, los turismos (M1) están exentos hasta los 4 años; después, bienal, y anual a partir de los 10.", "fuente": "RD 920/2017 inspección técnica de vehículos, texto consolidado BOE, art. 6.1", "img": null}, {"tema": 9, "q": "Una conductora de 68 años renueva su permiso de la clase B. ¿Qué vigencia le corresponde?", "opts": ["3 años", "10 años", "5 años"], "a": 2, "expl": "Los permisos no profesionales (como el B) duran diez años hasta los 65 y cinco años a partir de esa edad; los de las clases C1, C, D1 y D (y sus +E) duran cinco años y tres desde los 65.", "fuente": "RGC (Conductores) art. 12.2", "img": null}, {"tema": 9, "q": "¿Quién está obligado a suscribir y mantener en vigor el seguro obligatorio de responsabilidad civil de un turismo cuyo estacionamiento habitual está en España?", "opts": ["El conductor que lo utilice, en cada trayecto que realice", "Únicamente el fabricante o el importador del vehículo", "El propietario del vehículo, con un contrato por vehículo"], "a": 2, "expl": "La obligación recae sobre todo propietario de vehículos a motor con estacionamiento habitual en España.", "fuente": "RDL 8/2004 (seguro obligatorio), texto consolidado BOE, art. 2.1", "img": null}, {"tema": 9, "q": "Un turismo recibe un resultado desfavorable en la ITV por un defecto grave. ¿Qué puede hacer?", "opts": ["Circular solo hasta el taller y volver a la ITV en un máximo de dos meses", "No circular bajo ningún concepto, ni siquiera para ir al taller", "Circular con normalidad durante dos meses hasta la nueva inspección"], "a": 0, "expl": "Los defectos graves inhabilitan para circular, salvo para el traslado al taller y la vuelta a la estación ITV en un plazo no superior a dos meses.", "fuente": "RD 920/2017 art. 11.2", "img": null}, {"tema": 9, "q": "Se detecta por primera vez que un turismo circula sin seguro obligatorio. ¿Por cuánto tiempo se acuerda cautelarmente su depósito o precinto?", "opts": ["Un mes", "Un año", "Tres meses"], "a": 0, "expl": "El depósito cautelar es de un mes; tres meses en caso de reincidencia y un año si se quebranta el depósito o precinto.", "fuente": "RDL 8/2004 art. 3.1.b", "img": null}, {"tema": 9, "q": "Un conductor de turismo baja del vehículo y pisa el arcén de una vía interurbana. ¿Debe utilizar el chaleco reflectante?", "opts": ["Solo si se trata de una autopista o una autovía", "Solo si es de noche o hay poca visibilidad", "Sí, también de día y con buena visibilidad"], "a": 2, "expl": "Debe usarlo siempre que salga del vehículo y ocupe la calzada o el arcén de una vía interurbana, sin distinción de hora ni visibilidad.", "fuente": "RGC art. 118.4 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 9, "q": "¿Con qué periodicidad debe pasar la ITV un turismo de uso particular que tiene siete años desde su primera matriculación?", "opts": ["Cada cuatro años", "Cada dos años", "Cada año"], "a": 1, "expl": "Entre más de 4 y 10 años de antigüedad, los turismos pasan la inspección con frecuencia bienal.", "fuente": "RD 920/2017 inspección técnica de vehículos, texto consolidado BOE, art. 6.1", "img": null}, {"tema": 9, "q": "¿Cuál de estos vehículos debe llevar, como dotación obligatoria, un equipo homologado de extinción de incendios?", "opts": ["Una furgoneta de mercancías de 3.000 kg de masa máxima autorizada", "Un camión de mercancías de 7.500 kg de masa máxima autorizada", "Un turismo de cinco plazas destinado a uso particular"], "a": 1, "expl": "El anexo XII exige extintor a autobuses y a mixtos y camiones de más de 3.500 kg de MMA, no a turismos ni a vehículos de hasta 3.500 kg.", "fuente": "RGV anexo XII, apartado 2", "img": null}, {"tema": 9, "q": "¿Qué se registra en el anverso de la tarjeta ITV?", "opts": ["El certificado de características del vehículo", "La relación de sanciones pendientes del titular", "El registro de las inspecciones periódicas"], "a": 2, "expl": "El anverso recoge las inspecciones periódicas; el reverso contiene el certificado de características del vehículo.", "fuente": "RGV art. 3.g", "img": null}, {"tema": 9, "q": "¿En qué caso se permite circular con láminas adhesivas o cortinillas contra el sol en las ventanillas posteriores?", "opts": ["Si lleva el retrovisor interior y un solo espejo retrovisor exterior", "Solo si circula de día, en vía urbana y con buena visibilidad", "Si lleva dos espejos retrovisores exteriores que cumplan lo exigido"], "a": 2, "expl": "Solo se permiten en las ventanillas posteriores cuando el vehículo lleva dos espejos retrovisores exteriores con las especificaciones técnicas necesarias.", "fuente": "RGC art. 19.1", "img": null}, {"tema": 9, "q": "Un turismo supera la ITV con resultado favorable 20 días antes de que venza la inspección anterior. ¿Desde cuándo se cuenta el nuevo plazo de validez?", "opts": ["Desde el mismo día en que se supera la inspección", "Desde la fecha de primera matriculación del vehículo", "Desde el vencimiento de la inspección anterior"], "a": 2, "expl": "Si la inspección favorable se hace en los 30 días naturales anteriores al vencimiento, la nueva validez se suma a la fecha de expiración de la anterior.", "fuente": "RD 920/2017 art. 6.5", "img": null}, {"tema": 9, "q": "¿Qué color de fondo tienen las placas de matrícula de los remolques y semirremolques?", "opts": ["Rojo retrorreflectante, con caracteres negros", "Blanco retrorreflectante, con caracteres negros", "Amarillo retrorreflectante, con caracteres negros"], "a": 0, "expl": "Remolques y semirremolques llevan fondo rojo y caracteres negros, con la letra R inicial; el blanco es de los automóviles y el amarillo de los ciclomotores.", "fuente": "RGV anexo XVIII, A) c)", "img": null}, {"tema": 9, "q": "¿Qué dotación obligatoria establece el Reglamento General de Vehículos para una motocicleta?", "opts": ["Un extintor homologado y un triángulo de preseñalización", "Un chaleco reflectante de alta visibilidad", "Un dispositivo V-16 y un extintor de bolsillo"], "a": 1, "expl": "Para las motocicletas el anexo XII solo exige un chaleco reflectante de alta visibilidad.", "fuente": "RGV anexo XII, apartado 3", "img": null}, {"tema": 9, "q": "Un turismo arrastra un remolque de 700 kg de masa máxima autorizada. ¿Qué documento del remolque debe llevar el conductor?", "opts": ["Su permiso de circulación, con matrícula propia", "Su tarjeta de inspección técnica", "Ninguno, bastan los documentos del turismo"], "a": 1, "expl": "Con remolques de hasta 750 kg el conductor debe llevar la tarjeta ITV del remolque y en la del turismo debe constar un acoplamiento compatible.", "fuente": "RGV art. 26.1.c", "img": null}, {"tema": 9, "q": "¿Qué profundidad mínima deben tener las ranuras principales del dibujo de los neumáticos de un camión de más de 3.500 kg?", "opts": ["2,0 mm", "1,0 mm", "1,6 mm"], "a": 1, "expl": "En las categorías M2, M3, N2, N3, O3 y O4 el mínimo es 1,0 mm; los 1,6 mm son para M1, N1, O1 y O2 (turismos, furgonetas ligeras y remolques ligeros).", "fuente": "RGV anexo VII, apartado 2", "img": null}, {"tema": 9, "q": "El titular de un vehículo cambia de domicilio, sin que cambie la titularidad del vehículo. ¿De qué plazo dispone para comunicarlo a la Jefatura de Tráfico para renovar el permiso de circulación?", "opts": ["Quince días desde que se produjo el cambio", "Tres meses desde que se produjo el cambio", "Seis meses desde que se produjo el cambio"], "a": 0, "expl": "El cambio de nombre, apellidos o domicilio del titular que no modifica la titularidad registral debe comunicarse en quince días desde que se produce, para renovar el permiso de circulación.", "fuente": "Reglamento General de Vehículos (RD 2822/1998), art. 30.2", "img": null}, {"tema": 9, "q": "Una persona vende a otra su turismo, matriculado en España. ¿En qué plazo debe el vendedor notificar la transmisión a la Jefatura de Tráfico?", "opts": ["En cuarenta y ocho horas desde la transmisión", "En tres meses desde la transmisión", "En diez días desde la transmisión"], "a": 2, "expl": "El transmitente debe notificarlo a la Jefatura de Tráfico en el plazo de diez días desde la transmisión; si no lo hace, sigue siendo considerado titular.", "fuente": "RGV art. 30.2", "img": null}, {"tema": 9, "q": "¿Cuál de estos neumáticos no puede utilizarse en la vía pública?", "opts": ["Uno con ampollas, deformaciones anormales o cables al descubierto", "Uno recauchutado que conserva sus inscripciones reglamentarias", "Uno nuevo, de las dimensiones previstas por el fabricante del vehículo"], "a": 0, "expl": "Los neumáticos, nuevos o recauchutados, no deben presentar ampollas, deformaciones, roturas ni cables al descubierto, y deben conservar las inscripciones reglamentarias.", "fuente": "RGV anexo VII, apartado 4", "img": null}, {"tema": 9, "q": "¿Qué consecuencia tiene para un propietario circular con un vehículo sin seguro obligatorio?", "opts": ["La retirada del permiso de conducción durante un año", "Prohibición de circular y depósito del vehículo a su costa", "Solo una multa, pudiendo seguir circulando mientras la recurre"], "a": 1, "expl": "La falta de seguro implica prohibición de circular, depósito o precinto del vehículo con cargo al propietario y multa.", "fuente": "RDL 8/2004 art. 3.1", "img": null}, {"tema": 9, "q": "El titular de un turismo solicita la baja temporal voluntaria y no pide prórroga. ¿Qué ocurre al cumplirse un año desde la solicitud?", "opts": ["Pasa automáticamente a baja definitiva en el Registro", "Termina la baja y el vehículo vuelve a estar activo", "Se prorroga automáticamente otro año"], "a": 1, "expl": "La baja temporal voluntaria dura un año como máximo; si no se solicita prórroga, termina y el vehículo vuelve a estar activo.", "fuente": "RGV art. 36.1.a", "img": null}, {"tema": 9, "q": "¿Con cuánta antelación máxima puede solicitarse la prórroga de vigencia de un permiso de conducción respecto a su fecha de caducidad?", "opts": ["Seis meses", "Nueve meses", "Tres meses"], "a": 2, "expl": "La solicitud de prórroga puede presentarse con una antelación máxima de tres meses a la fecha de caducidad.", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 13.1", "img": null}, {"tema": 9, "q": "Una motocicleta de 125 cm³ tiene cinco años desde su primera matriculación. ¿Con qué frecuencia debe pasar la ITV?", "opts": ["Cada cuatro años", "Cada dos años", "Cada año"], "a": 1, "expl": "Las motocicletas (resto de la categoría L) están exentas hasta los 4 años y después tienen ITV bienal.", "fuente": "RD 920/2017 art. 6.1 (tabla)", "img": null}, {"tema": 9, "q": "¿Qué periodo de vigencia tiene el permiso de conducción de la clase B de un titular de 40 años?", "opts": ["Cinco años", "Quince años", "Diez años"], "a": 2, "expl": "El permiso B tiene un periodo de vigencia de diez años mientras su titular no cumpla los sesenta y cinco; desde esa edad, cinco años.", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 12.2", "img": null}, {"tema": 9, "q": "¿Con qué periodicidad debe pasar la ITV un turismo de uso particular con doce años desde su primera matriculación?", "opts": ["Cada año", "Cada dos años", "Cada seis meses"], "a": 0, "expl": "A partir de más de 10 años de antigüedad, la frecuencia de la ITV de los turismos es anual.", "fuente": "RD 920/2017 inspección técnica de vehículos, texto consolidado BOE, art. 6.1", "img": null}, {"tema": 9, "q": "Un conductor tiene el permiso B desde hace cuatro años y sin limitaciones. ¿Qué motocicletas puede conducir en España sin otro permiso?", "opts": ["Cualquier motocicleta de hasta 35 kW de potencia", "Las del permiso A1, solo dentro del territorio nacional", "Ninguna, el permiso B no autoriza a conducir motocicletas"], "a": 1, "expl": "Con más de tres años de antigüedad, el permiso B permite conducir en España las motocicletas de la clase A1 (hasta 125 cm³ y 11 kW).", "fuente": "RGC (Conductores) art. 4.2 (tabla, clase B)", "img": null}, {"tema": 9, "q": "Una persona compra un turismo ya matriculado a un particular. ¿En qué plazo debe solicitar la renovación del permiso de circulación a su nombre?", "opts": ["Dentro de los treinta días desde la adquisición", "Dentro del año siguiente a la adquisición del vehículo", "Dentro de los tres meses siguientes a la adquisición"], "a": 0, "expl": "El adquirente debe solicitar la renovación del permiso de circulación dentro del plazo de treinta días desde la adquisición.", "fuente": "RD 2822/1998 Reglamento General de Vehículos (texto consolidado 26/06/2026), art. 32.3", "img": null}, {"tema": 10, "q": "Su vehículo ha quedado inmovilizado en una autovía y no puede reemprender la marcha. Si las condiciones de circulación no permiten a los ocupantes abandonarlo con seguridad, ¿qué deben hacer?", "opts": ["Bajar y esperar de pie delante del vehículo", "Bajar y colocarse en el carril contiguo para pedir ayuda", "Permanecer en el habitáculo con el cinturón abrochado"], "a": 2, "expl": "Si bajarse no es seguro, los ocupantes deben permanecer en el habitáculo con el cinturón abrochado hasta que llegue el auxilio.", "fuente": "RGC art. 130.3", "img": null}, {"tema": 10, "q": "Al avisar al 112 tras un accidente, ¿qué información debe facilitarse?", "opts": ["Dónde ocurrió, cuántos heridos hay y qué peligros existen", "Solo la matrícula y los nombres de los implicados en el choque", "Únicamente la hora del accidente y la marca de los coches implicados"], "a": 0, "expl": "Hay que indicar el lugar exacto, el número de heridos y vehículos y los peligros especiales, como fuego o mercancías peligrosas.", "fuente": "DGT, conducta PAS (Proteger, Alertar, Socorrer)", "img": null}, {"tema": 10, "q": "Un herido tiene una herida que sangra abundantemente. ¿Qué debe hacerse en primer lugar?", "opts": ["Dejar que sangre unos minutos para que se limpie sola", "Retirar el apósito cada pocos segundos para ver si sigue sangrando", "Presionar directamente sobre la herida de forma firme y mantenida"], "a": 2, "expl": "La hemorragia externa se controla comprimiendo la herida firmemente y de forma sostenida (Cruz Roja indica unos 10 minutos).", "fuente": "Cruz Roja, 'Por ejemplo... aprende a actuar en un accidente'; DGT, Qué hacer ante un accidente", "img": null}, {"tema": 10, "q": "Un herido con sospecha de fractura en una pierna no corre peligro en el lugar del accidente. ¿Qué debe hacerse?", "opts": ["Ayudarle a ponerse en pie para ver si puede apoyar la pierna", "Intentar recolocar el hueso en su posición normal con cuidado", "No moverlo e inmovilizar la zona hasta que lleguen"], "a": 2, "expl": "Ante una fractura se evitan las movilizaciones del herido y se inmoviliza la zona; nunca se intenta recolocar el hueso.", "fuente": "Manual de Primeros Auxilios (JCyL); CICR, Folleto de primeros auxilios", "img": null}, {"tema": 10, "q": "En la RCP de un adulto, ¿a qué frecuencia deben darse las compresiones torácicas?", "opts": ["Entre 140 y 160 por minuto", "Entre 100 y 120 por minuto", "Entre 60 y 80 por minuto"], "a": 1, "expl": "Las guías del ERC 2021 fijan 100-120 compresiones por minuto, a 5-6 cm de profundidad, con las mínimas interrupciones posibles.", "fuente": "ERC Guidelines 2021, Basic Life Support, 'High quality chest compressions'", "img": null}, {"tema": 10, "q": "Un motorista accidentado yace en el suelo con el casco puesto. Si quien le auxilia no conoce la técnica adecuada, ¿qué debe hacer con el casco?", "opts": ["Quitárselo tirando hacia arriba para ver las lesiones", "Quitárselo enseguida para que respire mejor", "No quitárselo y esperar a los servicios sanitarios"], "a": 2, "expl": "Retirar mal el casco puede agravar lesiones cervicales; solo debe hacerlo quien conozca la técnica.", "fuente": "DGT, Unidad didáctica 'Saber actuar en caso de accidente'; DGT, Qué hacer ante un accidente", "img": null}, {"tema": 10, "q": "Ante una quemadura, ¿cuál de estas actuaciones es incorrecta?", "opts": ["Echar pomada sobre la zona", "Cubrir la quemadura con una gasa limpia", "Enfriar la zona con agua fría"], "a": 0, "expl": "No deben aplicarse ungüentos ni pomadas sobre una quemadura ni reventarse las ampollas; se enfría con agua y se cubre con gasa limpia.", "fuente": "CICR/Cruz Roja, Folleto de primeros auxilios; Manual de Primeros Auxilios (JCyL)", "img": null}, {"tema": 10, "q": "Una persona inconsciente respira con normalidad, no hay peligro en el lugar y no se sospechan lesiones que desaconsejen moverla. ¿Qué se hace mientras llegan los servicios de emergencia?", "opts": ["Sentarla y darle agua poco a poco hasta que reaccione y hable", "Llamar al 112, ponerla de lado (PLS) y vigilar su respiración", "Zarandearla con fuerza y abofetearla hasta que recobre el conocimiento"], "a": 1, "expl": "Si la víctima respira y no hay traumatismos visibles, se coloca en posición de recuperación (lateral de seguridad), se llama al 112 y se vigila su respiración.", "fuente": "Manual de Primeros Auxilios (Junta de Castilla y León, basado en Cruz Roja/ERC)", "img": null}, {"tema": 10, "q": "Una persona inconsciente no respira o lo hace de forma anormal. ¿Qué debe hacerse?", "opts": ["Esperar a la ambulancia sin tocarla, para no agravar posibles lesiones", "Llamar al 112 y empezar enseguida las compresiones torácicas", "Colocarla de lado y esperar a ver si recupera la respiración"], "a": 1, "expl": "Ante una persona inconsciente que no respira normalmente hay que pedir ayuda al 112 e iniciar la RCP sin demora.", "fuente": "Manual de Primeros Auxilios (Junta de Castilla y León); ERC Guidelines 2021, Basic Life Support", "img": null}, {"tema": 10, "q": "Al presenciar un accidente de tráfico, ¿cuál es el orden correcto de la conducta PAS?", "opts": ["Socorrer, proteger y avisar", "Avisar, socorrer y proteger", "Proteger, avisar y socorrer"], "a": 2, "expl": "La conducta PAS indica primero proteger el lugar (y a uno mismo) para evitar nuevos accidentes, después avisar al 112 y por último socorrer a las víctimas.", "fuente": "DGT, Qué hacer ante un accidente de tráfico; DGT, Unidad didáctica 'Saber actuar en caso de accidente'", "img": null}, {"tema": 10, "q": "Tras un accidente con heridas claramente leves, circulación restablecida y sin que nadie lo pida, ¿hay que avisar a la autoridad?", "opts": ["No es necesario avisarla ni permanecer allí", "Sí, siempre hay que avisar y esperar a los agentes", "Sí, aunque no es preciso esperar a su llegada"], "a": 0, "expl": "El RGC dispensa de avisar y de permanecer si solo hay heridas claramente leves, la seguridad está restablecida y nadie lo solicita.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 129.2.e)", "img": null}, {"tema": 10, "q": "Una persona sufre una quemadura leve en un brazo. ¿Qué debe hacerse en primer lugar?", "opts": ["Enfriarla con un chorro suave de agua fría varios minutos", "Aplicar aceite o una pomada grasa para aislar la piel del aire", "Aplicar hielo directamente sobre la piel quemada y vendarla"], "a": 0, "expl": "El primer auxilio en una quemadura es enfriarla con agua fría abundante y suave (Cruz Roja: 10-15 minutos).", "fuente": "Cruz Roja (quemaduras: enfriar con agua fría)", "img": null}, {"tema": 10, "q": "Un herido tiene un objeto clavado profundamente en el pecho. ¿Qué debe hacer quien le auxilia?", "opts": ["Extraerlo con rapidez para que el herido pueda respirar mejor", "No sacarlo e inmovilizarlo hasta la llegada de sanitarios", "Extraerlo con cuidado y presionar después sobre la herida"], "a": 1, "expl": "Un objeto clavado no debe sacarse: al retirarlo puede producirse una hemorragia grave; se inmoviliza.", "fuente": "CICR/Cruz Roja, Folleto de primeros auxilios", "img": null}, {"tema": 10, "q": "Hay una persona muerta o gravemente herida en un accidente. Salvo que perjudique a heridos o a la circulación, ¿qué debe procurarse?", "opts": ["Retirar de inmediato los vehículos para reabrir la vía", "Evitar que se modifique el estado de las cosas y las huellas", "Limpiar la calzada de restos antes de que lleguen los agentes"], "a": 1, "expl": "Se debe evitar la modificación del estado de las cosas y de las huellas útiles para determinar responsabilidades, salvo que perjudique a heridos o a la circulación.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 129.2.c)", "img": null}, {"tema": 10, "q": "Tras un accidente, ¿dónde debe cumplimentarse el parte amistoso con los datos de los implicados?", "opts": ["En el propio carril, para no mover los vehículos", "En el arcén, con las luces de emergencia encendidas", "En un lugar seguro fuera de la vía"], "a": 2, "expl": "Se prohíbe cumplimentar el parte en la plataforma de circulación (calzada y arcenes); debe hacerse en un lugar seguro fuera de la vía.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 130.5", "img": null}, {"tema": 10, "q": "En una reanimación cardiopulmonar (RCP) a un adulto con ventilaciones de rescate, ¿qué relación entre compresiones y ventilaciones se aplica?", "opts": ["30 compresiones y 2 ventilaciones", "50 compresiones y 1 ventilación", "15 compresiones y 5 ventilaciones"], "a": 0, "expl": "Las guías del ERC 2021 indican alternar 30 compresiones torácicas con 2 ventilaciones de rescate en el adulto.", "fuente": "ERC Guidelines 2021, Basic Life Support, 'Rescue breaths'", "img": null}, {"tema": 10, "q": "¿Cuándo debe aplicarse un torniquete en una hemorragia de un miembro?", "opts": ["Nunca, ni aunque la presión directa no detenga el sangrado", "Siempre, antes de presionar la herida", "Solo si falla la compresión directa sobre la herida"], "a": 2, "expl": "La compresión directa es la primera medida; el torniquete se reserva para cuando esta falla, y no debe aflojarse hasta la llegada de los sanitarios.", "fuente": "Manual de Primeros Auxilios (JCyL, apartado Hemorragias)", "img": null}, {"tema": 10, "q": "Un herido consciente en un accidente dice tener mucha sed. ¿Qué debe hacer quien le atiende?", "opts": ["Darle una bebida azucarada para evitar un desmayo", "No darle de beber ni de comer, ni siquiera agua", "Darle agua en pequeños sorbos"], "a": 1, "expl": "No se debe dar de comer ni beber a los heridos, ni siquiera agua, por si requieren intervención sanitaria o pierden el conocimiento.", "fuente": "DGT, Unidad didáctica 'Saber actuar en caso de accidente'; DGT, Qué hacer ante un accidente", "img": null}, {"tema": 10, "q": "Su vehículo, tras una avería, puede moverse pero necesita servicio de auxilio. ¿Qué debe hacer en una autovía?", "opts": ["Detenerse donde esté, en el propio carril, con las luces de emergencia encendidas", "Salir de los carriles y seguir por el arcén derecho hasta la salida", "Seguir por el carril izquierdo hasta la próxima área de servicio"], "a": 1, "expl": "Debe abandonar cuanto antes los carriles y dirigirse a la primera salida disponible por el arcén derecho.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 130.2", "img": null}, {"tema": 10, "q": "Si presencia un accidente en el que no está implicado y hay víctimas, ¿qué está obligado a hacer?", "opts": ["Auxiliar a las víctimas o solicitar auxilio para ellas", "Continuar su camino, pues solo los implicados deben actuar", "Avisar únicamente si hay víctimas mortales"], "a": 0, "expl": "La obligación de auxilio alcanza a quien se ve implicado, presencia el accidente o tiene conocimiento de él.", "fuente": "Ley de Tráfico RDL 6/2015 art. 51.1", "img": null}, {"tema": 11, "q": "¿Cuándo se descuentan los puntos tras una sanción firme en vía administrativa?", "opts": ["Al anotarse la sanción firme en el registro de conductores", "Desde el momento en que el agente formula la denuncia al conductor", "Cuando el conductor renueve el permiso de conducción en la DGT"], "a": 0, "expl": "Los puntos se descuentan automáticamente cuando la infracción sancionada en firme se anota en el registro de conductores e infractores.", "fuente": "Ley de Tráfico RDL 6/2015 art. 64.5", "img": null}, {"tema": 11, "q": "En un mismo día un conductor comete varias infracciones graves, cada una de las cuales detrae puntos, y la suma supera con mucho los ocho. ¿Cuántos puntos pierde como máximo ese día?", "opts": ["Diez puntos", "Seis puntos", "Ocho puntos"], "a": 2, "expl": "Por acumulación de infracciones en un solo día no se pierden más de ocho puntos, salvo que concurran ciertas infracciones muy graves del art. 77, que no es el caso.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 64.4", "img": null}, {"tema": 11, "q": "Un conductor comete una infracción que acarrea pérdida de puntos mientras circula en bicicleta. ¿Pierde puntos por ella?", "opts": ["No, la pérdida solo afecta a vehículos que exigen permiso", "Sí, pero únicamente si la infracción cometida es muy grave", "Sí, se descuentan igual que si condujera un coche o una moto"], "a": 0, "expl": "La pérdida de puntos solo se produce cuando el hecho se comete conduciendo un vehículo para el que se exige permiso o licencia.", "fuente": "Ley de Tráfico RDL 6/2015 art. 65.3", "img": null}, {"tema": 11, "q": "Un conductor no profesional conserva parte de sus puntos y realiza y supera un curso de sensibilización y reeducación vial. ¿Qué puede recuperar?", "opts": ["Hasta ocho puntos, una sola vez cada año natural", "Hasta seis puntos, una sola vez cada dos años", "Hasta tres puntos, una vez cada seis meses"], "a": 1, "expl": "El curso permite recuperar hasta un máximo de seis puntos, por una sola vez cada dos años (los profesionales pueden hacerlo anualmente).", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 65.4", "img": null}, {"tema": 11, "q": "¿Qué ocurre con el permiso de conducción de quien pierde la totalidad de los puntos asignados?", "opts": ["Solo le autoriza a conducir por las vías urbanas", "Pierde su vigencia y el titular no puede conducir", "Queda en suspenso un mes y después se restablece"], "a": 1, "expl": "La vigencia del permiso está condicionada a no haber perdido el crédito de puntos. Si se pierden todos, se declara la pérdida de vigencia.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 61.3; RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, arts. 12.5 y 37", "img": null}, {"tema": 11, "q": "Un conductor tiene un permiso de conducción con más de tres años de antigüedad y no se da ninguno de los supuestos excepcionales. ¿Qué crédito inicial de puntos se le asigna?", "opts": ["Doce puntos", "Quince puntos", "Diez puntos"], "a": 0, "expl": "El crédito inicial ordinario es de doce puntos. Los quince solo se alcanzan como máximo con la bonificación por no ser sancionado.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 63.1", "img": null}, {"tema": 11, "q": "Un conductor es titular de un permiso B y de un permiso A. ¿Cómo se gestiona su crédito de puntos?", "opts": ["Solo cuenta el crédito del permiso que obtuvo en último lugar", "Tiene un único crédito de puntos para todas sus autorizaciones", "Tiene un crédito de puntos independiente para cada permiso suyo"], "a": 1, "expl": "El crédito de puntos es único para todas las autorizaciones administrativas de las que sea titular el conductor.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 63.3", "img": null}, {"tema": 11, "q": "Un conductor mantiene todos sus puntos porque no ha sido sancionado en firme. Con la bonificación, ¿cuál es el máximo de puntos que puede llegar a acumular?", "opts": ["Quince puntos", "Catorce puntos", "Dieciocho puntos"], "a": 0, "expl": "La bonificación (dos puntos en los tres primeros años y uno en los tres siguientes) permite llegar como máximo a quince en lugar de los doce iniciales.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 63.4", "img": null}, {"tema": 11, "q": "Un conductor no profesional pierde la vigencia del permiso por perder todos los puntos (primera vez). ¿Cuánto tiempo debe esperar, como mínimo, para poder obtener un nuevo permiso?", "opts": ["Seis meses", "Tres meses", "Nueve meses"], "a": 0, "expl": "Quien pierde la vigencia por pérdida total de puntos no puede obtener un nuevo permiso hasta que transcurran seis meses (tres para profesionales).", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 38.3", "img": null}, {"tema": 11, "q": "Un conductor perdió parte de sus puntos por infracciones graves. Si pasan dos años sin que se le imponga una sanción firme que conlleve pérdida de puntos, ¿qué ocurre?", "opts": ["Recupera solo la mitad de los puntos que había perdido", "Recupera los puntos únicamente si antes realiza un curso", "Recupera la totalidad del crédito inicial de doce puntos"], "a": 2, "expl": "Tras dos años sin sanciones firmes que conlleven pérdida de puntos se recupera la totalidad del crédito inicial de doce puntos, sin necesidad de curso.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 65.1", "img": null}, {"tema": 11, "q": "¿Qué compensa la superación de un curso de conducción segura y eficiente a quien tiene saldo positivo de puntos?", "opts": ["Un punto adicional, hasta un máximo de doce puntos", "Seis puntos adicionales, por una sola vez cada dos años", "Dos puntos adicionales, hasta un máximo de quince"], "a": 2, "expl": "El curso de conducción segura y eficiente compensa con dos puntos adicionales hasta un máximo de quince.", "fuente": "Ley de Tráfico RDL 6/2015 art. 63.5", "img": null}, {"tema": 11, "q": "Un conductor ha perdido la vigencia de su permiso por pérdida total de puntos. ¿Qué debe hacer para obtener de nuevo el permiso?", "opts": ["Superar de nuevo únicamente la prueba práctica de circulación en vía abierta, sin curso previo", "Esperar dos años sin conducir y solicitar el permiso en la Jefatura Provincial de Tráfico", "Realizar el curso de sensibilización y reeducación vial y superar la prueba de conocimientos"], "a": 2, "expl": "Para recuperar el permiso tras la pérdida total de puntos se exige el curso de sensibilización y reeducación vial y superar la prueba de control de conocimientos, además del plazo de espera.", "fuente": "RD 818/2009 Reglamento General de Conductores, texto consolidado BOE, art. 38.1", "img": null}, {"tema": 11, "q": "Una persona recupera su permiso tras una condena penal de privación del derecho a conducir superior a dos años. ¿Con cuántos puntos empieza?", "opts": ["Con 6 puntos", "Con 8 puntos", "Con 12 puntos"], "a": 1, "expl": "El permiso obtenido tras una condena de más de dos años dispone de un saldo de 8 puntos.", "fuente": "Ley de Tráfico RDL 6/2015 art. 73.1", "img": null}, {"tema": 11, "q": "Un conductor no profesional obtiene un nuevo permiso tras perder todos sus puntos y, antes de tres años, los vuelve a perder todos. ¿Cuánto debe esperar para obtener otro?", "opts": ["Doce meses desde la notificación del acuerdo", "Seis meses desde la notificación de la resolución", "Tres meses desde la notificación de la resolución"], "a": 0, "expl": "Si la nueva pérdida total se produce en los tres años siguientes, el plazo es de doce meses (seis para profesionales).", "fuente": "Ley de Tráfico RDL 6/2015 art. 71.1", "img": null}, {"tema": 11, "q": "Una persona obtiene su primer permiso de conducción y nunca ha sido titular de otro. ¿Con cuántos puntos empieza?", "opts": ["Con diez puntos hasta que cumpla su primer año de permiso", "Con doce puntos, igual que cualquier otro conductor titular", "Con ocho puntos, por tener menos de tres años de permiso"], "a": 2, "expl": "Excepcionalmente se asigna un crédito inicial de ocho puntos a quien tiene una antigüedad no superior a tres años.", "fuente": "RDL 6/2015 (Ley de Tráfico), texto consolidado BOE, art. 63.2.a", "img": null}, {"tema": 12, "q": "En una autovía con dos carriles en el mismo sentido hay retención y los vehículos avanzan al paso o están detenidos. Si se aproxima un vehículo prioritario con señales especiales, ¿dónde debe formarse el carril de emergencia?", "opts": ["En el arcén derecho, al que se apartan todos los vehículos", "En el carril de la derecha, que todos los conductores dejan libre", "En el centro de la vía, entre los dos carriles del mismo sentido"], "a": 2, "expl": "Con dos carriles por sentido, los vehículos se orillan hacia los lados y el espacio libre (carril de emergencia) queda en el centro, entre ambos carriles.", "fuente": "RGC art. 32.1 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "¿En qué vías urbanas puede la autoridad municipal permitir que las bicicletas circulen en los dos sentidos?", "opts": ["En todas las calles con un carril por sentido y límite de 50 km/h", "En las de un solo carril con límite de 30 km/h o menos", "En cualquier calle de un solo carril, sea cual sea su límite"], "a": 1, "expl": "Es posible en vías urbanas de un solo carril limitadas a 30 km/h o menos y previa señalización.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 153.6", "img": null}, {"tema": 12, "q": "Un peatón camina de noche por el arcén de una carretera interurbana. ¿Qué debe llevar como mínimo?", "opts": ["Un elemento luminoso o reflectante visible a 150 metros", "Un elemento luminoso o reflectante visible a solo 50 metros", "Ropa de color claro y buena visibilidad, sin otros elementos"], "a": 0, "expl": "Entre el ocaso y la salida del sol, el peatón que transita por calzada o arcén en vía interurbana debe llevar un elemento luminoso o reflectante visible a 150 metros.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 123.1", "img": null}, {"tema": 12, "q": "Un niño de diez años quiere ir en bicicleta por la acera. ¿En qué caso es posible?", "opts": ["Si lleva casco y circula pegado a las fachadas", "Si no hay peatones en ese momento y va a poca velocidad", "Si la ordenanza lo permite y va con un adulto a pie"], "a": 2, "expl": "Las ordenanzas pueden permitir la circulación por aceras de niños de hasta doce años en bicicleta, a cargo de un adulto que : "RGC art. 65.1.b) (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Va a girar con su turismo para entrar en otra vía y hay un ciclista en sus proximidades. ¿Quién tiene prioridad?", "opts": ["El ciclista", "El conductor del turismo, por ser vehículo a motor", "El que llegue antes al punto de cruce"], "a": 0, "expl": "El ciclista tiene prioridad cuando el vehículo de motor gira para entrar en otra vía y hay un ciclista en sus proximidades.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 64.2.b)", "img": null}, {"tema": 12, "q": "Unos viajeros acaban de bajar de un autobús en una parada señalizada y están entre el autobús y la zona peatonal. ¿Quién tiene prioridad?", "opts": ["Los peatones", "El conductor que circula por la calzada", "El primero que llegue al punto de cruce"], "a": 0, "expl": "Los peatones tienen prioridad cuando van a subir o han bajado de un vehículo de transporte colectivo en una parada señalizada y se encuentran entre este y la zona peatonal o refugio.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 65.1.d)", "img": null}, {"tema": 12, "q": "En una vía con dos carriles por sentido, ¿por cuál circulan los ciclistas, como norma general?", "opts": ["Por el carril derecho", "Por el que prefieran en cada momento", "Por el carril izquierdo, para ser más visibles"], "a": 0, "expl": "En vías con al menos dos carriles por sentido los ciclistas circulan por el carril derecho, y pueden usar otros para cambiar de dirección o por seguridad.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 153.3", "img": null}, {"tema": 12, "q": "¿Qué obligación de protección tiene el conductor de un patinete eléctrico?", "opts": ["Usar casco solo si es menor de dieciséis años", "Usar casco homologado o certificado, bien abrochado", "Usar casco solo cuando circule por vías interurbanas"], "a": 1, "expl": "Todos los conductores de vehículos de movilidad personal deben utilizar casco adecuadamente abrochado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 118.3", "img": null}, {"tema": 12, "q": "Va a adelantar a un ciclista en una carretera interurbana con dos carriles por sentido. ¿Qué exige el Reglamento a partir del 1-oct-2026?", "opts": ["Rebasarlo por su mismo carril avisando antes con la bocina", "Realizar un cambio completo de carril para rebasarlo", "Mantenerse en su carril si deja un metro de separación lateral"], "a": 1, "expl": "Cuando la calzada tiene más de un carril por sentido, el adelantamiento a ciclistas exige cambiar completamente de carril, no basta con apartarse lateralmente.", "fuente": "RGC art. 85.4 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "En una carretera convencional con un carril por sentido, ¿qué separación lateral mínima debe dejar al adelantar a un ciclista?", "opts": ["2 metros como mínimo", "1 metro como mínimo", "1,5 metros"], "a": 2, "expl": "El adelantamiento exige una anchura de seguridad de al menos 1,5 metros, ocupando parte o la totalidad del carril contiguo o contrario.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 85.4", "img": null}, {"tema": 12, "q": "Conduce un turismo detrás de un ciclista en el mismo carril. ¿Qué separación mínima debe dejar?", "opts": ["Al menos diez metros", "Al menos cinco metros", "Al menos tres metros y medio"], "a": 1, "expl": "Los conductores de vehículos a motor deben dejar una separación mínima de cinco metros con los ciclistas que les precedan en el mismo carril.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 153.4", "img": null}, {"tema": 12, "q": "A efectos de adelantamiento, ¿cómo se considera un grupo de ciclistas que circula agrupado?", "opts": ["Como un obstáculo fijo en la calzada", "Como varios ciclistas a adelantar uno a uno", "Como una única unidad móvil"], "a": 2, "expl": "El art. 85.4 establece que los conductores de bicicletas que circulan en grupo se consideran una única unidad móvil, de modo que la maniobra se hace respecto al conjunto.", "fuente": "RGC art. 85.4 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Un peatón camina por una carretera convencional fuera de poblado y no dispone de zona peatonal practicable. Como norma general, ¿por dónde debe circular?", "opts": ["Por el centro de la calzada, sobre la línea longitudinal", "Por el arcén derecho, si existe y es practicable", "Por el arcén izquierdo, si existe y es practicable"], "a": 2, "expl": "Sin zona peatonal, el peatón usa el arcén izquierdo si existe y es practicable; si no, la calzada lo más alejado posible del tránsito. Solo por la derecha cuando razones de seguridad lo justifiquen.", "fuente": "RGC art. 122.1 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Se acerca a un paso para ciclistas debidamente señalizado por el que cruza un ciclista. ¿Quién tiene prioridad de paso?", "opts": ["El ciclista", "Usted, por conducir un vehículo de motor", "Quien llegue antes al cruce"], "a": 0, "expl": "Los ciclistas tienen prioridad cuando circulan por un carril bici, paso para ciclistas o arcén debidamente señalizados.", "fuente": "RGC art. 64.2.a) (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "¿Qué dato puede consultar el titular de un permiso en la aplicación miDGT?", "opts": ["La ubicación diaria de los radares móviles", "El historial de sanciones de otros conductores", "El saldo de puntos de su permiso"], "a": 2, "expl": "miDGT permite llevar el permiso y la documentación del vehículo en el móvil y consultar, entre otros datos, el saldo de puntos.", "fuente": "DGT, nota de prensa de la aplicación miDGT", "img": null}, {"tema": 12, "q": "¿Pueden circular los vehículos de movilidad personal (por ejemplo, patinetes eléctricos) por autopistas y autovías?", "opts": ["Sí, pero únicamente por el arcén derecho de la vía", "No, está prohibido que circulen", "Sí, siempre que no superen los 25 km/h"], "a": 1, "expl": "El RGC prohíbe a los vehículos de movilidad personal circular por autopistas y autovías (y por travesías).", "fuente": "RGC art. 38.4 (redacción RD 518/2026)", "img": null}, {"tema": 12, "q": "Circula por una zona donde caminan niños y personas mayores. ¿Qué debe hacer el conductor?", "opts": ["Avisar con la bocina de forma continuada", "Mantener la velocidad, pues los peatones deben apartarse solos", "Extremar el cuidado para no poner en riesgo su integridad"], "a": 2, "expl": "Los peatones, en especial niños, mayores y personas con movilidad reducida, gozan de prioridad de paso y estancia, y los conductores deben extremar el cuidado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 121.1", "img": null}, {"tema": 12, "q": "¿Pueden los peatones atravesar una glorieta por su calzada?", "opts": ["No, deben rodearla salvo que haya un paso habilitado", "Sí, siempre que no haya vehículos circulando", "Sí, si lo hacen perpendicularmente al eje de la calzada"], "a": 0, "expl": "Los peatones no podrán atravesar plazas y glorietas por su calzada, debiendo rodearlas, salvo que exista un paso para peatones habilitado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 124.4", "img": null}, {"tema": 12, "q": "Va a adelantar a un ciclista fuera de poblado. ¿Qué debe hacer con su velocidad durante la maniobra?", "opts": ["Aumentarla notoriamente para acortar la duración de la maniobra", "Reducirla 20 km/h como mínimo respecto al límite", "Circular al límite de velocidad de la vía sin sobrepasarlo"], "a": 1, "expl": "Fuera de poblado el que adelanta a un ciclista debe reducir la velocidad al menos 20 km/h respecto al límite existente, antes y durante la maniobra.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 85.4", "img": null}, {"tema": 12, "q": "Cuando se habilita el arcén derecho para motocicletas, ¿qué velocidad máxima y formación se exigen?", "opts": ["50 km/h máximo, en columna de a uno", "30 km/h, en columnas de a dos", "30 km/h, en columna de a uno"], "a": 2, "expl": "En los tramos habilitados y señalizados, con la circulación detenida por congestión, la velocidad se limita a 30 km/h y solo se circula en columna de a uno.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 36.3", "img": null}]};</script>
<script>/* ApruebaB · simulador de percepción de riesgo (escenas propias, vista del conductor). Sin dependencias. */
(function () {
  "use strict";
  var W = 360, H = 216, HZ = 82, F = 240, CAMH = 1.3;

  /* ---------- geometría ---------- */
  function P(x, z) { var s = F / z; return { x: W / 2 + x * s, y: HZ + CAMH * s, s: s }; }
  function quad(c, x0, x1, z0, z1, col) {
    var a = P(x0, z0), b = P(x1, z0), d = P(x1, z1), e = P(x0, z1);
    c.fillStyle = col; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(d.x, d.y); c.lineTo(e.x, e.y); c.closePath(); c.fill();
  }
  function lerpKeys(keys, t, idx) {
    // keys: [[t, v...]] -> interpolación lineal del valor idx
    if (t <= keys[0][0]) return keys[0][idx];
    for (var i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) { var k = (t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0] || 1); return keys[i - 1][idx] + (keys[i][idx] - keys[i - 1][idx]) * k; }
    }
    return keys[keys.length - 1][idx];
  }
  function egoZ(sc, t) {
    // hasta el corte, velocidad constante; después, el conductor reduce (lo correcto) hasta un 35 %
    if (t <= sc.cut) return sc.v * t;
    var s = t - sc.cut, d = Math.min(s, 2), z = sc.v * sc.cut + sc.v * (d - 0.325 * d * d / 1);
    if (s > 2) z += sc.v * 0.35 * (s - 2);
    return z;
  }

  /* ---------- dibujo de actores (vista desde detrás/delante) ---------- */
  function box(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
  function drawActor(c, a, st) {
    var s = st.s, x = st.x, y = st.y; // x centro, y suelo

<script>/* ApruebaB · motor de tests de teórico (v0.1). Sin dependencias. */
(function () {
  "use strict";
  var BANK = window.BANK, SIGNS = window.SIGNS || {};
  var EXAM_N = 30, EXAM_SEC = 30 * 60, EXAM_MAX_FAILS = 3;
  var KEY = "abp:v1", KEYCUR = "abp:cur", KEYX = "abp:extra";

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function $(id) { return document.getElementById(id); }
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return "q" + (h >>> 0).toString(36); }
  function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(a, r) { r = r || Math.random; a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmtT(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }
  function fmtD(ts) { var d = new Date(ts); return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short" }) + " " + d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }

  var mem = {};

  /* ---------- banco ---------- */
  var QS = [], QID = {};
  function addQuestions(list, extra) {
    list.forEach(function (p) {
      if (!p || !p.q || !p.opts || p.opts.length !== 3 || typeof p.a !== "number") return;
      var id = hash(p.q);
      if (QID[id]) return;
      var o = { id: id, tema: p.tema, q: p.q, opts: p.opts, a: p.a, expl: p.expl || "", fuente: p.fuente || "", img: p.img || null, extra: !!extra };
      QS.push(o); QID[id] = o;

  }
  addQuestions(BANK.preguntas, false);
  try { var ex = JSON.parse(lsGet(KEYX) || "[]"); addQuestions(ex, true); } catch (e) { }
  var RISK = window.RISK, TEMAS = {}, activeP = null;
  Object.keys(BANK.temas).forEach(function (k) { TEMAS[k] = BANK.temas[k]; });
  TEMAS["13"] = "Percepción de riesgo (vídeo)";
  if (RISK) RISK.scenes.forEach(function (sc) {
    var o = { id: "v_" + sc.id, tema: 13, q: "¿Qué crees que va a pasar a continuación?", opts: sc.q.despues, a: 0, expl: sc.sol, fuente: "Vídeo de práctica propio · formato de percepción del riesgo del examen teórico", img: null, vid: sc.id };
    QS.push(o); QID[o.id] = o;
  });
  function isVid(q) { return !!q.vid; }
  /* estructura de un test de 30 como el examen real: cuota por grupos de temas + 1 vídeo */
  var GROUPS = [[[2], 5], [[4], 5], [[8, 1], 4], [[9], 3], [[5], 3], [[12], 3], [[3], 2], [[6], 2], [[7], 1], [[10, 11], 1]];
  function structured(pools, r) {
    var out = [];
    GROUPS.forEach(function (g) {
      var ids = [];
      g[0].forEach(function (t) { ids = ids.concat(pools[t] || []); });
      ids = shuffle(ids, r);
      var take = ids.splice(0, g[1]);
      g[0].forEach(function (t) { pools[t] = (pools[t] || []).filter(function (x) { return take.indexOf(x) < 0; }); });
      out = out.concat(take);
    });
    return out;
  }
  function poolsOf(ids) {
    var p = {}; ids.forEach(function (id) { var q = QID[id]; (p[q.tema] = p[q.tema] || []).push(id); }); return p;
  }
  function withVideo(ids, r, k) {
    var vs = RISK ? RISK.scenes : []; if (!vs.length) return shuffle(ids, r);
    var arr = shuffle(ids, r), v = "v_" + vs[k % vs.length].id;
    arr.splice(Math.floor(r() * (arr.length + 1)), 0, v); return arr;
  }
  function examIds() {
    var ids = QS.filter(function (q) { return !isVid(q); }).map(function (q) { return q.id; });
    var r = Math.random, chosen = structured(poolsOf(ids), r);
    if (chosen.length < EXAM_N - 1) { var rest = ids.filter(function (x) { return chosen.indexOf(x) < 0; }); chosen = chosen.concat(shuffle(rest, r).slice(0, EXAM_N - 1 - chosen.length)); }
    return withVideo(chosen, r, Math.floor(Math.random() * 99));
  }

  /* ---------- almacenamiento ---------- */
  var DB;

  }

    for (var guard = 0; guard < 60; guard++) {

      var test = structured(tmp, r);

    }
    var left = []; Object.keys(pools).forEach(function (t) { left = left.concat(pools[t]); });
    if (left.length >= 15 || !out.length) { var v = withVideo(shuffle(left, r).slice(0, EXAM_N - 1), r, k++); out.push(v); }
    NT = out; return NT;
  }
  function sample(ids, n) { return shuffle(ids).slice(0, n); }
  function allIds() { return QS.filter(function (q) { return !isVid(q); }).map(function (q) { return q.id; }); }
  function smartReview(n) {
    var P = PD().qs, now = Date.now();
    var sc = QS.map(function (q) {
      var s = P[q.id], pr;
      if (!s || !s.s) pr = 2.2;                                   // sin ver
      else {
        var age = (now - s.last) / 864e5, wait = [0, 0.5, 2, 5, 12][s.box];
        pr = (s.ok === false ? 4 : 0) + (4 - s.box) * 0.7 + Math.max(0, age - wait) * 0.15 + s.w * 0.3;
        if (s.box >= 4 && age < 12) pr = 0;                       // dominada
      }
      return { id: q.id, p: pr + Math.random() * 0.8 };
    }).filter(function (x) { return x.p > 0; }).sort(function (a, b) { return b.p - a.p; });
    return sc.slice(0, n).map(function (x) { return x.id; });
  }
  function hotIds() {
    var P = PD().qs;
    return Object.keys(P).filter(function (id) { return P[id].w > 0 && QID[id]; }).sort(function (a, b) { return P[b].w - P[a].w || P[b].last - P[a].last; });
  }

  /* ---------- estado de navegación ---------- */

  /* ---------- vistas ---------- */

  V.home = function () {

      '<main class="wrap">' +
      '<section class="hero card"><div class="hero-t">Teórico del carnet B</div><div class="hero-s">' + QS.length + ' preguntas originales · banco v' + esc(BANK.version) + '</div>' +
      '<div class="stats"><div><b>' + (n7 ? Math.round(ok7 / n7 * 100) + "%" : "–") + '</b><span>acierto 7 días</span></div><div><b>' + seen + '/' + QS.length + '</b><span>vistas</span></div><div><b>' + aptos + '/' + exams.length + '</b><span>exámenes aptos</span></div></div></section>' +
      '<div class="grid">' +
      tile("exam", "&#9201;", "Test de examen", "30 preguntas · 30 min · máx. 3 fallos", "tile-main") +
