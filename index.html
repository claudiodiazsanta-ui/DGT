pts": ["Desplazarse lateralmente o reducir la velocidad, deteniéndose si hace falta", "Acelerar para pasar antes de que el autobús se incorpore a la circulación", "Mantener su marcha normal, pues el autobús debe ceder el paso al resto del tráfico"], "a": 0, "expl": "En poblado deben facilitar la maniobra del transporte colectivo desplazándose o reduciendo la velocidad hasta detenerse si es preciso.", "fuente": "RGC art. 73.2", "img": null}, {"tema": 5, "q": "Un conductor da marcha atrás y oye avisos o ve a una persona muy cerca del vehículo. ¿Qué debe hacer?", "opts": ["Detenerse con toda rapidez y desistir de la maniobra si es preciso", "Dar un toque de bocina y terminar la maniobra con mucha lentitud y cuidado", "Seguir con la maniobra apoyándose únicamente en los espejos retrovisores"], "a": 0, "expl": "Debe detenerse con toda rapidez si oye avisos o aprecia la proximidad de otro vehículo, persona o animal, desistiendo si hace falta.", "fuente": "RGC art. 81.3 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "¿En qué casos está permitido circular hacia atrás, además de en maniobras complementarias de otra que lo exija?", "opts": ["Cuando no pueda avanzar ni cambiar de dirección o de sentido", "Cuando el conductor prefiera evitar un giro a la izquierda complicado", "Cuando la vía sea de un solo sentido y no circulen otros vehículos"], "a": 0, "expl": "Solo se permite si no se puede avanzar ni cambiar de dirección o sentido, y con el recorrido mínimo indispensable.", "fuente": "RGC art. 80.1", "img": null}, {"tema": 5, "q": "Un conductor estaciona en una parada de autobús urbano señalizada y delimitada. ¿Cómo se califica su conducta?", "opts": ["Estacionamiento correcto, si no hay ningún autobús esperando en la parada", "Estacionamiento correcto, siempre que no abandone el vehículo más de dos minutos", "Estacionamiento en lugar peligroso o que obstaculiza gravemente la circulación"], "a": 2, "expl": "Estacionar en una parada de transporte público señalizada y delimitada se considera estacionamiento en lugar peligroso o que obstaculiza gravemente la circulación.", "fuente": "RGC art. 91.2.i (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Una avería deja un vehículo obstaculizando la calzada. Tras señalizarlo, ¿qué debe hacer su conductor?", "opts": ["Dejarlo donde está hasta que llegue la grúa, con las luces de emergencia", "Empujarlo hasta el arcén izquierdo para no estorbar al tráfico del sentido contrario", "Sacarlo de la calzada y estacionarlo, si es factible"], "a": 2, "expl": "El conductor debe señalizar, adoptar medidas para que se retire cuanto antes y sacarlo de la calzada, estacionándolo según las normas, siempre que sea factible.", "fuente": "RGC art. 130.1 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Un turismo permanece estacionado en una plaza reservada a personas con discapacidad sin el distintivo que lo autoriza. ¿Qué puede hacer la autoridad?", "opts": ["Solo denunciarlo, pues la retirada exige que obstaculice la circulación", "Retirarlo de la vía y depositarlo en el lugar designado", "Solo inmovilizarlo con un cepo hasta que regrese su conductor"], "a": 1, "expl": "La autoridad puede retirar el vehículo estacionado sin distintivo en zonas de aparcamiento reservado para personas con discapacidad.", "fuente": "Ley de Tráfico RDL 6/2015, art. 105.1.e", "img": null}, {"tema": 5, "q": "¿Está permitido parar un momento en un carril reservado para bicicletas?", "opts": ["No, está prohibido parar en un carril reservado para bicicletas", "Sí, siempre que en ese momento no circule ningún ciclista", "Sí, si es una parada muy breve y se activan las luces de emergencia"], "a": 0, "expl": "Queda prohibido parar en los carriles destinados al uso exclusivo del transporte público urbano o reservados para las bicicletas.", "fuente": "RGC art. 94.1.h (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "En una calzada de doble sentido con tres carriles separados por líneas discontinuas, ¿dónde se coloca quien va a girar a la izquierda?", "opts": ["En el carril central", "En el carril situado más a la izquierda", "En el carril situado más a la derecha"], "a": 0, "expl": "En calzada de doble sentido y tres carriles separados por líneas discontinuas, quien va a girar a la izquierda se coloca en el carril central, que solo se usa para adelantar y para cambiar de dirección hacia la izquierda.", "fuente": "RGC art. 75.1.b) y 30.1.b)", "img": null}, {"tema": 5, "q": "Un vehículo averiado ocupa parcialmente el carril por el que circulamos. Al rebasarlo, ¿qué exige el Reglamento?", "opts": ["Separarse 1,5 metros como mínimo y reducir al menos 20 km/h respecto al límite de la vía.", "Avisar con la bocina y pasar sin modificar la velocidad cuando el sentido contrario esté libre.", "Separarse 1 metro como mínimo y reducir al menos 10 km/h respecto al límite de la vía, si hay tráfico."], "a": 0, "expl": "Desde el RD 518/2026, rebasar un vehículo inmovilizado exige mantener una anchura de seguridad de al menos 1,5 m y reducir la velocidad al menos 20 km/h respecto al límite de la vía.", "fuente": "RGC art. 88.1 (redacción RD 518/2026, en vigor 1-10-2026)", "img": null}, {"tema": 5, "q": "En una vía interurbana sin carril acondicionado para el giro a la izquierda, ¿cómo debe iniciarlo un ciclomotor de dos ruedas?", "opts": ["Colocándose junto al eje de la calzada y girando con el intermitente izquierdo puesto", "Situándose a la derecha, fuera de la calzada si puede, e iniciándolo desde ahí", "Ciñéndose al borde izquierdo de su sentido y cruzando de forma rápida"], "a": 1, "expl": "Los ciclos y ciclomotores de dos ruedas inician el giro a la izquierda desde la derecha, fuera de la calzada siempre que sea posible.", "fuente": "RGC art. 76.2 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Si es posible, ¿cómo debe advertirse la intención de frenar de modo considerable?", "opts": ["Con una sola pisada larga del freno y el intermitente del lado hacia el que se circula", "Con la luz de emergencia encendida en cualquier tipo de vía y ante cualquier frenada", "Con el empleo reiterado de las luces de frenado o moviendo el brazo de arriba abajo"], "a": 2, "expl": "La frenada considerable se avisa con uso reiterado de las luces de freno o con el brazo en movimientos cortos y rápidos de arriba abajo.", "fuente": "RGC art. 109.2.c (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un conductor detiene unos instantes su coche sobre un paso para ciclistas, esperando a un amigo. ¿Qué establece el Reglamento?", "opts": ["Que solo está prohibido si en ese momento cruza algún ciclista", "Que puede hacerse si no se supera el minuto de duración", "Que está prohibido parar en los pasos para ciclistas"], "a": 2, "expl": "La parada está prohibida en pasos a nivel, pasos para ciclistas y pasos para peatones, haya o no usuarios cruzando.", "fuente": "RGC art. 94.1.b (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Una vía dispone de carril de aceleración. ¿Cómo debe actuar el conductor que lo utiliza para incorporarse a la calzada?", "opts": ["Cerciorarse al comienzo del carril de que puede incorporarse sin peligro y acelerar hasta la velocidad adecuada.", "Esperar detenido al comienzo del carril hasta que la calzada quede completamente libre y acelerar después a fondo.", "Incorporarse sin comprobar nada, porque la ley obliga a los demás vehículos de la calzada a cederle siempre el paso."], "a": 0, "expl": "Debe comprobar al principio del carril (incluso deteniéndose si es necesario) que no pone en peligro a nadie y después acelerar hasta la velocidad adecuada para incorporarse.", "fuente": "RGC art. 72.4", "img": null}, {"tema": 5, "q": "Un turismo ha pagado una hora en una zona regulada con limitación horaria y regresa pasadas más de tres horas. ¿Puede retirarlo la autoridad?", "opts": ["No, la retirada solo procede si el vehículo carece de todo título de pago", "No, solo cabe retirarlo si se excede en más de seis horas el tiempo abonado", "Sí, puede retirarlo cuando se rebase el triple del tiempo abonado"], "a": 2, "expl": "La retirada procede en zonas de estacionamiento con limitación horaria cuando no se coloca el distintivo o cuando se rebasa el triple del tiempo abonado.", "fuente": "Ley de Tráfico RDL 6/2015, art. 105.1.g", "img": null}, {"tema": 5, "q": "Respecto al estacionamiento en doble fila, ¿qué establece el Reglamento General de Circulación?", "opts": ["Se permite si se encienden las luces de emergencia", "Se permite si no se obstaculiza a otros vehículos", "Queda prohibido estacionar en doble fila"], "a": 2, "expl": "Estacionar en doble fila está prohibido y, si se hace sin conductor, se considera estacionamiento en lugar peligroso o que obstaculiza gravemente la circulación.", "fuente": "RGC art. 94.2.g) y 91.2.h)", "img": null}, {"tema": 5, "q": "Un conductor da marcha atrás como maniobra complementaria para estacionar. ¿Qué recorrido máximo puede hacer hacia atrás?", "opts": ["50 metros como máximo, siempre que no invada ningún cruce de vías.", "30 metros como máximo, pudiendo atravesar un cruce si no se acerca ningún vehículo.", "15 metros como máximo, sin invadir un cruce de vías."], "a": 2, "expl": "El recorrido hacia atrás como maniobra complementaria de la parada, el estacionamiento o la incorporación no puede superar los 15 metros ni invadir un cruce de vías.", "fuente": "RGC art. 80.2", "img": null}, {"tema": 5, "q": "Si por necesidades de la circulación un vehículo queda inmovilizado dentro de un túnel, ¿qué deben hacer conductor y pasajeros?", "opts": ["Permanecer dentro con el motor en marcha y las luces de posición apagadas", "No abandonarlo, conectar un momento la señal de emergencia y apagar el motor", "Abandonar el vehículo de inmediato y dejar las puertas abiertas con la llave puesta"], "a": 1, "expl": "Cuando la parada se debe al tráfico, no se debe salir del vehículo: se activa la emergencia un momento, se mantienen las luces de posición y se apaga el motor.", "fuente": "RGC art. 97.3 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "¿Cuál de estos estacionamientos se considera en lugar peligroso o que obstaculiza gravemente la circulación?", "opts": ["El que se hace paralelo al bordillo, dejando libre el paso de otros vehículos", "El que obstaculiza un paso rebajado para personas con discapacidad", "El que se hace junto a la acera, a más de tres metros de la línea continua"], "a": 1, "expl": "El art. 91.2.d) incluye expresamente obstaculizar los pasos rebajados para disminuidos físicos.", "fuente": "RGC art. 91.2.d)", "img": null}, {"tema": 5, "q": "Antes de abrir la puerta de un coche parado junto a la calzada, ¿qué debe hacer el conductor?", "opts": ["Cerciorarse de que no hay peligro, sobre todo para ciclistas", "Encender la luz de emergencia y abrir la puerta con rapidez", "Avisar con un toque de bocina a los usuarios que se aproximen por detrás"], "a": 0, "expl": "Está prohibido abrir o apearse sin cerciorarse de que no hay peligro o entorpecimiento para otros usuarios, especialmente conductores de bicicletas.", "fuente": "RGC art. 114.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "En una autovía con tres carriles por sentido, el tráfico avanza muy despacio o está detenido por una retención. ¿Entre qué carriles debe formarse el carril de emergencia?", "opts": ["En el arcén derecho, que deben ocupar los vehículos del carril situado más a la derecha.", "Entre el carril situado más a la izquierda y el contiguo.", "Entre el carril central y el carril situado más a la derecha de la calzada."], "a": 1, "expl": "Con tres o más carriles por sentido, el espacio libre para vehículos de emergencia se forma entre el carril más a la izquierda y el contiguo; los del carril izquierdo se pegan a la izquierda y los demás a la derecha.", "fuente": "RGC art. 32.1 (redacción RD 518/2026, en vigor 1-10-2026)", "img": null}, {"tema": 5, "q": "Un conductor queda detenido más de dos minutos dentro de un túnel por una retención. ¿Qué debe hacer?", "opts": ["Parar el motor y conservar encendido el alumbrado de posición", "Mantener el motor en marcha y apagar las luces para no gastar batería", "Parar el motor y apagar también el alumbrado de posición"], "a": 0, "expl": "En un túnel o lugar cerrado, si la detención pasa de dos minutos, se interrumpe el motor y se mantiene el alumbrado de posición.", "fuente": "RGC art. 115.2 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Al realizar un desplazamiento lateral que implique cambio de carril, ¿qué debe respetar el conductor?", "opts": ["La prioridad del que circule por el carril que pretende ocupar", "La prioridad del vehículo de mayor tamaño, esté en el carril que esté", "La prioridad del que circule por el carril que abandona"], "a": 0, "expl": "Todo cambio de carril debe respetar la prioridad del vehículo que ya circula por el carril de destino.", "fuente": "RGC art. 74.2 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Una bicicleta está amarrada a una farola y no estorba a nadie. ¿Puede la autoridad retirarla al depósito?", "opts": ["No, salvo que esté abandonada o que, amarrada, estorbe o dañe el mobiliario urbano", "Sí, porque las bicicletas solo pueden dejarse en los aparcamientos habilitados al efecto", "Sí, siempre que lleve más de veinticuatro horas amarrada en el mismo lugar de la vía"], "a": 0, "expl": "Las bicicletas solo pueden retirarse si están abandonadas o si, estando amarradas, dificultan la circulación de vehículos o personas o dañan el mobiliario urbano.", "fuente": "Ley de Tráfico RDL 6/2015, art. 7.c", "img": null}, {"tema": 5, "q": "Un conductor va a parar a su derecha en una vía. Además de avisar de la inmovilización, ¿qué indicador debe usar?", "opts": ["El indicador de dirección izquierdo, para avisar a los que vienen de frente", "El indicador de dirección derecho, si el vehículo lo tiene", "Ninguno, pues la parada no implica un desplazamiento lateral"], "a": 1, "expl": "Si la inmovilización es para parar o estacionar, debe usarse además el indicador de dirección del lado hacia el que se efectúa.", "fuente": "RGC art. 109.2.c (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Por motivos de emergencia, un vehículo queda inmovilizado en un túnel con refugios y salidas. ¿Qué hacen el conductor y los ocupantes?", "opts": ["Abandonan el vehículo y se dirigen rápidamente al refugio o salida más próximos", "Salen del vehículo y caminan por la calzada hacia el extremo más cercano del túnel", "Permanecen dentro del vehículo hasta que llegue algún servicio de emergencia con ayuda"], "a": 0, "expl": "En una inmovilización por emergencia, todos los ocupantes abandonan el vehículo y se dirigen al refugio o salida más próximos, sin transitar por la calzada si hay zonas excluidas a la circulación.", "fuente": "RGC art. 97.3 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Al girar a la izquierda en una intersección sin acondicionamiento ni señalización especial, ¿cómo se deja el centro de la intersección?", "opts": ["A la izquierda del vehículo", "A la derecha del vehículo", "A uno u otro lado, según la densidad del tráfico"], "a": 0, "expl": "Si el giro es a la izquierda, se deja a la izquierda el centro de la intersección, salvo que esté acondicionada o señalizada para dejarlo a la derecha.", "fuente": "RGC art. 75.1.c (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "En una calzada de un solo sentido, sin señalización que disponga otra cosa, ¿dónde se coloca quien va a girar a la izquierda?", "opts": ["En el centro de la calzada, para poder girar en cualquier dirección", "Lo más cerca posible del borde derecho de la calzada", "Lo más cerca posible del borde izquierdo de la calzada"], "a": 2, "expl": "En vía de sentido único, el giro a la izquierda se prepara ciñéndose todo lo posible al borde izquierdo.", "fuente": "RGC art. 75.1.b (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un camión de más de 3.500 kg de masa máxima autorizada se estaciona en un lugar de pendiente acusada. ¿Qué debe hacer, además de las medidas generales?", "opts": ["Usar como calzos piedras u otros objetos que encuentre a mano junto a la calzada.", "Dejarlo calzado con calzos específicos o apoyando una rueda directriz en el bordillo.", "Basta con accionar el freno de estacionamiento, porque el calzado es voluntario en estos casos."], "a": 1, "expl": "En pendiente sensible los vehículos de más de 3.500 kg, autobuses y conjuntos deben calzarse con calzos (no piedras u otros elementos) o apoyando una rueda directriz en el bordillo, y retirar los calzos al reanudar la marcha.", "fuente": "RGC art. 92.3.d", "img": null}, {"tema": 5, "q": "Un conductor de turismo o ciclomotor va a dejar su puesto. ¿Qué debe hacer, además de accionar el freno de estacionamiento?", "opts": ["Parar el motor y desconectar el sistema de arranque, adoptando precauciones si se aleja", "Dejar la llave puesta si se queda a la vista del vehículo y sin pasajeros", "Dejar el motor al ralentí con las luces de emergencia si se ausenta menos de cinco minutos"], "a": 0, "expl": "Quien deja su puesto debe parar el motor, desconectar el sistema de arranque y, si se aleja, impedir el uso no autorizado; y dejar accionado el freno de estacionamiento.", "fuente": "RGC art. 92.3.a (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Un vehículo debe inmovilizarse en una autovía. ¿Cómo señaliza su presencia, si dispone de ello?", "opts": ["Con el indicador de dirección izquierdo", "Con las luces de largo alcance fijas", "Con la luz de emergencia"], "a": 2, "expl": "Al inmovilizarse en autopista o autovía debe señalizarse la presencia con la luz de emergencia, si se dispone de ella, y, en su caso, con las luces de posición.", "fuente": "RGC art. 109.2.c (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un conductor sin luces indicadoras va a girar a la izquierda y usa el brazo izquierdo. ¿Cómo lo coloca?", "opts": ["Moviéndolo de arriba abajo con movimientos cortos y rápidos", "Doblado hacia arriba, con la palma de la mano extendida", "Horizontal, con la palma de la mano extendida hacia abajo"], "a": 2, "expl": "Horizontal con palma hacia abajo indica desplazamiento hacia el lado del brazo; doblado hacia arriba indica el lado contrario; el movimiento de arriba abajo avisa de frenada o inmovilización.", "fuente": "RGC art. 109.2.a (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Para recuperar un vehículo retirado de la vía y llevado al depósito, ¿qué ocurre con los gastos de la retirada?", "opts": ["Los asume siempre la Administración, aunque el vehículo estuviese mal estacionado", "Se abonan antes de la devolución, sin perjuicio del derecho de recurso", "Se abonan después de recuperarlo, en el plazo que fije la autoridad de tráfico"], "a": 1, "expl": "Salvo sustracción justificada, los gastos de la retirada deben abonarse como requisito previo a la devolución del vehículo, sin perjuicio del recurso.", "fuente": "Ley de Tráfico RDL 6/2015, art. 105.2", "img": null}, {"tema": 5, "q": "Una ordenanza regula una zona de estacionamiento con limitación horaria. ¿Qué medida correctora puede prever para quien no dispone de título que autorice estacionar?", "opts": ["Retirada o inmovilización hasta identificar al conductor", "La retirada del permiso de conducir hasta que se abone la tarifa debida", "La confiscación del vehículo durante un periodo mínimo de tres meses completos"], "a": 0, "expl": "El régimen municipal puede incluir retirada o inmovilización del vehículo sin título en zonas limitadas en tiempo hasta que se logre la identificación del conductor.", "fuente": "Ley de Tráfico RDL 6/2015, art. 39.4", "img": null}, {"tema": 5, "q": "Un agente comprueba que un turismo circula sin seguro obligatorio. ¿Puede inmovilizarlo?", "opts": ["Sí, pero solo si además el vehículo no ha pasado la ITV vigente en ese momento", "No, la falta de seguro solo permite denunciar al conductor y no inmovilizar", "Sí, la falta de seguro obligatorio permite inmovilizar el vehículo"], "a": 2, "expl": "Los agentes pueden inmovilizar el vehículo que carezca de seguro obligatorio.", "fuente": "Ley de Tráfico RDL 6/2015, art. 104.1.e", "img": null}, {"tema": 5, "q": "Un vehículo ha sido inmovilizado por un agente. ¿Cuándo se levanta, con carácter general, la inmovilización?", "opts": ["Cuando el conductor abone la sanción correspondiente a la infracción", "En el momento en que cese la causa que la motivó", "Cuando hayan transcurrido veinticuatro horas desde la inmovilización"], "a": 1, "expl": "La inmovilización se levanta en el momento en que cesa la causa que la motivó (con reglas propias en algunos supuestos, como gases, manipulación o elusión de control).", "fuente": "Ley de Tráfico RDL 6/2015, art. 104.2", "img": null}, {"tema": 5, "q": "¿Puede estacionarse un turismo delante de un vado correctamente señalizado si en ese momento nadie entra ni sale por él?", "opts": ["No, está prohibido estacionar delante de un vado correctamente señalizado.", "Sí, si deja visible un teléfono de contacto para poder mover el vehículo.", "Sí, mientras no haya ningún vehículo entrando o saliendo del vado en ese instante."], "a": 0, "expl": "Está prohibido estacionar delante de un vado señalizado correctamente, aunque en ese momento nadie lo esté usando.", "fuente": "RGC art. 94.2.f", "img": null}, {"tema": 5, "q": "Un conductor deja su coche en una zona de estacionamiento con limitación horaria, con el distintivo colocado, pero rebasa el tiempo máximo. ¿Qué ocurre?", "opts": ["Se admite si no hay otro vehículo esperando para ocupar el sitio", "Queda prohibido estacionar en exceso sobre el tiempo máximo", "Se admite hasta media hora más sin necesidad de renovar el distintivo"], "a": 1, "expl": "Estacionar en zona con limitación horaria sin distintivo, o excediendo el tiempo máximo con él colocado, está prohibido.", "fuente": "RGC art. 94.2.b)", "img": null}, {"tema": 5, "q": "¿Puede un turismo que arrastra un remolque circular por un carril habilitado en sentido contrario al habitual?", "opts": ["No, ese carril queda limitado a motocicletas y turismos, sin remolque", "Sí, siempre que lleve encendida la luz de corto alcance", "Sí, si el remolque es ligero y se respeta la velocidad mínima de 60 km/h"], "a": 0, "expl": "En los carriles reversibles solo pueden circular motocicletas y turismos; está prohibido a los turismos con remolque.", "fuente": "RGC art. 41.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un autobús de viajeros ha puesto el intermitente para reanudar la marcha desde una parada señalizada en poblado. ¿Qué sigue obligado a hacer su conductor?", "opts": ["Adoptar las precauciones necesarias para evitar todo riesgo de accidente", "Nada más, porque los demás conductores deben cederle el paso en todo caso", "Esperar a que el resto de vehículos se detenga por completo antes de salir"], "a": 0, "expl": "La obligación de los demás de facilitar la salida no exime al conductor del autobús de extremar las precauciones tras anunciar su intención.", "fuente": "RGC art. 73.3 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "En una vía urbana de un solo sentido de circulación, sin ordenanza municipal que disponga otra cosa, ¿en qué lado de la calzada puede estacionarse?", "opts": ["Solo en el borde izquierdo, para dejar libre el derecho al transporte público.", "Solo en el borde derecho, igual que en las vías de doble sentido.", "En el borde derecho y también en el izquierdo."], "a": 2, "expl": "En vías urbanas se estaciona lo más cerca posible del borde derecho, pero en las de único sentido se puede hacer también en el lado izquierdo.", "fuente": "RGC art. 90.2", "img": null}, {"tema": 5, "q": "En una calzada de doble sentido, con un carril por sentido, ¿cómo se prepara el conductor que va a girar a la izquierda?", "opts": ["Invade ligeramente el sentido contrario para facilitar el giro", "Se ciñe al borde derecho de la calzada para no estorbar a los que vienen detrás", "Se ciñe a la marca de separación o al eje, sin invadir el sentido contrario"], "a": 2, "expl": "En calzada de doble sentido se ciñe a la marca de separación o al eje, sin invadir la zona del sentido contrario.", "fuente": "RGC art. 75.1.b)", "img": null}, {"tema": 5, "q": "Un conductor sin luces indicadoras va a girar a la derecha y avisa con el brazo izquierdo. ¿Cómo lo coloca?", "opts": ["Extendido en horizontal, con la palma de la mano hacia atrás", "Doblado hacia arriba, con la palma de la mano extendida", "En posición horizontal, con la palma de la mano hacia abajo"], "a": 1, "expl": "Si el desplazamiento es hacia el lado contrario al del brazo, este se dobla hacia arriba con la palma extendida.", "fuente": "RGC art. 109.2.a (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un conductor quiere parar medio minuto en una curva de visibilidad reducida para dejar a un pasajero. ¿Puede hacerlo?", "opts": ["Sí, siempre que conecte la luz de emergencia mientras dure la parada", "No, porque está prohibido parar en las curvas de visibilidad reducida", "Sí, porque una parada de menos de dos minutos no está prohibida en ningún lugar"], "a": 1, "expl": "Queda prohibido parar en las curvas y cambios de rasante de visibilidad reducida y en sus proximidades; la brevedad de la parada no cambia la prohibición.", "fuente": "RGC art. 94.1.a (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Un agente detecta a un ciclista sin casco en un caso en que este es obligatorio. ¿Puede inmovilizar la bicicleta por ese motivo?", "opts": ["Sí, pero solo si el ciclista es menor de dieciséis años de edad", "Sí, igual que a un motorista que circule sin el casco que sea obligatorio", "No, esa medida no se aplica a los ciclistas"], "a": 2, "expl": "La inmovilización por no usar casco de protección se prevé para conductores y pasajeros, pero no se aplica a los ciclistas.", "fuente": "Ley de Tráfico RDL 6/2015, art. 104.1.c", "img": null}, {"tema": 5, "q": "Un conductor sin tarjeta de movilidad reducida para medio minuto en una zona señalizada de uso exclusivo para personas con discapacidad. ¿Es correcto?", "opts": ["No, en esas zonas está prohibido parar y también estacionar", "Sí, siempre que permanezca en el vehículo con el motor en marcha", "Sí, porque solo está prohibido estacionar en ellas, no parar"], "a": 0, "expl": "Queda prohibido parar en las zonas señalizadas para uso exclusivo de personas con discapacidad, por lo que también está prohibido estacionar.", "fuente": "Ley de Tráfico RDL 6/2015, art. 40.1.j", "img": null}, {"tema": 5, "q": "¿En cuál de estos lugares queda prohibido parar?", "opts": ["En una zona de estacionamiento regulado con limitación horaria", "En una calle urbana de doble sentido, junto al bordillo derecho", "En túneles, pasos inferiores y tramos con la señal «Túnel»"], "a": 2, "expl": "Parar está prohibido en túneles, pasos inferiores y tramos con la señal «Túnel»; también en pasos a nivel, de ciclistas y de peatones.", "fuente": "RGC art. 94.1.a)", "img": null}, {"tema": 5, "q": "En una calzada de doble sentido hay una isleta que separa ambos sentidos. ¿Por qué parte debe circularse?", "opts": ["Por cualquiera de los dos lados, según la densidad de tráfico", "Por la parte que quede a la izquierda de la isleta, en el sentido de la marcha", "Por la parte que quede a la derecha de la isleta, en el sentido de la marcha"], "a": 2, "expl": "Con refugios, isletas o dispositivos de guía se circula por la parte que queda a su derecha; solo en vías de sentido único o dentro de un sentido puede hacerse por cualquier lado.", "fuente": "RGC art. 43.1", "img": null}, {"tema": 5, "q": "Una línea amarilla continua pintada junto al bordillo, con una señal vertical que no indica horario, ¿qué prohíbe en ese lado de la calzada?", "opts": ["Solo la parada, pudiendo estacionarse si el conductor no se aleja", "La parada y el estacionamiento a lo largo de toda su longitud", "Solo el estacionamiento, pudiendo pararse el tiempo necesario"], "a": 1, "expl": "La marca longitudinal continua amarilla (M-7.8) indica la prohibición de la parada y del estacionamiento en toda su longitud, en el lado de la calzada donde esté situada.", "fuente": "RGC art. Anexo I, 4.7 (M-7.8) (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "¿Puede un ayuntamiento regular mediante ordenanza el estacionamiento de motocicletas sobre las aceras?", "opts": ["Sí, siempre que no se perjudique ni se entorpezca el tránsito de los peatones", "Sí, sin más condición, porque los ayuntamientos regulan libremente el estacionamiento urbano", "No, el estacionamiento sobre las aceras está prohibido en todos los casos sin excepción"], "a": 0, "expl": "Como regla general no se puede estacionar sobre aceras, pero las ordenanzas pueden regular el estacionamiento de vehículos de dos ruedas en ellas sin perjudicar ni entorpecer el tránsito de los peatones.", "fuente": "RGC art. 156.2 (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Un conductor para su furgoneta justo delante de una señal vertical, de modo que los que se aproximan no pueden verla. ¿Qué dice el Reglamento?", "opts": ["Que está permitido si la parada dura menos de dos minutos", "Que está prohibido parar donde se impida la visibilidad de la señalización", "Que solo está prohibido si la señal oculta es de «Stop» o de «Ceda el paso»"], "a": 1, "expl": "Queda prohibido parar en los lugares donde se impida la visibilidad de la señalización a los usuarios a quienes les afecte u obligue a hacer maniobras.", "fuente": "RGC art. 94.1.f (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Un conductor espera en la calzada para cambiar de sentido y su permanencia impide avanzar a los vehículos de detrás. ¿Qué debe hacer, si es posible?", "opts": ["Hacer sonar el claxon para que los de atrás esperen", "Mantenerse en su sitio con las luces de emergencia encendidas hasta poder girar", "Salir de la calzada por su lado derecho hasta poder hacer la maniobra"], "a": 2, "expl": "Si su espera impide continuar a los de atrás, debe salir por su lado derecho hasta que las condiciones permitan el cambio de sentido.", "fuente": "RGC art. 78.1", "img": null}, {"tema": 5, "q": "Un conductor sale de una zona de servicio a la vía por la que circulan otros vehículos. ¿Qué debe hacer?", "opts": ["Incorporarse con preferencia si ya ha puesto el intermitente con antelación", "Ceder el paso, cerciorarse de que no hay peligro y advertir la maniobra", "Ceder el paso solo a los vehículos que lleguen por su derecha, sin señalizar nada"], "a": 1, "expl": "Quien se incorpora desde una zona de servicio o propiedad colindante debe cerciorarse, ceder el paso y advertir la maniobra con las señales obligatorias.", "fuente": "RGC art. 72.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Fuera de poblado, sin que exista ninguna emergencia, ¿dónde debe parar o estacionar un vehículo?", "opts": ["En el arcén derecho, ocupando la parte transitable del mismo para no estorbar a la calzada.", "Sobre la calzada, en el lado derecho, siempre que se enciendan las luces de posición.", "Fuera de la calzada, en el lado derecho, dejando libre la parte transitable del arcén."], "a": 2, "expl": "En vías interurbanas la parada y el estacionamiento se hacen fuera de la calzada, a la derecha y sin ocupar la parte transitable del arcén.", "fuente": "RGC art. 90.1", "img": null}, {"tema": 5, "q": "Un vehículo ha sido inmovilizado por una infracción del conductor. Salvo sustracción justificada, ¿quién asume los gastos de la inmovilización?", "opts": ["El titular del vehículo, en todo caso", "El conductor que cometió la infracción", "La Administración que ordenó la medida, siempre"], "a": 1, "expl": "Los gastos corren por cuenta del conductor que cometió la infracción y, en su defecto, del conductor habitual o arrendatario y, a falta de estos, del titular.", "fuente": "Ley de Tráfico RDL 6/2015, art. 104.6", "img": null}, {"tema": 5, "q": "¿Pueden los ayuntamientos establecer tarifas de estacionamiento según las características del vehículo?", "opts": ["Sí, pero solo en función del número de ocupantes habituales del vehículo", "No, la tarifa debe ser igual para todos los vehículos de la zona regulada", "Sí, según sus dimensiones y su clasificación ambiental"], "a": 2, "expl": "El estacionamiento puede ser objeto de tarificación por los Ayuntamientos en función de las dimensiones y la clasificación ambiental de los vehículos.", "fuente": "RGC art. 156.1.e (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "¿Puede un conductor dar marcha atrás en una autovía para tomar una salida que ha rebasado?", "opts": ["Sí, si lo hace lentamente y con las luces de emergencia", "No, está prohibido en autovías y autopistas", "Sí, siempre que circule por el carril de la derecha"], "a": 1, "expl": "Se prohíbe la maniobra de marcha atrás en autovías y autopistas, sin excepciones.", "fuente": "RGC art. 80.3", "img": null}, {"tema": 5, "q": "Un coche queda estacionado de forma que impide a otros vehículos girar a la derecha en un cruce donde esa maniobra está permitida por señal. ¿Qué es?", "opts": ["Estacionamiento sin consecuencias, mientras no haya vehículos esperando para girar", "Estacionamiento permitido, pues el giro a la derecha admite siempre una alternativa", "Estacionamiento en lugar peligroso o que obstaculiza gravemente la circulación"], "a": 2, "expl": "Impedir el giro autorizado por la señal correspondiente es un supuesto de estacionamiento en lugar peligroso o que obstaculiza gravemente la circulación.", "fuente": "RGC art. 91.2.f (texto consolidado con RD 518/2026)", "img": null}, {"tema": 5, "q": "Como regla general, ¿cómo debe colocarse un vehículo al parar o estacionar?", "opts": ["En batería, para aprovechar mejor el espacio, salvo que esté prohibido", "Paralelamente al borde de la calzada, salvo excepciones justificadas", "En espiga cuando haya espacio libre, aunque la vía admita la colocación en línea"], "a": 1, "expl": "La regla es la colocación paralela al borde de la calzada, con excepciones justificadas por la vía o las circunstancias.", "fuente": "RGC art. 92.1", "img": null}, {"tema": 5, "q": "¿En cuál de estos lugares se prohíbe cambiar de sentido?", "opts": ["En una calle ancha de un poblado, sin tráfico próximo y sin señal que lo prohíba", "En un tramo de carretera convencional con buena visibilidad donde no está prohibido adelantar", "En un túnel"], "a": 2, "expl": "Se prohíbe el cambio de sentido en túneles, pasos a nivel, pasos inferiores y, salvo lugares habilitados, en autopistas y autovías.", "fuente": "RGC art. 79.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Un vehículo sufre una avería en un túnel, pero todavía puede avanzar. ¿Qué debe hacer su conductor?", "opts": ["Parar junto al borde izquierdo de la calzada y bajar del vehículo con rapidez", "Continuar hasta la salida del túnel o, si no puede, hasta una zona de emergencia", "Detenerse de inmediato en el carril en que circula y esperar a que llegue la ayuda"], "a": 1, "expl": "Si la avería permite la marcha, debe continuar hasta la salida del túnel y, si no puede, hasta una zona reservada para emergencia.", "fuente": "RGC art. 97.3 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "Como norma general, ¿por qué lado se entra y se sale de un vehículo?", "opts": ["Por el más próximo al centro de la calzada, estando parado", "Por el que resulte más cómodo, incluso con el vehículo en marcha lenta", "Por el más próximo al borde de la vía y solo estando parado"], "a": 2, "expl": "Se entra y sale por el lado más cercano al borde de la vía y únicamente con el vehículo parado.", "fuente": "RGC art. 114.2 (texto consolidado 26/06/2026)", "img": null}, {"tema": 5, "q": "¿Puede hacerse un cambio de sentido en un tramo donde esté prohibido adelantar?", "opts": ["Sí, si se hace con las luces intermitentes encendidas", "Sí, siempre que no se vea ningún vehículo en ese momento", "No, salvo autorización expresa del cambio de sentido"], "a": 2, "expl": "El cambio de sentido se prohíbe en todos los tramos donde esté prohibido adelantar, salvo autorización expresa.", "fuente": "RGC art. 79.1", "img": null}, {"tema": 5, "q": "¿En qué caso de ocupación excesiva pueden los agentes inmovilizar un vehículo?", "opts": ["Al llevar una sola persona más de las plazas autorizadas, sea cual sea el vehículo", "Al aumentar en un 20 por ciento las plazas autorizadas, incluida la del conductor", "Al aumentar en un 50 por ciento las plazas autorizadas, excluida la del conductor"], "a": 2, "expl": "La inmovilización procede si la ocupación supone aumentar en un 50 por ciento el número de plazas autorizadas, excluida la del conductor.", "fuente": "Ley de Tráfico RDL 6/2015, art. 104.1.g", "img": null}, {"tema": 5, "q": "Si al dar marcha atrás no puede comprobar bien el espacio libre, ¿qué prevé el Reglamento?", "opts": ["Avisar con el claxon y retroceder con la mayor rapidez posible", "Cerciorarse, incluso apeándose o con indicaciones de otra persona", "Confiar en los retrovisores y retroceder con las luces de emergencia"], "a": 1, "expl": "La maniobra se hace lentamente y tras cerciorarse de que no hay peligro, incluso bajando del vehículo o con ayuda de otra persona.", "fuente": "RGC art. 81.1", "img": null}, {"tema": 5, "q": "Para abandonar una autovía por una salida con carril de deceleración, ¿cómo debe actuar el conductor?", "opts": ["Frenar en el carril por el que circula y entrar en el carril de deceleración solo cuando llegue al final de este.", "Circular con antelación por el carril más próximo a la salida y entrar cuanto antes en el carril de deceleración.", "Mantenerse en el carril central a la velocidad de la vía y entrar en el carril de deceleración lo más tarde posible."], "a": 1, "expl": "Hay que situarse con antelación en el carril más próximo a la salida y penetrar lo antes posible en el carril de deceleración.", "fuente": "RGC art. 77", "img": null}, {"tema": 5, "q": "Tras un accidente, un turismo no puede continuar su marcha y su conductor no lo retira de la vía. ¿Puede hacerlo la autoridad?", "opts": ["No, solo puede retirarlo si el conductor lo autoriza expresamente", "Sí, puede retirarlo de la vía y llevarlo al lugar designado", "No, solo puede retirarlo si el vehículo está causando un incendio"], "a": 1, "expl": "La autoridad encargada de la gestión del tráfico puede retirar el vehículo, si el obligado no lo hace, en caso de accidente que impida continuar su marcha.", "fuente": "Ley de Tráfico RDL 6/2015, art. 105.1.b", "img": null}, {"tema": 6, "q": "¿Qué indica la señal V-4 colocada en la parte posterior de un vehículo?", "opts": ["Que el vehículo circula a la velocidad que figura en la señal siempre", "Que la cifra de la señal es la velocidad mínima a la que debe circular", "Que no debe circular a velocidad superior a la cifra de la señal"], "a": 2, "expl": "La V-4 indica que el vehículo no debe circular a una velocidad superior, en km/h, a la cifra que figura en la señal.", "fuente": "RGV (RD 2822/1998), Anexo XI, V-4, apartado 1", "img": null}, {"tema": 6, "q": "Un conductor circula de noche con la luz de largo alcance y se cruza con otro vehículo que viene en sentido contrario. ¿Cuándo puede volver a usar el largo alcance?", "opts": ["En cuanto el otro conductor apague su luz de largo alcance", "Al rebasar, en el cruce, la posición del vehículo cruzado", "Cuando el vehículo cruzado se haya alejado unos cien metros"], "a": 1, "expl": "El largo alcance no se restablece hasta rebasar, en el cruce, la posición del vehículo cruzado.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 102.1", "img": null}, {"tema": 6, "q": "De noche, un turismo está estacionado en una vía urbana (no travesía) cuya iluminación permite distinguirlo a suficiente distancia. ¿Qué ocurre con las luces de posición?", "opts": ["Debe llevar siempre encendidas las dos de posición traseras", "Debe llevar encendida la luz de cruce", "No es obligatorio que las tenga encendidas"], "a": 2, "expl": "En vías urbanas que no sean travesías no es obligatorio si la iluminación permite distinguir los vehículos estacionados.", "fuente": "RGC art. 105.3", "img": null}, {"tema": 6, "q": "Un tractor agrícola circula de día por una carretera a 25 km/h. ¿Qué señal luminosa debe utilizar?", "opts": ["La V-1, por ser un vehículo lento", "Ninguna, pues de día basta la luz de cruce", "La V-2, tanto de día como de noche"], "a": 2, "expl": "Los vehículos especiales deben usar la V-2 de día y de noche siempre que circulen a una velocidad que no supere los 40 km/h.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 71.3", "img": null}, {"tema": 6, "q": "¿Con qué otras luces puede utilizarse simultáneamente la luz antiniebla delantera?", "opts": ["Solo con la de corto alcance; con la de largo alcance no", "Con ninguna, pues debe utilizarse siempre de forma aislada", "Con la de corto alcance e incluso con la de largo alcance"], "a": 2, "expl": "La antiniebla delantera puede usarse aislada, junto con el cruce o incluso con el largo alcance.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 106.2", "img": null}, {"tema": 6, "q": "¿Cuándo puede encenderse la luz antiniebla trasera de un vehículo?", "opts": ["Cuando estén encendidas las luces de posición, aunque no haya ninguna otra luz", "Solo si lo están también las de carretera, las de cruce o las antiniebla delanteras", "Siempre que haya niebla, aunque no lleve ninguna otra luz de las anteriores encendida"], "a": 1, "expl": "La antiniebla trasera exige que estén encendidas la de carretera, la de cruce o la antiniebla delantera.", "fuente": "RGV art. 15.3 (RD 2822/1998, texto consolidado)", "img": null}, {"tema": 6, "q": "Un conductor va a detener su vehículo para estacionar a su derecha. ¿Qué indicador luminoso debe usar, además de advertir que frena?", "opts": ["Las dos luces de emergencia, sea cual sea el lado en el que vaya a estacionar.", "El indicador de dirección del lado en el que se vaya a inmovilizar.", "Ninguno, porque bastan las luces de freno para advertir a los demás usuarios."], "a": 1, "expl": "Si la inmovilización es para parar o estacionar debe emplearse, además de las luces de freno, el indicador luminoso de dirección correspondiente al lado hacia el que se vaya a efectuar.", "fuente": "RGC art. 109.2", "img": null}, {"tema": 6, "q": "Según el anexo XII del Reglamento General de Vehículos, ¿qué dispositivo de preseñalización de peligro forma parte de la dotación obligatoria de un turismo?", "opts": ["Dos triángulos de preseñalización de peligro", "La señal V-16, con geolocalización", "Un chaleco reflectante colocado sobre el techo"], "a": 1, "expl": "El anexo XII incluye como dotación el dispositivo luminoso de preseñalización V-16, que comunica su activación y posición a la DGT; los triángulos ya no figuran en la dotación.", "fuente": "RGV anexo XII, ap. 1.a) y anexo XI (V-16)", "img": null}, {"tema": 6, "q": "Un vehículo de conservación de carreteras trabaja parado en el arcén de una vía. ¿Qué señal luminosa debe utilizar para indicar su situación?", "opts": ["La V-2, luz amarilla auto", "La V-16, luz de preseñalización de peligro", "La V-1, luz azul de vehículo prioritario"], "a": 0, "expl": "La V-2 indica la posición de un vehículo que desempeña un servicio o trabajo en situación de parada o a no más de 40 km/h; es de color amarillo auto.", "fuente": "RGV (RD 2822/1998), Anexo XI, V-2, apartados 1 y 3", "img": null}, {"tema": 6, "q": "Un conductor va a dar marcha atrás con un vehículo que no dispone de luz de marcha atrás. ¿Cómo debe advertirlo?", "opts": ["Moviendo el brazo de arriba abajo con movimientos cortos, rápidos y reiterados", "Doblando el brazo hacia arriba y manteniendo la palma de la mano extendida", "Extendiendo el brazo horizontalmente con la palma de la mano hacia atrás"], "a": 2, "expl": "La marcha atrás se advierte con la luz de marcha atrás o, si no la hay, con el brazo extendido horizontalmente y la palma hacia atrás.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 109.2.b)", "img": null}, {"tema": 6, "q": "De noche, un turismo circula dentro de una población por una calle insuficientemente iluminada. ¿Qué alumbrado debe llevar, además del de posición?", "opts": ["Ninguno más, porque en poblado basta la posición", "El de corto alcance o de cruce", "El de largo alcance, para ver mejor la calzada"], "a": 1, "expl": "En poblado, cuando la vía está insuficientemente iluminada, debe llevarse encendida la luz de cruce además de la de posición. El largo alcance es para vías interurbanas insuficientemente iluminadas.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 101.1", "img": null}, {"tema": 6, "q": "Además de en condiciones que disminuyen la visibilidad, ¿en qué otro caso puede usarse la luz antiniebla delantera?", "opts": ["En cualquier carretera de montaña, de noche, aunque la visibilidad sea buena y haya curvas", "En vías con muchas curvas, sea cual sea la anchura de la calzada", "En tramos estrechos con muchas curvas, de calzada de 6,50 m o menos, señalizados"], "a": 2, "expl": "También puede usarse en tramos estrechos (calzada de 6,50 m o menos) con señales de sucesión de curvas próximas.", "fuente": "RGC art. 106.2", "img": null}, {"tema": 6, "q": "De día, un turismo entra en un túnel suficientemente iluminado señalizado con la S-5. ¿Qué alumbrado debe llevar?", "opts": ["Solo las luces de posición, al ser un túnel iluminado", "Las luces de posición y la de cruce", "La luz de largo alcance, por ser un túnel iluminado"], "a": 1, "expl": "En túneles suficientemente iluminados se lleva, a cualquier hora, el alumbrado de posición y el de cruce.", "fuente": "RGC art. 101.1", "img": null}, {"tema": 6, "q": "¿Cuándo deben llevar encendido el alumbrado que corresponda los vehículos que circulan por una vía?", "opts": ["Solo desde una hora después del ocaso hasta una hora antes de la salida del sol, en cualquier vía.", "Entre el ocaso y la salida del sol, y siempre en túneles y tramos con señal «Túnel».", "Entre el ocaso y la salida del sol, pero no en túneles cuando tengan iluminación propia suficiente."], "a": 1, "expl": "El alumbrado es obligatorio entre el ocaso y la salida del sol y, a cualquier hora del día, en túneles, pasos inferiores y tramos afectados por la señal «Túnel» (S-5).", "fuente": "RGC art. 98.1", "img": null}, {"tema": 6, "q": "¿Qué requisito deben cumplir los conductores de vehículos prioritarios para tener tal carácter cuando circulan en servicio urgente?", "opts": ["Circular siempre con el largo alcance encendido y a gran velocidad", "Anunciarse con la señal luminosa y la acústica especial a la vez", "Usar solo la señal acústica especial, porque se oye desde lejos"], "a": 1, "expl": "Son prioritarios los vehículos de los servicios citados en servicio urgente cuyos conductores advierten con la señal luminosa y el aparato emisor de señales acústicas especiales, usados simultáneamente (la luz sola cuando omitir la acústica no entrañe peligro).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 68.2", "img": null}, {"tema": 6, "q": "Un conductor de patinete eléctrico (vehículo de movilidad personal) va a girar. ¿Cómo debe advertir la maniobra al resto de usuarios?", "opts": ["Siempre con el brazo, según el artículo 109", "Con un timbre o aviso acústico antes de girar", "Con el intermitente, y con el brazo solo si falla"], "a": 0, "expl": "Los conductores de VMP deben utilizar siempre el brazo para advertir las maniobras.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 155.4", "img": null}, {"tema": 6, "q": "Un remolque (no agrícola) de 1,80 metros de anchura, ¿debe llevar luces de posición delanteras?", "opts": ["No, solo las llevan los de más de 2,10 metros de anchura", "No, los remolques solo llevan luces de posición traseras", "Sí, los remolques de más de 1,60 metros de anchura"], "a": 2, "expl": "Los remolques de más de 1,60 m de anchura deben llevar luz de posición delantera; la de gálibo se exige a partir de 2,10 m.", "fuente": "RGV (RD 2822/1998), art. 16.5", "img": null}, {"tema": 6, "q": "Circulas de noche con la luz de largo alcance y se aproxima un vehículo en sentido contrario que también lleva el largo alcance. ¿Debes pasar tú a cruce?", "opts": ["No, hasta que el otro conductor cambie a cruce primero", "Sí, aunque el otro conductor no cumpla esa obligación", "Solo si el otro conductor te hace destellos con sus faros"], "a": 1, "expl": "El cambio a cruce es obligatorio ante vehículos en sentido contrario aunque estos no cumplan la prescripción.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 102.1", "img": null}, {"tema": 6, "q": "¿Qué se entiende por vía insuficientemente iluminada?", "opts": ["Aquella en la que no se lee la matrícula a 50 m o no se ve un vehículo oscuro a 10 m", "Aquella en la que no se lee la matrícula a 10 m o no se ve un vehículo oscuro a 50 m", "Aquella en la que ningún vehículo se distingue a más de 100 metros con vista normal"], "a": 1, "expl": "El Reglamento fija dos criterios con vista normal: matrícula a 10 metros y vehículo pintado de oscuro a 50 metros.", "fuente": "RGC art. 100.3", "img": null}, {"tema": 6, "q": "¿Cuándo debe llevarse encendida la luz antiniebla trasera?", "opts": ["Siempre que llueva, con independencia de la intensidad de la lluvia y de la visibilidad que haya.", "Solo con condiciones especialmente desfavorables, como niebla espesa o nevada fuerte.", "Siempre que se circule de noche por vías interurbanas, para ser más visible desde atrás."], "a": 1, "expl": "La antiniebla trasera solo debe encenderse con condiciones meteorológicas o ambientales especialmente desfavorables (niebla espesa, lluvia muy intensa, fuerte nevada, nubes densas de polvo o humo).", "fuente": "RGC art. 106.2", "img": null}, {"tema": 6, "q": "Un vehículo queda inmovilizado por una emergencia dentro de un túnel. ¿Cómo debe solicitar auxilio su conductor?", "opts": ["Sin demora, desde el poste de socorro (SOS) más próximo, si existe.", "Esperando dentro del vehículo a que algún conductor que pase avise a los servicios de emergencia.", "Saliendo a la calzada para parar a otros vehículos y pedirles que avisen a los servicios de auxilio."], "a": 0, "expl": "El conductor debe solicitar auxilio sin demora desde el poste SOS más próximo, si existe, y seguir las instrucciones que se le den.", "fuente": "RGC art. 97.3", "img": null}, {"tema": 6, "q": "¿En cuál de estos casos puede un conductor de un vehículo no prioritario hacer uso de la bocina?", "opts": ["Fuera de poblado, para avisar a otro conductor de un adelantamiento", "Para indicar a quien va delante que debe acelerar su marcha en la vía", "Para saludar a otro conductor al cruzarse con él en la carretera"], "a": 0, "expl": "Las advertencias acústicas solo se permiten para evitar un accidente, para avisar de un adelantamiento fuera de poblado o para advertir la presencia del propio vehículo en los casos previstos.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 110.2.b)", "img": null}, {"tema": 6, "q": "Al activar la señal V-16 tras una avería, ¿dónde debe colocarse?", "opts": ["En el suelo, sobre la calzada, unos 50 metros detrás del vehículo.", "En el interior del vehículo, apoyada en la luneta trasera.", "En la parte más alta posible del vehículo, normalmente el techo."], "a": 2, "expl": "La V-16 se coloca en la parte más alta posible del vehículo inmovilizado, para garantizar su máxima visibilidad.", "fuente": "RGV anexo XI, V-16 ap. 2", "img": null}, {"tema": 6, "q": "De noche y con la luz de largo alcance encendida, se acerca un vehículo en sentido contrario. ¿Cuándo debe cambiarse a la luz de cruce?", "opts": ["Solo cuando el otro conductor haga ráfagas o cambie él primero a la de cruce.", "Tan pronto como se aprecie la posibilidad de deslumbrar al otro conductor.", "Cuando los dos vehículos estén a punto de cruzarse, nunca antes."], "a": 1, "expl": "La luz de largo alcance debe sustituirse por la de cruce en cuanto se aprecie la posibilidad de deslumbrar, muy especialmente a conductores que circulan en sentido contrario.", "fuente": "RGC art. 102.1", "img": null}, {"tema": 6, "q": "¿Qué catadióptricos traseros debe llevar un remolque (no agrícola)?", "opts": ["Ninguno, si lleva luces de posición traseras", "No triangulares, como los turismos", "Triangulares"], "a": 2, "expl": "Todo remolque y semirremolque, salvo los agrícolas, debe llevar catadióptricos traseros triangulares.", "fuente": "RGV (RD 2822/1998), art. 16.5", "img": null}, {"tema": 6, "q": "Un turismo queda inmovilizado por una avería en el arcén de una carretera, de noche. ¿Qué alumbrado debe tener encendido?", "opts": ["Las luces de posición y, en su caso, las de gálibo.", "Las luces de largo alcance, para que se vea desde lejos.", "Únicamente las luces de cruce, pues las de posición no son necesarias."], "a": 0, "expl": "Todo vehículo inmovilizado entre la puesta y la salida del sol en calzada o arcén debe tener encendidas las luces de posición y, en su caso, las de gálibo; además la luz de largo alcance está prohibida con el vehículo parado.", "fuente": "RGC art. 105.1 y art. 100.2", "img": null}, {"tema": 6, "q": "Un conductor avisa con el intermitente de un desplazamiento lateral. ¿Cuándo debe concluir la advertencia?", "opts": ["Cuando el vehículo que le sigue haya concluido su propia maniobra", "Cuando haya recorrido al menos cien metros tras la maniobra", "Tan pronto como el vehículo adopte su nueva trayectoria"], "a": 2, "expl": "Se avisa solo el desplazamiento lateral, por lo que la advertencia termina al adoptar la nueva trayectoria.", "fuente": "RGC art. 109.2.a)", "img": null}, {"tema": 6, "q": "¿Cuándo debe llevar encendida la luz de corto alcance o de cruce una motocicleta?", "opts": ["Solo de día y por vías interurbanas", "Solo de noche, tanto en poblado como fuera de él", "Siempre, también de día y por cualquier vía"], "a": 2, "expl": "Las motocicletas deben llevar la luz de cruce encendida durante el día por cualquier vía.", "fuente": "RGC art. 104.a)", "img": null}, {"tema": 6, "q": "Un turismo con luz de largo alcance circula a 60 km/h, de día, por un túnel insuficientemente iluminado y sin tráfico delante. ¿Qué luz debe llevar encendida?", "opts": ["Solo la antiniebla delantera", "La de largo alcance", "Solo las luces de posición"], "a": 1, "expl": "Debe llevar la luz de largo alcance en túneles insuficientemente iluminados, salvo que deba usarse la de cruce.", "fuente": "RGC art. 100.1", "img": null}, {"tema": 6, "q": "Un turismo circula de día por un carril adicional circunstancial habilitado con balizamiento provisional. ¿Qué alumbrado debe llevar como mínimo?", "opts": ["Solo las luces de posición, por ser de día", "La luz de cruce, aunque sea de día", "Ninguno, pues el alumbrado es obligatorio solo de noche"], "a": 1, "expl": "Todos los vehículos que circulen por un carril adicional circunstancial deben llevar encendida la luz de cruce durante el día.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 104.b)", "img": null}, {"tema": 6, "q": "Por una avería irreparable en ruta, un conductor debe circular con un alumbrado de intensidad inferior a la correspondiente. ¿Qué debe hacer?", "opts": ["Circular solo por el arcén con las luces de emergencia hasta llegar a destino", "Reducir la velocidad hasta poder detenerse dentro de la zona iluminada", "Mantener la velocidad y utilizar la bocina para avisar a los demás usuarios"], "a": 1, "expl": "Debe reducir la velocidad hasta la que permita detener el vehículo dentro de la zona iluminada.", "fuente": "RGC art. 107", "img": null}, {"tema": 6, "q": "¿Qué accesorio de dotación debe llevar una motocicleta según el Reglamento General de Vehículos?", "opts": ["Una rueda completa de repuesto", "Un equipo homologado de extinción de incendios", "Un chaleco reflectante de alta visibilidad"], "a": 2, "expl": "Las motocicletas deben llevar un chaleco reflectante de alta visibilidad.", "fuente": "RGV (RD 2822/1998), Anexo XII, apartado 3", "img": null}, {"tema": 6, "q": "Un turismo circula a 90 km/h, de noche, fuera de poblado, por una carretera sin iluminación y sin ningún vehículo a la vista. ¿Qué alumbrado debe llevar?", "opts": ["Solo las luces de posición, pues las de carretera se reservan para la niebla.", "Únicamente la luz de corto alcance, que es la única permitida fuera de poblado.", "La luz de largo alcance o carretera, además de la de posición."], "a": 2, "expl": "A más de 40 km/h, de noche, fuera de poblado y por vías insuficientemente iluminadas debe llevarse la luz de largo alcance, salvo que deba usarse la de cruce para evitar deslumbrar.", "fuente": "RGC art. 100.1", "img": null}, {"tema": 6, "q": "De día, la lluvia intensa disminuye sensiblemente la visibilidad. ¿Es obligatorio utilizar el alumbrado?", "opts": ["Solo si el conductor circula por una vía interurbana de noche", "No, el alumbrado es obligatorio solo entre el ocaso y la salida del sol", "Sí, es obligatorio cuando la visibilidad disminuye sensiblemente"], "a": 2, "expl": "El alumbrado es obligatorio también con niebla, lluvia intensa, nevada o nubes de humo o polvo.", "fuente": "RGC art. 106.1", "img": null}, {"tema": 6, "q": "De noche, un vehículo transporta una carga que sobresale por la parte posterior. ¿Con qué luz debe señalizarse la carga, además de con la V-20?", "opts": ["Con una luz blanca", "Con una luz amarilla intermitente", "Con una luz roja"], "a": 2, "expl": "Entre la puesta y la salida del sol o con visibilidad reducida, la carga que sobresale por detrás se señaliza además con luz roja (por delante, con luz blanca).", "fuente": "RGC (texto consolidado con RD 518/2026), art. 15.6", "img": null}, {"tema": 6, "q": "¿Cómo puede advertirse con el brazo la intención de frenar la marcha de modo considerable?", "opts": ["Extendiéndolo en horizontal con la palma de la mano hacia abajo", "Moviéndolo de arriba abajo con movimientos cortos y rápidos", "Doblándolo hacia arriba con la palma de la mano extendida"], "a": 1, "expl": "Frenar considerablemente o inmovilizar el vehículo se advierte con luces de frenado reiteradas o con el brazo moviéndolo alternativamente de arriba abajo con movimientos cortos y rápidos.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 109.2.c)", "img": null}, {"tema": 6, "q": "Un conductor lleva ocho meses con su primer permiso de conducción. ¿Debe llevar en su vehículo la señal V-13 (letra L)?", "opts": ["Sí, mientras el permiso tenga menos de un año", "No, solo la llevan los vehículos de autoescuela", "No, solo es obligatoria durante los primeros seis meses"], "a": 0, "expl": "La V-13 indica que el conductor tiene un permiso con menos de un año de antigüedad y deben llevarla quienes lo hayan obtenido por primera vez durante ese año.", "fuente": "RGV (RD 2822/1998), Anexo XI, V-13, apartado 1", "img": null}, {"tema": 6, "q": "Cuando debe llevarse alumbrado, ¿a partir de qué anchura del vehículo son obligatorias también las luces de gálibo, además de las de posición?", "opts": ["Cuando la anchura del vehículo excede de 1,80 metros, en todo caso.", "Cuando la anchura del vehículo excede de 2,10 metros.", "Cuando la anchura del vehículo excede de 2,55 metros, que es el máximo legal."], "a": 1, "expl": "Las luces de gálibo se añaden a las de posición si la anchura del vehículo supera 2,10 metros.", "fuente": "RGC art. 99.1", "img": null}, {"tema": 6, "q": "De noche, un turismo circula a 35 km/h por una carretera sin iluminación y no utiliza la luz de largo alcance. ¿Qué luz debe llevar encendida?", "opts": ["Solo las de posición, por circular a menos de 40 km/h", "La de cruce, además de las de posición", "La antiniebla delantera, por ir a velocidad reducida"], "a": 1, "expl": "En vía interurbana insuficientemente iluminada, quien circula a no más de 40 km/h y no usa el largo alcance debe llevar encendida la luz de cruce.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 101.2.b)", "img": null}, {"tema": 6, "q": "Un turismo debe inmovilizarse en una autovía. Además de frenar, ¿cómo debe señalizar la presencia del vehículo?", "opts": ["Con destellos continuos de la luz de largo alcance hasta detenerse", "Con la luz de emergencia y, en su caso, con las de posición", "Con la luz antiniebla trasera, por ser la más visible de todas"], "a": 1, "expl": "Si la inmovilización se produce en autopista o autovía, o con poca visibilidad, se señaliza la presencia con la luz de emergencia y, en su caso, con las de posición.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 109.2.c)", "img": null}, {"tema": 6, "q": "De noche, un turismo permanece estacionado en línea en una travesía insuficientemente iluminada. ¿Qué luces debe tener encendidas?", "opts": ["Ninguna, porque un vehículo estacionado ya no circula", "Las de posición, sustituibles por las de estacionamiento", "Las de cruce, que sustituyen a las de posición en travesías"], "a": 1, "expl": "En calzada o arcén de una travesía insuficientemente iluminada, el vehículo parado o estacionado debe tener encendidas las luces de posición, sustituibles por las de estacionamiento.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 105.2", "img": null}, {"tema": 6, "q": "Fuera de poblado, de noche y por una vía insuficientemente iluminada, ¿a partir de qué velocidad es obligatoria la luz de largo alcance, si el vehículo la lleva?", "opts": ["A más de 40 km/h", "A más de 30 km/h", "A más de 50 km/h"], "a": 0, "expl": "Es obligatoria cuando se circula a más de 40 km/h, salvo que haya que usar la de cruce.", "fuente": "RGC art. 100.1", "img": null}, {"tema": 6, "q": "Para usar la luz antiniebla delantera en un tramo de vía estrecha con sucesión de curvas, ¿qué anchura de calzada debe tener como máximo?", "opts": ["6,50 metros o inferior", "7,50 metros o inferior", "5,50 metros o inferior"], "a": 0, "expl": "La antiniebla delantera puede usarse en vías con calzada de 6,50 m o menos señalizadas con sucesión de curvas próximas entre sí.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 106.2", "img": null}, {"tema": 6, "q": "Además de los vehículos que circulan en sentido contrario, ¿con qué otros vehículos debe cambiarse de largo alcance a cruce para evitar deslumbrar?", "opts": ["Con los que circulan a menos de 40 km/h en el mismo sentido", "Con los del mismo sentido que puedan deslumbrarse por el retrovisor", "Con ninguno más: la obligación afecta solo a los de sentido contrario"], "a": 1, "expl": "La misma precaución rige para los vehículos que van en el mismo sentido y pueden ser deslumbrados a través del retrovisor.", "fuente": "RGC art. 102.2", "img": null}, {"tema": 6, "q": "A un vehículo especial se le avería la señal luminosa V-2 mientras circula. ¿Qué debe utilizar en su lugar?", "opts": ["Solo las luces de posición y la antiniebla trasera", "La de cruce con las luces de emergencia", "La de largo alcance y el avisador acústico intermitente"], "a": 1, "expl": "En caso de avería de la V-2 debe utilizarse la luz de cruce junto con las luces de emergencia.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 71.3", "img": null}, {"tema": 6, "q": "Un turismo se utiliza para enseñar a conducir al amparo de una licencia de aprendizaje. ¿Dónde debe llevar la señal V-14?", "opts": ["Solo en la parte trasera, a la izquierda", "Solo en la parte delantera, junto a la matrícula", "En la parte delantera y en la trasera"], "a": 2, "expl": "Los turismos usados para enseñar a conducir con licencia de aprendizaje deben llevar la V-14 en la parte delantera y trasera.", "fuente": "RGV (RD 2822/1998), Anexo XI, V-14, apartado 3", "img": null}, {"tema": 6, "q": "Un vehículo especial circula por una vía pública. ¿Puede realizar en ella las tareas para las que está destinado?", "opts": ["Sí, siempre que circule a una velocidad que no supere los 40 km/h", "No, solo desplazarse, salvo obras de vía o remolcado", "Sí, siempre que lleve conectada la señal luminosa V-2 en la vía"], "a": 1, "expl": "Los vehículos especiales solo pueden usar las vías para desplazarse, con las excepciones de los que trabajan en obras de la vía en su zona y los destinados a remolcar vehículos.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 71.1", "img": null}, {"tema": 6, "q": "Una carga sobresale longitudinalmente por toda la anchura de la parte posterior del vehículo. ¿Cómo deben colocarse los paneles V-20?", "opts": ["Un único panel centrado y horizontal sobre la carga", "Dos paneles, uno por extremo, en “v” invertida", "Dos paneles paralelos formando una “v” normal"], "a": 1, "expl": "Cuando la carga sobresale por toda la anchura posterior se colocan transversalmente dos paneles V-20, uno en cada extremo, formando una “v” invertida.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 15.6", "img": null}, {"tema": 6, "q": "Según la señal V-6 colocada en la parte posterior de un vehículo, ¿qué característica indica del vehículo o conjunto?", "opts": ["Longitud superior a 10 metros", "Longitud superior a 12 metros", "Longitud superior a 14 metros"], "a": 1, "expl": "La V-6 (vehículo largo) indica una longitud superior a 12 metros.", "fuente": "RGV (RD 2822/1998), Anexo XI, V-6, apartado 1", "img": null}, {"tema": 6, "q": "Un turismo tiene parabrisas. ¿Dónde se coloca el distintivo V-19 que indica que ha superado la inspección técnica periódica?", "opts": ["En el ángulo inferior derecho del parabrisas, por su cara interior", "En el ángulo superior derecho del parabrisas, por su cara interior", "En el ángulo superior izquierdo del parabrisas, por su cara exterior"], "a": 1, "expl": "Si el vehículo tiene parabrisas, el distintivo V-19 se coloca en el ángulo superior derecho, por la cara interior.", "fuente": "RGV (RD 2822/1998), Anexo XI, V-19, apartado 2", "img": null}, {"tema": 6, "q": "¿Puede llevarse encendida la luz de largo alcance cuando el vehículo está parado o estacionado?", "opts": ["No, su uso está prohibido en esa situación", "Sí, si el motor permanece en marcha", "Sí, si es de noche y la vía está poco iluminada"], "a": 0, "expl": "Se prohíbe la luz de largo alcance siempre que el vehículo esté parado o estacionado.", "fuente": "RGC art. 100.2", "img": null}, {"tema": 6, "q": "En poblado, ¿puede un conductor advertir de un peligro con destellos de las luces de cruce o de largo alcance en lugar de la bocina?", "opts": ["Sí, de modo intermitente, a intervalos muy cortos y sin deslumbrar", "No, en poblado solo puede advertirse con señales acústicas", "Sí, pero únicamente con la luz de largo alcance y a intervalos largos"], "a": 0, "expl": "Las advertencias luminosas pueden sustituir a las acústicas, incluso en poblado, evitando deslumbrar.", "fuente": "RGC art. 109.3", "img": null}, {"tema": 6, "q": "Un ciclista saca el brazo izquierdo doblado hacia arriba, con la palma de la mano extendida. ¿Qué maniobra está advirtiendo?", "opts": ["Que va a frenar de modo considerable", "Un desplazamiento lateral hacia la izquierda", "Un desplazamiento lateral hacia la derecha"], "a": 2, "expl": "El brazo doblado hacia arriba indica desplazamiento hacia el lado contrario al del brazo: con el izquierdo, hacia la derecha.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 109.2.a)", "img": null}, {"tema": 6, "q": "Si un conductor sufre deslumbramiento por otro vehículo, ¿qué debe hacer?", "opts": ["Reducir la velocidad lo necesario, incluso hasta detenerse, para no alcanzar a nadie.", "Acelerar para salir cuanto antes de la zona en la que se produce el deslumbramiento.", "Mantener la velocidad y devolver el deslumbramiento con la luz de largo alcance un instante."], "a": 0, "expl": "Quien sufre deslumbramiento debe reducir la velocidad lo necesario, incluso hasta la detención total, para evitar alcances.", "fuente": "RGC art. 102.3", "img": null}, {"tema": 6, "q": "De día, ¿qué vehículos deben llevar encendida la luz de cruce al circular por un carril reversible?", "opts": ["Solo los vehículos de más de 3.500 kg de masa máxima autorizada.", "Ninguno, pues de día su uso es voluntario también en esos carriles.", "Todos los vehículos que circulen por él."], "a": 2, "expl": "Deben llevar la luz de corto alcance de día todos los vehículos que circulen por un carril reversible, un carril adicional circunstancial o uno habilitado en sentido contrario.", "fuente": "RGC art. 104.b", "img": null}, {"tema": 6, "q": "¿Qué indica la señal V-5 colocada en la parte posterior de un vehículo?", "opts": ["Que es un vehículo de motor que, por construcción, no supera 40 km/h", "Que el vehículo circula despacio de forma transitoria por una avería", "Que es un vehículo de motor que, por construcción, no supera 50 km/h, como máximo"], "a": 0, "expl": "La V-5 (vehículo lento) indica un vehículo de motor o conjunto que por construcción no puede sobrepasar los 40 km/h.", "fuente": "RGV (RD 2822/1998), Anexo XI, V-5, apartado 1", "img": null}, {"tema": 6, "q": "¿Puede montarse y utilizarse la señal luminosa V-1 en un vehículo que no sea prioritario?", "opts": ["No, su montaje y uso están prohibidos en no prioritarios", "Sí, si el titular obtiene antes autorización del órgano de tráfico", "Sí, pero únicamente de día y con la velocidad reducida en la vía"], "a": 0, "expl": "La V-1 (luz azul) solo se permite en vehículos prioritarios; en ellos no requiere autorización administrativa.", "fuente": "RGV (RD 2822/1998), Anexo XI, V-1, apartado 5", "img": null}, {"tema": 6, "q": "De noche, un turismo circula por una calle de ciudad bien iluminada. ¿Qué alumbrado debe llevar encendido?", "opts": ["Las luces de posición y la luz de largo alcance", "Solo las luces de posición, porque la vía está iluminada", "Las luces de posición y la luz de cruce"], "a": 2, "expl": "En vías urbanas suficientemente iluminadas, entre el ocaso y la salida del sol, el vehículo de motor lleva la luz de cruce además del alumbrado de posición.", "fuente": "RGC (texto consolidado con RD 518/2026), art. 101.1", "img": null}, {"tema": 7, "q": "¿Qué calzado deben llevar los conductores y pasajeros de motocicletas en todo tipo de vías?", "opts": ["Calzado cerrado, pero solo en vías interurbanas", "Calzado cerrado que cubra todo el pie", "Cualquier calzado, si llevan casco y guantes"], "a": 1, "expl": "El RGC exige calzado cerrado que cubra todo el pie en todo tipo de vías.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 118.1.c)", "img": null}, {"tema": 7, "q": "Un menor de baja estatura viaja excepcionalmente en el asiento delantero de un turismo que tiene airbag frontal. ¿Cuándo puede usar un sistema de retención orientado hacia atrás?", "opts": ["Siempre, porque el airbag no afecta a estos sistemas", "Solo si el menor tiene más de tres años de edad", "Solo si el airbag frontal ha sido desactivado"], "a": 2, "expl": "En el asiento delantero con airbag frontal, el sistema de retención orientado hacia atrás solo puede utilizarse si el airbag está desactivado.", "fuente": "RGC art. 117.3 (no modificado por RD 518/2026)", "img": null}, {"tema": 7, "q": "Un ciclista adulto circula por una carretera convencional. ¿Está obligado a llevar casco?", "opts": ["Sí, adecuadamente abrochado, por ser vía interurbana", "Solo si circula por la calzada y no por el arcén", "No, solo es obligatorio para los menores de dieciséis años"], "a": 0, "expl": "En vías interurbanas el casco es obligatorio para el ciclista; en todo tipo de vías lo es para menores de dieciséis años.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 118.2", "img": null}, {"tema": 7, "q": "¿Cómo debe ir colocado el pasajero de una motocicleta autorizada para llevarlo?", "opts": ["Detrás del conductor, sentado de lado y agarrado a su cintura", "Detrás del conductor, a horcajadas y con pies en los reposapiés", "Entre el conductor y el manillar, siempre que sea un niño pequeño"], "a": 1, "expl": "El pasajero va a horcajadas, con los pies en los reposapiés laterales y en el asiento detrás del conductor; nunca entre el conductor y el manillar.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 12.1", "img": null}, {"tema": 7, "q": "Un conductor se niega a realizar la prueba de alcoholemia que le requiere un agente. ¿Qué puede hacer el agente con su vehículo?", "opts": ["Precintarlo durante un año como mínimo en depósito", "Inmovilizarlo por la negativa a la prueba", "Nada, solo puede formular la denuncia al conductor"], "a": 1, "expl": "La negativa a efectuar las pruebas de detección alcohólica permite también inmovilizar el vehículo, igual que un resultado positivo.", "fuente": "RGC art. 25.2 (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Una chica de 15 años va en bicicleta por una calle de una ciudad. ¿Está obligada a llevar casco?", "opts": ["No, en las vías urbanas el casco no es nunca obligatorio", "Sí, es obligatorio para menores de 16 años en toda vía", "Sí, pero solo si circula por un carril de uso compartido"], "a": 1, "expl": "El casco es obligatorio para los ciclistas en vías interurbanas, y para los menores de dieciséis años en todo tipo de vías, urbanas incluidas.", "fuente": "RGC art. 118.2 (redacción RD 518/2026)", "img": null}, {"tema": 7, "q": "El conductor de un camión de transporte de mercancías con masa máxima autorizada de 7.500 kg lleva años con el permiso. ¿Qué tasa máxima de alcohol en sangre se le permite?", "opts": ["0,3 gramos por litro", "0,8 gramos por litro", "0,5 gramos por litro"], "a": 0, "expl": "En vehículos de mercancías de más de 3.500 kg de MMA el límite baja a 0,3 g/l en sangre (0,15 mg/l en aire espirado).", "fuente": "RGC art. 20, párrafo segundo (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Un motorista lleva en el casco un dispositivo inalámbrico certificado. ¿Para qué fines se permite su uso?", "opts": ["Solo intercomunicación o navegación, sin restar seguridad", "Para hablar por teléfono y escuchar música mientras conduce", "Para cualquier uso si mantiene el volumen bajo"], "a": 0, "expl": "Solo se exceptúan los dispositivos integrados en el casco con fines exclusivos de intercomunicación o navegación y sin afectar a la seguridad.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 18.2.a)", "img": null}, {"tema": 7, "q": "¿Están obligados los ciclistas a someterse a las pruebas de detección de alcohol que ordene un agente?", "opts": ["No, solo se exige a los conductores de vehículos a motor", "Sí, igual que los conductores de vehículos", "Solo si han provocado un accidente"], "a": 1, "expl": "El RGC obliga a someterse a las pruebas de alcohol a todos los conductores de vehículos y de bicicletas.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 21", "img": null}, {"tema": 7, "q": "¿En qué consiste la prueba de detección de drogas que practican los agentes de tráfico?", "opts": ["Un análisis de sangre realizado en el propio control", "Prueba salival y análisis posterior de la muestra", "Una prueba de aire espirado con etilómetro autorizado"], "a": 1, "expl": "La Ley prevé una prueba salival con dispositivo autorizado y un posterior análisis de una muestra salival suficiente.", "fuente": "Ley de Tráfico RDL 6/2015 art. 14.3", "img": null}, {"tema": 7, "q": "El conductor de un taxi lleva años con el permiso. ¿Qué tasa máxima de alcohol en aire espirado se le permite?", "opts": ["0,25 mg/l, como cualquier conductor", "0,15 mg/l", "0,30 mg/l"], "a": 1, "expl": "Los conductores de vehículos de servicio público (taxi) no pueden superar 0,3 g/l en sangre ni 0,15 mg/l en aire espirado.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 20", "img": null}, {"tema": 7, "q": "Respecto a la presencia de drogas en el organismo del conductor, ¿qué ocurre con las sustancias usadas bajo prescripción médica y con finalidad terapéutica?", "opts": ["Quedan permitidas siempre, aunque disminuyan su capacidad de conducir", "Quedan excluidas de la prohibición si puede conducir con la diligencia exigida", "Quedan prohibidas igual que cualquier droga, sin excepción alguna"], "a": 1, "expl": "La Ley excluye de la prohibición las sustancias bajo prescripción facultativa con finalidad terapéutica, siempre que el conductor esté en condiciones de conducir con diligencia, precaución y sin distraerse.", "fuente": "Ley de Tráfico (RDL 6/2015) art. 14.1 (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Un conductor de turismo, con permiso desde hace diez años, circula por una carretera convencional. ¿Cuál es la tasa máxima de alcohol en aire espirado con la que puede conducir?", "opts": ["0,50 miligramos por litro", "0,15 miligramos por litro", "0,25 miligramos por litro"], "a": 2, "expl": "Para los conductores en general el límite es 0,5 g/l en sangre o 0,25 mg/l en aire espirado. El 0,15 mg/l solo rige para profesionales de ciertos vehículos y para noveles.", "fuente": "RGC art. 20, párrafo primero (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "¿En cuál de estos casos puede el conductor de un turismo circular sin cinturón sin tener certificado médico?", "opts": ["En trayectos urbanos de menos de un kilómetro", "Al hacer marcha atrás o al estacionar", "En vías urbanas con límite de 30 km/h"], "a": 1, "expl": "La exención por maniobra afecta a la marcha atrás y al estacionamiento; no existe exención por distancia ni por velocidad de la vía.", "fuente": "RGC (texto consolidado con RD 518/2026) art. 119.1.a)", "img": null}, {"tema": 7, "q": "Si la primera prueba de alcohol en aire espirado supera los límites, se practica una segunda prueba de contraste. ¿Qué tiempo mínimo debe transcurrir entre ambas?", "opts": ["Una hora", "Diez minutos", "Treinta minutos"], "a": 1, "expl": "El reglamento exige un mínimo de 10 minutos entre la primera y la segunda prueba de detección alcohólica.", "fuente": "RGC art. 23 (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Una conductora mayor de edad obtuvo el permiso B hace catorce meses. ¿Qué tasa máxima de alcohol en sangre puede tener al conducir su turismo?", "opts": ["0,3 gramos por litro", "0,0 gramos por litro", "0,5 gramos por litro"], "a": 0, "expl": "Durante los dos años siguientes a obtener el permiso se aplica el límite reducido de 0,3 g/l en sangre y 0,15 mg/l en aire espirado. La tasa 0 es la de los menores de edad.", "fuente": "RGC art. 20, párrafo tercero (texto consolidado 26/06/2026)", "img": null}, {"tema": 7, "q": "Un conductor ha bebido de más y quiere reducir su tasa de alcohol antes de volver a conducir. ¿Qué es realmente eficaz?", "opts": ["Respirar aire fresco con la ventanilla bajada", "Tomar un café bien cargado y comer algo", "Esperar el tiempo necesario sin conducir"], "a": 2, "expl": "El alcohol solo se elimina con el tiempo, a un ritmo que varía según la persona; el café, la comida o el aire fresco no reducen la tasa.", "fuente": "DGT, consejos sobre alcohol y falsos mitos", "img": null}, {"tema": 7, "q": "¿Puede el conductor de un turismo circular con auriculares conectados a un reproductor de música?", "opts": ["Sí, siempre que el volumen sea bajo y no circule por autovía", "No, están prohibidos los auriculares con aparatos de sonido", "Sí, siempre que lleve puesto uno solo de los dos auriculares"], "a": 1, "expl": "Queda prohibido conducir con cualquier tipo de casco de audio o auriculares conectados a aparatos receptores o reproductores de sonido que disminuyan la atención permanente a la conducción.", "fuente": "RGC art. 18.2 (redacción vigente desde 01/10/2026)", "img": null}, {"tema": 7, "q": "Excepcionalmente, un menor puede ir de pasajero en una moto conducida por su padre, madre o tutor. ¿Qué edad debe superar?", "opts": ["Mayores de cinco años, con casco homologado y guantes",
